
name: CAO FUJAO 3.2 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 3.2
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e extrair Cão Fujão 3.2
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./CAO-FUJAO-3.2-PROJETO-COMPLETO.zip"
          DEST="/tmp/cao-fujao-32"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: coloque o ZIP 3.2 na raiz do repositório."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          PROJECT=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle" ] &&
               grep -q "com.caofujao.game" "$DIR/app/build.gradle"; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$DEST" -type f \
              -name settings.gradle -print0
          )

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android não encontrado."
            find "$DEST" -maxdepth 6 -type f
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Verificar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          for FILE in \
            settings.gradle \
            build.gradle \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/assets/index.html \
            app/src/main/assets/intro.png \
            app/src/main/java/com/caofujao/game/MainActivity.java
          do
            if [ ! -s "$PROJECT_DIR/$FILE" ]; then
              echo "ERRO: arquivo ausente: $FILE"
              exit 1
            fi
          done

          grep -q "com.caofujao.game" \
            "$PROJECT_DIR/app/build.gradle"

          echo "CÃO FUJÃO 3.2 CONFIRMADO!"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Conferir APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p entrega
          cp "$APK" entrega/CAO-FUJAO-3.2.apk
          ls -lh entrega/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-3.2-APK
          path: entrega/CAO-FUJAO-3.2.apk
          if-no-files-found: error
          


name: Gerar APK MENTEX Neon 5.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'MENTEX-codigo-fonte-extraido.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair e verificar jogo
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MENTEX-codigo-fonte-extraido.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Envie o ZIP para a raiz do repositório."
            exit 1
          fi

          mkdir -p extraido app/src/main/assets
          unzip -oq "$ZIP" -d extraido

          HTML="$(find extraido -type f -name index.html | head -n 1 || true)"

          if [ -z "$HTML" ] || [ ! -s "$HTML" ]; then
            echo "::error::Não foi encontrado um index.html válido."
            exit 1
          fi

          echo "HTML encontrado: $HTML"
          cp -a "$(dirname "$HTML")/." app/src/main/assets/

          if [ ! -s app/src/main/assets/index.html ]; then
            echo "::error::Falha ao copiar index.html."
            exit 1
          fi

          echo "Verificando versão da interface:"
          grep -in -m 5 'MENTEX 5.0 Neon' app/src/main/assets/index.html || true

          echo "Arquivos copiados:"
          find app/src/main/assets -maxdepth 2 -type f

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          echo "SDK: $ANDROID_HOME"
          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Criar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/mentex/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MENTEX"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mentex.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mentex.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 50
                  versionName '5.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="MENTEX Neon 5.0"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mentex/app/MainActivity.java <<'EOF'
          package com.mentex.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDefaultTextEncodingName("UTF-8");
                  webView.getSettings().setAllowFileAccess(true);

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::O APK não foi gerado."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK" > apk-sha256.txt

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-Neon-V5.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
          

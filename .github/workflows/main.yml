
name: Gerar APK do Cao Fujao

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  construir:
    name: Compilar Cão Fujão
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto atualizado
        run: |
          unzip -o CaoFujao_captura_visual_vitoria_sem_tentar_novamente.zip -d .
          test -f CaoFujaoAndroid/app/src/main/assets/index.html
          test -f CaoFujaoAndroid/app/src/main/java/com/caofujao/app/MainActivity.java

      - name: Corrigir importacao do Billing
        run: |
          FILE="CaoFujaoAndroid/app/src/main/java/com/caofujao/app/MainActivity.java"
          sed -i 's/import com\.android\.billingclient\.api\.ProductDetailsParams;/import com.android.billingclient.api.BillingFlowParams.ProductDetailsParams;/' "$FILE"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Limpar projeto
        run: |
          gradle -p CaoFujaoAndroid clean

      - name: Gerar APK
        run: |
          gradle -p CaoFujaoAndroid assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cao-Fujao-Atualizado
          path: CaoFujaoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

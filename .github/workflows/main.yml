name: MENTEX V4.6.3 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6.3
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. BAIXAR PROJETO DO GITHUB
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. CONFIGURAR JAVA 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. CONFIGURAR GRADLE 8.7
      # ============================================================
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ============================================================
      # 4. PROCURAR ZIP DO MENTEX V4.6.3
      # ============================================================
      - name: Procurar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " PROCURANDO MENTEX V4.6.3"
          echo "=========================================="

          ZIP="MENTEX-V4.6.3-CONTROLES-MAIORES.zip"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERRO: arquivo não encontrado:"
            echo "$ZIP"
            echo ""
            echo "ZIPs encontrados:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      # ============================================================
      # 5. EXTRAIR PROJETO
      # ============================================================
      - name: Extrair projeto Android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " EXTRAINDO PROJETO"
          echo "=========================================="

          rm -rf android-project
          mkdir -p android-project

          unzip -q \
            "MENTEX-V4.6.3-CONTROLES-MAIORES.zip" \
            -d android-project

          echo ""
          echo "Projeto extraído."

          find android-project \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

      # ============================================================
      # 6. LOCALIZAR PROJETO ANDROID
      # ============================================================
      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " LOCALIZANDO PROJETO ANDROID"
          echo "=========================================="

          SETTINGS=$(find android-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo ""
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo ""
          echo "Pasta app encontrada."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 7. AUMENTAR CÉREBRO DAS PERGUNTAS
      # ============================================================
      - name: Ajustar cérebro das perguntas
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " AJUSTANDO TAMANHO DO CÉREBRO"
          echo "=========================================="

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          if [ ! -f "$INDEX" ]; then
            echo ""
            echo "ERRO: index.html não encontrado:"
            echo "$INDEX"
            exit 1
          fi

          echo ""
          echo "Arquivo encontrado:"
          echo "$INDEX"

          python3 - "$INDEX" <<'PY'
          import sys

          arquivo = sys.argv[1]

          with open(arquivo, "r", encoding="utf-8") as f:
              html = f.read()

          # Evita inserir o ajuste duas vezes
          marcador = "MENTEX_V463_CEREBRO_MAIOR_FINAL"

          if marcador not in html:

              ajuste = r'''
          <style>
          /* ============================================================
             MENTEX V4.6.3
             CÉREBRO UM POUCO MAIOR NAS PERGUNTAS
             ============================================================ */

          /* Tela normal */
          #game:not(.hidden) .brain-game {
              height: 100px !important;
              min-height: 100px !important;
              flex-basis: 100px !important;
              margin: 2px 0 5px !important;
          }

          #game:not(.hidden) .brain-game img,
          #game:not(.hidden) .brain-game.correct img,
          #game:not(.hidden) .brain-game.incorrect img {
              width: 108px !important;
              height: 90px !important;
              object-fit: contain !important;
          }

          /* Ícone de pergunta */
          #game:not(.hidden) .question-brain .brain-reaction span {
              width: 34px !important;
              height: 34px !important;
              font-size: 20px !important;
              right: -7px !important;
              top: -4px !important;
          }

          /* ============================================================
             CELULARES COM MENOS ALTURA
             ============================================================ */
          @media (max-height: 760px) {

              #game:not(.hidden) .brain-game {
                  height: 88px !important;
                  min-height: 88px !important;
                  flex-basis: 88px !important;
              }

              #game:not(.hidden) .brain-game img,
              #game:not(.hidden) .brain-game.correct img,
              #game:not(.hidden) .brain-game.incorrect img {
                  width: 94px !important;
                  height: 80px !important;
              }
          }

          /* ============================================================
             CELULARES MUITO BAIXOS
             ============================================================ */
          @media (max-height: 650px) {

              #game:not(.hidden) .brain-game {
                  height: 72px !important;
                  min-height: 72px !important;
                  flex-basis: 72px !important;
              }

              #game:not(.hidden) .brain-game img,
              #game:not(.hidden) .brain-game.correct img,
              #game:not(.hidden) .brain-game.incorrect img {
                  width: 78px !important;
                  height: 66px !important;
              }
          }

          /* MENTEX_V463_CEREBRO_MAIOR_FINAL */
          </style>
          '''

              if "</head>" not in html:
                  raise SystemExit("ERRO: </head> não encontrado no index.html")

              html = html.replace(
                  "</head>",
                  ajuste + "\n</head>",
                  1
              )

              with open(arquivo, "w", encoding="utf-8") as f:
                  f.write(html)

              print("Cérebro aumentado com sucesso.")

          else:
              print("Ajuste do cérebro já existe. Nenhuma alteração duplicada.")

          PY

          echo ""
          echo "=========================================="
          echo " AJUSTE CONCLUÍDO"
          echo "=========================================="

      # ============================================================
      # 8. VERIFICAR PROJETO
      # ============================================================
      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo " VERIFICANDO PROJETO"
          echo "=========================================="

          echo ""
          echo "Diretório:"
          pwd

          echo ""
          echo "Arquivos principais:"
          ls -la

          echo ""
          echo "Pasta APP:"
          ls -la app

          echo ""
          echo "Arquivo HTML:"
          ls -lh app/src/main/assets/index.html

          echo ""
          echo "Verificando ajuste do cérebro:"
          grep -n "MENTEX_V463_CEREBRO_MAIOR_FINAL" \
            app/src/main/assets/index.html

      # ============================================================
      # 9. VERIFICAR JAVA
      # ============================================================
      - name: Verificar Java e Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          gradle --version

      # ============================================================
      # 10. LIMPAR PROJETO
      # ============================================================
      - name: Limpar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo " LIMPANDO PROJETO"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 11. COMPILAR APK
      # ============================================================
      - name: Compilar APK Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo " COMPILANDO MENTEX V4.6.3"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 12. LOCALIZAR APK
      # ============================================================
      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " PROCURANDO APK"
          echo "=========================================="

          echo ""
          echo "APKs encontrados:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERRO: APK não encontrado."

            echo ""
            echo "Conteúdo de build/outputs:"

            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          # Criar pasta final
          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          # Copiar APK
          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.3.apk"

          echo ""
          echo "=========================================="
          echo " APK FINAL"
          echo "=========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.3.apk"

      # ============================================================
      # 13. PUBLICAR APK
      # ============================================================
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.3-APK
          path: apk-final/MENTEX-V4.6.3.apk
          if-no-files-found: error
          retention-days: 7

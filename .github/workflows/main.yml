
name: NEXUS 350 - APK COM ICONE REDONDO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Localizar e extrair fonte
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name 'NEXUS350-BOAS-VINDAS-APK.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -type f -name '*.zip' | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum ZIP da fonte encontrado no repositorio"
            exit 1
          fi

          echo "Fonte encontrada: $ZIP"

          mkdir -p /tmp/nexus_fonte
          unzip -oq "$ZIP" -d /tmp/nexus_fonte

          PACKAGE=$(find /tmp/nexus_fonte -type f -name package.json | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json nao encontrado dentro do ZIP"
            exit 1
          fi

          PROJECT=$(dirname "$PACKAGE")

          echo "Projeto localizado em: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV

      - name: Instalar dependencias
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Preparar Capacitor
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Gerar icones
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx capacitor-assets generate --android

      - name: Sincronizar Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-APK-ICONE-REDONDO
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

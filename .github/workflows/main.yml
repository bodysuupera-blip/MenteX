
name: CAO FUJAO - GERAR APK 500 FASES

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujao
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Aceitar licencas e instalar SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          echo "Aceitando todas as licencas..."

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          echo "Instalando pacotes Android..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "SDK instalado!"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="Cao_Fujao_Android_500_Fases.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP do projeto nao encontrado."
            exit 1
          fi

          mkdir -p projeto-cao-fujao

          unzip -q "$ZIP" -d projeto-cao-fujao

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find projeto-cao-fujao -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Estrutura Android nao encontrada."
            find projeto-cao-fujao -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado: $PROJECT_DIR"

      - name: Verificar arquivos do jogo
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -s "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERRO: index.html nao encontrado."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERRO: AndroidManifest.xml nao encontrado."
            exit 1
          fi

          echo "Arquivos verificados!"

      - name: Compilar aplicativo
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Preparar APK final
        shell: bash
        run: |
          set -Eeuo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' | head -1)

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          mkdir -p resultado

          cp "$APK" resultado/CAO-FUJAO-500-FASES.apk

          echo "APK preparado com sucesso!"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-500-FASES
          path: resultado/CAO-FUJAO-500-FASES.apk
          if-no-files-found: error

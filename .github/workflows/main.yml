name: MENTEX V5.1 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V5.1
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Entrar na pasta do projeto
        shell: bash
        run: |
          if [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "MENTEX_REFEITO_PROJETO/settings.gradle" ]; then
            echo "PROJECT_DIR=MENTEX_REFEITO_PROJETO" >> "$GITHUB_ENV"
          else
            echo "ERRO: Não encontrei settings.gradle."
            exit 1
          fi

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.1-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

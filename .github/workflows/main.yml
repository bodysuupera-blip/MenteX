
name: CAO FUJAO 3.2 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 3.2
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e extrair Cão Fujão 3.2
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./CAO-FUJAO-3.2-PROJETO-COMPLETO.zip"
          DEST="/tmp/cao-fujao-32"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP 3.2 não encontrado."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          PROJECT=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle" ] &&
               grep -q "com.caofujao.game" "$DIR/app/build.gradle"; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$DEST" -type f -name settings.gradle -print0)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Cão Fujão não encontrado."
            find "$DEST" -maxdepth 6 -type f | head -150
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDKMANAGER=$(find \
            /usr/local/lib/android/sdk \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado no servidor."
            find /usr/local/lib/android -maxdepth 5 -type f | head -100
            exit 1
          fi

          SDK_ROOT="$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")"

          echo "SDK encontrado: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          for FILE in \
            settings.gradle \
            build.gradle \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/assets/index.html
          do
            if [ ! -s "$PROJECT_DIR/$FILE" ]; then
              echo "ERRO: arquivo ausente: $FILE"
              exit 1
            fi
          done

          grep -q "com.caofujao.game" \
            "$PROJECT_DIR/app/build.gradle"

          echo "CÃO FUJÃO 3.2 CONFIRMADO!"

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p entrega
          cp "$APK" entrega/CAO-FUJAO-3.2.apk

          ls -lh entrega/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-3.2-APK
          path: entrega/CAO-FUJAO-3.2.apk
          if-no-files-found: error
          

name: MENTEX V4.8 - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENTEX V4.8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find MENTEX ZIP
        shell: bash
        run: |
          echo "Searching for MENTEX ZIP..."

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: MENTEX ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mentex"
          mkdir -p "$RUNNER_TEMP/mentex"

          unzip -o "$ZIP_PATH" -d "$RUNNER_TEMP/mentex"

          echo "Extracted files:"
          find "$RUNNER_TEMP/mentex" -maxdepth 3 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          SETTINGS=$(find "$RUNNER_TEMP/mentex" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find "$RUNNER_TEMP/mentex" -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Project files:"
          ls -la

          echo "Gradle files:"
          find . -maxdepth 2 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \
            -o -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Configure Java 17
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "app/build.gradle" ]; then
            python3 - <<'PY'
from pathlib import Path

p = Path("app/build.gradle")
text = p.read_text()

if "sourceCompatibility JavaVersion.VERSION_17" not in text:
    text += """

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
"""

p.write_text(text)
PY
          fi

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-V4.8.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-APK
          path: MENTEX-V4.8.apk
          if-no-files-found: error

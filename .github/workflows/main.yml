name: MENTEX V4.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENTEX V4.6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find MENTEX ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          ls -la

          ZIP="MENTEX-V4.6-TELA-CHEIA-CORRIGIDA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found:"
            echo "$ZIP"
            echo ""
            echo "Available files:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "ZIP found: $ZIP"

          rm -rf projeto
          mkdir -p projeto

          unzip -o "$ZIP" -d projeto

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find projeto -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."

            find projeto -maxdepth 6 -type f -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "BUILDING MENTEX V4.6"
          echo "FULL SCREEN QUESTIONS"
          echo "NO SCROLL"
          echo "======================================"

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Generated APK files:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-TELA-CHEIA
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: LABIRINTO MORTAL - APK 3D 3.0.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar ZIP exclusivo do LABIRINTO MORTAL
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$GITHUB_WORKSPACE/LABIRINTO-MORTAL-3.0.2-ABERTURA-CINEMATOGRAFICA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP do LABIRINTO MORTAL 3.0.2 não encontrado na raiz."
            echo "Arquivos ZIP encontrados:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name '*.zip'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/labirinto"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/labirinto"

          PROJECT="$RUNNER_TEMP/labirinto/LabirintoMortal"

          if [ ! -f "$PROJECT/settings.gradle" ] || [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERRO: estrutura do projeto LABIRINTO MORTAL inválida."
            find "$RUNNER_TEMP/labirinto" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto exclusivo localizado: $PROJECT"

      - name: Conferir versão 3.0.2
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          cat app/build.gradle

          grep -Eq 'versionCode[[:space:]]+7' app/build.gradle
          grep -Fq "versionName '3.0.2'" app/build.gradle

          echo "Versão 3.0.2 confirmada."

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug --stacktrace

      - name: Conferir e preparar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK do LABIRINTO MORTAL não foi gerado."
            find "$PROJECT_DIR" -type f -name '*.apk'
            exit 1
          fi

          mkdir -p saida

          cp "$APK" "saida/LABIRINTO-MORTAL-3.0.2-ABERTURA-CINEMATOGRAFICA.apk"

          ls -lh saida/
          sha256sum saida/*.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-3.0.2-ABERTURA-CINEMATOGRAFICA
          path: saida/LABIRINTO-MORTAL-3.0.2-ABERTURA-CINEMATOGRAFICA.apk
          if-no-files-found: error
          retention-days: 7

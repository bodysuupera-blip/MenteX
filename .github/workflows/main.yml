
name: LABIRINTO MORTAL - GERAR APK 4.0.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL 4.0.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair exclusivamente LABIRINTO MORTAL 4.0.0
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$GITHUB_WORKSPACE/LABIRINTO-MORTAL-4.0.0-PLATAFORMA-3D-SOMBRIA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP 4.0.0 não encontrado na raiz do GitHub."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -name '*.zip'
            exit 1
          fi

          DEST="$RUNNER_TEMP/labirinto-4.0.0"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          PROJECT="$DEST/LabirintoMortal"

          if [ ! -f "$PROJECT/settings.gradle" ] || [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERRO: projeto LABIRINTO MORTAL inválido."
            find "$DEST" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto 4.0.0 encontrado."

      - name: Conferir versão do jogo
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          grep -Eq 'versionCode[[:space:]]+8' app/build.gradle
          grep -Fq "versionName '4.0.0'" app/build.gradle

          echo "Versão 4.0.0 confirmada."
          cat app/build.gradle

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug --stacktrace

      - name: Conferir APK gerado
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp "$APK" "$GITHUB_WORKSPACE/saida/LABIRINTO-MORTAL-4.0.0.apk"

          ls -lh "$GITHUB_WORKSPACE/saida"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-4.0.0
          path: saida/LABIRINTO-MORTAL-4.0.0.apk
          if-no-files-found: error
          retention-days: 7
          

name: Compilar MENTEX V4.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Compilar MENTEX V4.3
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar ZIP MENTEX V4.3
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " PROCURANDO PROJETO MENTEX V4.3"
          echo "========================================"

          echo ""
          echo "Arquivos ZIP encontrados:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

          echo ""
          echo "Procurando ZIP V4.3..."

          ZIP_V43=$(find . -maxdepth 2 -type f -iname "*.zip" \
            | grep -Ei 'V4[._-]?3|4[._-]?3' \
            | head -1 || true)

          if [ -z "$ZIP_V43" ]; then
            echo ""
            echo "ERRO: ZIP V4.3 não encontrado."
            echo ""
            echo "Envie o ZIP V4.3 para a raiz do repositório."
            exit 1
          fi

          echo ""
          echo "ZIP selecionado:"
          echo "$ZIP_V43"

          rm -rf mentex
          mkdir -p mentex

          echo ""
          echo "Extraindo projeto..."
          unzip -q -o "$ZIP_V43" -d mentex

          echo ""
          echo "Procurando settings.gradle..."

          SETTINGS=$(find mentex -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1 || true)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERRO: settings.gradle não encontrado."
            echo "O ZIP selecionado não contém um projeto Android Gradle válido."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "========================================"
          echo " PROJETO ANDROID ENCONTRADO"
          echo "========================================"
          echo "Pasta: $PROJECT_DIR"
          echo "Arquivo: $SETTINGS"

          echo "$PROJECT_DIR" > project_dir.txt

          echo ""
          echo "Estrutura principal:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -100

      - name: Corrigir permissões do Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

          find "$PROJECT_DIR" -type f -name "gradlew" -exec chmod +x {} \;

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configurar Java 17 no Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Configurando Java 17..."

          APP_GRADLE=$(find "$PROJECT_DIR" -type f \
            \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) \
            | head -1 || true)

          if [ -n "$APP_GRADLE" ]; then
            echo "Arquivo Android encontrado:"
            echo "$APP_GRADLE"
          else
            echo "Aviso: app/build.gradle não encontrado."
          fi

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "========================================"
          echo " COMPILANDO MENTEX V4.3"
          echo "========================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "========================================"
          echo " PROCURANDO APK"
          echo "========================================"

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1 || true)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            echo ""
            echo "APKs encontrados:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/MENTEX-V4.3.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.3
          path: output/MENTEX-V4.3.apk
          if-no-files-found: error

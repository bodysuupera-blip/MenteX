
name: CAO FUJAO - GERAR APK 500 FASES

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujao
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK encontrado!"
          "$SDKMANAGER" --version

      - name: Aceitar licencas Android
        shell: bash
        run: |
          set -Eeuo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          echo "Licencas processadas!"

      - name: Instalar pacotes Android
        shell: bash
        run: |
          set -Eeuo pipefail

          "$SDKMANAGER" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Pacotes Android instalados!"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Cão Fujão
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="Cao_Fujao_Android_500_Fases.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP nao encontrado na raiz."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/cao-fujao"

          unzip -oq "$ZIP" -d "$RUNNER_TEMP/cao-fujao"

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/cao-fujao" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Projeto Android nao encontrado."
            find "$RUNNER_TEMP/cao-fujao" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Verificar arquivos
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -s "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Todos os arquivos encontrados!"

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          mkdir -p resultado

          cp "$APK" resultado/CAO-FUJAO-500-FASES.apk

          echo "APK gerado com sucesso!"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-500-FASES
          path: resultado/CAO-FUJAO-500-FASES.apk
          if-no-files-found: error
          

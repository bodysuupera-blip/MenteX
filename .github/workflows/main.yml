name: MENTEX V4.6 - Gerar APK Instalavel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Preparar APK MENTEX
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar ferramentas Android
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zipalign apksigner

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          mkdir -p work

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK nao encontrado diretamente."

            for ZIP in $(find . -type f -name "*.zip"); do
              echo "Abrindo: $ZIP"

              mkdir -p work/extract
              unzip -o "$ZIP" -d work/extract

              APK=$(find work/extract -type f -name "*.apk" | head -n 1)

              if [ -n "$APK" ]; then
                break
              fi

              rm -rf work/extract
            done
          fi

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" work/original.apk

      - name: Criar chave de assinatura
        run: |
          keytool -genkeypair \
            -keystore work/mentex.keystore \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX,O=MENTEX,C=BR"

      - name: Alinhar APK
        run: |
          zipalign -f -p 4 \
            work/original.apk \
            work/aligned.apk

      - name: Assinar APK
        run: |
          apksigner sign \
            --ks work/mentex.keystore \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out work/MENTEX-V4.6-ATUALIZADO.apk \
            work/aligned.apk

      - name: Verificar assinatura
        run: |
          apksigner verify --verbose \
            work/MENTEX-V4.6-ATUALIZADO.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-ATUALIZADO
          path: work/MENTEX-V4.6-ATUALIZADO.apk
          retention-days: 30


name: MENTEX V4.8 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$RUNNER_TEMP/android-cmdline"
            cd "$RUNNER_TEMP/android-cmdline"

            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o tools.zip

            unzip -q tools.zip
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -a cmdline-tools/. "$SDK/cmdline-tools/latest/"
          fi

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Aceitar licenças e instalar SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto
        id: project
        shell: bash
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -f "$DIR/app/build.gradle" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$ROOT" -type f \
            -name settings.gradle \
            -not -path '*/.git/*' -print0)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "Projeto: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Gerar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

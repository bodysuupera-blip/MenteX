name: Construir APK MENTEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Procurar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "ARQUIVOS DO REPOSITÓRIO"
          echo "================================"

          find . -maxdepth 6 -type f \
            -not -path "./.git/*" | sort

          echo ""
          echo "================================"
          echo "PROCURANDO PROJETO ANDROID"
          echo "================================"

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERRO: settings.gradle NÃO foi encontrado."
            echo ""
            echo "Você precisa enviar o projeto MENTEX para o GitHub."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "settings encontrado:"
          echo "$SETTINGS"

          echo ""
          echo "Pasta do projeto:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Conferir projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "PROJETO ENCONTRADO"
          echo "================================"

          pwd
          echo ""

          echo "Conteúdo:"
          ls -la

          echo ""

          if [ -f "settings.gradle" ]; then
            echo "OK: settings.gradle"
          elif [ -f "settings.gradle.kts" ]; then
            echo "OK: settings.gradle.kts"
          else
            echo "ERRO: settings.gradle não encontrado"
            exit 1
          fi

          if [ -f "build.gradle" ]; then
            echo "OK: build.gradle"
          elif [ -f "build.gradle.kts" ]; then
            echo "OK: build.gradle.kts"
          else
            echo "ERRO: build.gradle não encontrado"
            exit 1
          fi

          if [ -d "app" ]; then
            echo "OK: pasta app"
          else
            echo "ERRO: pasta app não encontrada"
            exit 1
          fi

          echo ""
          echo "PROJETO MENTEX OK!"

      - name: Limpar projeto
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean

      - name: Gerar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

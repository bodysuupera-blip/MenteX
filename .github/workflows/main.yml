
name: CAO FUJAO 1.3 CORRIGIDO - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 1.3
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extrair projeto corrigido
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$GITHUB_WORKSPACE/CAO-FUJAO-ATUALIZADO-1.3-CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP corrigido não encontrado na raiz."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/cao-fujao-source"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/cao-fujao-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/cao-fujao-source" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find "$RUNNER_TEMP/cao-fujao-source" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: build.gradle do aplicativo não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Verificar correção Java
        shell: bash
        run: |
          set -Eeuo pipefail

          JAVA_FILE="$PROJECT_DIR/app/src/main/java/com/caofujao/game/MainActivity.java"

          if [ ! -f "$JAVA_FILE" ]; then
            echo "ERRO: MainActivity.java não encontrado."
            find "$PROJECT_DIR/app/src/main/java" -type f
            exit 1
          fi

          if grep -q 'query.getProductDetailsList()' "$JAVA_FILE"; then
            echo "ERRO: chamada incompatível ainda encontrada."
            exit 1
          fi

          echo "Verificação Java concluída."

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-1.3-APK-CORRIGIDO
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          


name: MENTEX V4.6.3 - Preparar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Compilar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          FOUND="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -n "$FOUND" ]; then
            PROJECT_DIR="$(dirname "$FOUND")"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f -name '*.zip' \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p "$RUNNER_TEMP/mentex-extraido"
              echo "Extraindo arquivo: $ZIP_FILE"
              unzip -q "$ZIP_FILE" \
                -d "$RUNNER_TEMP/mentex-extraido"

              FOUND="$(find "$RUNNER_TEMP/mentex-extraido" \
                -type f \
                \( -name settings.gradle \
                -o -name settings.gradle.kts \) \
                -print -quit)"

              if [ -n "$FOUND" ]; then
                PROJECT_DIR="$(dirname "$FOUND")"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Android nao encontrado."
            echo "O repositorio precisa conter settings.gradle ou settings.gradle.kts."
            echo "Arquivos encontrados:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Projeto localizado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar projeto e compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Verificando estrutura do projeto..."

          if [ ! -f build.gradle ] &&
             [ ! -f build.gradle.kts ] &&
             [ ! -f app/build.gradle ] &&
             [ ! -f app/build.gradle.kts ]; then
            echo "::error::Arquivos de configuracao Gradle nao encontrados."
            exit 1
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "Wrapper ausente; tentando Gradle instalado."
            gradle clean assembleDebug --stacktrace
          fi

          echo "Verificando APK gerado..."

          APK="$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::A compilacao terminou sem gerar APK."
            exit 1
          fi

          echo "APK gerado: $APK"
          echo "APK_PATH=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.3-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
          

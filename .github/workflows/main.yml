
name: MENTE EM FUGA - APK INDEPENDENTE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> $GITHUB_ENV
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Aceitar licencas
        run: |
          yes | "$SDKMANAGER_PATH" --licenses || true

      - name: Instalar componentes Android
        run: |
          "$SDKMANAGER_PATH" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Conferir estrutura
        run: |
          ls -la
          test -f mente-em-fuga/www/index.html
          test -f mente-em-fuga/package.json
          test -f mente-em-fuga/capacitor.config.json

      - name: Instalar dependencias
        working-directory: mente-em-fuga
        run: npm install

      - name: Criar Android
        working-directory: mente-em-fuga
        run: npx cap add android

      - name: Sincronizar projeto
        working-directory: mente-em-fuga
        run: npx cap sync android

      - name: Compilar APK
        working-directory: mente-em-fuga/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTE-EM-FUGA-APK
          path: mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk
          

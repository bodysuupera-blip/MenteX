
name: LABIRINTO FANTASMA - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado"
            exit 1
          fi

          "$SDKMAN" --licenses || true
          "$SDKMAN" "platform-tools"
          "$SDKMAN" "platforms;android-34"
          "$SDKMAN" "build-tools;34.0.0"

      - name: Verificar projeto
        run: |
          test -f labirinto-fantasma/package.json
          test -f labirinto-fantasma/www/index.html
          test -f labirinto-fantasma/capacitor.config.json

      - name: Instalar dependencias
        working-directory: labirinto-fantasma
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: labirinto-fantasma/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK
        run: |
          APK="labirinto-fantasma/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK nao encontrado"
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-FANTASMA-APK
          path: labirinto-fantasma/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

name: MENTEX V4.7 - Reconstruir APK existente

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruir:
    name: Reconstruir APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar APK
        id: localizar
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . -type f -iname '*.apk' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK encontrado no repositório."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/mentex"
          cp "$APK" "$RUNNER_TEMP/mentex/original.apk"

          echo "APK encontrado: $APK"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner zipalign

      - name: Extrair e reconstruir APK
        shell: bash
        run: |
          set -euo pipefail

          apktool d -f \
            "$RUNNER_TEMP/mentex/original.apk" \
            -o "$RUNNER_TEMP/mentex/extraido"

          apktool b \
            "$RUNNER_TEMP/mentex/extraido" \
            -o "$RUNNER_TEMP/mentex/reconstruido.apk"

      - name: Assinar APK de teste
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mentex/teste.jks" \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=MENTEX"

          zipalign -f 4 \
            "$RUNNER_TEMP/mentex/reconstruido.apk" \
            "$RUNNER_TEMP/mentex/alinhado.apk"

          apksigner sign \
            --ks "$RUNNER_TEMP/mentex/teste.jks" \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out "$RUNNER_TEMP/mentex/MENTEX-V4.7-TESTE.apk" \
            "$RUNNER_TEMP/mentex/alinhado.apk"

          apksigner verify \
            "$RUNNER_TEMP/mentex/MENTEX-V4.7-TESTE.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK-TESTE
          path: ${{ runner.temp }}/mentex/MENTEX-V4.7-TESTE.apk
          if-no-files-found: error
          retention-days: 7

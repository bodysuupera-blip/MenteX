
name: Nexus 350 Ghost Run - APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'nexus350_rebuild/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Entrar no projeto
        run: cd nexus350_rebuild && npm install

      - name: Criar Android e sincronizar
        run: |
          cd nexus350_rebuild
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        run: |
          cd nexus350_rebuild/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-GhostRun
          path: nexus350_rebuild/android/app/build/outputs/apk/debug/app-debug.apk
          

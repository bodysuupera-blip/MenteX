name: Construir APK MENTEX Final

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK MENTEX Final
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Procurar ZIP atualizado
        shell: bash
        run: |
          echo "Procurando ZIP do MENTEX..."

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado."
            ls -la
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          mkdir -p android_project

          unzip -q "$ZIP" -d android_project

          echo "Projeto extraído."

      - name: Encontrar projeto Gradle
        id: projeto
        shell: bash
        run: |
          echo "Procurando settings.gradle..."

          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find android_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Corrigir dependências Kotlin
        shell: bash
        run: |
          PROJECT="${{ steps.projeto.outputs.project_dir }}"

          echo "Aplicando correções Kotlin..."

          if [ -f "$PROJECT/app/build.gradle" ]; then

            cat >> "$PROJECT/app/build.gradle" <<'EOF'

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
EOF

          fi

          echo "Correção aplicada."

      - name: Limpar projeto
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          gradle clean --no-daemon

      - name: Construir APK
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          echo "Iniciando construção do APK..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Procurar APK
        shell: bash
        run: |
          echo "APKs encontrados:"

          find android_project \
            -type f \
            -name "*.apk" \
            -print

      - name: Verificar APK
        shell: bash
        run: |
          APK=$(find android_project \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-Final
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Verificar projeto
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          echo "===== settings.gradle ====="
          cat settings.gradle

          echo ""
          echo "===== app/build.gradle ====="
          cat app/build.gradle

          echo ""
          echo "===== Arquivos do projeto ====="
          find app/src/main -type f

      - name: Limpar projeto
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          gradle clean --no-daemon

      - name: Construir APK
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Procurar APK
        shell: bash
        run: |
          echo "===== APKs encontrados ====="

          find android_project \
            -type f \
            -name "*.apk" \
            -print

      - name: Verificar APK
        shell: bash
        run: |
          APK=$(find android_project \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-FINAL
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

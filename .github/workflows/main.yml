
name: NEXUS 350 - NOVA BUILD SEM ALTERAR O JOGO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          set -e

          if [ -f "gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"

          elif [ -f "android/gradlew" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"

          else
            GRADLE=$(find . -maxdepth 5 -name gradlew -type f | head -n 1)

            if [ -z "$GRADLE" ]; then
              echo "ERRO: gradlew nao encontrado."
              exit 1
            fi

            DIR=$(dirname "$GRADLE")
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK original
        shell: bash
        run: |
          set -e

          cd "${{ steps.projeto.outputs.dir }}"

          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          mkdir -p entrega

          find . -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -exec cp {} entrega/ \;

          if [ -z "$(ls -A entrega)" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          ls -lh entrega

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-NOVA-BUILD-ORIGINAL
          path: entrega/*.apk
          retention-days: 30
          

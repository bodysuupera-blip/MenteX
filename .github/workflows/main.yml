
name: MENTEX V4.6 - Reconstruir APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Reconstruir MENTEX
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        uses: android-actions/setup-android@v3

      - name: Instalar Apktool
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y apktool zipalign

          sdkmanager "build-tools;35.0.0"

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -name "*.apk" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: coloque o APK original no repositório."
            exit 1
          fi

          echo "APK encontrado: $APK"
          echo "APK_ORIGINAL=$APK" >> "$GITHUB_ENV"

      - name: Desmontar APK
        shell: bash
        run: |
          set -e

          apktool d "$APK_ORIGINAL" \
            -o mentex-desmontado \
            -f

          echo "APK desmontado."

      - name: Salvar arquivos recuperados
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-ARQUIVOS-RECUPERADOS
          path: mentex-desmontado/

      - name: Reconstruir APK
        shell: bash
        run: |
          set -e

          apktool b mentex-desmontado \
            -o mentex-reconstruido.apk

          echo "APK reconstruído."

      - name: Preparar assinatura
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -keystore mentex.keystore \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mentex123 \
            -keypass mentex123 \
            -dname "CN=MENTEX"

          zipalign -f -v 4 \
            mentex-reconstruido.apk \
            mentex-alinhado.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks mentex.keystore \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out MENTEX-V4.6-RECONSTRUIDO.apk \
            mentex-alinhado.apk

      - name: Enviar APK reconstruído
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-RECONSTRUIDO
          path: MENTEX-V4.6-RECONSTRUIDO.apk
          

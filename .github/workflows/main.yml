
name: LABIRINTO MORTAL - APK 3D 3.0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL 3D
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f "LabirintoMortal/settings.gradle" ] && \
             [ -f "LabirintoMortal/app/build.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/LabirintoMortal"

          elif [ -f "settings.gradle" ] && \
               [ -f "app/build.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"

          else
            echo "ERRO: projeto LABIRINTO MORTAL não encontrado."
            echo "Extraia o ZIP 3D atualizado na raiz do repositório."
            find . -maxdepth 5 -type f | sort | head -150
            exit 1
          fi

          echo "Projeto selecionado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Conferir versão
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          grep -q "versionCode 6" app/build.gradle
          grep -q "versionName '3.0.1'" app/build.gradle

          echo "Versão 3.0.1 confirmada."

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean assembleDebug \
            --stacktrace

      - name: Preparar APK atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/saida"

          cp "$APK" \
            "$GITHUB_WORKSPACE/saida/LABIRINTO-MORTAL-3.0.1-3D.apk"

          echo "APK gerado:"
          ls -lh "$GITHUB_WORKSPACE/saida"

          sha256sum "$GITHUB_WORKSPACE/saida/LABIRINTO-MORTAL-3.0.1-3D.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-3.0.1-3D-APK
          path: saida/LABIRINTO-MORTAL-3.0.1-3D.apk
          if-no-files-found: error
          retention-days: 7
          


name: MENTEX V4.6.6 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar arquivos do projeto
        run: |
          echo "Arquivos encontrados:"
          ls -la
          echo "Procurando Gradle..."
          find . -maxdepth 5 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Instalar SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Localizar projeto
        id: projeto
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -n "$GRADLEW" ]; then
            DIR=$(dirname "$GRADLEW")
            chmod +x "$GRADLEW"
            echo "comando=$GRADLEW" >> "$GITHUB_OUTPUT"
            echo "diretorio=$DIR" >> "$GITHUB_OUTPUT"
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUILD=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)

          if [ -z "$BUILD" ]; then
            echo "ERRO: Código-fonte Android não encontrado."
            exit 1
          fi

          DIR=$(dirname "$BUILD")
          echo "diretorio=$DIR" >> "$GITHUB_OUTPUT"
          echo "wrapper=false" >> "$GITHUB_OUTPUT"

      - name: Configurar Gradle 8.7
        if: steps.projeto.outputs.wrapper == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd "${{ steps.projeto.outputs.diretorio }}"

          if [ "${{ steps.projeto.outputs.wrapper }}" = "true" ]; then
            "${{ github.workspace }}/${{ steps.projeto.outputs.comando }}" assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Preparar APK
        run: |
          mkdir -p apk-final
          APK=$(find . -type f -path "*/build/outputs/apk/*/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK não encontrado!"
            exit 1
          fi

          cp "$APK" apk-final/MENTEX-V4.6.6.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.6-APK
          path: apk-final/MENTEX-V4.6.6.apk
          retention-days: 7
          

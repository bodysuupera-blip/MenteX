name: MENTEX V4.6.3 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6.3
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "mentex/settings.gradle" ] || [ -f "mentex/settings.gradle.kts" ]; then
            PROJECT_DIR="mentex"
          elif [ -f "mentex-extra/mentex/settings.gradle" ] || [ -f "mentex-extra/mentex/settings.gradle.kts" ]; then
            PROJECT_DIR="mentex-extra/mentex"
          else
            echo "ERRO: projeto Android não encontrado."
            find . -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \)
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERRO: arquivo gradlew não encontrado."
            exit 1
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.3-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

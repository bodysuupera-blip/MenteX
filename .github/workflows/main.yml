name: Gerar APK MENTEX V4.6.4 Android

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mentex/app/MainActivity.java
          test -f app/src/main/assets/index.html

          grep -Fq "MENTEX V4.6.4" \
            app/src/main/assets/index.html

          grep -Eq "versionName[[:space:]]+['\"]4\.6\.4['\"]" \
            app/build.gradle

          echo "Arquivos do MENTEX V4.6.4 encontrados."

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK compilado com sucesso."
          ls -lh "$APK"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK-ANDROID
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7


name: MENTEX V4.6.4 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        run: |
          echo "Procurando projeto Android..."
          find . -name gradlew -type f

      - name: Preparar Gradle
        run: |
          chmod +x $(find . -name gradlew -type f | head -n 1)

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Compilar APK
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Preparar APK final
        run: |
          mkdir -p apk-final
          find . -name "*.apk" -type f
          cp $(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1) apk-final/MENTEX-V4.6.4.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: apk-final/MENTEX-V4.6.4.apk
          retention-days: 7
          


name: MENTEX V5.1 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Atualizar MENTEX V5.1
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK sem ação interativa
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      - name: Aceitar licenças e instalar ferramentas
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Baixar APKTool
        run: |
          curl -L https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar

      - name: Localizar APK compatível
        run: |
          python3 - <<'PY'
          import zipfile, glob, shutil, sys

          candidatos = []

          for arquivo in glob.glob("**/*.apk", recursive=True):
              try:
                  with zipfile.ZipFile(arquivo) as z:
                      if "assets/www/index.html" in z.namelist():
                          candidatos.append(arquivo)
                          print("APK compatível:", arquivo)
              except Exception:
                  pass

          if not candidatos:
              sys.exit("ERRO: Nenhum APK com assets/www/index.html foi encontrado.")

          candidatos.sort(key=lambda x: ("V5.0" not in x.upper(), len(x)))
          escolhido = candidatos[0]
          shutil.copy2(escolhido, "base.apk")
          print("APK escolhido:", escolhido)
          PY

      - name: Extrair aplicativo
        run: |
          java -jar apktool.jar d base.apk -o projeto -f

      - name: Conferir arquivos
        run: |
          test -f projeto/assets/www/index.html || {
            echo "ERRO: index.html não encontrado."
            exit 1
          }
          echo "Arquivos do MENTEX encontrados."

      - name: Gerar APK
        run: |
          java -jar apktool.jar b projeto -o MENTEX-V5.1-unsigned.apk

      - name: Criar chave de assinatura
        run: |
          keytool -genkeypair \
            -keystore mentex.jks \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mentex123 \
            -keypass mentex123 \
            -dname "CN=MENTEX, OU=App, O=MENTEX, L=Brasil, S=SP, C=BR"

      - name: Alinhar e assinar APK
        run: |
          zipalign -f -v 4 MENTEX-V5.1-unsigned.apk MENTEX-V5.1-aligned.apk

          apksigner sign \
            --ks mentex.jks \
            --ks-key-alias mentex \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out MENTEX-V5.1.apk \
            MENTEX-V5.1-aligned.apk

          apksigner verify MENTEX-V5.1.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.1
          path: MENTEX-V5.1.apk
          if-no-files-found: error
          

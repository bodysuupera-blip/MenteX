name: Build MENTEX V4.6 Compacto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6 Compacto
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR O PROJETO
      # ============================================================
      - name: Baixar código
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ENCONTRAR PROJETO ANDROID
      # ============================================================
      - name: Encontrar projeto Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO PROJETO ANDROID"
          echo "======================================"

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo ""
            echo "Este repositório precisa conter o código-fonte Android."
            echo ""
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 4. CONFIGURAR TELA CHEIA
      # ============================================================
      - name: Configurar tela cheia
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERRO: AndroidManifest.xml não encontrado."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          # Permite conteúdo de ponta a ponta em aparelhos modernos.
          if "android:windowLayoutInDisplayCutoutMode" not in text:
              text = text.replace(
                  "<application",
                  '<application android:windowLayoutInDisplayCutoutMode="shortEdges"',
                  1
              )

          # Garante que não exista orientação fixa.
          text = re.sub(
              r'\s+android:screenOrientation="[^"]*"',
              '',
              text
          )

          manifest.write_text(text, encoding="utf-8")

          print("Manifest configurado.")
          PY

      # ============================================================
      # 5. TEMA FULLSCREEN
      # ============================================================
      - name: Criar configuração fullscreen
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/app/src/main/res/values"

          cat > "$PROJECT_DIR/app/src/main/res/values/mentex_fullscreen.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="MENTEX_Fullscreen">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowDisablePreview">true</item>
              </style>

          </resources>
          EOF

          echo "Tema fullscreen criado."

      # ============================================================
      # 6. PROCURAR GRADLE WRAPPER
      # ============================================================
      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper encontrado."
          else
            echo "Gradle Wrapper não encontrado."
            echo "Instalando Gradle 8.7..."

            curl -L \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -o /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp/

            echo "Gradle instalado."
          fi

      # ============================================================
      # 7. VERIFICAR PROJETO
      # ============================================================
      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "ESTRUTURA DO PROJETO"
          echo "======================================"

          find app/src/main \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

      # ============================================================
      # 8. COMPILAR
      # ============================================================
      - name: Compilar MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COMPILANDO MENTEX V4.6"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug \
              --stacktrace \
              --no-daemon
          else
            gradle clean assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      # ============================================================
      # 9. LOCALIZAR APK
      # ============================================================
      - name: Procurar APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO APK"
          echo "======================================"

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | grep -v "androidTest" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

      # ============================================================
      # 10. ENVIAR APK
      # ============================================================
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-COMPACTO
          path: MENTEX-V4.6-COMPACTO.apk
          if-no-files-found: error

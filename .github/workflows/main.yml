name: Compilar MENTEX V4.6 - Cerebro Reacoes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENTEX V4.6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos do repositorio:"
          find . -maxdepth 3 -type f | head -100

          PROJECT_DIR="."

          if [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            SETTINGS=$(find . -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERRO: settings.gradle nao encontrado."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "$PROJECT_DIR" > project_dir.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "Compilando MENTEX V4.6..."

          chmod +x gradlew 2>/dev/null || true

          if [ -f "gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p resultado

          cp "$APK" \
            resultado/MENTEX-V4.6-CEREBRO-REACTIONS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-CEREBRO-REACTIONS
          path: resultado/MENTEX-V4.6-CEREBRO-REACTIONS.apk
          if-no-files-found: error

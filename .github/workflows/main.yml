
name: MENTEX - Atualizar Icone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Localizar arquivos
        id: arquivos
        shell: bash
        run: |
          ZIP=$(find . -type f -iname '*V4.17*APK*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -type f -iname '*.zip' \
              -not -path './.git/*' | head -n 1)
          fi

          IMG=$(find . -type f -iname 'mentex_icon.png' \
            -not -path './.git/*' | head -n 1)

          test -n "$ZIP" || {
            echo "::error::ZIP do APK nao encontrado."
            exit 1
          }

          test -n "$IMG" || {
            echo "::error::mentex_icon.png nao encontrado."
            exit 1
          }

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zip python3-pil

      - name: Instalar Android SDK manualmente
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" "platform-tools" "build-tools;35.0.0"

      - name: Extrair APK
        shell: bash
        run: |
          mkdir original
          unzip -o "${{ steps.arquivos.outputs.zip }}" -d original

          APK=$(find original -type f -name '*.apk' | head -n 1)
          test -n "$APK" || {
            echo "::error::Nenhum APK dentro do ZIP."
            exit 1
          }

          cp "$APK" original.apk

      - name: Desmontar APK
        run: apktool d -f original.apk -o projeto

      - name: Trocar icones reconhecidos
        env:
          ICON: ${{ steps.arquivos.outputs.img }}
        run: |
          cat > trocar.py <<'PY'
          from pathlib import Path
          from PIL import Image
          import os, re

          root = Path("projeto/res")
          src = Image.open(os.environ["ICON"]).convert("RGBA")
          pat = re.compile(
              r"(ic_launcher|launcher_icon|app_icon|appicon)", re.I
          )
          count = 0

          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in (".png", ".webp"):
                  continue
              if not (
                  p.parent.name.startswith("mipmap")
                  or p.parent.name.startswith("drawable")
              ):
                  continue
              if not pat.search(p.stem):
                  continue

              try:
                  with Image.open(p) as old:
                      size, fmt = old.size, old.format

                  im = src.resize(size, Image.Resampling.LANCZOS)
                  im.save(p, "WEBP", lossless=True) if fmt == "WEBP" \
                    else im.save(p, "PNG")
                  print("Atualizado:", p)
                  count += 1
              except Exception as e:
                  print("Ignorado:", p, e)

          if count == 0:
              raise SystemExit("Nenhum icone reconhecido no APK.")
          PY

          python3 trocar.py

      - name: Reconstruir APK
        run: apktool b projeto -o mentex-unsigned.apk

      - name: Assinar APK
        shell: bash
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"

          keytool -genkeypair \
            -keystore mentex.keystore \
            -storepass android \
            -keypass android \
            -alias mentex \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX"

          "$BT/zipalign" -f 4 \
            mentex-unsigned.apk mentex-aligned.apk

          "$BT/apksigner" sign \
            --ks mentex.keystore \
            --ks-key-alias mentex \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out MENTEX-ICON-REDONDO.apk \
            mentex-aligned.apk

          "$BT/apksigner" verify MENTEX-ICON-REDONDO.apk

      - name: Criar ZIP
        run: |
          mkdir pacote
          cp MENTEX-ICON-REDONDO.apk pacote/
          cd pacote
          zip ../MENTEX-ICON-REDONDO.zip *.apk

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-ICON-REDONDO
          path: |
            MENTEX-ICON-REDONDO.zip
            MENTEX-ICON-REDONDO.apk
            

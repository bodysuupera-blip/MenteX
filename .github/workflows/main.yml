
name: MENTEX 5.1 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX Android
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar estrutura
        run: |
          echo "Verificando arquivos do MENTEX..."
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          echo "Estrutura encontrada!"

      - name: Instalar dependências
        run: npm install

      - name: Configurar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: SDK Manager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar MENTEX
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-5.1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

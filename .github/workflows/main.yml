
name: MENTEX V4.7 - Preparar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Preparar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Localizar e extrair APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mentex-apk"

          ZIP="$(find . -type f \
            -name 'MENTEX-V4.6.4-TELA-PERGUNTAS-SEM-VACUO.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -type f -name '*.zip' \
              -not -path './.git/*' -print -quit)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::Nenhum arquivo ZIP encontrado."
            exit 1
          fi

          echo "Arquivo encontrado: $ZIP"

          unzip -oq "$ZIP" -d "$RUNNER_TEMP/mentex-apk"

          APK="$(find "$RUNNER_TEMP/mentex-apk" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::O ZIP não contém nenhum APK."
            exit 1
          fi

          cp "$APK" "$RUNNER_TEMP/MENTEX.apk"

          echo "APK preparado com sucesso."
          ls -lh "$RUNNER_TEMP/MENTEX.apk"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: ${{ runner.temp }}/MENTEX.apk
          if-no-files-found: error
          retention-days: 14
          

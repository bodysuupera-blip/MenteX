name: Gerar APK MENTEX V4.6.4 Atualizado

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verificar projeto
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle -o -f settings.gradle.kts
          test -f app/build.gradle -o -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Projeto Android encontrado."

      - name: Gerar APK atualizado
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleDebug

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK gerado: $APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

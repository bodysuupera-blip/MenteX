name: MENTEX - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Extrair ZIP e localizar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/mentex-extraido

          find "$GITHUB_WORKSPACE" \
            -maxdepth 3 -type f -iname '*.zip' \
            ! -path '*/.git/*' \
            -print0 |
          while IFS= read -r -d '' arquivo; do
            echo "Extraindo: $arquivo"
            destino="/tmp/mentex-extraido/$(basename "$arquivo" .zip)"
            mkdir -p "$destino"
            unzip -oq "$arquivo" -d "$destino" || true
          done

          ROOT="$GITHUB_WORKSPACE"

          GRADLEW="$(find "$ROOT" /tmp/mentex-extraido \
            -type f -name gradlew -print -quit 2>/dev/null || true)"

          if [ -n "$GRADLEW" ]; then
            PROJETO="$(dirname "$GRADLEW")"
          else
            BUILD_FILE="$(find "$ROOT" /tmp/mentex-extraido \
              -type f -path '*/app/build.gradle' \
              -print -quit 2>/dev/null || true)"

            if [ -z "$BUILD_FILE" ]; then
              echo "ERRO: não foi encontrado o código-fonte Android."
              echo "O ZIP pode conter somente o APK."
              echo "Arquivos Gradle encontrados:"
              find "$ROOT" /tmp/mentex-extraido \
                -type f \( -name build.gradle \
                -o -name build.gradle.kts \
                -o -name settings.gradle \
                -o -name settings.gradle.kts \) \
                -print 2>/dev/null || true
              exit 1
            fi

            PROJETO="$(dirname "$(dirname "$BUILD_FILE")")"
          fi

          echo "Projeto localizado: $PROJETO"
          echo "PROJETO_ANDROID=$PROJETO" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJETO_ANDROID"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error

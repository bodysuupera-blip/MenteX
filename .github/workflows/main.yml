name: MENTEX V4.6 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        run: |
          echo "Arquivos do projeto:"
          find . -maxdepth 4 -type f | sort

      - name: Compilar APK
        run: |
          cd mentex
          gradle clean assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          find mentex -type f -name "*.apk" -print

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: mentex/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

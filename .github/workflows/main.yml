name: MENTEX V4.6.4 - Preparar ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  preparar-zip:
    name: Preparar atualização MENTEX V4.6.4
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar arquivos da atualização
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p saida

          # Evita incluir arquivos internos do GitHub e a própria saída.
          zip -r saida/MENTEX-V4.6.4-ATUALIZACAO.zip . \
            -x ".git/*" \
               ".github/*" \
               "saida/*" \
               "*/node_modules/*" \
               "*/build/*" \
               "*/.gradle/*"

          echo "ZIP criado:"
          ls -lh saida/MENTEX-V4.6.4-ATUALIZACAO.zip

      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-ATUALIZACAO
          path: saida/MENTEX-V4.6.4-ATUALIZACAO.zip
          if-no-files-found: error
          retention-days: 7

name: Gerar APK MENTEX V4.6.4 Android

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle"
      - "gradlew"
      - "gradle.properties"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  android:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnosticar estrutura
        shell: bash
        run: |
          echo "=== Raiz do projeto ==="
          pwd
          ls -la

          echo "=== Arquivos encontrados ==="
          find . -maxdepth 6 -type f \
            ! -path './.git/*' \
            | sort | head -300

      - name: Localizar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "::error::Android SDK não encontrado."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK Manager localizado."

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f settings.gradle ] &&
             [ ! -f settings.gradle.kts ]; then
            echo "::error::Falta settings.gradle ou settings.gradle.kts na raiz."
            exit 1
          fi

          if [ ! -f app/build.gradle ] &&
             [ ! -f app/build.gradle.kts ]; then
            echo "::error::Não foi encontrado o arquivo Gradle do módulo app."
            exit 1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::AndroidManifest.xml não encontrado."
            exit 1
          fi

          echo "Estrutura Android básica encontrada."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::O APK não foi gerado no caminho esperado."
            find app -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi

          echo "APK gerado:"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK-ANDROID
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

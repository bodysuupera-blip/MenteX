name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto MENTEX
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex
          unzip -o MENTEX_Android_2_8_Voz_Atualizada.zip -d /tmp/mentex

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: |
          cd /tmp/mentex
          gradle assembleDebug --stacktrace

      - name: Localizar APK
        run: |
          find /tmp/mentex -type f -name "*.apk" -print

      - name: Copiar APK
        run: |
          APK=$(find /tmp/mentex -type f -name "app-debug.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK não encontrado"
            exit 1
          fi
          cp "$APK" ./MENTEX-2.8.apk
          ls -lh ./MENTEX-2.8.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-2.8
          path: ./MENTEX-2.8.apk

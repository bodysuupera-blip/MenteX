name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Extrair MENTEX 3.9 - 5 Corações
        shell: bash
        run: |
          set -e

          ZIP="./MENTEX_Android_3_9_5_CORACOES_DEFINITIVO.zip"

          echo "======================================"
          echo "   VERIFICANDO ARQUIVO DO MENTEX"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo não encontrado:"
            echo "$ZIP"
            echo ""
            echo "Arquivos ZIP encontrados:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          unzip -o "$ZIP" -d /tmp/mentex

          echo "ZIP extraído com sucesso."

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find /tmp/mentex -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find /tmp/mentex -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compilar APK MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "      COMPILANDO MENTEX 3.9"
          echo "       5 CORAÇÕES ❤️"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-3.9-5-CORACOES
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Finalizado
        run: |
          echo "======================================"
          echo " MENTEX 3.9 GERADO COM SUCESSO!"
          echo " ❤️ 5 CORAÇÕES"
          echo " 🪙 PRÊMIOS"
          echo " 🎮 200 FASES"
          echo "======================================"

name: Compilar MENTEX V4.6.4 Android

on:
  workflow_dispatch:
  push:
    paths:
      - "MENTEX-V4.6.4-ANDROID-PROJETO-CORRIGIDO.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extrair projeto Android
        run: |
          set -e
          ZIP="MENTEX-V4.6.4-ANDROID-PROJETO-CORRIGIDO.zip"

          test -f "$ZIP" || {
            echo "ERRO: ZIP não encontrado."
            exit 1
          }

          mkdir projeto
          unzip -q "$ZIP" -d projeto

          test -f projeto/settings.gradle || {
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          }

      - name: Compilar APK
        run: |
          set -e
          cd projeto

          gradle --no-daemon clean assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          


name: CAO FUJAO 500 FASES - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto do jogo
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP=$(find . -maxdepth 3 -type f \
            \( -name 'CAO-FUJAO-500-FASES-ATUALIZADO.zip' \
            -o -name 'Cao_Fujao_ATUALIZADO_GOOGLE_PLAY.zip' \) \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do projeto Cão Fujão não encontrado."
            echo "Coloque o ZIP do projeto na raiz do repositório."
            exit 1
          fi

          echo "Projeto encontrado: $ZIP"

          mkdir -p /tmp/cao-fujao
          unzip -q "$ZIP" -d /tmp/cao-fujao

          SETTINGS=$(find /tmp/cao-fujao -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: módulo Android app não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto Android localizado em: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean :app:assembleDebug
          else
            gradle --no-daemon clean :app:assembleDebug
          fi

      - name: Localizar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p saida
          cp "$APK" saida/CAO-FUJAO-500-FASES.apk

          ls -lh saida/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-500-FASES-APK
          path: saida/CAO-FUJAO-500-FASES.apk
          if-no-files-found: error
          

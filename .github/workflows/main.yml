name: Construir APK MENTEX Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK MENTEX Final
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar projeto
        run: |
          echo "Arquivos do projeto:"
          find . -maxdepth 3 -type f | head -100

      - name: Procurar APK
        run: |
          echo "Procurando APK..."
          find . -type f -name "*.apk" -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: |
            **/*.apk
          if-no-files-found: error

      - name: Resumo
        run: |
          echo "================================="
          echo " APK MENTEX DISPONÍVEL "
          echo "================================="

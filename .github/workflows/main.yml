
name: NEXUS 350 - MENU CORRIGIDO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS350-MENU-BOTOES-CORRIGIDOS.zip'
      - '.github/workflows/nexus350.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Android SDK
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar ZIP corrigido
        run: |
          set -e
          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name 'NEXUS350-MENU-BOTOES-CORRIGIDOS.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ZIP corrigido nao encontrado."
            exit 1
          fi

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          echo "Arquivo encontrado: $ZIP"

      - name: Extrair projeto
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/extracted"

          PACKAGE="$(find "$GITHUB_WORKSPACE/extracted" -type f -name package.json -not -path '*/node_modules/*' | head -n 1)"

          if [ -z "$PACKAGE" ]; then
            echo "package.json nao encontrado no ZIP."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT_DIR"

      - name: Instalar dependencias
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install

      - name: Instalar plataforma Android
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install @capacitor/android@^7.0.0

      - name: Criar Android e sincronizar
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Fixar orientacao horizontal
        run: |
          set -e
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml nao encontrado."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "xmlns:android=" not in text:
              text = text.replace(
                  "<manifest",
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android',
                  1
              )

          pattern = re.compile(r"<activity\\b[^>]*>", re.DOTALL)
          matches = list(pattern.finditer(text))

          if not matches:
              raise SystemExit("Nenhuma activity encontrada.")

          target = None

          for match in matches:
              tag = match.group(0)
              if (
                  "android.intent.action.MAIN" in tag
                  and "android.intent.category.LAUNCHER" in tag
              ):
                  target = match
                  break

          if target is None:
              target = matches[0]

          tag = target.group(0)

          tag = re.sub(
              r'\\s+android:screenOrientation="[^"]*"',
              '',
              tag
          )

          tag = re.sub(
              r'\\s+android:resizeableActivity="[^"]*"',
              '',
              tag
          )

          tag = tag[:-1] + (
              ' android:screenOrientation="landscape"'
              ' android:resizeableActivity="false">'
          )

          text = text[:target.start()] + tag + text[target.end():]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          ET.parse(path)
          print("Manifest validado. Orientacao horizontal aplicada.")
          PY

      - name: Compilar APK
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar APK
        run: |
          set -e
          APK="$(find "$PROJECT_DIR/android" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK nao foi encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/resultado"
          cp "$APK" "$GITHUB_WORKSPACE/resultado/NEXUS350-MENU-CORRIGIDO.apk"
          ls -lh "$GITHUB_WORKSPACE/resultado"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-MENU-CORRIGIDO-APK
          path: resultado/NEXUS350-MENU-CORRIGIDO.apk
          if-no-files-found: error
          retention-days: 30
          

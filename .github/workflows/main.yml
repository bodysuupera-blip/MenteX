
name: MENTE EM FUGA - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
         

      - name: Instalar SDK Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Encontrar arquivo do jogo
        run: |
          if [ -f "index.html" ]; then
            echo "Jogo encontrado na raiz"
            GAME_FILE="index.html"
          elif [ -f "www/index.html" ]; then
            echo "Jogo encontrado na pasta www"
            GAME_FILE="www/index.html"
          else
            echo "ERRO: index.html não encontrado"
            echo "Arquivos existentes:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p www
          cp "$GAME_FILE" www/index.html

      - name: Preparar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Criar configuração
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.menteemfuga.game",
            "appName": "Mente em Fuga",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar projeto
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTE-EM-FUGA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          


name: MENTEX V5.2 - Gerar APK Atualizado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK MENTEX
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar APK atualizado
        run: |
          mkdir -p saida

          if [ -f "MENTEX-FIGURAS-ACERTO-ERRO.apk" ]; then
            cp MENTEX-FIGURAS-ACERTO-ERRO.apk saida/MENTEX-V5.2.apk
          else
            echo "ERRO: APK atualizado não encontrado na raiz do projeto"
            exit 1
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.2-APK
          path: saida/MENTEX-V5.2.apk
          if-no-files-found: error

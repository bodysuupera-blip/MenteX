
name: LABIRINTO DE FANTASMA - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar ZIP do jogo
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f \
            -iname 'Labirinto_de_Fantasma_ANDROID_PRONTO.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do jogo nao encontrado na raiz."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/labirinto"

          ZIP=$(find . -maxdepth 1 -type f \
            -iname 'Labirinto_de_Fantasma_ANDROID_PRONTO.zip' \
            -print -quit)

          unzip -q "$ZIP" -d "$RUNNER_TEMP/labirinto"

          cd "$RUNNER_TEMP/labirinto"

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/hero-maze.png

          echo "Arquivos do jogo encontrados!"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/labirinto"

          npm install

          npx cap add android

          npx cap sync android

      - name: Gerar APK Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/labirinto/android"

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Conferir APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/labirinto/android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-DE-FANTASMA-APK
          path: ${{ runner.temp }}/labirinto/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

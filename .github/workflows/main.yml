name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto MENTEX
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex
          unzip -o MENTEX_Android_2_8_Voz_Masculina_Palhaco.zip -d /tmp/mentex

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: |
          cd /tmp/mentex
          gradle assembleDebug --stacktrace

      - name: Copiar APK
        run: |
          cp /tmp/mentex/app/build/outputs/apk/debug/app-debug.apk ./MENTEX-2.8.apk
          ls -lh ./MENTEX-2.8.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-2.8
          path: ./MENTEX-2.8.apk

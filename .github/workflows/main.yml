
name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX Original Melhorado
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./MENTEX-ESTILO-ORIGINAL-MELHORADO.zip"
          DEST="$RUNNER_TEMP/mentex-original"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP MENTEX não encontrado."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          PACKAGE=$(find "$DEST" -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "$PROJECT_DIR" > "$RUNNER_TEMP/project-dir.txt"

          echo "Projeto localizado: $PROJECT_DIR"

      - name: Instalar e preparar Android
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR"

          test -f www/index.html
          test -f capacitor.config.json

          npm install

          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/MENTEX-ORIGINAL-MELHORADO.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-ORIGINAL-MELHORADO-APK
          path: MENTEX-ORIGINAL-MELHORADO.apk
          if-no-files-found: error
          

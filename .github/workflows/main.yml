name: Construir APK MENTEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Encontrar e extrair projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "Procurando projeto MENTEX..."

          PROJECT_DIR=""

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit || true)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "Projeto encontrado diretamente."
          fi

          if [ -z "$PROJECT_DIR" ]; then

            ZIP="./MENTEX_PRONTO_GITHUB_APK.zip"

            if [ ! -f "$ZIP" ]; then
              ZIP=$(find . \
                -type f \
                -name "*.zip" \
                -not -path "./.git/*" \
                -print | head -n 1 || true)
            fi

            if [ -z "$ZIP" ]; then
              echo "ERRO: nenhum ZIP encontrado."
              exit 1
            fi

            echo "ZIP encontrado: $ZIP"

            rm -rf /tmp/mentex
            mkdir -p /tmp/mentex

            unzip -q "$ZIP" -d /tmp/mentex

            SETTINGS=$(find /tmp/mentex \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit || true)

            if [ -z "$SETTINGS" ]; then
              echo "ERRO: settings.gradle não encontrado dentro do ZIP."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")

            echo "Projeto encontrado dentro do ZIP:"
            echo "$PROJECT_DIR"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Conferir projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Projeto:"
          pwd

          echo "Arquivos:"
          ls -la

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app

          echo "Projeto MENTEX OK!"

      - name: Limpar projeto
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean

      - name: Gerar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Localizar APK gerado
        shell: bash
        run: |
          set -e

          echo "Procurando APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/debug/*" \
            -print -quit || true)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            echo ""
            echo "Arquivos APK existentes:"
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" "$GITHUB_WORKSPACE/apk/MENTEX-debug.apk"

          echo ""
          echo "APK preparado para download:"
          ls -lh "$GITHUB_WORKSPACE/apk/MENTEX-debug.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: apk/MENTEX-debug.apk
          if-no-files-found: error


name: MENTEX - Gerar APK Corrigido

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK sem pacote antigo tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'yes'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e
          echo "Arquivos encontrados:"
          find . -maxdepth 4 \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \) -print

          if [ ! -f "./gradlew" ]; then
            echo "ERRO: gradlew não está na raiz do repositório."
            echo "Coloque o projeto Android na raiz ou ajuste o caminho no workflow."
            exit 1
          fi

      - name: Permitir execução do Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          


name: NEXUS 350 - COMPILAR FONTE ORIGINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extrair fonte correta
        shell: bash
        run: |
          set -e

          ZIP="NEXUS350_FONTE_ORIGINAL_SEM_MUDANCAS.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: A fonte original ZIP nao esta na raiz do repositorio."
            echo "Arquivos encontrados:"
            ls -la
            exit 1
          fi

          mkdir -p fonte_nexus
          unzip -oq "$ZIP" -d fonte_nexus

          test -f fonte_nexus/package.json
          test -f fonte_nexus/capacitor.config.json
          test -f fonte_nexus/www/index.html
          test -f fonte_nexus/www/game.js
          test -f fonte_nexus/www/style.css

          echo "FONTE ORIGINAL VALIDADA"

      - name: Instalar dependencias
        working-directory: fonte_nexus
        run: npm install

      - name: Instalar plataforma Android
        working-directory: fonte_nexus
        run: npx cap add android

      - name: Sincronizar Android
        working-directory: fonte_nexus
        run: npx cap sync android

      - name: Compilar APK
        working-directory: fonte_nexus/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-FONTE-ORIGINAL
          path: fonte_nexus/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

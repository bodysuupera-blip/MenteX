
name: LABIRINTO MORTAL - Gerar APK 2.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f settings.gradle && -f app/build.gradle ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [[ -f LabirintoMortal/settings.gradle && -f LabirintoMortal/app/build.gradle ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/LabirintoMortal"
          else
            echo "ERRO: Projeto Android não encontrado."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Configurar Gradle
        run: |
          set -Eeuo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK
        run: |
          set -Eeuo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Verificar APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-2.1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

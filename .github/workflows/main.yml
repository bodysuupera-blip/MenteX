name: Gerar APK MENTEX 3.1

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar projeto MENTEX 3.1
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          ZIP="./MENTEX_Android_3_1_Nova_Tela_Inicial.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado."
            exit 1
          fi

          unzip -o "$ZIP" -d /tmp/mentex

          echo "=== PROJETO MENTEX ==="
          find /tmp/mentex -maxdepth 3 -type f | head -100

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permissão ao Gradle
        run: |
          chmod +x /tmp/mentex/gradlew

      - name: Gerar APK
        run: |
          cd /tmp/mentex
          ./gradlew assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          echo "=== APK GERADO ==="
          find /tmp/mentex -type f -name "*.apk" -print

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-Android-3.1
          path: /tmp/mentex/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

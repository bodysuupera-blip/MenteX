name: MENTEX V4.6 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        run: |
          echo "=== Estrutura do projeto ==="
          ls -la
          echo ""
          echo "=== Módulo app ==="
          ls -la app
          echo ""
          echo "=== Versões ==="
          java -version
          gradle --version

      - name: Limpar projeto
        run: |
          gradle clean

      - name: Compilar APK Debug
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verificar APK gerado
        run: |
          echo "=== APKs encontrados ==="
          find app/build/outputs -type f -name "*.apk" -print

          if ! find app/build/outputs -type f -name "*.apk" | grep -q .; then
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          fi

      - name: Renomear APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK Debug não encontrado."
            exit 1
          fi

          cp "$APK" "MENTEX-V4.6.apk"

          echo "APK final:"
          ls -lh MENTEX-V4.6.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: MENTEX-V4.6.apk
          if-no-files-found: error

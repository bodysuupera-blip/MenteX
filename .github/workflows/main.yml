name: Construir APK MENTEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Encontrar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "Procurando settings.gradle..."

          PROJECT_DIR=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Não encontrei settings.gradle."
            echo ""
            echo "Arquivos existentes no GitHub:"
            find . -maxdepth 5 -type f -not -path "./.git/*" | sort
            exit 1
          fi

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar projeto
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Projeto: $PWD"
          ls -la

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo "Projeto MENTEX OK!"

      - name: Limpar projeto
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean

      - name: Gerar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

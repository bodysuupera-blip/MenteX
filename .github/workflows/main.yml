name: MENTEX V4.8 - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Encontrar projeto Android
        shell: bash
        run: |
          set -e

          echo "Procurando settings.gradle..."

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            echo "O repositorio precisa conter o projeto Android."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar modulo app
        shell: bash
        run: |
          set -e

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "Modulo app encontrado."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug
          else
            wget -q \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp

            export PATH="/tmp/gradle-8.7/bin:$PATH"

            gradle clean assembleDebug
          fi

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          mkdir -p resultado

          cp "$APK" \
            resultado/MENTEX-V4.8-ATUALIZADO.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-ATUALIZADO
          path: resultado/MENTEX-V4.8-ATUALIZADO.apk
          if-no-files-found: error

name: MENTEX V4.6 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Procurar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROCURANDO PROJETO MENTEX"
          echo "========================================"

          ZIP="MENTEX-V4.6-REDONDO-TELA-INTEIRA-CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado."
            echo ""
            echo "Arquivos disponíveis:"
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q \
            "MENTEX-V4.6-REDONDO-TELA-INTEIRA-CORRIGIDO.zip" \
            -d android-project

          echo "========================================"
          echo "PROJETO EXTRAÍDO"
          echo "========================================"

          find android-project -maxdepth 3 -type f | sort

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "========================================"
          echo "PROJETO ANDROID:"
          echo "$PROJECT_DIR"
          echo "========================================"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFICANDO PROJETO"
          echo "========================================"

          ls -la "$PROJECT_DIR"

          echo ""
          echo "Módulo app:"
          ls -la "$PROJECT_DIR/app"

          echo ""
          echo "Build Gradle:"
          ls -l "$PROJECT_DIR"/build.gradle* || true
          ls -l "$PROJECT_DIR/app"/build.gradle* || true

      - name: Verificar Java e Gradle
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Limpar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "COMPILANDO MENTEX V4.6"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROCURANDO APK"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: APK não foi encontrado."
            echo ""
            echo "Arquivos em build/outputs:"
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print || true
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.apk"

          echo ""
          echo "APK final:"
          ls -lh \
            "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: apk-final/MENTEX-V4.6.apk
          if-no-files-found: error
          retention-days: 7

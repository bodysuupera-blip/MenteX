name: MENTEX V4.6.3 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6.3
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. BAIXAR PROJETO DO GITHUB
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. CONFIGURAR JAVA 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. CONFIGURAR GRADLE 8.7
      # ============================================================
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ============================================================
      # 4. PROCURAR ZIP DO MENTEX
      # ============================================================
      - name: Procurar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " PROCURANDO ZIP DO MENTEX V4.6.3"
          echo "=========================================="

          ZIP="MENTEX-V4.6.3-CONTROLES-MAIORES.zip"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERRO: arquivo não encontrado:"
            echo "$ZIP"
            echo ""
            echo "ZIPs encontrados:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      # ============================================================
      # 5. EXTRAIR PROJETO
      # ============================================================
      - name: Extrair projeto Android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " EXTRAINDO PROJETO ANDROID"
          echo "=========================================="

          rm -rf android-project
          mkdir -p android-project

          unzip -q \
            "MENTEX-V4.6.3-CONTROLES-MAIORES.zip" \
            -d android-project

          echo ""
          echo "Projeto extraído."

          echo ""
          echo "Estrutura encontrada:"
          find android-project \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

      # ============================================================
      # 6. LOCALIZAR PROJETO ANDROID
      # ============================================================
      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " LOCALIZANDO PROJETO ANDROID"
          echo "=========================================="

          SETTINGS=$(find android-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo ""
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo ""
          echo "Pasta app encontrada."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 7. VERIFICAR PROJETO
      # ============================================================
      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo " VERIFICANDO PROJETO"
          echo "=========================================="

          echo ""
          echo "Diretório:"
          pwd

          echo ""
          echo "Arquivos:"
          ls -la

          echo ""
          echo "Pasta APP:"
          ls -la app

          echo ""
          echo "Build Gradle:"
          cat build.gradle

          echo ""
          echo "Build do APP:"
          cat app/build.gradle

          echo ""
          echo "Settings:"
          cat settings.gradle

      # ============================================================
      # 8. VERIFICAR JAVA E GRADLE
      # ============================================================
      - name: Verificar Java e Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          gradle --version

      # ============================================================
      # 9. LIMPAR PROJETO
      # ============================================================
      - name: Limpar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo " LIMPANDO PROJETO"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 10. COMPILAR APK DEBUG
      # ============================================================
      - name: Compilar APK Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo " COMPILANDO MENTEX V4.6.3"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 11. LOCALIZAR APK
      # ============================================================
      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " PROCURANDO APK"
          echo "=========================================="

          echo ""
          echo "Todos os APKs encontrados:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: APK não foi encontrado."

            echo ""
            echo "Conteúdo de build/outputs:"

            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          # Criar pasta final
          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          # Copiar APK
          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.3.apk"

          echo ""
          echo "=========================================="
          echo " APK FINAL"
          echo "=========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.3.apk"

      # ============================================================
      # 12. PUBLICAR APK COMO ARTIFACT
      # ============================================================
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.3-APK
          path: apk-final/MENTEX-V4.6.3.apk
          if-no-files-found: error
          retention-days: 7

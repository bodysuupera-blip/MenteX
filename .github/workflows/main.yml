
name: CÃO FUJÃO 2.0 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR="$(dirname "$(find . -name settings.gradle -not -path '*/.gradle/*' -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.0-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          

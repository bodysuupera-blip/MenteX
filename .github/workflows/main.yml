
name: CAO FUJAO 2.2 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 2.2
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        run: |
          set -Eeuo pipefail
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/intro.png
          grep -q 'com.caofujao.game' app/build.gradle
          grep -q "versionName '2.2'" app/build.gradle
          echo "CÃO FUJÃO 2.2 CONFIRMADO"

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

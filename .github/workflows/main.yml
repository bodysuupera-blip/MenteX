name: MENTEX - Reconstruir APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Reconstruir aplicativo
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Configurar SDK e verificar ferramentas
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não foi encontrado."
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f \
              2>/dev/null | head -n 30
            exit 1
          fi

          echo "SDK Manager encontrado: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Localizar APK original
        id: original
        run: |
          APK=$(find . -maxdepth 4 -type f -iname '*.apk' \
            ! -name '*atualizado*' \
            ! -name '*reconstruido*' \
            ! -name '*alinhado*' \
            ! -name '*unsigned*' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK original não encontrado no repositório."
            exit 1
          fi

          echo "APK encontrado: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Baixar Apktool
        run: |
          curl -fL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            -o apktool.jar

      - name: Decodificar APK
        run: |
          java -jar apktool.jar d \
            "${{ steps.original.outputs.path }}" \
            -o mentex-decoded \
            -f

      - name: Atualizar rolagem da interface
        run: |
          HTML="mentex-decoded/assets/www/index.html"

          if [ ! -f "$HTML" ]; then
            echo "ERRO: assets/www/index.html não encontrado."
            exit 1
          fi

          python3 - "$HTML" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              html = f.read()

          css = """
          <style id="mentex-scroll-update">
          html, body {
            min-height: 100% !important;
            height: auto !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
          }
          body {
            touch-action: pan-y !important;
          }
          #profile:not(.hidden) {
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
            padding-bottom: 100px !important;
          }
          </style>
          """

          if "mentex-scroll-update" not in html:
              if "</head>" in html:
                  html = html.replace("</head>", css + "\n</head>", 1)
              else:
                  html = css + "\n" + html

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)

          print("Alteração de rolagem aplicada.")
          PY

      - name: Reconstruir APK
        run: |
          java -jar apktool.jar b mentex-decoded \
            -o MENTEX-reconstruido.apk
          test -s MENTEX-reconstruido.apk

      - name: Alinhar APK
        run: |
          zipalign -f -v 4 \
            MENTEX-reconstruido.apk \
            MENTEX-alinhado.apk

      - name: Criar chave de assinatura
        run: |
          keytool -genkeypair \
            -keystore mentex-temp.jks \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX, O=MENTEX, C=BR"

      - name: Assinar e verificar APK
        run: |
          apksigner sign \
            --ks mentex-temp.jks \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out MENTEX-atualizado.apk \
            MENTEX-alinhado.apk

          apksigner verify --verbose MENTEX-atualizado.apk
          test -s MENTEX-atualizado.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: MENTEX-atualizado.apk
          if-no-files-found: error


name: MENTEX - Atualizar Jogador e Perfil

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  atualizar-mentex:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Localizar APK
        id: apk
        run: |
          APK=$(find . -type f -iname "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Nenhum APK encontrado no repositório."
            exit 1
          fi
          echo "arquivo=$APK" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: $APK"

      - name: Extrair arquivos do APK
        run: |
          mkdir -p trabalho
          unzip -q "${{ steps.apk.outputs.arquivo }}" -d trabalho

      - name: Aplicar rolagem
        run: |
          HTML=$(find trabalho -type f -path "*/assets/www/index.html" | head -n 1)

          if [ -z "$HTML" ]; then
            echo "index.html não encontrado em assets/www."
            echo "Este APK pode não usar uma interface HTML."
            exit 1
          fi

          cat > /tmp/mentex-scroll.html <<'EOF'
          <style id="mentex-jogador-perfil-scroll">
          html, body {
            min-height: 100% !important;
            height: auto !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
          }

          body {
            touch-action: pan-y !important;
          }

          #profile:not(.hidden),
          #player:not(.hidden),
          #ranking:not(.hidden) {
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
            padding-bottom: 100px !important;
            touch-action: pan-y !important;
          }

          #game:not(.hidden) {
            position: fixed !important;
            inset: 0 !important;
            height: 100vh !important;
            height: 100dvh !important;
            overflow: hidden !important;
          }
          </style>
          EOF

          if ! grep -q "mentex-jogador-perfil-scroll" "$HTML"; then
            python3 - "$HTML" <<'PY'
          import sys
          p = sys.argv[1]
          with open(p, encoding="utf-8") as f:
              html = f.read()
          with open("/tmp/mentex-scroll.html", encoding="utf-8") as f:
              css = f.read()
          if "</head>" in html:
              html = html.replace("</head>", css + "\n</head>", 1)
          else:
              html = css + "\n" + html
          with open(p, "w", encoding="utf-8") as f:
              f.write(html)
          PY
          fi

      - name: Criar pacote atualizado
        run: |
          cd trabalho
          zip -qr "$GITHUB_WORKSPACE/MENTEX-arquivos-atualizados.zip" .

      - name: Disponibilizar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-arquivos-atualizados
          path: MENTEX-arquivos-atualizados.zip
          if-no-files-found: error
          

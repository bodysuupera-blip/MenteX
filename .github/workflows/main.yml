name: Gerar APK MENTEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # BAIXAR CÓDIGO
      # ==============================
      - name: Baixar código
        uses: actions/checkout@v4

      # ==============================
      # PREPARAR PROJETO MENTEX
      # ==============================
      - name: Preparar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "Arquivos do repositório:"
          ls -la

          echo "Procurando ZIP do MENTEX..."

          BASE_ZIP=""

          for arquivo in \
            MENTEX_300_FASES_MOEDAS_10_MAPA_ANTIGO.zip \
            MENTEX_300_FASES_MAPA_ANTIGO.zip \
            MENTEX_300_FASES_10_CORACOES_LOJA.zip \
            MENTEX_Android_3_9_2_5_CORACOES_SEM_CRASH.zip
          do
            if [ -f "$arquivo" ]; then
              BASE_ZIP="$arquivo"
              break
            fi
          done

          if [ -z "$BASE_ZIP" ]; then
            BASE_ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)
          fi

          if [ -z "$BASE_ZIP" ]; then
            echo "ERRO: Nenhum ZIP do MENTEX encontrado."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$BASE_ZIP"

          rm -rf extracted_mentex
          mkdir -p extracted_mentex

          unzip -q "$BASE_ZIP" -d extracted_mentex

          echo "Conteúdo extraído:"
          find extracted_mentex -maxdepth 3 -type f | head -100

          # ==============================
          # LOCALIZAR PROJETO ANDROID
          # ==============================

          PROJECT_DIR=""

          if [ -f "extracted_mentex/settings.gradle" ]; then
            PROJECT_DIR="extracted_mentex"

          elif [ -f "extracted_mentex/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted_mentex"

          else

            FOUND=$(find extracted_mentex \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit || true)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERRO: Projeto Android não encontrado."

            echo "Procurando arquivos Gradle:"

            find extracted_mentex \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print

            exit 1

          fi

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==============================
      # VERIFICAR PROJETO
      # ==============================
      - name: Verificar projeto MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Diretório atual:"
          pwd

          echo "Arquivos:"
          ls -la

          echo "Verificando Gradle:"

          if [ -f "gradlew" ]; then

            chmod +x gradlew

            ./gradlew --version

          else

            echo "gradlew não encontrado."

          fi

          echo "Verificando arquivos do MENTEX:"

          find . -type f \
            \( -iname "*.png" \
            -o -iname "*.jpg" \
            -o -iname "*.jpeg" \
            -o -iname "*.wav" \
            -o -iname "*.mp3" \
            -o -iname "*.html" \) \
            -print | head -100

      # ==============================
      # JAVA 17
      # ==============================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==============================
      # GRADLE 8.7
      # ==============================
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==============================
      # GERAR APK
      # ==============================
      - name: Gerar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then

            ./gradlew assembleDebug --stacktrace

          else

            gradle assembleDebug --stacktrace

          fi

      # ==============================
      # LOCALIZAR APK
      # ==============================
      - name: Localizar APK
        shell: bash
        run: |
          set -e

          echo "Procurando APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERRO: APK não foi gerado."

            exit 1

          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk_final"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk_final/MENTEX-debug.apk"

      # ==============================
      # DISPONIBILIZAR APK
      # ==============================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-${{ github.run_id }}-${{ github.run_attempt }}
          path: apk_final/MENTEX-debug.apk
          if-no-files-found: error

name: Construir APK MENTEX Final

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK MENTEX Final
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Procurar ZIP MENTEX
        shell: bash
        run: |
          echo "======================================"
          echo "PROCURANDO ZIP DO MENTEX"
          echo "======================================"

          ZIP=$(find . -maxdepth 1 -type f -name 'MENTEX_Android*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP MENTEX encontrado."
            ls -lah
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          mkdir -p android_project
          unzip -o "$ZIP" -d android_project

      - name: Encontrar projeto Gradle
        id: projeto
        shell: bash
        run: |
          echo "======================================"
          echo "PROCURANDO PROJETO ANDROID"
          echo "======================================"

          SETTINGS=""

          while IFS= read -r file; do
            SETTINGS="$file"
            break
          done < <(find android_project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \))

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find android_project -maxdepth 6 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar projeto
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          echo "Arquivos do projeto:"
          ls -la

          echo ""
          echo "Arquivos Java/Kotlin:"
          find app/src/main -type f \( -name '*.java' -o -name '*.kt' \) -print

      - name: Corrigir dependências Kotlin
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

          echo "Dependências Kotlin ajustadas."

      - name: Limpar projeto
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"
          gradle clean --no-daemon

      - name: Construir APK
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          echo "======================================"
          echo "CONSTRUINDO APK MENTEX"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            -x compileDebugKotlin

      - name: Procurar APK
        shell: bash
        run: |
          echo "======================================"
          echo "APKs ENCONTRADOS"
          echo "======================================"

          find android_project -type f -name '*.apk' -print

      - name: Verificar APK
        shell: bash
        run: |
          APK=$(find android_project -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          ls -lh "$APK"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-Final
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

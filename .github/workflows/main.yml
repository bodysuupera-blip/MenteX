
name: MENTEX - Preparar APK com ícone ampliado

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip findutils

      - name: Localizar ZIP e imagem do ícone
        run: |
          set -euo pipefail
          echo "Arquivos encontrados:"
          find . -maxdepth 4 -type f | head -200
          echo "Procurando projeto Android..."
          if find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) | grep -q .; then
            echo "Projeto Gradle localizado."
          else
            echo "AVISO: projeto Android completo não encontrado."
            echo "Um APK existente não pode ser reconstruído só com este workflow."
          fi

      - name: Preparar pacote com o ícone ampliado
        run: |
          set -euo pipefail
          mkdir -p resultado
          find . -type f -iname 'mentex_icon_ampliado.png' \
            -exec cp {} resultado/mentex_icon_ampliado.png \;

          if [ ! -f resultado/mentex_icon_ampliado.png ]; then
            find . -type f \( -iname 'mentex_icon.png' \
              -o -iname 'ic_launcher.png' \) \
              | head -1 | while read -r arquivo; do
                cp "$arquivo" resultado/mentex_icon_ampliado.png
              done
          fi

          if [ -f resultado/mentex_icon_ampliado.png ]; then
            echo "Ícone incluído no pacote."
          else
            echo "Ícone não encontrado. Envie a imagem para o repositório."
            exit 1
          fi

          zip -j resultado/MENTEX-icone-ampliado.zip \
            resultado/mentex_icon_ampliado.png

      - name: Compilar APK se houver projeto Android
        run: |
          set -euo pipefail
          if [ -f gradlew ] && \
             find . -maxdepth 3 -type f \
             \( -name settings.gradle \
             -o -name settings.gradle.kts \) | grep -q .; then
            chmod +x gradlew
            ./gradlew assembleDebug
            mkdir -p resultado/apk
            find . -type f -path '*/build/outputs/apk/*/*.apk' \
              -exec cp {} resultado/apk/ \;
          else
            echo "Sem projeto Android completo: APK não compilado."
          fi

      - name: Disponibilizar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-resultado
          path: resultado/
          if-no-files-found: error
          

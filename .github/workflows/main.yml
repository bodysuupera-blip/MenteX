name: Compilar MENTEX V4.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar projeto Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " PROCURANDO PROJETO ANDROID MENTEX"
          echo "======================================"

          # Primeiro verifica se o projeto já está na raiz
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Projeto encontrado na raiz."
            exit 0
          fi

          # Cria diretório temporário
          mkdir -p /tmp/mentex_extract

          FOUND=""

          echo ""
          echo "Procurando dentro dos arquivos ZIP..."

          while IFS= read -r ZIP; do

            echo ""
            echo "Verificando:"
            echo "$ZIP"

            if unzip -l "$ZIP" 2>/dev/null | grep -Eq '(^|/)(settings\.gradle|settings\.gradle\.kts)$'; then
              echo "PROJETO ANDROID ENCONTRADO!"
              FOUND="$ZIP"
              break
            fi

          done < <(find . -type f -iname "*.zip" | sort)

          if [ -z "$FOUND" ]; then
            echo ""
            echo "======================================"
            echo " ERRO"
            echo "======================================"
            echo "Nenhum ZIP contendo settings.gradle foi encontrado."
            echo ""
            echo "O arquivo precisa conter um projeto Android completo."
            exit 1
          fi

          echo ""
          echo "ZIP escolhido:"
          echo "$FOUND"

          rm -rf /tmp/mentex_extract/*
          unzip -q "$FOUND" -d /tmp/mentex_extract

          echo ""
          echo "Localizando settings.gradle extraído..."

          SETTINGS=$(find /tmp/mentex_extract -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não foi localizado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "Projeto Android:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > /tmp/mentex_project_dir

          echo ""
          echo "Conteúdo do projeto:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -150

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat /tmp/mentex_project_dir)

          echo "Verificando:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "Gradle Wrapper encontrado."
          else
            echo "Gradle Wrapper não encontrado."
            echo "Será usado o Gradle 8.7."
          fi

          echo "Projeto Android OK."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat /tmp/mentex_project_dir)

          echo "======================================"
          echo " COMPILANDO MENTEX V4.2"
          echo "======================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Localizar APK
        shell: bash
        run: |
          echo "======================================"
          echo " APK GERADO"
          echo "======================================"

          find /tmp/mentex_extract -type f -name "*.apk" -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.2-APK
          path: |
            /tmp/mentex_extract/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

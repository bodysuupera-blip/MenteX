
name: MENTEX - Extrair Projeto e Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Extrair projeto MENTEX
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MENTEX-4.7-PROJETO-RECONSTRUIDO-CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP do projeto não encontrado."
            ls -lah
            exit 1
          fi

          mkdir -p projeto
          unzip -oq "$ZIP" -d projeto

          ROOT=$(find projeto -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find projeto -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$ROOT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: arquivo build.gradle do aplicativo não encontrado."
            exit 1
          fi

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aplicar novo icone MENTEX
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MENTEX-ICONE-MELHORADO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP do icone não encontrado."
            exit 1
          fi

          mkdir -p /tmp/mentex-icon
          unzip -oq "$ZIP" -d /tmp/mentex-icon

          ICON_DIR=$(find /tmp/mentex-icon \
            -type d -path '*/android/app/src/main/res' \
            -print -quit)

          APP_DIR="$PROJECT_DIR/app/src/main/res"

          if [ -z "$ICON_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "ERRO: estrutura de icones não encontrada."
            exit 1
          fi

          cp -R "$ICON_DIR"/. "$APP_DIR"/
          echo "Icone aplicado."

      - name: Compilar aplicativo
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --version
          gradle clean assembleDebug --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-ATUALIZADO
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
          

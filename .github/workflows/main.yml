
name: MENTEX V4.9 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Preparar e compilar MENTEX
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Extrair e localizar projeto Android
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/mentex-extraido"

          FOUND=""

          for ZIP in \
            "MENTEX_PRONTO_GITHUB_APK.zip" \
            "MENTEX_RECONSTRUIDO_10_CORACOES_250_FASES.zip" \
            "MENTEX_Rafael_FINAL_10_CORACOES_250_FASES_JOGO_COMPLETO_CORRIGIDO.zip" \
            "MENTEX_Rafael_FINAL_10_CORACOES_250_FASES_JOGO_COMPLETO.zip" \
            "MENTEX_Rafael_10_CORACOES_250_FASES_JOGO_COMPLETO.zip" \
            *.zip
          do
            [ -f "$ZIP" ] || continue

            DEST="$RUNNER_TEMP/mentex-extraido/$(basename "$ZIP" .zip)"
            mkdir -p "$DEST"

            echo "Verificando: $ZIP"

            if ! unzip -oq "$ZIP" -d "$DEST"; then
              echo "Não foi possível extrair $ZIP"
              continue
            fi

            GRADLEW="$(find "$DEST" -type f -name gradlew \
              -not -path '*/build/*' -print -quit)"

            if [ -n "$GRADLEW" ]; then
              FOUND="$GRADLEW"
              echo "Projeto encontrado em: $FOUND"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "ERRO: nenhum ZIP contém o arquivo gradlew."
            echo "O pacote pode conter somente arquivos web ou APK."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$FOUND")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado em $PROJECT_DIR"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERRO: pasta app não encontrada em $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x ./gradlew

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.9-APK
          path: ${{ runner.temp }}/mentex-extraido/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          

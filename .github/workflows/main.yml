
name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujão Atualizado
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Extrair projeto atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP=$(find . -maxdepth 3 -type f \
            -name 'CAO-FUJAO-ATUALIZACAO-FUNCIONALIDADES.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP atualizado nao encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/cao-fujao"

          unzip -oq "$ZIP" -d "$RUNNER_TEMP/cao-fujao"

          SETTINGS=$(find "$RUNNER_TEMP/cao-fujao" \
            -type f -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERRO: app/build.gradle nao encontrado."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $PROJECT"

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT" clean assembleDebug

      - name: Localizar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK=$(find "$PROJECT/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/CAO-FUJAO-ATUALIZADO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-ATUALIZADO
          path: resultado/CAO-FUJAO-ATUALIZADO.apk
          if-no-files-found: error
          

name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivo MENTEX
        run: |
          echo "Arquivos disponíveis:"
          ls -lh
          echo ""
          echo "Procurando ZIP atualizado:"
          ls -lh MENTEX_Android_2_8_Voz_Atualizada.zip

      - name: Preparar projeto MENTEX
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          unzip -o MENTEX_Android_2_8_Voz_Atualizada.zip -d /tmp/mentex

          echo ""
          echo "Projeto extraído:"
          find /tmp/mentex -maxdepth 3 -type f | head -100

      - name: Verificar áudio da voz
        run: |
          echo "Procurando arquivos de áudio:"
          find /tmp/mentex -type f -name "*.mp3" -o -name "*.wav" -o -name "*.ogg" -print

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: |
          cd /tmp/mentex
          grad

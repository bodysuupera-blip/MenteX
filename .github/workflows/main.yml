name: Compilador MENTEX V4.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos do repositório:"
          ls -la

          ZIP="MENTEX-V4.6-CEREBRO-PERGUNTA-ACERTO-ERRO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado:"
            echo "$ZIP"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          rm -rf projeto
          mkdir -p projeto

          echo "Extraindo projeto..."
          unzip -o "$ZIP" -d projeto

          echo "Projeto extraído:"
          find projeto -maxdepth 4 -type f | sort

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "projeto/mentex/settings.gradle" ]; then
            PROJECT_DIR="projeto/mentex"
          elif [ -f "projeto/mentex/settings.gradle.kts" ]; then
            PROJECT_DIR="projeto/mentex"
          else
            SETTINGS=$(find projeto -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) | head -1)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Projeto Android não encontrado."
            find projeto -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Diretório atual:"
          pwd

          echo "Arquivos:"
          ls -la

          echo "Build Gradle:"
          if [ -f "build.gradle" ]; then
            cat build.gradle
          elif [ -f "build.gradle.kts" ]; then
            cat build.gradle.kts
          fi

      - name: Compilar APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Iniciando compilação..."

          gradle assembleDebug --stacktrace

      - name: Procurar APK
        shell: bash
        run: |
          echo "================================"
          echo "APKs encontrados:"
          echo "================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

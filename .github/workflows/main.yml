name: MENTEX V5.0 - Gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MENTEX-V5.0-PROJETO.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V5.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -e

          if [ -f "MENTEX-V5.0-PROJETO.zip" ]; then
            echo "Extraindo projeto MENTEX V5.0..."
            mkdir -p "$RUNNER_TEMP/mentex-project"
            unzip -o "MENTEX-V5.0-PROJETO.zip" \
              -d "$RUNNER_TEMP/mentex-project"
            PROJECT="$RUNNER_TEMP/mentex-project"
          elif [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            echo "::error::Não encontrei MENTEX-V5.0-PROJETO.zip nem o projeto Android."
            echo "Envie MENTEX-V5.0-PROJETO.zip para a raiz do repositório."
            exit 1
          fi

          SETTINGS="$(find "$PROJECT" -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::O ZIP não contém settings.gradle."
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Não encontrei app/build.gradle na pasta do projeto."
            find "$PROJECT" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT"

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            echo "::error::O projeto não contém gradlew."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.0-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

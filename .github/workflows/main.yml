name: Gerar APK MENTEX 3.6

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto MENTEX 3.6
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          ZIP="./MENTEX_Android_3_6_Entrada_Corrigida.zip"

          echo "=== VERIFICANDO ZIP ==="

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado."
            echo ""
            echo "Arquivos ZIP encontrados no repositório:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          unzip -o "$ZIP" -d /tmp/mentex

          echo ""
          echo "=== ARQUIVOS DO PROJETO ==="
          find /tmp/mentex -maxdepth 5 -type f | sort

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find /tmp/mentex \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo ""
            echo "Conteúdo encontrado:"
            find /tmp/mentex -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto Android encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar projeto Android
        run: |
          cd "$PROJECT_DIR"

          echo "=== DIRETÓRIO DO PROJETO ==="
          pwd

          echo ""
          echo "=== CONTEÚDO ==="
          ls -la

          echo ""
          echo "=== VERIFICAÇÕES ==="

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERRO: build.gradle não encontrado."
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

          chmod +x gradlew

          echo "Projeto Android OK."

      - name: Gerar APK MENTEX 3.6
        run: |
          cd "$PROJECT_DIR"

          echo "=== INICIANDO BUILD ==="

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Localizar APK
        run: |
          echo "=== APK GERADO ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Verificar se APK existe
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-Android-3.6
          path: |
            /tmp/mentex/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

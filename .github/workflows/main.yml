
name: Gerar APK MENTEX V5.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  construir:
    name: Compilar MENTEX
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Cordova
        run: npm install -g cordova@12.0.0

      - name: Adicionar Android
        run: cordova platform add android@13.0.0

      - name: Gerar APK
        run: cordova build android --debug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-V5.1
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

name: Construir APK MENTEX Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK MENTEX V4.0
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos do repositório:"
          ls -la

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -n "$ZIP" ]; then
            echo "ZIP encontrado: $ZIP"
            mkdir -p mentex
            unzip -o "$ZIP" -d mentex
          else
            echo "Nenhum arquivo ZIP encontrado."
          fi

          echo ""
          echo "Procurando projeto Gradle..."
          find . -maxdepth 5 -type f \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          -print

      - name: Corrigir compatibilidade Java/Kotlin 17
        shell: bash
        run: |
          set -e

          APP_GRADLE=$(find . -path "*/app/build.gradle" -type f | head -1)

          if [ -n "$APP_GRADLE" ]; then
            echo "Arquivo encontrado: $APP_GRADLE"

            cat >> "$APP_GRADLE" <<'EOF'

            // Compatibilidade Java 17
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            EOF
          else
            echo "Aviso: app/build.gradle não encontrado."
          fi

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto Android
        shell: bash
        run: |
          set -e

          if [ ! -f "mentex/gradlew" ] && [ ! -f "gradlew" ]; then
            echo "ERRO: Não foi encontrado gradlew."
            echo ""
            echo "O arquivo ZIP precisa conter um projeto Android/Gradle."
            echo "Estrutura esperada:"
            echo "  gradlew"
            echo "  settings.gradle"
            echo "  build.gradle"
            echo "  app/"
            exit 1
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          if [ -f "mentex/gradlew" ]; then
            cd mentex
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-V4
          path: |
            mentex/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if

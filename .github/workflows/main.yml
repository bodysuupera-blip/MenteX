
name: CAO FUJAO 3.0 - ATUALIZAR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DOC-20261107-WA0017.apk'
      - 'CAO_FUJAO_ATUALIZACAO_CODIGO.zip'
      - '.github/workflows/CAO-FUJAO-3-0.yml'

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Conferir arquivos
        shell: bash
        run: |
          set -euo pipefail

          test -s DOC-20261107-WA0017.apk || {
            echo "ERRO: APK original nao encontrado."
            exit 1
          }

          test -s CAO_FUJAO_ATUALIZACAO_CODIGO.zip || {
            echo "ERRO: ZIP de atualizacao nao encontrado."
            exit 1
          }

          echo "Arquivos encontrados."

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y apktool unzip

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas de assinatura
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "build-tools;35.0.0"

          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Extrair atualizacao
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p atualizacao

          unzip -oq CAO_FUJAO_ATUALIZACAO_CODIGO.zip \
            -d atualizacao

          UPDATE="$(find atualizacao \
            -type f -name index.html -print -quit)"

          if [ -z "$UPDATE" ]; then
            echo "ERRO: index.html nao encontrado no ZIP."
            exit 1
          fi

          test -s "$UPDATE"

          mkdir -p trabalho
          cp "$UPDATE" trabalho/index.html

          echo "Atualizacao encontrada."

      - name: Desmontar APK original
        shell: bash
        run: |
          set -euo pipefail

          apktool d -f \
            DOC-20261107-WA0017.apk \
            -o projeto_decodificado

          test -f projeto_decodificado/assets/index.html || {
            echo "ERRO: APK nao possui assets/index.html."
            exit 1
          }

      - name: Aplicar novas funcionalidades
        shell: bash
        run: |
          set -euo pipefail

          cp trabalho/index.html \
            projeto_decodificado/assets/index.html

          echo "Atualizacao aplicada ao Cão Fujão."

      - name: Reconstruir aplicativo
        shell: bash
        run: |
          set -euo pipefail

          apktool b projeto_decodificado \
            -o CAO-FUJAO-3.0-unsigned.apk

          test -s CAO-FUJAO-3.0-unsigned.apk

      - name: Alinhar APK
        shell: bash
        run: |
          set -euo pipefail

          zipalign -f -v 4 \
            CAO-FUJAO-3.0-unsigned.apk \
            CAO-FUJAO-3.0-aligned.apk

      - name: Assinar aplicativo
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore cao-fujao-debug.keystore \
            -storepass android \
            -keypass android \
            -alias cao-fujao \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Cao Fujao, OU=Games, O=Supera Games, L=Brasil, C=BR"

          apksigner sign \
            --ks cao-fujao-debug.keystore \
            --ks-key-alias cao-fujao \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out CAO-FUJAO-3.0.apk \
            CAO-FUJAO-3.0-aligned.apk

          apksigner verify CAO-FUJAO-3.0.apk

      - name: Conferir aplicativo final
        shell: bash
        run: |
          set -euo pipefail

          test -s CAO-FUJAO-3.0.apk

          mkdir -p saida
          cp CAO-FUJAO-3.0.apk saida/

          sha256sum saida/CAO-FUJAO-3.0.apk
          ls -lh saida/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-3.0-APK
          path: saida/CAO-FUJAO-3.0.apk
          if-no-files-found: error
          

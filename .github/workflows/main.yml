
name: MENTEX V4.6.4 - Diagnostico e APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnosticar repositorio
        shell: bash
        run: |
          set -eu

          echo "=== DIRETORIO ==="
          pwd

          echo "=== ARQUIVOS PRINCIPAIS ==="
          ls -la

          echo "=== ARQUIVOS ANDROID E GRADLE ==="
          find . -type f \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name AndroidManifest.xml \
            -o -name '*.apk' \
            -o -name 'gradle-wrapper.properties' \) \
            -not -path './.git/*' -print

      - name: Localizar projeto Gradle
        id: projeto
        shell: bash
        run: |
          set -eu

          WRAPPER="$(find . -type f -name gradlew \
            -not -path './.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::Projeto Gradle não encontrado: falta gradlew."
            exit 1
          fi

          DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$DIR/settings.gradle" ] && \
             [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "::error::Falta settings.gradle ou settings.gradle.kts."
            exit 1
          fi

          chmod +x "$WRAPPER"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.projeto.outputs.dir }}
        run: |
          set -eu
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Localizar APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.projeto.outputs.dir }}
        run: |
          set -eu

          mkdir -p saida

          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -exec cp {} saida/ \;

          if ! find saida -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "::error::A compilação não produziu APK."
            exit 1
          fi

          ls -lh saida

      - name: Criar ZIP
        shell: bash
        run: |
          set -eu
          zip -j MENTEX-V4.6.4-PACOTE.zip saida/*.apk

      - name: Publicar arquivos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4
          path: |
            saida/*.apk
            MENTEX-V4.6.4-PACOTE.zip
          if-no-files-found: error
          retention-days: 14
          

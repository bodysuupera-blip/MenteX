name: MENTEX V4.6.4 - Gerar APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
preparar-apk:
name: Compilar MENTEX
runs-on: ubuntu-22.04

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Baixar código do repositório
    uses: actions/checkout@v4

  - name: Configurar Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Verificar Android SDK
    shell: bash
    run: |
      set -e
      echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      if [ ! -d "$ANDROID_HOME" ]; then
        echo "Android SDK não encontrado em $ANDROID_HOME"
        exit 1
      fi

      SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
        -type f -name sdkmanager 2>/dev/null | head -n 1)"

      if [ -z "$SDKMANAGER" ]; then
        echo "ERRO: sdkmanager não encontrado."
        exit 1
      fi

      "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Verificar estrutura do projeto
    shell: bash
    run: |
      set -e
      echo "Conteúdo da raiz:"
      ls -la

      if [ ! -f settings.gradle ] && \
         [ ! -f settings.gradle.kts ]; then
        echo "ERRO: settings.gradle não encontrado."
        exit 1
      fi

      if [ ! -f app/build.gradle ] && \
         [ ! -f app/build.gradle.kts ]; then
        echo "ERRO: configuração do módulo app não encontrada."
        exit 1
      fi

  - name: Instalar Gradle 8.7
    shell: bash
    run: |
      set -e
      curl -fL \
        https://services.gradle.org/distributions/gradle-8.7-bin.zip \
        -o "$RUNNER_TEMP/gradle.zip"

      unzip -q "$RUNNER_TEMP/gradle.zip" \
        -d "$RUNNER_TEMP"

      echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

  - name: Aceitar licenças Android
    shell: bash
    run: |
      set -e
      SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
        -type f -name sdkmanager 2>/dev/null | head -n 1)"

      yes | "$SDKMANAGER" \
        --sdk_root="$ANDROID_HOME" --licenses || true

  - name: Compilar APK
    shell: bash
    run: |
      set -e
      gradle --version
      gradle --no-daemon --stacktrace assembleDebug

  - name: Publicar APK
    uses: actions/upload-artifact@v4
    with:
      name: MENTEX-V4.6.4-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14

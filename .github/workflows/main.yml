
name: LABIRINTO FANTASMA - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Verificar arquivos do jogo
        run: |
          set -e
          test -f labirinto-fantasma/package.json
          test -f labirinto-fantasma/capacitor.config.json
          test -f labirinto-fantasma/www/index.html
          echo "Arquivos encontrados!"

      - name: Instalar dependencias
        working-directory: labirinto-fantasma
        run: |
          set -e
          npm install
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        working-directory: labirinto-fantasma/android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Conferir APK
        run: |
          set -e
          APK="labirinto-fantasma/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-FANTASMA-APK
          path: labirinto-fantasma/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

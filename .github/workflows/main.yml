name: Construir APK MENTEX Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK MENTEX Final
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Limpar projeto
        run: ./gradlew clean

      - name: Construir APK Debug
        run: ./gradlew assembleDebug

      - name: Verificar APK
        run: |
          echo "APKs encontrados:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Resumo da compilação
        run: |
          echo "================================="
          echo " APK MENTEX GERADO COM SUCESSO "
          echo "================================="
          ls -lh app/build/outputs/apk/debug/

name: MENTEX - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair arquivos ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/mentex

          while IFS= read -r -d '' ZIP; do
            DEST="/tmp/mentex/$(basename "$ZIP" .zip)"
            mkdir -p "$DEST"

            echo "Extraindo: $ZIP"
            unzip -oq "$ZIP" -d "$DEST"
          done < <(
            find . -maxdepth 3 -type f \
              -name '*.zip' \
              -not -path './.git/*' \
              -print0
          )

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          while IFS= read -r -d '' SETTINGS; do
            ROOT="$(dirname "$SETTINGS")"

            if [[ -f "$ROOT/app/build.gradle" ||
                  -f "$ROOT/app/build.gradle.kts" ]]; then
              FOUND="$ROOT"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" /tmp/mentex \
              -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/build/*' \
              -print0 2>/dev/null
          )

          if [[ -z "$FOUND" ]]; then
            echo "::error::Projeto Android não encontrado."
            echo "O ZIP precisa conter settings.gradle"
            echo "e app/build.gradle ou app/build.gradle.kts."
            echo ""
            echo "Arquivos Gradle encontrados:"
            find "$GITHUB_WORKSPACE" /tmp/mentex \
              -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \
                 -o -name build.gradle \
                 -o -name build.gradle.kts \) \
              -not -path '*/.git/*' \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "Projeto encontrado: $FOUND"
          echo "PROJECT_DIR=$FOUND" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ ! -f gradlew ]]; then
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK não encontrado em $APK"
            find "$PROJECT_DIR" -type f \
              -name '*.apk' -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/MENTEX.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: apk-final/MENTEX.apk
          if-no-files-found: error
          retention-days: 7


name: MENTEX 2.0 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extrair MENTEX
        run: |
          mkdir -p projeto

          ZIP=$(find . -type f -iname '*mentex*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP do MENTEX não encontrado"
            exit 1
          fi

          unzip -o "$ZIP" -d projeto

          APP=$(find projeto -name capacitor.config.json -printf '%h\n' | head -n 1)

          if [ -z "$APP" ]; then
            echo "Configuração Capacitor não encontrada"
            exit 1
          fi

          echo "APP_DIR=$APP" >> $GITHUB_ENV

      - name: Instalar dependências
        run: |
          cd "$APP_DIR"
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Criar Android
        run: |
          cd "$APP_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sincronizar aplicativo
        run: |
          cd "$APP_DIR"
          npx cap sync android

      - name: Compilar APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-2.0-APK
          path: projeto/**/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

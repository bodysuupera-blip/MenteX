
name: CAO FUJAO 2.0 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 2.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar arquivos
        shell: bash
        run: |
          set -e
          PROJECT="cao-fujao-project"

          echo "Verificando projeto..."

          for FILE in settings.gradle build.gradle app/build.gradle app/src/main/assets/index.html; do
            if [ ! -f "$PROJECT/$FILE" ]; then
              echo "ERRO: arquivo ausente: $PROJECT/$FILE"
              exit 1
            fi
          done

          echo "Todos os arquivos encontrados!"

      - name: Compilar aplicativo
        shell: bash
        run: |
          set -e
          gradle --no-daemon -p cao-fujao-project assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.0-APK
          path: cao-fujao-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

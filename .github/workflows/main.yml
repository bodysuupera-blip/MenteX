name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar projeto MENTEX
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex
          unzip -o MENTEX_Android_2_8_2_Tela_Inicial.zip -d /tmp/mentex

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Conferir projeto
        run: |
          echo "Arquivos do projeto:"
          find /tmp/mentex -maxdepth 3 -type f | head -100
          echo "Arquivos Gradle:"
          find /tmp/mentex -name "build.gradle*" -o -name "settings.gradle*"

      - name: Gerar APK
        run: |
          cd /tmp/mentex
          gradle assembleDebug --stacktrace

      - name: Conferir APK
        run: |
          find /tmp/mentex/app/build/outputs -type f -name "*.apk" -print

      - name: Copiar APK
        run: |
          cp /tmp/mentex/app/build/outputs/apk/debug/app-debug.apk ./MENTEX-2.8.3.apk
          ls -lh ./MENTEX-2.8.3.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-2.8.3
          path: ./MENTEX-2.8.3.apk

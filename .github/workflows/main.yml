name: Gerar APK MENTEX

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  construir:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. BAIXAR O CÓDIGO
      # ==========================================

      - name: Baixar código

        uses: actions/checkout@v4


      # ==========================================
      # 2. ENCONTRAR O PROJETO ANDROID
      # ==========================================

      - name: Encontrar projeto

        shell: bash

        run: |

          set -e

          echo "=== PROCURANDO PROJETO MENTEX ==="

          PROJECT_DIR=$(find . -type f \( \
            -name "settings.gradle" \
            -o \
            -name "settings.gradle.kts" \
          \) \
          -not -path "./.git/*" \
          -print \
          -quit \
          | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERRO: Projeto Android não encontrado."

            echo "Arquivos encontrados:"

            find . -maxdepth 4 -type f | head -100

            exit 1

          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "PROJETO ENCONTRADO:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 3. VERIFICAR PROJETO
      # ==========================================

      - name: Verificar projeto

        shell: bash

        run: |

          set -e

          cd "$PROJECT_DIR"

          echo "=== PROJETO OK ==="

          echo "Diretório:"
          pwd

          echo ""

          echo "Arquivos principais:"

          ls -la

          echo ""

          if [ ! -d "app" ]; then

            echo "ERRO: pasta app não encontrada."

            exit 1

          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then

            echo "ERRO: arquivo Gradle do app não encontrado."

            exit 1

          fi

          echo "PROJETO OK"


      # ==========================================
      # 4. PREPARAR ARQUIVOS DA ABERTURA
      # ==========================================

      - name: Preparar abertura do MENTEX

        shell: bash

        run: |

          set -e

          cd "$PROJECT_DIR"

          echo "=== PREPARANDO ABERTURA DO MENTEX ==="

          ASSETS_DIR="app/src/main/assets"

          mkdir -p "$ASSETS_DIR"

          echo "Procurando primeira imagem..."

          INTRO=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "intro_screen.png" \
            -not -path "*/.git/*" \
            -print \
            -quit)

          if [ -z "$INTRO" ]; then

            echo "ERRO: intro_screen.png não encontrada."

            exit 1

          fi

          echo "Primeira imagem encontrada:"
          echo "$INTRO"


          echo "Procurando segunda imagem..."

          RULES=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "opening_screen.png" \
            -not -path "*/.git/*" \
            -print \
            -quit)

          if [ -z "$RULES" ]; then

            echo "ERRO: opening_screen.png não encontrada."

            exit 1

          fi

          echo "Segunda imagem encontrada:"
          echo "$RULES"


          echo "Procurando música..."

          MUSIC=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "mentex_musica_inicio.wav" \
            -not -path "*/.git/*" \
            -print \
            -quit)

          if [ -z "$MUSIC" ]; then

            echo "ERRO: mentex_musica_inicio.wav não encontrada."

            exit 1

          fi

          echo "Música encontrada:"
          echo "$MUSIC"


          # Copiar arquivos

          cp "$INTRO" \
             "$ASSETS_DIR/intro_screen.png"

          cp "$RULES" \
             "$ASSETS_DIR/opening_screen.png"

          cp "$MUSIC" \
             "$ASSETS_DIR/mentex_musica_inicio.wav"


          echo ""
          echo "=== ARQUIVOS COPIADOS ==="

          ls -lh "$ASSETS_DIR"


      # ==========================================
      # 5. JAVA 17
      # ==========================================

      - name: Java 17

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: "17"


      # ==========================================
      # 6. GRADLE 8.7
      # ==========================================

      - name: Gradle 8.7

        uses: gradle/actions/setup-gradle@v4

        with:

          gradle-version: "8.7"


      # ==========================================
      # 7. VERIFICAR GRADLE
      # ==========================================

      - name: Verificar Gradle

        shell: bash

        run: |

          set -e

          cd "$PROJECT_DIR"

          echo "=== VERSÃO DO GRADLE ==="

          gradle --version


      # ==========================================
      # 8. GERAR APK
      # ==========================================

      - name: Gerar APK

        shell: bash

        run: |

          set -e

          cd "$PROJECT_DIR"

          echo "=== GERANDO APK MENTEX ==="

          gradle assembleDebug --stacktrace

          echo ""

          echo "=== APK PRONTO ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 9. VERIFICAR APK
      # ==========================================

      - name: Verificar APK

        shell: bash

        run: |

          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then

            echo "ERRO: APK não foi encontrado."

            exit 1

          fi

          echo "APK ENCONTRADO:"
          echo "$APK"

          echo ""

          ls -lh "$APK"


      # ==========================================
      # 10. DISPONIBILIZAR APK
      # ==========================================

      - name: Disponibilizar APK

        uses: actions/upload-artifact@v4

        with:

          name: MENTEX-${{ github.run_number }}

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk

          if-no-files-found: error

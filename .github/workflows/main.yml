name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Encontrar projeto
        shell: bash
        run: |
          set -e

          echo "=== PROCURANDO PROJETO MENTEX ==="

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Projeto encontrado na raiz."
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP="./MENTEX_FINAL_250_FASES_10_CORACOES_INICIO.zip"

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do MENTEX não encontrado."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          unzip -o "$ZIP" -d /tmp/mentex

          SETTINGS=$(find /tmp/mentex -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado dentro do ZIP."
            find /tmp/mentex -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar arquivos
        shell: bash
        run: |
          set -e

          echo "=== VERIFICANDO MENTEX ==="

          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "PROJETO OK"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Gerar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== GERANDO APK MENTEX ==="

          gradle assembleDebug --stacktrace

          echo "=== APK PRONTO ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

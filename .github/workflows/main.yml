
name: MENTEX - Gerar APK Atualizado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Localizar APK original
        id: original
        shell: bash
        run: |
          APK=$(find . -type f -iname '*.apk' \
            ! -name '*atualizado*' \
            ! -name '*assinado*' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: coloque o APK original no repositório."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Extrair APK
        run: |
          mkdir -p trabalho
          unzip -q "${{ steps.original.outputs.path }}" -d trabalho

      - name: Atualizar rolagem do perfil e ranking
        run: |
          HTML="trabalho/assets/www/index.html"

          if [ ! -f "$HTML" ]; then
            echo "ERRO: assets/www/index.html não encontrado."
            exit 1
          fi

          python3 - "$HTML" <<'PY'
          import sys

          p = sys.argv[1]
          with open(p, encoding="utf-8") as f:
              html = f.read()

          css = """
          <style id="mentex-scroll-update">
          html, body {
            min-height: 100% !important;
            height: auto !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
          }
          body {
            touch-action: pan-y !important;
          }
          #profile, #ranking {
            height: auto !important;
            min-height: 100vh;
            max-height: none !important;
            overflow: visible !important;
            padding-bottom: 100px !important;
            touch-action: pan-y !important;
          }
          #game:not(.hidden) {
            position: fixed !important;
            inset: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
          }
          </style>
          """

          if "mentex-scroll-update" not in html:
              if "</head>" in html:
                  html = html.replace("</head>", css + "\n</head>", 1)
              else:
                  raise SystemExit("Não foi encontrada a tag </head>.")

          with open(p, "w", encoding="utf-8") as f:
              f.write(html)
          PY

      - name: Reempacotar APK
        run: |
          rm -f trabalho/META-INF/*.SF
          rm -f trabalho/META-INF/*.RSA
          rm -f trabalho/META-INF/*.DSA
          rm -f trabalho/META-INF/*.EC
          rm -f trabalho/META-INF/MANIFEST.MF

          cd trabalho
          zip -qr ../MENTEX-rebuild-unsigned.apk .
          cd ..

      - name: Criar chave de assinatura
        run: |
          keytool -genkeypair -v \
            -keystore mentex-release.jks \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX, OU=App, O=MENTEX, L=Brasil, ST=SP, C=BR"

      - name: Assinar APK
        run: |
          jarsigner \
            -keystore mentex-release.jks \
            -storepass mentex123 \
            -keypass mentex123 \
            -digestalg SHA-256 \
            -sigalg SHA256withRSA \
            -signedjar MENTEX-atualizado.apk \
            MENTEX-rebuild-unsigned.apk mentex

          jarsigner -verify MENTEX-atualizado.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-atualizado
          path: MENTEX-atualizado.apk
          if-no-files-found: error
          

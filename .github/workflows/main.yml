
name: NEXUS 350 - APK COM NOVO ICONE

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS350-BOAS-VINDAS-CHAVE-FUGA.zip'
      - 'NEXUS350-ICON-ROUND.zip'
      - '.github/workflows/nexus350.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar arquivos ZIP
        run: |
          set -e

          GAMEZIP=$(find "$GITHUB_WORKSPACE" -type f -name 'NEXUS350-BOAS-VINDAS-CHAVE-FUGA.zip' | head -n 1)
          ICONZIP=$(find "$GITHUB_WORKSPACE" -type f -name 'NEXUS350-ICON-ROUND.zip' | head -n 1)

          if [ -z "$GAMEZIP" ] || [ -z "$ICONZIP" ]; then
            echo "ZIP do jogo ou icone nao encontrado."
            exit 1
          fi

          echo "GAMEZIP=$GAMEZIP" >> "$GITHUB_ENV"
          echo "ICONZIP=$ICONZIP" >> "$GITHUB_ENV"

      - name: Extrair jogo e icone
        run: |
          set -e

          mkdir -p extracted iconfiles

          unzip -q "$GAMEZIP" -d extracted
          unzip -q "$ICONZIP" -d iconfiles

          PACKAGE=$(find extracted -type f -name package.json -not -path '*/node_modules/*' | head -n 1)

          ICON=$(find iconfiles -type f -name 'NEXUS350-ICON-ROUND.png' | head -n 1)

          if [ -z "$PACKAGE" ] || [ -z "$ICON" ]; then
            echo "Projeto ou PNG do icone nao encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"
          echo "ICON_PATH=$ICON" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm install @capacitor/android@^7.0.0

      - name: Criar Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Instalar ferramentas de imagem
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Aplicar novo icone Android
        run: |
          set -e

          RES="$PROJECT_DIR/android/app/src/main/res"
          mkdir -p "$RES/drawable"

          for SIZE in 48 72 96 144 192; do
            case "$SIZE" in
              48) DIR="mipmap-mdpi" ;;
              72) DIR="mipmap-hdpi" ;;
              96) DIR="mipmap-xhdpi" ;;
              144) DIR="mipmap-xxhdpi" ;;
              192) DIR="mipmap-xxxhdpi" ;;
            esac

            mkdir -p "$RES/$DIR"

            convert "$ICON_PATH" \
              -resize "${SIZE}x${SIZE}" \
              "$RES/$DIR/ic_launcher.png"

            convert "$ICON_PATH" \
              -resize "${SIZE}x${SIZE}" \
              "$RES/$DIR/ic_launcher_round.png"
          done

          convert "$ICON_PATH" \
            -resize 432x432 \
            "$RES/drawable/ic_launcher_foreground.png"

          echo "Novo icone instalado."

      - name: Configurar tela horizontal
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          android = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", android)

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("Application nao encontrada")

          for activity in app.findall("activity"):
              for intent in activity.findall("intent-filter"):
                  actions = [
                      a.get(f"{{{android}}}name")
                      for a in intent.findall("action")
                  ]
                  categories = [
                      c.get(f"{{{android}}}name")
                      for c in intent.findall("category")
                  ]

                  if (
                      "android.intent.action.MAIN" in actions
                      and "android.intent.category.LAUNCHER" in categories
                  ):
                      activity.set(
                          f"{{{android}}}screenOrientation",
                          "landscape"
                      )
                      activity.set(
                          f"{{{android}}}resizeableActivity",
                          "false"
                      )

          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          print("Orientacao horizontal configurada.")
          PY

      - name: Compilar APK
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/android" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK nao encontrado."
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/NEXUS350-ICONE-NOVO.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-APK-NOVO-ICONE
          path: resultado/NEXUS350-ICONE-NOVO.apk
          if-no-files-found: error
          retention-days: 30
          

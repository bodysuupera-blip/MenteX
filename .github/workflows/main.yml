
name: NEXUS 350 - APK RECUPERADO COM NOVO ICONE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar projeto Nexus
        run: |
          if [ -f "nexus-recovered/package.json" ]; then
            echo "PROJECT_DIR=nexus-recovered" >> $GITHUB_ENV
          elif [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            echo "ERRO: package.json do Nexus não encontrado"
            find . -maxdepth 4 -name package.json
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Preparar Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Aplicar ícones do Nexus
        run: |
          cd "$PROJECT_DIR"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DEST="android/app/src/main/res/mipmap-$density"
            SRC="assets/icons/mipmap-$density"

            mkdir -p "$DEST"

            cp "$SRC/ic_launcher.png" "$DEST/ic_launcher.png"
            cp "$SRC/ic_launcher_round.png" "$DEST/ic_launcher_round.png"
          done

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-NOVO-ICONE
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

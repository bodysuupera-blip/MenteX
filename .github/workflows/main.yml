
name: CAO FUJAO - GERAR APK 500 FASES

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujao
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto original
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="Cao_Fujao_ATUALIZADO_GOOGLE_PLAY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: Projeto original nao encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/build-cao-fujao"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/build-cao-fujao"

          PROJECT_DIR=$(dirname "$(find "$RUNNER_TEMP/build-cao-fujao" -name settings.gradle -o -name settings.gradle.kts | head -1)")

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRO: Projeto Android nao encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Aplicar atualizacao 500 fases
        shell: bash
        run: |
          set -Eeuo pipefail

          PATCH="CAO-FUJAO-ATUALIZACAO-500-FASES-PATCH.zip"

          if [ ! -f "$PATCH" ]; then
            echo "ERRO: ZIP de atualizacao nao encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/cao-patch"
          unzip -q "$PATCH" -d "$RUNNER_TEMP/cao-patch"

          mkdir -p "$PROJECT_DIR/app/src/main/assets"

          cp "$RUNNER_TEMP/cao-patch/assets/index.html" \
             "$PROJECT_DIR/app/src/main/assets/index.html"

          cp "$RUNNER_TEMP/cao-patch/assets/intro.png" \
             "$PROJECT_DIR/app/src/main/assets/intro.png"

          test -s "$PROJECT_DIR/app/src/main/assets/index.html"
          echo "Atualizacao aplicada!"

      - name: Verificar projeto
        run: |
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Preparar APK final
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p resultado-cao-fujao

          cp "$APK" \
            resultado-cao-fujao/CAO-FUJAO-500-FASES.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-500-FASES
          path: resultado-cao-fujao/CAO-FUJAO-500-FASES.apk
          if-no-files-found: error
          

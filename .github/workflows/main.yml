name: MENTEX V4.6 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar projeto Android
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo "Estrutura do repositório:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar projeto
        run: |
          echo "Conteúdo do projeto:"
          ls -la "$PROJECT_DIR"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Encontrar APK
        shell: bash
        run: |
          echo "APKs encontrados:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Preparar APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-V4.6.apk"

          echo "APK preparado:"
          ls -lh "$GITHUB_WORKSPACE/MENTEX-V4.6.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: MENTEX-V4.6.apk
          if-no-files-found: error

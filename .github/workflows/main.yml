
name: CAO FUJAO - ATUALIZAR ITENS E GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gerar Cão Fujão Atualizado
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar ferramentas
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Localizar APK e arquivos atualizados
        shell: bash
        run: |
          set -Eeuo pipefail

          APK=$(find . -type f -iname '*.apk' -print -quit)
          HTML=$(find . -type f -path '*/assets/index.html' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK encontrado no repositório."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [ -z "$HTML" ]; then
            echo "ERRO: assets/index.html não encontrado."
            exit 1
          fi

          echo "APK encontrado: $APK"
          echo "HTML encontrado: $HTML"

          echo "APK_ORIGINAL=$APK" >> "$GITHUB_ENV"
          echo "HTML_ATUALIZADO=$HTML" >> "$GITHUB_ENV"

      - name: Atualizar jogo
        run: |
          set -Eeuo pipefail

          mkdir -p trabalho resultado

          cd trabalho
          unzip -oq "../$APK_ORIGINAL"

          mkdir -p assets
          cp "../$HTML_ATUALIZADO" assets/index.html

          zip -qr ../resultado/CAO-FUJAO-UNSIGNED.apk .

          cd ..

      - name: Alinhar APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -f 4 \
            resultado/CAO-FUJAO-UNSIGNED.apk \
            resultado/CAO-FUJAO-ALIGNED.apk

      - name: Assinar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MENTEX_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.MENTEX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MENTEX_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.MENTEX_STORE_PASSWORD }}
        run: |
          set -Eeuo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "ERRO: configure os quatro Secrets da assinatura original."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > assinatura.jks

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks assinatura.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out resultado/CAO-FUJAO-ATUALIZADO.apk \
            resultado/CAO-FUJAO-ALIGNED.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            resultado/CAO-FUJAO-ATUALIZADO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-ATUALIZADO
          path: resultado/CAO-FUJAO-ATUALIZADO.apk
          if-no-files-found: error
          

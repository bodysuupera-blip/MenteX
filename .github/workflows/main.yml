name: MENTEX V4.6.4 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            **/*.gradle.kts
            **/gradle-wrapper.properties

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1 || true)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::Arquivo gradlew não encontrado."
            echo "Este repositório precisa conter o projeto-fonte Android."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Compilar APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleRelease

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14
          

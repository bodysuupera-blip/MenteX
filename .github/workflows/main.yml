name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivo MENTEX
        run: |
          echo "Arquivos disponíveis:"
          ls -lh
          echo ""
          echo "Verificando ZIP atualizado:"
          test -f MENTEX_Android_2_8_Voz_Atualizada.zip
          echo "ZIP atualizado encontrado!"

      - name: Preparar projeto MENTEX
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex
          unzip -o MENTEX_Android_2_8_Voz_Atualizada.zip -d /tmp/mentex

          echo ""
          echo "Projeto extraído com sucesso."

      - name: Verificar áudio da voz
        run: |
          echo "Arquivos de áudio encontrados:"
          find /tmp/mentex -type f -name "*.mp3" -print
          echo ""
          echo "Verificação concluída."

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: |
          cd /tmp/mentex
          gradle assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          echo "Procurando APK:"
          find /tmp/mentex -type f -name "*.apk" -print

      - name: Copiar APK
        run: |
          APK=$(find /tmp/mentex -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          cp "$APK" ./MENTEX-2.8-VOZ-ATUALIZADA.apk

          echo "APK pronto:"
          ls -lh ./MENTEX-2.8-VOZ-ATUALIZADA.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-2.8-VOZ-ATUALIZADA
          path: ./MENTEX-2.8-VOZ-ATUALIZADA.apk
          if-no-files-found: error

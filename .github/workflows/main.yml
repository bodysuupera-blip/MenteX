name: Gerar APK MENTEX V4.6.4 Android

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - "!README.md"

permissions:
  contents: read

jobs:
  android:
    name: Construir APK MENTEX
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Localizar interface web
        shell: bash
        run: |
          set -euo pipefail

          HTML="$(find . \
            -type f \
            -name index.html \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            | head -n 1)"

          if [ -z "$HTML" ]; then
            echo "::error::Nenhum index.html foi encontrado no repositório."
            exit 1
          fi

          echo "Interface encontrada: $HTML"
          echo "WEB_HTML=$HTML" >> "$GITHUB_ENV"

      - name: Criar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/mentex/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # Copia a interface e os recursos locais
          SOURCE_DIR="$(dirname "$WEB_HTML")"

          cp -a "$SOURCE_DIR/." app/src/main/assets/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MENTEX"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mentex.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mentex.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 464
                  versionName '4.6.4'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="MENTEX"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mentex/app/MainActivity.java <<'EOF'
          package com.mentex.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

          echo "Estrutura Android criada."

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK-ANDROID
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

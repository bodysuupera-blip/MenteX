
name: MENTE EM FUGA - APK INDEPENDENTE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Aceitar licencas
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Android SDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Identificar pasta do projeto
        run: |
          echo "Arquivos do repositorio:"
          ls -la
          echo "Procurando index.html:"
          find . -maxdepth 5 -name index.html

      - name: Verificar estrutura
        run: |
          test -d mente-em-fuga
          test -f mente-em-fuga/www/index.html
          test -f mente-em-fuga/package.json
          test -d mente-em-fuga/android

      - name: Instalar dependencias
        working-directory: mente-em-fuga
        run: npm install

      - name: Sincronizar Capacitor
        working-directory: mente-em-fuga
        run: npx cap sync android

      - name: Compilar APK
        working-directory: mente-em-fuga/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTE-EM-FUGA-APK
          path: mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk
          

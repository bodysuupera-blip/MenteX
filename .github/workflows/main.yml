
name: Gerar APK - Fuga dos Fantasmas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/fuga

          ZIP=$(find . -maxdepth 3 -iname "*.zip" | head -n 1)

          if [ -n "$ZIP" ]; then
            unzip -oq "$ZIP" -d /tmp/fuga
          else
            cp -r . /tmp/fuga
          fi

          GRADLE_FILE=$(find /tmp/fuga -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: Projeto Android Gradle não encontrado."
            echo "O APK original não contém necessariamente o código-fonte."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FUGA-DOS-FANTASMAS-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

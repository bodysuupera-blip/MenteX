
name: MENTEX V4.6.3 - Preparar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Compilar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Localizar e extrair projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mentex-extraido"

          if find . -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path './.git/*' | grep -q .; then
            echo "Projeto Android encontrado no repositorio."
          else
            ZIP_FILE="$(find . -type f -name '*.zip' \
              -not -path './.git/*' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Nenhum projeto Android ou arquivo ZIP encontrado."
              echo "Envie o codigo-fonte Android para o repositorio."
              exit 1
            fi

            echo "Extraindo: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/mentex-extraido"
          fi

          PROJECT_DIR=""

          for BASE in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mentex-extraido"; do
            [ -d "$BASE" ] || continue

            FOUND="$(find "$BASE" -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' -print -quit)"

            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(dirname "$FOUND")"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle nao encontrado."
            echo "O ZIP precisa conter o projeto-fonte Android."
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Projeto localizado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "::error::Gradle Wrapper nao encontrado."
            echo "O projeto precisa conter o arquivo gradlew."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.3-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          


name: CAO FUJAO - 15 SEGUNDOS E ICONE REDONDO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto atualizado
        run: |
          set -e
          mkdir -p /tmp/cao
          unzip -q CAO-FUJAO-15-SEGUNDOS-ICONE-REDONDO.zip -d /tmp/cao

          test -f /tmp/cao/settings.gradle
          test -f /tmp/cao/app/build.gradle
          test -f /tmp/cao/app/src/main/assets/index.html

          echo "Projeto encontrado!"

      - name: Conferir ícone redondo
        run: |
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' \
            /tmp/cao/app/src/main/AndroidManifest.xml

          test -f /tmp/cao/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Compilar APK
        run: |
          cd /tmp/cao
          gradle --no-daemon clean :app:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-15-SEGUNDOS-APK
          path: /tmp/cao/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

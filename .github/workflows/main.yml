name: Gerar APK MENTEX TESTE 999

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar projeto MENTEX TESTE
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex
          unzip -o MENTEX_Android_3_0_TESTE_999_Coracoes.zip -d /tmp/mentex

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Localizar projeto
        run: |
          echo "=== ARQUIVOS ==="
          find /tmp/mentex -maxdepth 4 -type f | head -150

      - name: Gerar APK
        run: |
          cd /tmp/mentex
          gradle assembleDebug --stacktrace

      - name: Encontrar APK
        run: |
          echo "=== APK GERADO ==="
          find /tmp/mentex -type f -name "*.apk" -print

      - name: Copiar APK
        run: |
          APK=$(find /tmp/mentex -type f -name "app-debug.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          cp "$APK" ./MENTEX-TESTE-999-Coracoes.apk

          ls -lh ./MENTEX-TESTE-999-Coracoes.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-TESTE-999-Coracoes
          path: ./MENTEX-TESTE-999-Coracoes.apk

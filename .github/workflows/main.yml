
name: MenteX - Gerar APK Atualizado

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Compilar aplicativo Android
        run: ./gradlew assembleDebug

      - name: Criar ZIP atualizado
        run: |
          mkdir -p release
          find . -path '*/build/outputs/apk/*/*.apk' \
            -type f -exec cp {} release/ \;
          if [ -z "$(ls -A release)" ]; then
            echo "Nenhum APK foi gerado."
            exit 1
          fi
          cd release
          zip -j ../MENTEX-V4.18-ATUALIZADO.zip *.apk

      - name: Disponibilizar ZIP para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.18-ATUALIZADO
          path: MENTEX-V4.18-ATUALIZADO.zip
          if-no-files-found: error
          

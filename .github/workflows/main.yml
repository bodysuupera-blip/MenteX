
name: NEXUS 350 EVOLUTION - APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar estrutura Web
        run: |
          mkdir -p www

          if [ ! -f www/index.html ]; then
            cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>Nexus 350 Evolution</title>
          <style>
          *{box-sizing:border-box}
          body{
            margin:0;
            background:radial-gradient(circle,#1b3260,#050914);
            color:#fff;
            font-family:Arial;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            overflow:hidden
          }
          .box{padding:20px}
          h1{
            font-size:48px;
            color:#5de0ff;
            text-shadow:0 0 25px #008cff
          }
          button{
            padding:18px 45px;
            border:0;
            border-radius:15px;
            background:#087dff;
            color:white;
            font-size:22px;
            font-weight:bold
          }
          </style>
          </head>
          <body>
          <div class="box">
          <h1>NEXUS 350</h1>
          <h2>EVOLUTION</h2>
          <p>Uma nova aventura está começando!</p>
          <button onclick="alert('Nexus 350 Evolution')">JOGAR</button>
          </div>
          </body>
          </html>
          EOF
          fi

      - name: Criar package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Criar configuracao
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexus350.evolution",
            "appName": "Nexus 350 Evolution",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Criar Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-EVOLUTION-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

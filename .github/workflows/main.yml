name: MENTEX V4.6 - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilador MENTEX V4.6
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDKMANAGER encontrado:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "VERIFICANDO PROJETO MENTEX"
          echo "===================================="

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo ""
          echo "Arquivos principais:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Instalar Gradle
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Compilar MENTEX
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "COMPILANDO MENTEX"
          echo "===================================="

          gradle --no-daemon clean assembleDebug

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "PROCURANDO APK GERADO"
          echo "===================================="

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p resultado

          cp "$APK" \
            resultado/MENTEX-V4.6-ATUALIZADO.apk

          ls -lh resultado/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-ATUALIZADO
          path: resultado/MENTEX-V4.6-ATUALIZADO.apk
          if-no-files-found: error
          retention-days: 30

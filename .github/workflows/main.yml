name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK e aceitar licenças
        shell: bash
        run: |
          set -Eeuo pipefail

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "Aceitando licenças Android..."
          yes | "$SDKMANAGER" --licenses || true

          echo "Verificando licenças..."
          "$SDKMANAGER" --licenses

          echo "Instalando ferramentas Android..."
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="Cao_Fujao_ATUALIZADO_GOOGLE_PLAY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado no repositório."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/build-cao-fujao"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/build-cao-fujao"

          PROJECT=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/build-cao-fujao" \
              -type f \( \
                -name settings.gradle -o \
                -name settings.gradle.kts \
              \)
          )

          if [ -z "$PROJECT" ]; then
            echo "ERRO: Projeto Android não encontrado no ZIP."
            find "$RUNNER_TEMP/build-cao-fujao" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT"

      - name: Corrigir compatibilidade Google Play Billing
        shell: bash
        run: |
          set -Eeuo pipefail

          JAVA_FILE="$(find "$PROJECT_DIR" \
            -name MainActivity.java -print -quit)"

          if [ -z "$JAVA_FILE" ]; then
            echo "ERRO: MainActivity.java não encontrado."
            exit 1
          fi

          python3 - "$JAVA_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "queryResult.getProductDetailsList().isEmpty()",
              "queryResult.isEmpty()"
          )

          s = s.replace(
              "queryResult.getProductDetailsList().get(0)",
              "queryResult.get(0)"
          )

          s = s.replace(
              "queryResult.getProductDetailsList()",
              "queryResult"
          )

          if "getProductDetailsList()" in s:
              raise SystemExit(
                  "ERRO: chamadas antigas do Billing continuam no Java."
              )

          p.write_text(s, encoding="utf-8")
          print("Compatibilidade Billing verificada.")
          PY

      - name: Verificar arquivos do jogo
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          HTML="$(find "$PROJECT_DIR/app/src/main/assets" \
            -name index.html -print -quit)"

          if [ -z "$HTML" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          echo "Jogo encontrado: $HTML"

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/intro.png" ]; then
            echo "AVISO: intro.png não encontrada."
          fi

          echo "Arquivos verificados."

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon clean :app:assembleDebug

      - name: Preparar APK final
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p resultado-cao-fujao

          cp "$APK" \
            resultado-cao-fujao/CAO-FUJAO-ATUALIZADO.apk

          ls -lh resultado-cao-fujao/

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK-EXCLUSIVO
          path: resultado-cao-fujao/CAO-FUJAO-ATUALIZADO.apk
          if-no-files-found: error
          retention-days: 30

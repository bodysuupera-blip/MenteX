
name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/cao-fujao
          ZIP=$(find . -maxdepth 2 -name 'CAO-FUJAO-NOVO-PROJETO-ANDROID.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do projeto não encontrado."
            exit 1
          fi

          unzip -oq "$ZIP" -d /tmp/cao-fujao

          PROJECT=$(find /tmp/cao-fujao -name settings.gradle -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "PROJECT=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-12-SEGUNDOS
          path: /tmp/cao-fujao/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

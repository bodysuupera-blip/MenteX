
name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX 4.13
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto MENTEX
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/mentex-projetos

          while IFS= read -r -d '' arquivo; do
            nome="$(basename "$arquivo" .zip)"
            destino="/tmp/mentex-projetos/$nome"
            mkdir -p "$destino"
            unzip -oq "$arquivo" -d "$destino"
          done < <(
            find . -maxdepth 4 -type f -iname '*.zip' \
              -not -path './.git/*' -print0
          )

          PROJETO=""

          while IFS= read -r -d '' arquivo; do
            pasta="$(dirname "$arquivo")"

            if [[ -f "$pasta/app/build.gradle" ||
                  -f "$pasta/app/build.gradle.kts" ]]; then
              PROJETO="$pasta"
              break
            fi
          done < <(
            find /tmp/mentex-projetos . \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' -print0
          )

          if [[ -z "$PROJETO" ]]; then
            echo "::error::Projeto Android completo não encontrado."
            echo "O ZIP precisa conter o código-fonte Android."
            exit 1
          fi

          echo "Projeto encontrado: $PROJETO"
          echo "PROJETO=$PROJETO" >> "$GITHUB_ENV"

      - name: Verificar Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJETO"

          if [[ ! -f gradlew ||
                ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "::error::Gradle Wrapper ausente no projeto."
            echo "É necessário restaurar gradlew e gradle/wrapper."
            exit 1
          fi

          chmod +x gradlew

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJETO"
          ./gradlew --no-daemon assembleDebug

      - name: Localizar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-gerado"

          APK="$(find "$PROJETO" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -1)"

          if [[ -z "$APK" ]]; then
            echo "::error::APK não encontrado após a compilação."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/apk-gerado/MENTEX-V4.13.apk"
          ls -lh "$GITHUB_WORKSPACE/apk-gerado/MENTEX-V4.13.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: apk-gerado/MENTEX-V4.13.apk
          if-no-files-found: error
          retention-days: 14
          

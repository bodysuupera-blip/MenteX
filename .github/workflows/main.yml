
name: CAO FUJAO - GERAR APK ATUALIZADO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;34.0.0'

      - name: Extrair projeto atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./CAO-FUJAO-ATUALIZACAO-MENU-DIFICULDADES-ICONE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP atualizado não encontrado."
            exit 1
          fi

          mkdir -p /tmp/cao-fujao
          unzip -oq "$ZIP" -d /tmp/cao-fujao

          PROJECT="/tmp/cao-fujao"

          if [ ! -f "$PROJECT/settings.gradle" ]; then
            PROJECT="$(find /tmp/cao-fujao -name settings.gradle \
              -type f -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT"

      - name: Verificar aplicativo
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          grep -q "com.caofujao.game" app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Projeto e novo ícone encontrados."

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p entrega
          cp "$APK" entrega/CAO-FUJAO-ATUALIZADO.apk

          ls -lh entrega/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-ATUALIZADO
          path: entrega/CAO-FUJAO-ATUALIZADO.apk
          if-no-files-found: error
          

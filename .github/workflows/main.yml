- name: Instalar ferramentas atualizadas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk curl jq apksigner zipalign aapt

          API="https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"

          URL="$(curl -fsSL "$API" | jq -r \
            '.assets[] | select(.name | test("^apktool_.*\\.jar$")) | .browser_download_url' \
            | head -n 1)"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Não foi possível encontrar a versão atual do Apktool."
            exit 1
          fi

          curl -fL "$URL" -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Extrair APK original
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" d -f \
            "$RUNNER_TEMP/mentex/original.apk" \
            -o "$RUNNER_TEMP/mentex/extraido"

      - name: Reconstruir APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" b \
            "$RUNNER_TEMP/mentex/extraido" \
            --use-aapt2 \
            -o "$RUNNER_TEMP/mentex/reconstruido.apk"

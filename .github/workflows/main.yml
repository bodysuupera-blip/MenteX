name: MENTEX V4.7 - Compilador APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Compilador MENTEX V4.7
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar ZIP do MENTEX
        shell: bash
        run: |
          echo "Procurando ZIP do MENTEX..."

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do MENTEX não encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        shell: bash
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          unzip -o "$ZIP" -d /tmp/mentex

          echo "Projeto extraído."

      - name: Localizar projeto Android
        shell: bash
        run: |
          PROJECT_DIR=$(find /tmp/mentex -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Projeto Android não encontrado."
            exit 1
          fi

          echo "Projeto: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar Gradle
        shell: bash
        run: |
          gradle --version

      - name: Configurar Java 17 no projeto
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          text = p.read_text()

          if "compileOptions" not in text:
              text += """

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
"""

          p.write_text(text)
          PY

          echo "Configuração Java 17 concluída."

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Copiar APK
        shell: bash
        run: |
          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-V4.7.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK
          path: MENTEX-V4.7.apk
          if-no-files-found: error

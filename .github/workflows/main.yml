
name: MENTEX 2.0 - APK CORRETO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Encontrar MENTEX
        run: |
          mkdir -p projeto
          FOUND=""

          for ZIP in $(find . -type f -iname "*.zip"); do
            rm -rf projeto/*
            unzip -oq "$ZIP" -d projeto

            APP=$(find projeto -type f -name capacitor.config.json \
              -exec dirname {} \; | head -n 1)

            if [ -n "$APP" ]; then
              if echo "$APP" | grep -qi "mentex"; then
                FOUND="$APP"
                echo "MENTEX encontrado: $APP"
                break
              fi
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "ERRO: Projeto MENTEX não encontrado."
            exit 1
          fi

          echo "APP_DIR=$FOUND" >> $GITHUB_ENV

      - name: Validar identidade
        run: |
          echo "Projeto selecionado: $APP_DIR"
          test -f "$APP_DIR/package.json"
          test -f "$APP_DIR/www/index.html"
          grep -qi "mentex" "$APP_DIR/package.json" "$APP_DIR/www/index.html" || {
            echo "ERRO: Identidade MENTEX não confirmada."
            exit 1
          }

      - name: Instalar dependências
        run: |
          cd "$APP_DIR"
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Criar Android
        run: |
          cd "$APP_DIR"
          npx cap add android

      - name: Sincronizar
        run: |
          cd "$APP_DIR"
          npx cap sync android

      - name: Gerar APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar MENTEX 2.0
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-2.0-APK-CORRETO
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

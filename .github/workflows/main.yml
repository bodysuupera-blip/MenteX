
name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX com Novo Ícone
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto MENTEX
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./MENTEX-ESTILO-ORIGINAL-MELHORADO-ICONE-NOVO.zip"
          DEST="$RUNNER_TEMP/mentex-original"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP atualizado do MENTEX não encontrado."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          PACKAGE=$(find "$DEST" -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "$PROJECT_DIR" > "$RUNNER_TEMP/project-dir.txt"

          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Instalar dependências e preparar Android
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR"

          test -f www/index.html
          test -f capacitor.config.json

          npm install
          npx cap add android

      - name: Aplicar novo ícone MENTEX
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          RES_DIR="$PROJECT_DIR/android-icon-res"
          ANDROID_RES="$PROJECT_DIR/android/app/src/main/res"

          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ ! -f "$RES_DIR/$density/ic_launcher.png" ]; then
              echo "ERRO: ícone não encontrado em $density"
              exit 1
            fi

            mkdir -p "$ANDROID_RES/$density"

            cp "$RES_DIR/$density/ic_launcher.png" \
              "$ANDROID_RES/$density/ic_launcher.png"

            cp "$RES_DIR/$density/ic_launcher_round.png" \
              "$ANDROID_RES/$density/ic_launcher_round.png"
          done

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' "$MANIFEST"

          echo "Novo ícone MENTEX aplicado."

      - name: Sincronizar projeto Android
        run: |
          set -Eeuo pipefail
          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Compilar APK
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/MENTEX-NOVO-ICONE.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-NOVO-ICONE-APK
          path: MENTEX-NOVO-ICONE.apk
          if-no-files-found: error
          

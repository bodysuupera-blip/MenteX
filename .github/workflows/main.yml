name: Compilar MENTEX V4.4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Compilar MENTEX V4.4
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar ZIP MENTEX
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO ZIP DO MENTEX"
          echo "======================================"

          echo "Arquivos ZIP encontrados:"
          find . -maxdepth 3 -type f -iname "*.zip" -print

          ZIP_MENTEX=$(find . -maxdepth 3 -type f -iname "MENTEX*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_MENTEX" ]; then
            echo ""
            echo "ERRO: nenhum ZIP MENTEX foi encontrado."
            echo ""
            echo "Coloque o ZIP do projeto na raiz do repositório."
            exit 1
          fi

          echo ""
          echo "ZIP encontrado:"
          echo "$ZIP_MENTEX"

          rm -rf mentex
          mkdir -p mentex

          echo ""
          echo "Extraindo projeto..."

          unzip -o "$ZIP_MENTEX" -d mentex

          echo ""
          echo "Conteúdo extraído:"
          find mentex -maxdepth 3 -type f | head -100

      - name: Encontrar projeto Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO PROJETO ANDROID"
          echo "======================================"

          SETTINGS=$(find mentex -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERRO: settings.gradle não encontrado."
            echo ""
            echo "O ZIP não contém um projeto Android Gradle válido."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "settings.gradle encontrado em:"
          echo "$SETTINGS"

          echo ""
          echo "Pasta do projeto Android:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Corrigir permissões do Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Projeto: $PROJECT_DIR"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "gradlew encontrado e configurado."
          else
            echo "gradlew não encontrado."
            echo "Será utilizado o Gradle instalado no runner."
          fi

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configurar Java 17 no Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Verificando arquivos Gradle..."

          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          echo ""
          echo "Java utilizado:"
          java -version

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "COMPILANDO MENTEX"
          echo "======================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO APK"
          echo "======================================"

          find mentex -type f -name "*.apk" -print

          APK=$(find mentex -type f \
            \( -name "app-debug.apk" -o -name "*.apk" \) \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          mkdir -p resultado
          cp "$APK" resultado/MENTEX-V4.4.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.4-APK
          path: resultado/MENTEX-V4.4.apk
          if-no-files-found: error

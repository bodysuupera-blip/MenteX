
name: MENTEX 5.1 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX Android
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: MENTEX-NOVO-PROJETO/package.json

      - name: Localizar projeto MENTEX
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/android/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: package.json não encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Projeto localizado: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Conferir arquivos necessários
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

          echo "Arquivos principais encontrados!"
          ls -lh www/

      - name: Instalar dependências
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platform-tools"

      - name: Criar plataforma Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sincronizar aplicativo
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Conferir APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi encontrado."
            find "$PROJECT_DIR/android" -name '*.apk'
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/MENTEX-5.1.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-5.1-APK
          path: resultado/MENTEX-5.1.apk
          if-no-files-found: error
          

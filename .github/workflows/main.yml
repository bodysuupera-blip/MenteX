
name: MENTEX - Gerar APK Corrigido

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilador MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -e
          echo "Verificando projeto..."
          if [ ! -f "gradlew" ]; then
            echo "ERRO: gradlew não encontrado na raiz."
            echo "O projeto Android precisa estar na raiz do repositório."
            find . -maxdepth 4 \
              \( -name gradlew -o -name settings.gradle \
              -o -name settings.gradle.kts \) -print
            exit 1
          fi

      - name: Preparar Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

name: MENTEX V4.6.4 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Gerar APK MENTEX V4.6.4
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar ferramentas Android
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;35.0.0"

      - name: Localizar e extrair ZIP correto
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/MENTEX-V4.6.3-PROPORCIONAL.zip"
          DIR="$RUNNER_TEMP/mentex"

          mkdir -p "$DIR"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Não encontrei MENTEX-V4.6.3-PROPORCIONAL.zip na raiz do repositório."
            exit 1
          fi

          unzip -l "$ZIP"

          unzip -p "$ZIP" \
            "MENTEX-V4.6.3-PROPORCIONAL.apk" \
            > "$DIR/MENTEX-V4.6.4-original.apk"

          if [ ! -s "$DIR/MENTEX-V4.6.4-original.apk" ]; then
            echo "::error::Não foi possível extrair o APK do ZIP."
            exit 1
          fi

      - name: Baixar Apktool
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            -o "$RUNNER_TEMP/apktool.jar"

      - name: Reconstruir APK
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/mentex"
          APKTOOL="$RUNNER_TEMP/apktool.jar"

          java -jar "$APKTOOL" d \
            "$DIR/MENTEX-V4.6.4-original.apk" \
            -o "$DIR/decoded" -f

          java -jar "$APKTOOL" b \
            "$DIR/decoded" \
            -o "$DIR/MENTEX-V4.6.4-reconstruido.apk"

          test -s "$DIR/MENTEX-V4.6.4-reconstruido.apk"

      - name: Alinhar e assinar APK
        run: |
          set -euo pipefail

          DIR="$RUNNER_TEMP/mentex"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          KEY="$RUNNER_TEMP/mentex-debug.keystore"

          keytool -genkeypair \
            -keystore "$KEY" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 -noprompt

          "$TOOLS/zipalign" -f -p 4 \
            "$DIR/MENTEX-V4.6.4-reconstruido.apk" \
            "$DIR/MENTEX-V4.6.4-alinhado.apk"

          "$TOOLS/apksigner" sign \
            --ks "$KEY" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$DIR/MENTEX-V4.6.4.apk" \
            "$DIR/MENTEX-V4.6.4-alinhado.apk"

          "$TOOLS/apksigner" verify --verbose \
            "$DIR/MENTEX-V4.6.4.apk"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: ${{ runner.temp }}/mentex/MENTEX-V4.6.4.apk
          if-no-files-found: error
          retention-days: 14

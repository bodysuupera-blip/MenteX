name: MENTEX V4.7 - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Compilar MENTEX V4.7
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar ZIP do MENTEX
        shell: bash
        run: |
          echo "Procurando o projeto MENTEX..."

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        shell: bash
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          unzip -o "$ZIP" -d /tmp/mentex

          echo "Conteúdo extraído:"
          find /tmp/mentex -maxdepth 3 -type f | head -100

      - name: Localizar projeto Android
        shell: bash
        run: |
          PROJECT_DIR=$(find /tmp/mentex -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/mentex -type f -name "gradlew" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Projeto Android não encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Corrigir compatibilidade Java 17
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Verificando projeto..."

          if [ -f "app/build.gradle" ]; then
            cat >> app/build.gradle <<'EOF'

            // MENTEX V4.7 - Compatibilidade Java 17
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            EOF
          fi

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew clean assembleDebug --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          echo "Procurando APK..."

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado: $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Renomear APK
        shell: bash
        run: |
          cp "$APK" "$PROJECT_DIR/MENTEX-V4.7.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK
          path: ${{ env.PROJECT_DIR }}/MENTEX-V4.7.apk
          if-no-files-found: error

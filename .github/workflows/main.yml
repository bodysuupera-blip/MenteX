
name: NEXUS 350 EVOLUTION - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Conferir Java e Node
        run: |
          java -version
          javac -version
          node -v
          npm -v

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: nexus350-java21-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            nexus350-java21-${{ runner.os }}-

      - name: Criar estrutura do jogo
        run: |
          mkdir -p www

          if [ ! -f www/index.html ]; then
            cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
            <title>Nexus 350 Evolution</title>
          </head>
          <body>
            <h1>NEXUS 350 EVOLUTION</h1>
            <p>Nova aventura!</p>
          </body>
          </html>
          EOF
          fi

      - name: Criar package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configurar Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexus350.evolution",
            "appName": "Nexus 350 Evolution",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Compilar APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew

          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de 3"

            if ./gradlew assembleDebug \
              --no-daemon \
              --max-workers=2; then
              echo "APK compilado!"
              exit 0
            fi

            if [ "$tentativa" -lt 3 ]; then
              sleep 30
            fi
          done

          exit 1

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-EVOLUTION-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

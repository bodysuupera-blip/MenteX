
name: CAO FUJAO 2.1 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 2.1
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          echo "Android SDK disponível!"

      - name: Extrair Cão Fujão 2.1
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./CAO-FUJAO-2.1-ATUALIZACAO-PARA-GERAR-APK.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP 2.1 não encontrado!"
            exit 1
          fi

          mkdir -p /tmp/cao-fujao-21
          unzip -oq "$ZIP" -d /tmp/cao-fujao-21

          PROJECT="/tmp/cao-fujao-21"

          SETTINGS=$(find "$PROJECT" -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado!"
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          test -f "$PROJECT/build.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/assets/index.html"

          grep -q 'com.caofujao.game' "$PROJECT/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Cão Fujão 2.1 confirmado!"

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Verificar APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.1-APK
          path: /tmp/cao-fujao-21/**/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

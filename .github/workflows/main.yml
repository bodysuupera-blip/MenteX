
name: Nexus 350 - Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'Nexus350_Labirinto_Fantasmas.zip'
      - '.github/workflows/build-nexus350.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Localizar ZIP do jogo
        run: |
          ZIP=$(find . -maxdepth 2 -type f \
            -name 'Nexus350_Labirinto_Fantasmas.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do Nexus 350 nao encontrado!"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

      - name: Localizar codigo do jogo
        id: project
        run: |
          P=$(find extracted -type f \
            -name package.json | head -n 1)

          if [ -z "$P" ]; then
            echo "ERRO: package.json nao encontrado!"
            exit 1
          fi

          DIR=$(dirname "$P")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          echo "Projeto encontrado: $DIR"

      - name: Instalar dependencias
        run: |
          cd "${{ steps.project.outputs.dir }}"
          npm install

      - name: Preparar Android
        run: |
          cd "${{ steps.project.outputs.dir }}"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configurar tela horizontal
        run: |
          cd "${{ steps.project.outputs.dir }}"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:screenOrientation="landscape"' not in s:
              s = s.replace(
                  '<activity ',
                  '<activity android:screenOrientation="landscape" ',
                  1
              )

          p.write_text(s)
          print("Orientacao horizontal configurada.")
          PY

      - name: Gerar APK
        run: |
          cd "${{ steps.project.outputs.dir }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-Labirinto-de-Fantasmas
          path: extracted/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

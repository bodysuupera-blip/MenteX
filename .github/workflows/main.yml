name: MENTEX V4.9 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner do GitHub já possui o Android SDK.
      # Não usar setup-android@v3 aqui.

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID SDK:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERRO: Android SDK não encontrado."
            exit 1
          fi

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print 2>/dev/null | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo "Aceitando licenças..."

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo "Instalando componentes Android..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" || {

              echo "Tentativa alternativa..."

              "$SDKMANAGER" "platform-tools"

              "$SDKMANAGER" "platforms;android-35"

              "$SDKMANAGER" "build-tools;35.0.0"
            }

      - name: Localizar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO PROJETO MENTEX"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/projeto"

          ZIP=""

          while IFS= read -r arquivo; do

            echo "Verificando:"
            echo "$arquivo"

            if unzip -l "$arquivo" 2>/dev/null | \
              grep -Eq '(^|/)(settings\.gradle|settings\.gradle\.kts)$'
            then
              ZIP="$arquivo"
              break
            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              -print
          )

          if [ -z "$ZIP" ]; then

            echo ""
            echo "ERRO: nenhum ZIP contendo projeto Android foi encontrado."
            echo ""

            echo "ZIPs existentes:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              -print

            exit 1
          fi

          echo ""
          echo "ZIP DO MENTEX:"
          echo "$ZIP"

          rm -rf "$GITHUB_WORKSPACE/projeto"
          mkdir -p "$GITHUB_WORKSPACE/projeto"

          unzip -q "$ZIP" \
            -d "$GITHUB_WORKSPACE/projeto"

          echo ""
          echo "Procurando settings.gradle..."

          SETTINGS=$(find "$GITHUB_WORKSPACE/projeto" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then

            echo "ERRO: settings.gradle não encontrado."

            echo ""
            echo "Conteúdo extraído:"

            find "$GITHUB_WORKSPACE/projeto" \
              -maxdepth 6 \
              -type f \
              | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "======================================"
          echo "PROJETO ANDROID ENCONTRADO"
          echo "======================================"

          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" \
            > "$GITHUB_WORKSPACE/project_dir.txt"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "Projeto:"
          echo "$PROJECT_DIR"

          echo ""

          ls -la "$PROJECT_DIR"

          echo ""

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

      - name: Compilar APK MENTEX
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COMPILANDO MENTEX"
          echo "======================================"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          fi

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "======================================"
          echo "PROCURANDO APK"
          echo "======================================"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERRO: APK não encontrado."

            find "$PROJECT_DIR" \
              -type f \
              | grep -E '\.(apk|aab)$' \
              || true

            exit 1
          fi

          echo ""
          echo "APK ENCONTRADO:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/MENTEX-V4.9.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.9-APK
          path: apk/MENTEX-V4.9.apk
          if-no-files-found: error

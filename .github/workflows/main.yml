name: Construir APK MENTEX Final

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK MENTEX V3.3
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar ZIP V3.3
        shell: bash
        run: |
          ZIP="MENTEX_ANDROID_PERFIL_RANKING_V3_3.zip"

          echo "Procurando:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP V3.3 não encontrado!"
            echo "Arquivos disponíveis:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP V3.3 encontrado com sucesso."

      - name: Extrair MENTEX V3.3
        shell: bash
        run: |
          rm -rf android_project
          mkdir -p android_project

          unzip -q "MENTEX_ANDROID_PERFIL_RANKING_V3_3.zip" \
            -d android_project

          echo "Projeto extraído:"
          find android_project -maxdepth 4 -type f | sort | head -200

      - name: Encontrar projeto Android
        id: projeto
        shell: bash
        run: |
          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado!"
            find android_project -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Limpar projeto
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"
          gradle clean --no-daemon --stacktrace

      - name: Construir APK MENTEX V3.3
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          echo "======================================"
          echo "      CONSTRUINDO MENTEX V3.3"
          echo "      PERFIL + AVATAR + RANKING"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Procurar APK
        shell: bash
        run: |
          echo "APKs gerados:"
          find android_project \
            -type f \
            -name "*.apk" \
            -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V3.3-PERFIL-RANKING
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Corrigir conflito Kotlin
        shell: bash
        run: |
          PROJECT="${{ steps.projeto.outputs.project_dir }}"

          echo "Corrigindo dependências Kotlin..."

          find "$PROJECT" -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          # Remove dependências antigas que podem gerar classes duplicadas
          find "$PROJECT" -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -exec sed -i \
            -e '/kotlin-stdlib-jdk7/d' \
            -e '/kotlin-stdlib-jdk8/d' \
            {} \;

          echo "Verificando referências Kotlin:"
          grep -RIn "kotlin-stdlib-jdk7\|kotlin-stdlib-jdk8" \
            "$PROJECT" --include="*.gradle" --include="*.gradle.kts" || true

      - name: Limpar projeto
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"
          gradle clean --no-daemon --stacktrace

      - name: Construir APK
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          echo "Iniciando compilação do MENTEX..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Procurar APK
        shell: bash
        run: |
          echo "APKs encontrados:"
          find android_project -type f -name "*.apk" -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-Final
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

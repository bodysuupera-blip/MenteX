
name: LABIRINTO MORTAL - Gerar APK 2.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair ZIP 2.1
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$GITHUB_WORKSPACE/LABIRINTO-MORTAL-PLATAFORMA-2.1-FUNDO-SOMBRIO.zip"

          if [[ ! -f "$ZIP" ]]; then
            echo "ZIP 2.1 não encontrado. Procurando..."
            ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 3 \
              -type f -iname 'LABIRINTO-MORTAL-PLATAFORMA-2.1-FUNDO-SOMBRIO.zip' \
              -print -quit)
          fi

          if [[ -z "${ZIP:-}" || ! -f "$ZIP" ]]; then
            echo "ERRO: ZIP da versão 2.1 não encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/labirinto-extraido"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/labirinto-extraido"

          echo "Conteúdo extraído:"
          find "$RUNNER_TEMP/labirinto-extraido" -maxdepth 5 -type f | head -100

          PROJECT_DIR=$(find "$RUNNER_TEMP/labirinto-extraido" \
            -type f -name settings.gradle \
            -printf '%h\n' | while read -r dir; do
              if [[ -f "$dir/app/build.gradle" ]]; then
                echo "$dir"
                break
              fi
            done)

          if [[ -z "${PROJECT_DIR:-}" ]]; then
            echo "ERRO: Projeto Android não encontrado dentro do ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT_DIR"

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -Eeuo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-2.1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

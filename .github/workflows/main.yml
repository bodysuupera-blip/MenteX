
name: CAO FUJAO 1.2 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 1.2
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extrair projeto atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./CAO-FUJAO-ATUALIZADO-1.2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: coloque CAO-FUJAO-ATUALIZADO-1.2.zip na raiz do repositório."
            exit 1
          fi

          mkdir -p /tmp/cao-fujao
          unzip -q "$ZIP" -d /tmp/cao-fujao

          echo "PROJECT_DIR=/tmp/cao-fujao" >> "$GITHUB_ENV"

          test -f /tmp/cao-fujao/settings.gradle
          test -f /tmp/cao-fujao/app/build.gradle
          test -f /tmp/cao-fujao/app/src/main/assets/index.html

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Preparar APK
        run: |
          set -Eeuo pipefail

          APK="$(find "$PROJECT_DIR" \
            -path '*/build/outputs/apk/debug/*.apk' \
            -type f | head -n 1)"

          test -n "$APK"

          mkdir -p entrega
          cp "$APK" entrega/CAO-FUJAO-1.2.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-1.2-APK
          path: entrega/CAO-FUJAO-1.2.apk
          if-no-files-found: error
          

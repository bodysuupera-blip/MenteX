name: Gerar APK MENTEX V4.6.3

on:
  workflow_dispatch:
  push:
    paths:
      - "MENTEX-V4.6.3-PERGUNTAS-MELHORADAS.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extrair projeto MENTEX
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-V4.6.3-PERGUNTAS-MELHORADAS.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo $ZIP não encontrado no repositório."
            echo "Envie o ZIP para a raiz do repositório no GitHub."
            exit 1
          fi

          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

          SETTINGS=$(find projeto -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado dentro do ZIP."
            echo "Confira se o ZIP contém o projeto Android completo."
            exit 1
          fi

          echo "PROJETO_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $(dirname "$SETTINGS")"

      - name: Gerar APK
        shell: bash
        run: |
          set -e
          cd "$PROJETO_DIR"

          gradle --no-daemon clean assembleDebug

      - name: Preparar APK final
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJETO_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p apk-final
          cp "$APK" apk-final/MENTEX-V4.6.3.apk
          ls -lh apk-final/

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.3-APK
          path: apk-final/MENTEX-V4.6.3.apk
          if-no-files-found: error
          retention-days: 14

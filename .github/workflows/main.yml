
name: MENTEX V4.14 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MENTEX-V4.14-ATUALIZADO-ASSINADO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: envie o ZIP V4.14 para a raiz do repositório."
            exit 1
          fi

          mkdir -p projeto
          unzip -oq "$ZIP" -d projeto

          SETTINGS="$(find projeto -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$DIR/app/build.gradle" ] && \
             [ ! -f "$DIR/app/build.gradle.kts" ]; then
            echo "ERRO: módulo app não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          mkdir -p entrega
          cp "$APK" entrega/MENTEX-V4.14.apk

          echo "APK pronto para baixar:"
          ls -lh entrega/MENTEX-V4.14.apk

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.14-APK
          path: entrega/MENTEX-V4.14.apk
          if-no-files-found: error
          retention-days: 14
          

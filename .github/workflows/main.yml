name: MENTEX V4.7 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Compilar MENTEX V4.7
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto MENTEX V4.7
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-V4.7-TELA-4-OPCOES.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo $ZIP não encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/mentex-project"

          unzip -oq "$ZIP" \
            -d "$RUNNER_TEMP/mentex-project"

          if [ ! -f "$RUNNER_TEMP/mentex-project/settings.gradle" ]; then
            echo "ERRO: settings.gradle não está na raiz do ZIP."
            exit 1
          fi

          cp -a "$RUNNER_TEMP/mentex-project/." .

          echo "Projeto V4.7 extraído com sucesso."
          ls -la

      - name: Verificar Android SDK
        shell: bash
        run: |
          set -e

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERRO: Android SDK não encontrado."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Aceitar licenças Android
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mentex/game/MainActivity.java
          test -f app/src/main/assets/index.html

          echo "Estrutura do projeto validada."

      - name: Instalar Gradle 8.7
        shell: bash
        run: |
          set -e

          curl -fL \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -oq "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

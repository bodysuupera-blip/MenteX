name: Gerar APK MENTEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          ZIP="MENTEX_300_FASES_FINAL_CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado na raiz do repositório."
            ls -la
            exit 1
          fi

          rm -rf projeto_mentex
          mkdir projeto_mentex

          unzip -q "$ZIP" -d projeto_mentex

          echo "Arquivos do projeto:"
          find projeto_mentex -maxdepth 3 -type f | head -100

          if [ ! -f "projeto_mentex/settings.gradle" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=projeto_mentex" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Iniciando compilação..."

          gradle assembleDebug --stacktrace --no-daemon

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p apk_final
          cp "$APK" apk_final/MENTEX-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-${{ github.run_id }}
          path: apk_final/MENTEX-debug.apk
          if-no-files-found: error

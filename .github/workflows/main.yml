
name: Compilar MENTEX V4.15

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="MENTEX-V4.15-INTERFACE-RENOVADA.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: ZIP do MENTEX não encontrado na raiz do repositório."
            exit 1
          fi

          mkdir -p projeto
          unzip -oq "$ZIP_FILE" -d projeto

          SETTINGS=$(find projeto -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p entrega
          cp "$APK" entrega/MENTEX-V4.15.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.15-APK
          path: entrega/MENTEX-V4.15.apk
          if-no-files-found: error
          retention-days: 14
          

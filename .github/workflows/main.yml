
name: Gerar APK MENTEX V5.5

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar projeto MENTEX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/mentex

          ZIP="$(find . -type f -name 'MENTEX_NOVA_PLATAFORMA_PARA_GERAR_APK.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP MENTEX não encontrado."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -oq "$ZIP" -d /tmp/mentex

          echo "Arquivos extraídos:"
          find /tmp/mentex -maxdepth 3 -type f -print

          if [ -f /tmp/mentex/config.xml ] && [ -f /tmp/mentex/www/index.html ]; then
            echo "TIPO=cordova" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=/tmp/mentex" >> "$GITHUB_ENV"
          elif [ -f /tmp/mentex/MENTEX_NOVA_PLATAFORMA/config.xml ]; then
            echo "TIPO=cordova" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=/tmp/mentex/MENTEX_NOVA_PLATAFORMA" >> "$GITHUB_ENV"
          else
            echo "ERRO: Não encontrei config.xml e www/index.html."
            exit 1
          fi

      - name: Instalar Cordova
        run: npm install -g cordova@12.0.0

      - name: Adicionar Android
        run: |
          cd "$PROJECT_DIR"
          cordova platform add android@13.0.0

      - name: Compilar MENTEX
        run: |
          cd "$PROJECT_DIR"
          cordova build android --debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-V5.5
          path: /tmp/mentex/**/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          

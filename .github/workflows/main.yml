
name: CAO FUJAO 2.1 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar somente Cao Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto se estiver em ZIP
        shell: bash
        run: |
          set -e
          if ! find . -name settings.gradle \
            -not -path './.git/*' | grep -q .; then

            echo "Procurando ZIP do Cao Fujão..."
            mkdir -p cao_fujao_extraido

            FOUND=0
            while IFS= read -r arquivo; do
              unzip -oq "$arquivo" -d cao_fujao_extraido
              FOUND=1
            done < <(find . -maxdepth 2 -type f \
              -iname 'Cao_Fujao*.zip' \
              -not -path './cao_fujao_extraido/*')

            if [ "$FOUND" -eq 0 ]; then
              echo "ERRO: Envie o ZIP do Cao Fujão para o repositorio."
              exit 1
            fi
          fi

      - name: Localizar projeto Cao Fujão
        shell: bash
        run: |
          set -e
          PROJECT_DIR=$(dirname "$(find . -type f \
            -name settings.gradle \
            -not -path './.git/*' \
            -print -quit)")

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRO: Estrutura Android nao encontrada."
            exit 1
          fi

          grep -q 'com.caofujao.game' \
            "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Compilar aplicativo Cao Fujão
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon clean :app:assembleDebug

      - name: Conferir APK
        run: |
          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          

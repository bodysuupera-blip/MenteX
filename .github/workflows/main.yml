
name: NEXUS 350 EVOLUTION 5.0 - APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Conferir ambiente
        run: |
          java -version
          node -v
          npm -v

      - name: Instalar dependencias
        run: npm install

      - name: Verificar arquivos V5
        run: |
          test -f www/index.html
          test -f package.json
          test -f capacitor.config.json
          grep -q "EVOLUTION 5.0" www/index.html
          grep -q "joystick" www/index.html
          echo "Fonte V5 encontrada!"

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configurar tela horizontal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:screenOrientation=' not in s:
              s = s.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity" android:screenOrientation="landscape"'
              )

          p.write_text(s)
          print("Tela horizontal configurada")
          PY

      - name: Corrigir dependencias Kotlin
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                          details.because "Unificar bibliotecas Kotlin"
                      }
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug \
            --no-daemon \
            --max-workers=2

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-EVOLUTION-V5-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

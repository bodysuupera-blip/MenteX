name: MENTEX V4.8 - Compilador APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilador MENTEX
    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 4. Instalar componentes necessários
      - name: Instalar SDK Android
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Encontrar e extrair o ZIP do MENTEX
      - name: Preparar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO ZIP DO MENTEX"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/projeto"

          ZIP=""

          # Procura ZIPs do MENTEX
          while IFS= read -r arquivo; do
            if unzip -l "$arquivo" 2>/dev/null | \
              grep -Eq '(^|/)(settings\.gradle|settings\.gradle\.kts)$'; then
              ZIP="$arquivo"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" \
                    -maxdepth 3 \
                    -type f \
                    -iname 'MENTEX*.zip' \
                    -print)

          if [ -z "$ZIP" ]; then
            echo ""
            echo "ERRO: nenhum ZIP do MENTEX contendo settings.gradle foi encontrado."
            echo ""
            echo "ZIPs encontrados:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -print || true
            exit 1
          fi

          echo "ZIP escolhido:"
          echo "$ZIP"

          echo ""
          echo "Extraindo projeto..."

          rm -rf "$GITHUB_WORKSPACE/projeto"
          mkdir -p "$GITHUB_WORKSPACE/projeto"

          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/projeto"

          echo ""
          echo "Procurando settings.gradle..."

          SETTINGS=$(find "$GITHUB_WORKSPACE/projeto" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado depois da extração."
            find "$GITHUB_WORKSPACE/projeto" -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "======================================"
          echo "PROJETO ANDROID ENCONTRADO"
          echo "======================================"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > "$GITHUB_WORKSPACE/project_dir.txt"

      # 6. Configurar Gradle
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 7. Dar permissão ao Gradle Wrapper, se existir
      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "Projeto:"
          echo "$PROJECT_DIR"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "Gradle Wrapper encontrado."
          else
            echo "Gradle Wrapper não encontrado."
            echo "Será usado o Gradle 8.7 instalado pelo GitHub Actions."
          fi

      # 8. Compilar APK
      - name: Compilar MENTEX
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COMPILANDO MENTEX"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      # 9. Procurar APK
      - name: Procurar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "======================================"
          echo "PROCURANDO APK"
          echo "======================================"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            find "$PROJECT_DIR" -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/MENTEX-V4.8.apk"

      # 10. Publicar APK para baixar
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-APK
          path: apk/MENTEX-V4.8.apk
          if-no-files-found: error


name: MENTEX - Gerar APK com rolagem corrigida

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    env:
      ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Dar permissão ao Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Compilar APK
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERRO: gradlew não encontrado na raiz."
            echo "Coloque o projeto Android na raiz do repositório."
            exit 1
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

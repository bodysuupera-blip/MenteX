name: Construir APK MENTEX Final

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK MENTEX
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar ZIP
        id: zip
        shell: bash
        run: |
          echo "Procurando ZIP do MENTEX..."

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado."
            ls -la
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p android_project
          unzip -o "$ZIP" -d android_project

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado."
            find android_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Ajustar Kotlin
        shell: bash
        run: |
          PROJECT="${{ steps.projeto.outputs.project_dir }}"

          echo "Ajustando Kotlin..."

          if [ -f "$PROJECT/app/build.gradle" ]; then
            cat >> "$PROJECT/app/build.gradle" <<'EOF'

configurations.configureEach {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}
EOF
          fi

      - name: Limpar projeto
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"
          gradle clean --no-daemon

      - name: Gerar APK
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          echo "Procurando APK..."

          find android_project \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android_project \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK gerado:"
          echo "$APK"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-Final
          path: android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

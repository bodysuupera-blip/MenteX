name: MENTEX V5.0 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V5.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          echo "Procurando arquivos do MENTEX..."

          find . -maxdepth 6 -type f -name settings.gradle

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle" ] &&
               [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -maxdepth 6 -type f -name settings.gradle)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Android não encontrado. Extraia e envie todos os arquivos do ZIP para o GitHub."
            echo "Arquivos presentes no repositório:"
            ls -la
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        run: |
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

      - name: Verificar arquivos
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Arquivos principais encontrados."

      - name: Gerar APK
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          /tmp/gradle-8.7/bin/gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.0-APK
          path: ${{ steps.projeto.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

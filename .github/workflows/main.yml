
name: Gerar APK MENTEX V4.11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          set -e
          mkdir projeto
          unzip -oq MENTEX-V4.11-ROLAGEM-RESPONSIVA.zip -d projeto

          test -f projeto/settings.gradle || \
          test -f projeto/settings.gradle.kts

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          set -e
          cd projeto
          gradle assembleDebug

      - name: Publicar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.11-APK
          path: projeto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

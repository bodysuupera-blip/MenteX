name: MENTEX V4.6 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar projeto
        run: |
          echo "Diretório atual:"
          pwd
          echo "Arquivos:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Encontrar Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          elif [ -f "./app/gradlew" ]; then
            chmod +x ./app/gradlew
            echo "GRADLE_CMD=./app/gradlew" >> "$GITHUB_ENV"
          else
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

      - name: Limpar projeto
        run: $GRADLE_CMD clean

      - name: Gerar APK
        run: $GRADLE_CMD assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error

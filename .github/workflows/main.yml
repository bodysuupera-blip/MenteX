
name: NEXUS 350 - TROCAR ICONE SEM RECONSTRUIR JOGO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trocar_icone:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip imagemagick

      - name: Extrair pacote
        run: |
          set -e
          mkdir -p pacote
          unzip -oq NEXUS350_ICONE_RECURSOS_APK_ORIGINAL.zip -d pacote

          APK=$(find pacote -type f -name '*.apk' | head -1)
          ICON=$(find pacote -type f \( -name 'ic_launcher.png' -o -name 'icon.png' \) | grep -v '\.apk$' | head -1)

          test -n "$APK"
          test -n "$ICON"

          echo "APK=$APK" >> $GITHUB_ENV
          echo "ICON=$ICON" >> $GITHUB_ENV

      - name: Extrair APK sem reconstruir recursos
        run: |
          set -e
          mkdir apk_original
          unzip -oq "$APK" -d apk_original

      - name: Substituir somente PNG dos icones
        run: |
          set -e

          find apk_original/res -type f -name '*.png' | while read FILE; do
            NAME=$(basename "$FILE")

            case "$NAME" in
              ic_launcher.png|ic_launcher_round.png|ic_launcher_foreground.png)
                echo "Atualizando: $FILE"
                convert "$ICON" -resize 512x512 \
                  -background none -gravity center -extent 512x512 "$FILE"
                ;;
            esac
          done

      - name: Reempacotar APK original
        run: |
          cd apk_original
          zip -qr ../nexus_unsigned.apk .

      - name: Criar chave de assinatura
        run: |
          keytool -genkeypair \
            -keystore nexus.keystore \
            -alias nexus \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexus350123 \
            -keypass nexus350123 \
            -dname "CN=Nexus350, O=Nexus350, C=BR"

      - name: Assinar APK
        run: |
          apksigner sign \
            --ks nexus.keystore \
            --ks-key-alias nexus \
            --ks-pass pass:nexus350123 \
            --key-pass pass:nexus350123 \
            --out NEXUS350-ICONE.apk \
            nexus_unsigned.apk

      - name: Verificar APK
        run: |
          apksigner verify NEXUS350-ICONE.apk
          unzip -t NEXUS350-ICONE.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-ICONE-ORIGINAL
          path: NEXUS350-ICONE.apk
          if-no-files-found: error
          

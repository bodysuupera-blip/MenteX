
name: LABIRINTO MORTAL - APK ATUALIZADO 3.0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar versão atualizada
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair ZIP correto
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="LABIRINTO-MORTAL-3.0.1-SEM-ARCADE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo atualizado não encontrado: $ZIP"
            echo "Arquivos ZIP disponíveis:"
            find . -type f -iname '*.zip'
            exit 1
          fi

          echo "Usando exclusivamente: $ZIP"

          mkdir -p "$RUNNER_TEMP/fonte-atualizada"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/fonte-atualizada"

          PROJECT_DIR="$(find "$RUNNER_TEMP/fonte-atualizada" \
            -type f -name settings.gradle -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Android não encontrado dentro do ZIP."
            exit 1
          fi

          echo "Projeto selecionado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Conferir versão do projeto
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          echo "Verificando versão:"
          grep -nE 'versionCode|versionName' app/build.gradle

          if ! grep -q 'versionName "3.0.1"' app/build.gradle; then
            echo "ERRO: o projeto não contém a versão 3.0.1."
            exit 1
          fi

      - name: Compilar APK atualizado
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Conferir APK gerado
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          mkdir -p saida
          cp "$APK" saida/LABIRINTO-MORTAL-3.0.1-ATUALIZADO.apk

          sha256sum saida/LABIRINTO-MORTAL-3.0.1-ATUALIZADO.apk
          ls -lh saida/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-3.0.1-ATUALIZADO
          path: saida/LABIRINTO-MORTAL-3.0.1-ATUALIZADO.apk
          if-no-files-found: error
          

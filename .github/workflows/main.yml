
name: NEXUS 350 EVOLUTION - BUILD APK NOVO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar estrutura independente
        run: |
          mkdir -p game assets .github/workflows

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm pkg set name="nexus-350-evolution"
          npm pkg set version="1.0.0"
          npm pkg set scripts.build="echo Build preparado"

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core
          npm install @capacitor/cli @capacitor/android

      - name: Criar tela inicial caso nao exista
        run: |
          if [ ! -f index.html ]; then
            cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
          <title>Nexus 350 Evolution</title>
          <style>
          *{box-sizing:border-box}
          body{
            margin:0;background:radial-gradient(circle,#182c54,#050914);
            color:white;font-family:Arial;height:100vh;
            display:flex;align-items:center;justify-content:center;
            text-align:center;overflow:hidden
          }
          .box{padding:25px}
          h1{font-size:42px;color:#65d9ff;text-shadow:0 0 20px #008cff}
          button{padding:18px 45px;font-size:22px;border:0;border-radius:15px;
          background:#087dff;color:white;font-weight:bold}
          </style>
          </head>
          <body>
          <div class="box">
          <h1>NEXUS 350</h1>
          <h2>EVOLUTION</h2>
          <p>Uma nova aventura está começando!</p>
          <button onclick="alert('Projeto Nexus 350 Evolution iniciado!')">JOGAR</button>
          </div>
          </body>
          </html>
          EOF
          fi

      - name: Configurar Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexus350.evolution",
            "appName": "Nexus 350 Evolution",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF
          fi

      - name: Criar Android
        run: npx cap add android

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-EVOLUTION-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

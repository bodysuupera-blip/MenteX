
name: CAO FUJAO 3.1 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 3.1
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Corrigir e verificar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Verificando arquivos do Cão Fujão..."

          for FILE in \
            settings.gradle \
            build.gradle \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/assets/index.html \
            app/src/main/assets/intro.png
          do
            if [ ! -s "$FILE" ]; then
              echo "ERRO: arquivo ausente ou vazio: $FILE"
              exit 1
            fi
          done

          grep -q 'com.caofujao.game' app/build.gradle || {
            echo "ERRO: pacote incorreto."
            exit 1
          }

          sed -i "s/versionName '3.0'/versionName '3.1'/" app/build.gradle

          echo "Versão configurada:"
          grep versionName app/build.gradle

          echo "Projeto confirmado!"

      - name: Compilar APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Verificar APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-3.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          


name: MENTEX V5.1 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Atualizar MENTEX V5.1
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos necessários
        run: |
          test -f MENTEX-V5.0.apk
          test -f opening_first.jpg
          test -f mentex_icon.png
          echo "Arquivos encontrados!"

      - name: Atualizar arquivos internos do MENTEX
        run: |
          python3 - <<'PY'
          import zipfile
          import os
          import shutil

          apk = "MENTEX-V5.0.apk"
          saida = "MENTEX-V5.1-unsigned.apk"

          with zipfile.ZipFile(apk, "r") as origem:
              arquivos = {
                  item.filename: (item, origem.read(item.filename))
                  for item in origem.infolist()
              }

          caminho = "assets/www/index.html"

          if caminho not in arquivos:
              raise Exception("index.html não encontrado no APK")

          info, dados = arquivos[caminho]
          html = dados.decode("utf-8")

          inicio = html.index('<div id="opening"')
          audio = html.index('<audio id="introMusic"', inicio)

          nova_tela = """
          <div id="opening" class="opening mentex-v51">
            <img class="mentex-welcome"
                 src="opening_first.jpg"
                 alt="Bem-vindo ao MENTEX">

            <button class="mentex-start"
                    onclick="enterGame()"
                    aria-label="Começar o MENTEX">
            </button>
          </div>
          """

          html = html[:inicio] + nova_tela + html[audio:]

          css = """
          <style id="mentex-v51-style">
          .mentex-v51 {
            position:fixed!important;
            inset:0!important;
            width:100%!important;
            height:100%!important;
            height:100dvh!important;
            padding:0!important;
            margin:0!important;
            overflow:hidden!important;
            background:#031a53!important;
            z-index:99999!important;
          }

          .mentex-welcome {
            position:absolute!important;
            inset:0!important;
            width:100%!important;
            height:100%!important;
            object-fit:fill!important;
          }

          .mentex-start {
            position:absolute!important;
            left:19%!important;
            bottom:6.5%!important;
            width:62%!important;
            height:6.3%!important;
            border:0!important;
            border-radius:30px!important;
            background:transparent!important;
            cursor:pointer!important;
          }

          .share-game-btn {
            display:block!important;
            width:100%!important;
            padding:14px!important;
            margin-top:12px!important;
            border-radius:16px!important;
            background:linear-gradient(135deg,#16d66c,#087d43)!important;
            color:white!important;
            font-weight:900!important;
          }
          </style>
          """

          html = html.replace("</head>", css + "</head>", 1)

          botao = """
          <button class="secondary share-game-btn"
                  onclick="shareMentex()">
            📲 COMPARTILHAR MENTEX PELO WHATSAPP
          </button>
          """

          marcador = '<button class="secondary home-ad"'

          if marcador not in html:
              raise Exception("Não foi encontrado o local do botão na tela inicial")

          html = html.replace(marcador, botao + marcador, 1)

          javascript = """
          function shareMentex() {
            const mensagem =
              '🧠 Conheça o MENTEX! Desafie sua mente, exercite seu cérebro e divirta-se!';

            const whatsapp =
              'https://wa.me/?text=' +
              encodeURIComponent(mensagem);

            if (navigator.share) {
              navigator.share({
                title: 'MENTEX',
                text: mensagem
              }).catch(function() {
                window.open(whatsapp, '_system');
              });
            } else {
              window.open(whatsapp, '_system');
            }
          }
          """

          posicao = html.rfind("</script>")

          if posicao < 0:
              raise Exception("Script do aplicativo não encontrado")

          html = html[:posicao] + javascript + html[posicao:]

          arquivos[caminho] = (info, html.encode("utf-8"))

          arquivos["assets/www/opening_first.jpg"] = (
              None,
              open("opening_first.jpg", "rb").read()
          )

          icone = open("mentex_icon.png", "rb").read()

          for nome, (info, dados) in list(arquivos.items()):
              if nome == "assets/www/mentex_icon.png":
                  arquivos[nome] = (info, icone)

              elif nome.startswith("res/mipmap-") and nome.endswith(
                  ("/ic_launcher.png", "/ic_launcher_round.png",
                   "/ic_launcher_foreground.png")
              ):
                  arquivos[nome] = (info, icone)

          with zipfile.ZipFile(saida, "w") as destino:
              for nome, (info, dados) in arquivos.items():

                  if nome.upper().startswith("META-INF/") and nome.upper().endswith(
                      (".RSA", ".DSA", ".EC", ".SF")
                  ):
                      continue

                  if info is None:
                      destino.writestr(nome, dados)
                  else:
                      destino.writestr(info, dados)

          print("Atualização interna concluída!")
          print("Arquivo MENTEX V5.1 preparado!")
          PY

      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > mentex.jks
            ALIAS="$KEY_ALIAS"
            STOREPASS="$KEYSTORE_PASSWORD"
            KEYPASS="$KEY_PASSWORD"
          else
            keytool -genkeypair -v \
              -keystore mentex.jks \
              -alias mentex \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mentex123 \
              -keypass mentex123 \
              -dname "CN=MENTEX,O=MENTEX,C=BR"

            ALIAS=mentex
            STOREPASS=mentex123
            KEYPASS=mentex123
          fi

          echo "ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "STOREPASS=$STOREPASS" >> $GITHUB_ENV
          echo "KEYPASS=$KEYPASS" >> $GITHUB_ENV

      - name: Assinar aplicativo
        run: |
          jarsigner \
            -keystore mentex.jks \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar MENTEX-V5.1.apk \
            MENTEX-V5.1-unsigned.apk \
            "$ALIAS"

      - name: Verificar assinatura
        run: |
          jarsigner -verify -verbose MENTEX-V5.1.apk
          test -s MENTEX-V5.1.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.1-FINAL
          path: MENTEX-V5.1.apk
          if-no-files-found: error
          

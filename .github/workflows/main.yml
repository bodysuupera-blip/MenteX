
name: CAO FUJAO 1.3 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 1.3
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=""

          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ] && [ -f "$GITHUB_WORKSPACE/app/build.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name 'CAO-FUJAO-ATUALIZADO-1.3.zip' -print -quit)"

            if [ -n "$SOURCE_ZIP" ]; then
              mkdir -p "$RUNNER_TEMP/cao-fujao-source"
              unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/cao-fujao-source"

              SETTINGS_FILE="$(find "$RUNNER_TEMP/cao-fujao-source" -type f -name settings.gradle -print -quit)"

              if [ -n "$SETTINGS_FILE" ]; then
                PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRO: projeto Android não encontrado."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort | head -n 200
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.dir }}" \
            clean :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-1.3-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

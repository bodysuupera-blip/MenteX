name: Construir APK MENTEX Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK MENTEX Final
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Procurar APK
        run: |
          echo "Procurando APK do MENTEX..."
          find . -type f -name "*.apk" -print

      - name: Verificar APK
        run: |
          if [ ! -f "MENTEX_Android_Projeto/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "MENTEX_Android_Projeto/app/build/outputs/apk/debug/app-debug.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-FINAL
          path: MENTEX_Android_Projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Resumo
        run: |
          echo "======================================"
          echo " APK MENTEX GERADO/DISPONÍVEL"
          echo "======================================"
          echo "Arquivo:"
          ls -lh MENTEX_Android_Projeto/app/build/outputs/apk/debug/app-debug.apk

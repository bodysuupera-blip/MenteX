
name: CAO FUJAO - GERAR APK 500 FASES

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujao
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="Cao_Fujao_Android_500_Fases.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP do projeto nao encontrado."
            exit 1
          fi

          mkdir -p projeto-cao-fujao
          unzip -q "$ZIP" -d projeto-cao-fujao

          test -f projeto-cao-fujao/settings.gradle
          test -f projeto-cao-fujao/app/build.gradle
          test -f projeto-cao-fujao/app/src/main/assets/index.html

          echo "Projeto encontrado e verificado!"

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon \
            -p projeto-cao-fujao \
            clean :app:assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="projeto-cao-fujao/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          mkdir -p resultado

          cp "$APK" resultado/CAO-FUJAO-500-FASES.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-500-FASES
          path: resultado/CAO-FUJAO-500-FASES.apk
          if-no-files-found: error
          

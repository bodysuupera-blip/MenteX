
name: MENTEX V5.0 - Tela Inicial e Ícone Atualizados

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK MENTEX V5.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Instalar Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Localizar e extrair atualização
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \
            -iname "MENTEX-V5.0-ATUALIZACAO-DUAS-MELHORIAS.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP de atualização não encontrado."
            echo "Coloque o arquivo na raiz do repositório."
            exit 1
          fi

          mkdir -p extraido
          unzip -o "$ZIP" -d extraido

          WWW=$(find extraido -type f \
            -path "*/mentex-package/www/index.html" \
            | head -n 1)

          RES=$(find extraido -type f \
            -path "*/android-res/values/colors.xml" \
            | head -n 1)

          if [ -z "$WWW" ] || [ -z "$RES" ]; then
            echo "ERRO: arquivos da atualização não encontrados."
            exit 1
          fi

          echo "WWW=$(dirname "$WWW")" >> "$GITHUB_ENV"
          echo "ANDROID_RES=$(dirname "$(dirname "$RES")")" >> "$GITHUB_ENV"

      - name: Conferir arquivos da atualização
        run: |
          set -e

          test -f "$WWW/index.html"
          test -f "$WWW/opening_screen.png"
          test -f "$WWW/mentex_icon.png"
          test -f "$ANDROID_RES/mipmap-anydpi-v26/ic_launcher.xml"
          test -f "$ANDROID_RES/drawable/mentex_icon_source.png"

          echo "Arquivos da tela inicial e do ícone encontrados."

      - name: Criar projeto Cordova
        run: |
          cordova create mentex-build br.com.mentex.app MENTEX

          rm -rf mentex-build/www
          cp -a "$WWW" mentex-build/www

      - name: Configurar ícone no config.xml
        working-directory: mentex-build
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("config.xml")
          xml = path.read_text(encoding="utf-8")

          # Remove eventual prefixo de namespace incorreto
          xml = re.sub(r'\bns0:', '', xml)
          xml = re.sub(r'\s+xmlns:ns0="[^"]+"', '', xml)

          # Remove configurações antigas de ícone
          xml = re.sub(r'\s*<icon\b[^>]*/>', '', xml)

          if not re.search(r'<widget(?:\s|>)', xml):
              raise SystemExit("ERRO: raiz widget não encontrada.")

          xml = xml.replace(
              '</widget>',
              '  <icon src="www/mentex_icon.png" />\n</widget>',
              1
          )

          path.write_text(xml, encoding="utf-8")
          print("Ícone configurado no Cordova.")
          PY

      - name: Adicionar plataforma Android
        working-directory: mentex-build
        run: cordova platform add android@14.0.1

      - name: Aplicar ícones Android em todas as resoluções
        run: |
          set -e

          RES="mentex-build/platforms/android/app/src/main/res"

          mkdir -p "$RES"

          cp -a "$ANDROID_RES/." "$RES/"

          echo "Ícones Android instalados."

      - name: Conferir ícones instalados
        run: |
          set -e

          RES="mentex-build/platforms/android/app/src/main/res"

          test -f "$RES/mipmap-mdpi/ic_launcher.png"
          test -f "$RES/mipmap-hdpi/ic_launcher.png"
          test -f "$RES/mipmap-xhdpi/ic_launcher.png"
          test -f "$RES/mipmap-xxhdpi/ic_launcher.png"
          test -f "$RES/mipmap-xxxhdpi/ic_launcher.png"
          test -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          test -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "Todos os ícones foram encontrados."

      - name: Gerar APK
        working-directory: mentex-build
        run: cordova build android --debug

      - name: Preparar APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-final

          APK=$(find mentex-build/platforms/android \
            -type f -name "*debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" apk-final/MENTEX-V5.0-ATUALIZADO.apk

          echo "APK preparado com sucesso."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.0-ATUALIZADO
          path: apk-final/MENTEX-V5.0-ATUALIZADO.apk
          retention-days: 30
          

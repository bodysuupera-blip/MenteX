
name: MENTEX V5.2 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Preparar APK MENTEX V5.2
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Localizar e extrair APK
        run: |
          mkdir -p saida
          mkdir -p temporario

          APK=$(find . -type f -iname "*.apk" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$APK" ]; then
            ZIP=$(find . -type f -iname "*.zip" \
              -not -path "./.git/*" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: Nenhum APK ou ZIP encontrado."
              exit 1
            fi

            unzip -o "$ZIP" -d temporario

            APK=$(find temporario -type f \
              -iname "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERRO: O ZIP não contém APK."
            exit 1
          fi

          cp "$APK" saida/MENTEX-V5.2.apk

          echo "APK localizado com sucesso!"

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.2-APK
          path: saida/MENTEX-V5.2.apk
          if-no-files-found: error
          

name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto MENTEX
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex
          unzip -o MENTEX_Android_2_8_Voz_Atualizada.zip -d /tmp/mentex

      - name: Configurar tela inteira
        run: |
          cat > /tmp/mentex/app/src/main/java/br/com/mentex/game/MainActivity.kt <<'EOF'
          package br.com.mentex.game

          import android.app.Activity
          import android.os.Bundle
          import android.os.Build
          import android.view.View
          import android.view.Window
          import android.view.WindowInsets
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.media.MediaPlayer

          import com.google.android.gms.ads.MobileAds
          import com.google.android.gms.ads.rewarded.RewardItem
          import com.google.android.gms.ads.rewarded.RewardedAd
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback
          import com.google.android.gms.ads.interstitial.InterstitialAd
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.LoadAdError

          class MainActivity : Activity() {

              private lateinit var webView: WebView
              private var rewardedAd: RewardedAd? = null
              private var interstitialAd: InterstitialAd? = null
              private var introPlayer: MediaPlayer? = null

              companion object {
                  private const val REWARDED_AD_UNIT_ID =
                      "ca-app-pub-3631665156241326/4036769692"

                  private const val INTERSTITIAL_AD_UNIT_ID =
                      "ca-app-pub-3631665156241326/2935053979"
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  entrarEmTelaCheia()

                  webView = WebView(this)

                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(
                          view: WebView?,
                          url: String?
                      ) {
                          super.onPageFinished(view, url)
                          tocarIntro()
                      }
                  }

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mediaPlaybackRequiresUserGesture = false
                  }

                  webView.addJavascriptInterface(
                      GameBridge(),
                      "AndroidAds"
                  )

                  setContentView(webView)

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  )

                  MobileAds.initialize(this) {
                      carregarRewarded()
                      carregarInterstitial()
                  }
              }

              private fun entrarEmTelaCheia() {

                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  )

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {

                      window.setDecorFitsSystemWindows(false)

                      window.insetsController?.hide(
                          WindowInsets.Type.statusBars() or
                          WindowInsets.Type.navigationBars()
                      )

                      window.insetsController?.systemBarsBehavior =
                          android.view.WindowInsetsController
                              .BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE

                  } else {

                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility =
                          View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)

                  if (hasFocus) {
                      entrarEmTelaCheia()
                  }
              }

              private fun tocarIntro() {

                  if (introPlayer != null) return

                  try {

                      introPlayer = MediaPlayer().apply {

                          setDataSource(
                              "file:///android_asset/mentex_intro.mp3"
                          )

                          setOnPreparedListener {
                              it.start()
                          }

                          setOnCompletionListener { mp ->
                              mp.release()
                              introPlayer = null
                          }

                          setOnErrorListener { mp, _, _ ->
                              mp.release()
                              introPlayer = null
                              true
                          }

                          prepareAsync()
                      }

                  } catch (_: Exception) {
                      introPlayer = null
                  }
              }

              private fun carregarRewarded() {

                  RewardedAd.load(
                      this,
                      REWARDED_AD_UNIT_ID,
                      AdRequest.Builder().build(),
                      object : RewardedAdLoadCallback() {

                          override fun onAdLoaded(ad: RewardedAd) {
                              rewardedAd = ad
                          }

                          override fun onAdFailedToLoad(
                              error: LoadAdError
                          ) {
                              rewardedAd = null
                          }
                      }
                  )
              }

              private fun carregarInterstitial() {

                  InterstitialAd.load(
                      this,
                      INTERSTITIAL_AD_UNIT_ID,
                      AdRequest.Builder().build(),
                      object : Inter

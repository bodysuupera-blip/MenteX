
name: NEXUS 350 EVOLUTION 5.0 - APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Procurar e extrair ZIP V5
        run: |
          set -e

          if [ -f NEXUS_350_EVOLUTION_V5_FONTE.zip ]; then
            unzip -o NEXUS_350_EVOLUTION_V5_FONTE.zip -d .
          fi

          if [ ! -f www/index.html ]; then
            echo "ERRO: www/index.html nao encontrado."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Fonte V5 encontrada!"

      - name: Criar package.json se necessario
        run: |
          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
          {
            "name": "nexus-350-evolution",
            "version": "5.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          fi

      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund

      - name: Verificar arquivos
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          grep -q "EVOLUTION 5.0" www/index.html
          grep -q "joystick" www/index.html
          echo "Arquivos V5 conferidos!"

      - name: Criar projeto Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configurar tela horizontal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:screenOrientation=' not in s:
              s = s.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity" android:screenOrientation="landscape"'
              )

          p.write_text(s)
          print("Orientacao horizontal configurada")
          PY

      - name: Unificar Kotlin
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-EVOLUTION-V5-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

name: MENTEX - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Localizar e preparar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/mentex-zips

          shopt -s globstar nullglob
          found=""

          for zipfile in ./**/*.zip ./*.zip; do
            [ -f "$zipfile" ] || continue

            if unzip -Z1 "$zipfile" 2>/dev/null | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
              found="$zipfile"
              break
            fi
          done

          if [ -n "$found" ]; then
            echo "Projeto Android encontrado no ZIP: $found"
            unzip -q "$found" -d /tmp/mentex-zips
          fi

          project=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/app/build.gradle" ] || [ -f "$dir/app/build.gradle.kts" ]; then
              project="$dir"
              break
            fi
          done < <(find . /tmp/mentex-zips -type f \( -name settings.gradle -o -name settings.gradle.kts \) 2>/dev/null)

          if [ -z "$project" ]; then
            echo "::error::Nenhum projeto Android Gradle válido encontrado."
            echo "Arquivos encontrados:"
            find . /tmp/mentex-zips -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) 2>/dev/null | head -100
            exit 1
          fi

          echo "Projeto selecionado: $project"
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"

      - name: Preparar Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "::error::O projeto não contém gradlew."
            echo "Adicione o Gradle Wrapper original do projeto Android."
            exit 1
          fi

          chmod +x gradlew

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

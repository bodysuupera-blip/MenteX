name: MENTEX V4.10 - Gerar APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Compilar MENTEX V4.10
runs-on: ubuntu-22.04

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Baixar repositorio
    uses: actions/checkout@v4

  - name: Configurar Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Localizar projeto Android
    id: project
    shell: bash
    run: |
      set -euo pipefail

      ROOT="$GITHUB_WORKSPACE"
      PROJECT=""

      while IFS= read -r -d '' FILE; do
        DIR="$(dirname "$FILE")"

        if [ -f "$DIR/app/build.gradle" ] && \
           [ -f "$DIR/build.gradle" ]; then
          PROJECT="$DIR"
          break
        fi
      done < <(
        find "$ROOT" \
          -type f \
          -name settings.gradle \
          -not -path '*/.git/*' \
          -print0
      )

      if [ -z "$PROJECT" ]; then
        echo "ERRO: Projeto Android nao encontrado."
        echo "Verifique se a pasta MENTEX foi enviada ao repositorio."
        exit 1
      fi

      echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"
      echo "Projeto encontrado: $PROJECT"

  - name: Localizar SDK Manager
    id: sdk
    shell: bash
    run: |
      set -euo pipefail

      SDKMANAGER="$(
        find "$ANDROID_HOME/cmdline-tools" \
          -type f \
          -name sdkmanager \
          2>/dev/null | sort -V | tail -n 1
      )"

      if [ -z "$SDKMANAGER" ]; then
        echo "ERRO: SDK Manager nao encontrado."
        exit 1
      fi

      echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"

  - name: Instalar componentes Android
    shell: bash
    run: |
      set -e

      SDKMANAGER="${{ steps.sdk.outputs.path }}"

      set +o pipefail
      yes | "$SDKMANAGER" --licenses || true
      set -o pipefail

      "$SDKMANAGER" \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Configurar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Verificar arquivos do projeto
    working-directory: ${{ steps.project.outputs.dir }}
    shell: bash
    run: |
      set -e

      test -f settings.gradle
      test -f build.gradle
      test -f app/build.gradle
      test -f app/src/main/AndroidManifest.xml
      test -f app/src/main/assets/www/index.html

      echo "Arquivos principais encontrados."

  - name: Compilar APK
    working-directory: ${{ steps.project.outputs.dir }}
    run: gradle --no-daemon assembleDebug --stacktrace

  - name: Verificar APK gerado
    working-directory: ${{ steps.project.outputs.dir }}
    shell: bash
    run: |
      set -e

      APK="app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -s "$APK" ]; then
        echo "ERRO: APK nao foi gerado."
        exit 1
      fi

      echo "APK gerado com sucesso."
      ls -lh "$APK"

  - name: Disponibilizar APK para download
    uses: actions/upload-artifact@v4
    with:
      name: MENTEX-V4.10-APK
      path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7

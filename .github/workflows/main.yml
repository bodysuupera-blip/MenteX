name: Compilar MENTEX V4.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENTEX V4.6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare MENTEX project
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-V4.6-CEREBRO-REACTIONS-ATUALIZADO.zip"

          echo "Looking for project ZIP..."

          if [ ! -f "$ZIP" ]; then
            echo "Updated ZIP not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP found: $ZIP"

          rm -rf mentex-project
          mkdir -p mentex-project

          echo "Extracting project..."
          unzip -o "$ZIP" -d mentex-project

          SETTINGS=$(find mentex-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            find mentex-project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "Building MENTEX V4.6..."

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p result

          cp "$APK" \
            result/MENTEX-V4.6-CEREBRO-REACTIONS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-CEREBRO-REACTIONS
          path: result/MENTEX-V4.6-CEREBRO-REACTIONS.apk
          if-no-files-found: error

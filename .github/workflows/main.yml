
name: LABIRINTO MORTAL - PLATAFORMA V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Plataforma V4
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Localizar ZIP V4
        run: |
          set -Eeuo pipefail

          ZIP=$(find . -type f \
            -name "LABIRINTO-MORTAL-PLATAFORMA-INOVADORA-V4.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP V4 não encontrado."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/v4"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/v4"

          PROJECT=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/build.gradle" ] &&
               [ -f "$DIR/app/build.gradle" ] &&
               [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$RUNNER_TEMP/v4" \
            -type f -name settings.gradle)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: Projeto Android não encontrado."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verificar versão V4
        run: |
          FILE="$PROJECT/app/src/main/java/com/arcade/labirintomortal/MainActivity.java"

          test -f "$FILE"
          grep -q 'drawMissions' "$FILE"
          grep -q 'drawAchievements' "$FILE"
          grep -q 'drawSettings' "$FILE"
          grep -q 'dailyClaimed' "$FILE"
          test -f "$PROJECT/app/src/main/res/drawable/ic_launcher.xml"

          echo "Funcionalidades V4 verificadas."

      - name: Compilar APK
        run: |
          cd "$PROJECT"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-V4
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          

name: Compilador MENTEX V4.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar e preparar projeto
        shell: bash
        run: |
          set -e

          echo "Procurando ZIP do MENTEX..."

          ZIP=$(find . -maxdepth 1 -type f \
            -name 'MENTEX-V4.6-PERGUNTAS-FINAL-TELA-CHEIA.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: MENTEX-V4.6-PERGUNTAS-FINAL-TELA-CHEIA.zip nao encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          rm -rf projeto
          mkdir -p projeto

          unzip -o "$ZIP" -d projeto

          echo "Arquivos extraidos:"
          find projeto -maxdepth 5 -type f -print

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find projeto -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            find projeto -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto Android encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "================================"
          echo "COMPILANDO MENTEX V4.6"
          echo "TELA DE PERGUNTAS TELA CHEIA"
          echo "SEM DESLIZAMENTO"
          echo "================================"

          gradle clean assembleDebug --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          echo "APKs gerados:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-TELA-CHEIA
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: MENTEX - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT=""

          while IFS= read -r settings; do
            dir="$(dirname "$settings")"

            if [[ -f "$dir/app/build.gradle" || \
                  -f "$dir/app/build.gradle.kts" ]]; then
              PROJECT="$dir"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*'
          )

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Projeto Android não encontrado."
            echo "Verifique se o repositório contém o código-fonte."
            find . -maxdepth 5 -type f \
              \( -name build.gradle \
              -o -name build.gradle.kts \
              -o -name settings.gradle \
              -o -name settings.gradle.kts \)
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Preparar Gradle compatível
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [[ -f gradlew ]]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Gradle Wrapper ausente. Identificando o plugin Android..."

          VERSION="$(
            grep -RhoE \
              'com\.android\.(application|library)["[:space:]]*version[[:space:]]*["= ]+[0-9]+\.[0-9]+(\.[0-9]+)?' \
              . \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              --exclude-dir=.gradle 2>/dev/null |
            grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' |
            head -n 1 || true
          )"

          if [[ -z "$VERSION" ]]; then
            VERSION="$(
              grep -RhoE \
                'com\.android\.(application|library):[0-9]+\.[0-9]+(\.[0-9]+)?' \
                . \
                --include='*.gradle' \
                --include='*.gradle.kts' \
                --exclude-dir=.gradle 2>/dev/null |
              grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' |
              head -n 1 || true
            )"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::Não foi possível identificar a versão do Android Gradle Plugin."
            echo "Informe a versão do plugin ou inclua o Gradle Wrapper original."
            exit 1
          fi

          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"

          if [[ "$MAJOR" -ge 9 ]]; then
            GRADLE_VERSION="9.1.0"
          elif [[ "$MAJOR" -ge 8 ]]; then
            case "$MINOR" in
              9) GRADLE_VERSION="8.11.1" ;;
              8) GRADLE_VERSION="8.10.2" ;;
              7) GRADLE_VERSION="8.9" ;;
              6) GRADLE_VERSION="8.7" ;;
              5) GRADLE_VERSION="8.7" ;;
              4) GRADLE_VERSION="8.6" ;;
              3) GRADLE_VERSION="8.4" ;;
              2) GRADLE_VERSION="8.2" ;;
              1) GRADLE_VERSION="8.0" ;;
              0) GRADLE_VERSION="8.0" ;;
              *)
                echo "::error::Versão AGP 8.$MINOR sem mapeamento seguro."
                exit 1
                ;;
            esac
          elif [[ "$MAJOR" -eq 7 ]]; then
            case "$MINOR" in
              4) GRADLE_VERSION="7.5.1" ;;
              3) GRADLE_VERSION="7.4.2" ;;
              2) GRADLE_VERSION="7.3.3" ;;
              1) GRADLE_VERSION="7.2.2" ;;
              0) GRADLE_VERSION="7.0.2" ;;
              *)
                echo "::error::Versão AGP 7.$MINOR sem mapeamento seguro."
                exit 1
                ;;
            esac
          else
            echo "::error::Versão AGP $VERSION não mapeada."
            exit 1
          fi

          echo "AGP detectado: $VERSION"
          echo "Gradle selecionado: $GRADLE_VERSION"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          sudo mkdir -p /opt/gradle
          sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle

          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          "$GRADLE_CMD" --no-daemon assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14

name: MENTEX V4.6 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar ZIP MENTEX V4.6
        shell: bash
        run: |
          echo "Procurando projeto MENTEX V4.6..."

          if [ ! -f "MENTEX-V4.6-GITHUB-PRONTO.zip" ]; then
            echo "ERRO: MENTEX-V4.6-GITHUB-PRONTO.zip não encontrado."
            exit 1
          fi

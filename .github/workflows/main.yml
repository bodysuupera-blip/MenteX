name: Construir APK MENTEX V4.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENTEX V4.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project
        shell: bash
        run: |
          echo "======================================"
          echo " MENTEX V4.2"
          echo "======================================"

          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -200

          echo ""
          echo "Searching Android project..."

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "Android project found successfully."

      - name: Configure Java 17
        shell: bash
        run: |
          APP_GRADLE=""

          if [ -f "app/build.gradle" ]; then
            APP_GRADLE="app/build.gradle"
          elif [ -f "app/build.gradle.kts" ]; then
            APP_GRADLE="app/build.gradle.kts"
          fi

          if [ -n "$APP_GRADLE" ]; then
            echo "Android build file: $APP_GRADLE"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " BUILDING MENTEX V4.2"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found."
            echo "Using installed Gradle 8.7."
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo " GENERATED APK"
          echo "======================================"

          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.2-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

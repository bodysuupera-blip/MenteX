
name: Labirinto de Fantasmas - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas Android
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar SDK Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair fonte
        run: |
          set -e
          ZIP=$(find . -type f -iname "Labirinto_de_Fantasmas_Fonte_Nova.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP da fonte nao encontrado"
            exit 1
          fi

          mkdir -p appsource
          unzip -o "$ZIP" -d appsource

      - name: Localizar projeto
        run: |
          set -e
          PROJECT=$(find appsource -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json nao encontrado"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Instalar dependencias
        run: |
          cd "$PROJECT"
          npm install

      - name: Sincronizar Android
        run: |
          cd "$PROJECT"
          npx cap sync android

      - name: Gerar APK
        run: |
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Labirinto-de-Fantasmas-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

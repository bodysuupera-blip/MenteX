name: MENTEX V4.8 - Gerar APK com Interface Ajustada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.8 Ajustado
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair ZIP atualizado
        id: projeto
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 -type f \
            -name 'MENTEX-V4.8-INTERFACE-MODERNA-AJUSTADA.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: envie MENTEX-V4.8-INTERFACE-MODERNA-AJUSTADA.zip para a raiz do repositório."
            exit 1
          fi

          DEST="$RUNNER_TEMP/mentex-ajustado"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          INDEX="$(find "$DEST" -type f \
            -path '*/app/src/main/assets/www/index.html' \
            -print -quit)"

          if [ -z "$INDEX" ]; then
            echo "ERRO: index.html do jogo não encontrado no ZIP."
            exit 1
          fi

          WWW="$(dirname "$INDEX")"
          APP="${WWW%/src/main/assets/www}"
          ROOT="${APP%/app}"

          if [ ! -f "$ROOT/settings.gradle" ] || \
             [ ! -f "$APP/build.gradle" ]; then
            echo "ERRO: estrutura Android incompleta no ZIP."
            exit 1
          fi

          echo "Projeto selecionado: $ROOT"
          echo "Tela do jogo: $INDEX"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          mv "$RUNNER_TEMP/android-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK da interface ajustada
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.projeto.outputs.root }}"

          gradle --no-daemon assembleDebug --stacktrace

          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.8-AJUSTADO.apk"

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-APK-AJUSTADO
          path: apk-final/MENTEX-V4.8-AJUSTADO.apk
          if-no-files-found: error

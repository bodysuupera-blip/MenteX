name: MENTEX - Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          FILE=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::Projeto Android/Gradle não encontrado."
            echo "Envie o código-fonte completo do MENTEX."
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em $DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar aplicativo
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Criar ZIP do APK
        shell: bash
        run: |
          mkdir -p release

          find . -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -exec cp {} release/ \;

          if [ -z "$(ls -A release)" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          cd release
          zip -j ../MENTEX-V4.18-ATUALIZADO.zip *.apk

      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.18-ATUALIZADO
          path: MENTEX-V4.18-ATUALIZADO.zip
          if-no-files-found: error

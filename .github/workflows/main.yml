name: Build MENTEX V4.6 Compacto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6 Compacto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          echo "Procurando projeto Android..."

          # Primeiro procura um Gradle Wrapper já existente
          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            | head -n 1)

          # Se não encontrou, procura ZIP do MENTEX
          if [ -z "$GRADLEW" ]; then
            ZIP=$(find . \
              -type f \
              -iname "*MENTEX*V4.6*.zip" \
              -not -path "./.git/*" \
              | head -n 1)

            if [ -n "$ZIP" ]; then
              echo "ZIP encontrado: $ZIP"

              rm -rf mentex-extra
              mkdir -p mentex-extra

              unzip -o "$ZIP" -d mentex-extra

              GRADLEW=$(find mentex-extra \
                -type f \
                -name "gradlew" \
                | head -n 1)
            fi
          fi

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERRO: nenhum projeto Android foi encontrado."
            echo ""
            echo "Arquivos Gradle encontrados:"
            find . -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradlew" \) \
              -not -path "./.git/*" \
              -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "======================================"
          echo "PROJETO ANDROID ENCONTRADO"
          echo "======================================"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Conteúdo do projeto:"
          ls -la

          if [ ! -f "gradlew" ]; then
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

          chmod +x gradlew

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Iniciando compilação..."

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Localizar APK gerado
        shell: bash
        run: |
          set -e

          echo "Procurando APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: nenhum APK foi gerado."
            echo ""
            echo "Arquivos de build encontrados:"
            find "$PROJECT_DIR" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"
          echo ""

          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

          ls -lh "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-COMPACTO
          path: MENTEX-V4.6-COMPACTO.apk
          if-no-files-found: error

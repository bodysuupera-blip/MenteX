name: MENTEX V5.1 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V5.1
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto MENTEX
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname 'MENTEX-V5.1-ORIGINAL-MODERNO-200-FASES.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Envie o ZIP MENTEX V5.1 para a raiz do repositório."
            exit 1
          fi

          mkdir -p projeto_extraido
          unzip -o "$ZIP_FILE" -d projeto_extraido

          SETTINGS=$(find projeto_extraido -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projeto encontrado em: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.1-APK
          path: projeto_extraido/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7


name: CAO FUJAO - GERAR APK ATUALIZADO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Preparar Gradle
        shell: bash
        run: |
          set -Eeuo pipefail
          GRADLE_VERSION=8.9

          curl -L \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$(find . -type f -name 'Cao_Fujao_Android_500_Fases.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: Cao_Fujao_Android_500_Fases.zip não encontrado."
            exit 1
          fi

          mkdir -p /tmp/cao-fujao
          unzip -q "$ZIP" -d /tmp/cao-fujao

          PROJECT_DIR="$(dirname "$(find /tmp/cao-fujao -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRO: projeto Android não encontrado ou incompleto."
            find /tmp/cao-fujao -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            clean :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p entrega
          cp "$APK" entrega/CAO-FUJAO-ATUALIZADO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK-ATUALIZADO
          path: entrega/CAO-FUJAO-ATUALIZADO.apk
          if-no-files-found: error
          

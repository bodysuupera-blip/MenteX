name: Build MENTEX V4.6 Compacto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENTEX V4.6 Compacto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find MENTEX ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname \
            'MENTEX-V4.6-CEREBRO-PERGUNTA-ACERTO-ERRO-COMPACTO*.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: MENTEX V4.6 ZIP not found."
            find . -maxdepth 2 -type f -name "*.zip"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract MENTEX project
        shell: bash
        run: |
          set -e

          rm -rf mentex
          mkdir -p mentex

          unzip -o "$ZIP" -d mentex

          GRADLEW=$(find mentex -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            find mentex -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Projeto Android:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Arquivos encontrados:"
            find "$PROJECT_DIR" -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

          ls -lh "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-COMPACTO
          path: MENTEX-V4.6-COMPACTO.apk
          if-no-files-found: error

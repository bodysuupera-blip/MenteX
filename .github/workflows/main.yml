
name: NEXUS 350 - APK COM NOVO ICONE REDONDO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: |
          npm install

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Preparar icone Nexus 350
        run: |
          mkdir -p assets
          if [ -f www/icon.png ]; then
            cp www/icon.png assets/icon.png
          elif [ -f icon.png ]; then
            cp icon.png assets/icon.png
          fi

      - name: Sincronizar Android
        run: |
          npx cap sync android

      - name: Configurar Android
        run: |
          cd android
          chmod +x gradlew

      - name: Gerar APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Localizar APK
        run: |
          find android -name "*.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

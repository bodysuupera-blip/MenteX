name: Construir APK MENTEX

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK MENTEX
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android
        shell: bash
        run: |
          echo "Procurando projeto Android..."

          ZIP="MENTEX_Android_3_9_2_5_CORACOES_SEM_CRASH.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo $ZIP não encontrado."
            echo "Arquivos disponíveis:"
            ls -la
            exit 1
          fi

          mkdir -p android_project

          unzip -q "$ZIP" -d android_project

          echo "Arquivos extraídos:"
          find android_project -maxdepth 4 -type f | head -200

      - name: Encontrar projeto Gradle
        id: projeto
        shell: bash
        run: |
          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado depois de extrair o ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto Android encontrado em:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Construir APK
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          echo "Iniciando compilação..."

          gradle assembleDebug --no-daemon

      - name: Procurar APK
        shell: bash
        run: |
          echo "APKs encontrados:"
          find android_project -type f -name "*.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: |
            android_project/**/build/outputs/apk/debug/*.apk

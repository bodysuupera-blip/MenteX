
name: MENTEX V4.9 - Gerar APK Atualizado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Preparar Gradle
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERRO: arquivo gradlew não encontrado."
            echo "O projeto Android precisa estar na raiz."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Verificar estrutura
        run: |
          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERRO: configuração Gradle não encontrada."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

      - name: Compilar APK
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.9-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          

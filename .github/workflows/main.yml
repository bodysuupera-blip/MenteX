
name: NEXUS 350 - GERAR APK ATUALIZADO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extrair fonte Nexus 350
        run: |
          set -e
          ZIP="NEXUS350_ATUALIZACAO_ICONE_REDONDO_FONTE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP da fonte atualizado nao encontrado"
            ls -la
            exit 1
          fi

          mkdir -p nexus_fonte
          unzip -o "$ZIP" -d nexus_fonte

          PROJECT=$(find nexus_fonte -type f -name package.json | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: package.json nao encontrado"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $DIR"

      - name: Instalar dependencias
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Preparar Capacitor Android
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sincronizar projeto Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Configurar Gradle
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-APK-ATUALIZADO
          path: nexus_fonte/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

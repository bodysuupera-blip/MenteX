
name: LABIRINTO MORTAL - Gerar APK 3.0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Procurando projeto Android..."

          if [ -f "gradlew" ] && [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "LabirintoMortal/gradlew" ] && [ -f "LabirintoMortal/settings.gradle" ]; then
            PROJECT_DIR="LabirintoMortal"
          else
            PROJECT_DIR="$(find . -type f -name settings.gradle \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "${PROJECT_DIR:-}" ] || [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "ERRO: gradlew ausente no projeto."
            exit 1
          fi

          chmod +x gradlew

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug --stacktrace

      - name: Localizar e organizar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p saida
          cp "$APK" saida/LABIRINTO-MORTAL-3.0.1.apk

          echo "APK gerado:"
          ls -lh saida/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-3.0.1-APK
          path: saida/LABIRINTO-MORTAL-3.0.1.apk
          if-no-files-found: error
          


name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CAO_FUJAO/**'
      - '.github/workflows/gerar-cao-fujao.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: CAO_FUJAO
        run: gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK
          path: CAO_FUJAO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

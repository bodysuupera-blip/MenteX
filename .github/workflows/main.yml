name: Build MENTEX V4.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENTEX V4.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " SEARCHING FOR MENTEX ANDROID PROJECT"
          echo "======================================"

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project found in repository root."
            mkdir -p /tmp/mentex_project
            cp -a . /tmp/mentex_project/
            echo "/tmp/mentex_project" > /tmp/mentex_project_dir
            exit 0
          fi

          mkdir -p /tmp/mentex_extract

          FOUND=""

          echo "Searching inside ZIP files..."

          while IFS= read -r ZIP; do
            echo ""
            echo "Checking:"
            echo "$ZIP"

            if unzip -l "$ZIP" 2>/dev/null | grep -Eq '(^|/)(settings\.gradle|settings\.gradle\.kts)$'; then
              echo "Android project found!"
              FOUND="$ZIP"
              break
            fi
          done < <(find . -type f -iname "*.zip" | sort)

          if [ -z "$FOUND" ]; then
            echo ""
            echo "ERROR: No ZIP containing an Android Gradle project was found."
            exit 1
          fi

          echo ""
          echo "Selected ZIP:"
          echo "$FOUND"

          rm -rf /tmp/mentex_extract/*
          unzip -q "$FOUND" -d /tmp/mentex_extract

          SETTINGS=$(find /tmp/mentex_extract -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found after extraction."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > /tmp/mentex_project_dir

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -150

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat /tmp/mentex_project_dir)

          echo "Checking project:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using Gradle 8.7."
          fi

          echo "Android project verified successfully."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat /tmp/mentex_project_dir)

          echo "======================================"
          echo " BUILDING MENTEX V4.3"
          echo "======================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat /tmp/mentex_project_dir)

          mkdir -p "$GITHUB_WORKSPACE/apk"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/apk/MENTEX-V4.3.apk"

          echo ""
          echo "APK ready:"
          ls -lh "$GITHUB_WORKSPACE/apk/MENTEX-V4.3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.3-APK
          path: apk/MENTEX-V4.3.apk
          if-no-files-found: error

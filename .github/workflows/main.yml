
name: CAO FUJAO 2.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Cao Fujao
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto Cao Fujão
        uses: actions/checkout@v4

      - name: Conferir arquivos do projeto
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/caofujao/game/MainActivity.java
          echo "Projeto Cao Fujão encontrado!"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Aceitar licencas Android
        run: yes | sdkmanager --licenses || true

      - name: Verificar Gradle
        run: gradle --version

      - name: Compilar APK do Cao Fujão
        run: |
          gradle --no-daemon clean :app:assembleDebug

      - name: Verificar APK gerado
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar aplicativo APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          

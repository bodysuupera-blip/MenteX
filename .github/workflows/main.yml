name: MENTEX - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Procurando projeto Android..."

          PROJECT=""

          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"

            if [[ -f "$dir/settings.gradle" ||
                  -f "$dir/settings.gradle.kts" ]]; then
              if [[ -f "$dir/app/build.gradle" ||
                    -f "$dir/app/build.gradle.kts" ]]; then
                PROJECT="$dir"
                break
              fi
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -print0
          )

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Projeto Android não encontrado."
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Verificar Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "$PROJECT_DIR/gradlew" ||
                ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ||
                ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]]; then
            echo "::error::Gradle Wrapper original ausente. Restaure os arquivos do projeto-fonte."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Compilar APK Debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

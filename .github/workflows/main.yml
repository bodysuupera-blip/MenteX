
name: Gerar APK MENTEX V5.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Localizar projeto Android
        run: |
          set -e
          PROJECT=""

          while IFS= read -r FILE; do
            DIR=$(dirname "$FILE")
            if [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; then
              if [ -f "$DIR/app/build.gradle" ] || [ -f "$DIR/app/build.gradle.kts" ]; then
                PROJECT="$DIR"
                break
              fi
            fi
          done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \))

          if [ -z "$PROJECT" ]; then
            echo "ERRO: Projeto Android completo não localizado."
            echo "Arquivos encontrados:"
            find . -maxdepth 5 -type f -name '*.gradle'
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV
          echo "Projeto encontrado: $PROJECT"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-V5.4
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          

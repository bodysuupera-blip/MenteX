name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar arquivos do MENTEX
        shell: bash
        run: |
          set -e

          echo "=== VERIFICANDO PROJETO ==="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Projeto Android encontrado."

      - name: Verificar jogo
        shell: bash
        run: |
          set -e

          INDEX="app/src/main/assets/index.html"

          echo "=== VERIFICANDO JOGO ==="

          grep -q "Desafio Insano #250" "$INDEX"
          echo "250 fases: OK"

          grep -q "lives:10" "$INDEX"
          echo "10 corações: OK"

          grep -q "LOJA" "$INDEX"
          echo "Loja: OK"

          grep -q "PERFIL" "$INDEX"
          echo "Perfil: OK"

          grep -q "RANKING" "$INDEX"
          echo "Ranking: OK"

          grep -q "OPÇÕES" "$INDEX"
          echo "Opções: OK"

          grep -q "JOGAR" "$INDEX"
          echo "Botão JOGAR: OK"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            find app/build/outputs -type f
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-FINAL-${{ github.run_number }}
          path: ${{ env.APK }}
          if-no-files-found: error

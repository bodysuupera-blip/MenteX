name: MENTEX - Rolagem Jogador e Perfil

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Atualizar rolagem e reconstruir APK
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Localizar APK original
        id: original
        run: |
          set -euo pipefail

          APK=$(find . -maxdepth 4 -type f -iname '*.apk' \
            ! -name '*rolagem.apk' \
            ! -name '*atualizado.apk' \
            ! -name '*reconstruido.apk' \
            ! -name '*alinhado.apk' \
            ! -name '*unsigned.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: envie o APK original para a raiz do repositório."
            exit 1
          fi

          echo "APK encontrado: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Baixar Apktool
        run: |
          curl -fL --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            -o apktool.jar

      - name: Decodificar APK
        run: |
          java -jar apktool.jar d \
            "${{ steps.original.outputs.path }}" \
            -o mentex-decoded -f

      - name: Corrigir rolagem do Jogador e Perfil
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("mentex-decoded/assets/www/index.html")

          if not path.exists():
              raise SystemExit(
                  "ERRO: assets/www/index.html não foi encontrado."
              )

          html = path.read_text(encoding="utf-8")

          css = """
          <style id="mentex-scroll-update">
          html, body {
            min-height: 100% !important;
            height: auto !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
          }

          body {
            position: relative !important;
            touch-action: pan-y !important;
          }

          .app {
            min-height: 100vh !important;
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
            padding-bottom: 120px !important;
          }

          #profile:not(.hidden),
          #game:not(.hidden) {
            position: relative !important;
            inset: auto !important;
            width: 100% !important;
            height: auto !important;
            min-height: 100vh !important;
            max-height: none !important;
            overflow: visible !important;
            padding-bottom: 120px !important;
            touch-action: pan-y !important;
          }

          #game:not(.hidden) {
            display: flex !important;
            flex-direction: column !important;
          }

          #game:not(.hidden) * {
            flex-shrink: 0;
          }
          </style>
          """

          if "mentex-scroll-update" not in html:
              if "</head>" in html:
                  html = html.replace(
                      "</head>", css + "\n</head>", 1
                  )
              else:
                  html = css + "\n" + html

          path.write_text(html, encoding="utf-8")
          print("Regras de rolagem adicionadas.")
          PY

      - name: Reconstruir APK
        run: |
          java -jar apktool.jar b mentex-decoded \
            -o MENTEX-reconstruido.apk

          test -s MENTEX-reconstruido.apk

      - name: Alinhar APK
        run: |
          zipalign -f -v 4 \
            MENTEX-reconstruido.apk \
            MENTEX-alinhado.apk

      - name: Criar chave de assinatura
        run: |
          keytool -genkeypair \
            -keystore mentex-temp.jks \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX, O=MENTEX, C=BR"

      - name: Assinar e verificar APK
        run: |
          apksigner sign \
            --ks mentex-temp.jks \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out MENTEX-Jogador-Perfil-rolagem.apk \
            MENTEX-alinhado.apk

          apksigner verify --verbose \
            MENTEX-Jogador-Perfil-rolagem.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-Jogador-Perfil-rolagem
          path: MENTEX-Jogador-Perfil-rolagem.apk
          if-no-files-found: error

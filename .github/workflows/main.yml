name: Compilar MENTEX V4.6 Compacto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Compilar MENTEX V4.6 Compacto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto MENTEX V4.6
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-V4.6-CEREBRO-PERGUNTA-ACERTO-ERRO-COMPACTO.zip"

          echo "=========================================="
          echo "MENTEX V4.6 - TELA COMPACTA"
          echo "=========================================="

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado na raiz do repositório."
            echo ""
            echo "Arquivos ZIP encontrados:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          rm -rf mentex

          unzip -o "$ZIP" -d mentex

          SETTINGS=$(find mentex \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "$PROJECT_DIR" > project_dir.txt

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$(cat project_dir.txt)"

          chmod +x ./gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          mkdir -p ../resultado

          cp "$APK" \
            ../resultado/MENTEX-V4.6-COMPACTO.apk

          echo "APK gerado:"
          echo "../resultado/MENTEX-V4.6-COMPACTO.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-COMPACTO
          path: resultado/MENTEX-V4.6-COMPACTO.apk
          if-no-files-found: error

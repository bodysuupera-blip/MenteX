
name: MENTEX V5.0 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V5.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Instalar Cordova
        run: |
          npm install -g cordova@12.0.0

      - name: Localizar arquivos do MENTEX
        run: |
          set -e
          echo "Arquivos ZIP encontrados:"
          find . -maxdepth 3 -type f -name "*.zip"

          if [ ! -f "MENTEX-V5.0-ATUALIZACAO-DUAS-MELHORIAS.zip" ]; then
            echo "ERRO: ZIP do projeto não encontrado na raiz do repositório."
            exit 1
          fi

      - name: Extrair projeto
        run: |
          set -e
          mkdir -p origem
          unzip -q "MENTEX-V5.0-ATUALIZACAO-DUAS-MELHORIAS.zip" -d origem

          if [ ! -f "origem/mentex-package/www/index.html" ]; then
            echo "ERRO: não encontrei mentex-package/www/index.html"
            find origem -maxdepth 5 -type f | head -100
            exit 1
          fi

      - name: Criar projeto Android
        run: |
          set -e
          cordova create mentex-build br.com.mentex.app MENTEX

          rm -rf mentex-build/www
          mkdir -p mentex-build/www

          cp -a origem/mentex-package/www/. mentex-build/www/

          cd mentex-build
          cordova platform add android@14.0.1

      - name: Compilar APK
        run: |
          set -e
          cd mentex-build
          cordova build android --debug --verbose

      - name: Verificar APK
        run: |
          set -e
          APK="mentex-build/platforms/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find mentex-build/platforms/android -type f -name "*.apk"
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/MENTEX-V5.0.apk
          ls -lh resultado/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.0-APK
          path: resultado/MENTEX-V5.0.apk
          if-no-files-found: error
          

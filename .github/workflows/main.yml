
name: MENTEX V4.6.3 - Preparar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Compilar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          FOUND="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -n "$FOUND" ]; then
            PROJECT_DIR="$(dirname "$FOUND")"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f -name '*.zip' \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p "$RUNNER_TEMP/mentex-extraido"
              unzip -q "$ZIP_FILE" \
                -d "$RUNNER_TEMP/mentex-extraido"

              FOUND="$(find "$RUNNER_TEMP/mentex-extraido" \
                -type f \
                \( -name settings.gradle \
                -o -name settings.gradle.kts \) \
                -print -quit)"

              if [ -n "$FOUND" ]; then
                PROJECT_DIR="$(dirname "$FOUND")"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Android nao encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          echo "APK encontrado: $APK"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/MENTEX-V4.6.3-APK.apk"

          test -s "$GITHUB_WORKSPACE/dist/MENTEX-V4.6.3-APK.apk"
          echo "APK copiado para dist com sucesso."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.3-APK
          path: dist/MENTEX-V4.6.3-APK.apk
          if-no-files-found: error
          retention-days: 14
          

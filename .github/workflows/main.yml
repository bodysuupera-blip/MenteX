
name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cao_Fujao_Android.zip'
      - '.github/workflows/gerar-cao-fujao.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto separado
        run: |
          set -e
          test -f Cao_Fujao_Android.zip
          mkdir -p CAO_FUJAO
          unzip -o Cao_Fujao_Android.zip -d CAO_FUJAO
          test -f CAO_FUJAO/settings.gradle
          test -f CAO_FUJAO/app/build.gradle

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: CAO_FUJAO
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK
          path: CAO_FUJAO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

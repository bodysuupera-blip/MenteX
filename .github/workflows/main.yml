
name: Nexus 350 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extrair projeto Nexus 350
        shell: bash
        run: |
          set -e

          ZIP=$(find . -name "Labirinto_Fantasmas_Nexus350.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: Labirinto_Fantasmas_Nexus350.zip não foi enviado ao repositório."
            exit 1
          fi

          mkdir -p nexus_build
          unzip -oq "$ZIP" -d nexus_build

          PROJECT=$(find nexus_build -name package.json -not -path "*/node_modules/*" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: package.json não encontrado dentro do ZIP."
            find nexus_build -maxdepth 5 -type f
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado em: $DIR"
          ls -la "$DIR"

      - name: Instalar dependências
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Criar Android
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sincronizar Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

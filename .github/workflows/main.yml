name: Gerar APK MENTEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto MENTEX
        shell: bash
        run: |
          set -e

          ZIP="MENTEX_300_FASES_BUILD_ESTAVEL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado:"
            echo "$ZIP"
            echo ""
            echo "Arquivos disponíveis:"
            ls -la
            exit 1
          fi

          rm -rf projeto_mentex

          mkdir projeto_mentex

          unzip -q "$ZIP" -d projeto_mentex

          echo "Arquivos encontrados:"
          find projeto_mentex -maxdepth 3 -type f | head -100

          if [ ! -f "projeto_mentex/settings.gradle" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=projeto_mentex" >> "$GITHUB_ENV"

      - name: Verificar Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle --version

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "COMPILANDO MENTEX"
          echo "================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          echo "Procurando APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p apk_final

          cp "$APK" apk_final/MENTEX-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-${{ github.run_id }}
          path: apk_final/MENTEX-debug.apk
          if-no-files-found: error

name: MENTEX V4.9 - Cerebro Animado e Icone Redondo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.9
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto V4.9
        id: projeto
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/MENTEX-V4.9-CEREBRO-EXPRESSOES-ICONE-REDONDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: envie o ZIP V4.9 para a raiz do repositorio."
            exit 1
          fi

          DEST="$RUNNER_TEMP/mentex-v49"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          SETTINGS="$(find "$DEST" -type f \
            -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find "$DEST" -type f \
              -name settings.gradle.kts -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle nao encontrado no ZIP."
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"

          if [ ! -f "$ROOT/app/build.gradle" ] && \
             [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "ERRO: configuracao do modulo app nao encontrada."
            exit 1
          fi

          if [ ! -d "$ROOT/app/src/main/assets/www" ]; then
            echo "ERRO: pasta de assets do jogo nao encontrada."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado: $ROOT"

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          mv "$RUNNER_TEMP/android-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.projeto.outputs.root }}"

          gradle --no-daemon assembleDebug --stacktrace

          APK="$(find app/build/outputs/apk \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: a compilacao terminou sem gerar APK."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.9.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.9-APK
          path: apk-final/MENTEX-V4.9.apk
          if-no-files-found: error

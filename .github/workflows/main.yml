name: Construir APK

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK MENTEX
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MENTEX_Android_Projeto

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        run: |
          echo "Projeto:"
          pwd
          ls -la

      - name: Construir APK
        run: gradle assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: MENTEX_Android_Projeto/app/build/outputs/apk/debug/*.apk

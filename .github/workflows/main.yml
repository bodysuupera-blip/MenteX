name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v6

      - name: Verificar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          ZIP="./MENTEX_Android_4_0_10_CORACOES_250_FASES.zip"

          echo "======================================"
          echo "       VERIFICANDO MENTEX 4.0"
          echo "       10 CORAÇÕES"
          echo "       250 FASES"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado:"
            echo "$ZIP"
            echo ""
            echo "Arquivos ZIP disponíveis:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      - name: Extrair MENTEX
        shell: bash
        run: |
          set -e

          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          unzip -o \
            "./MENTEX_Android_4_0_10_CORACOES_250_FASES.zip" \
            -d /tmp/mentex

          echo "MENTEX extraído."

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find /tmp/mentex -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo ""
            echo "Arquivos encontrados:"
            find /tmp/mentex -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "======================================"
          echo "PROJETO ANDROID ENCONTRADO:"
          echo "$PROJECT_DIR"
          echo "======================================"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution

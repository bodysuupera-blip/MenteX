
name: FUGA DOS FANTASMAS - APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar ZIP correto
        shell: bash
        run: |
          set -e
          ZIP="./Fuga_dos_Fantasmas_Atualizacao.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP Fuga dos Fantasmas não encontrado."
            exit 1
          fi

          mkdir -p /tmp/fuga
          unzip -oq "$ZIP" -d /tmp/fuga

          HTML=$(find /tmp/fuga -type f -name index.html | head -n 1)

          if [ -z "$HTML" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          if ! grep -qi "Fuga dos Fantasmas" "$HTML"; then
            echo "ERRO: O ZIP não é do Fuga dos Fantasmas."
            exit 1
          fi

          WEB_DIR=$(dirname "$HTML")
          mkdir -p www
          cp -r "$WEB_DIR"/. www/

          test -f www/index.html
          test -f www/game.js
          test -f www/style.css

          echo "JOGO_VALIDADO=FUGA_DOS_FANTASMAS"
          echo "JOGO_VALIDADO=FUGA_DOS_FANTASMAS" >> $GITHUB_ENV

      - name: Criar estrutura Android
        run: |
          set -e

          npm init -y
          npm install @capacitor/core@6.1.2
          npm install --save-dev @capacitor/cli@6.1.2
          npm install @capacitor/android@6.1.2

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.fugadosfantasmas.game",
            "appName": "Fuga dos Fantasmas",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Garantir nome do aplicativo
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Fuga dos Fantasmas<\/string>/' android/app/src/main/res/values/strings.xml

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FUGA-DOS-FANTASMAS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

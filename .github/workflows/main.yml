name: Construir APK MENTEX

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK MENTEX
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar projeto Android
        id: encontrar
        shell: bash
        run: |
          echo "Procurando projeto Android..."

          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar projeto
        run: |
          echo "Diretório do projeto:"
          echo "${{ steps.encontrar.outputs.project_dir }}"
          echo ""
          ls -la "${{ steps.encontrar.outputs.project_dir }}"

      - name: Construir APK
        run: |
          cd "${{ steps.encontrar.outputs.project_dir }}"
          gradle assembleDebug --no-daemon

      - name: Procurar APK
        run: |
          echo "APKs encontrados:"
          find . -type f -name "*.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: |
            **/build/outputs/apk/debug/*.apk

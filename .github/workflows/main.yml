name: Gerar APK MENTEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Preparar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "        PROCURANDO ZIP DO MENTEX"
          echo "======================================"

          ZIP_FILE=""

          if [ -f "./MENTEX_Android_3_9_2_5_CORACOES_SEM_CRASH.zip" ]; then
            ZIP_FILE="./MENTEX_Android_3_9_2_5_CORACOES_SEM_CRASH.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -not -path "./.git/*" | head -1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP do MENTEX não encontrado."
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

          rm -rf mentex
          mkdir -p mentex

          echo "Extraindo projeto..."

          unzip -o "$ZIP_FILE" -d mentex


          echo "======================================"
          echo "       PROCURANDO PROJETO ANDROID"
          echo "======================================"

          PROJECT_DIR=$(find mentex \
            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -not -path "*/.git/*" \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            echo ""
            echo "Arquivos encontrados:"
            find mentex -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: Aplicar atualização MENTEX
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "        PROCURANDO ATUALIZAÇÃO"
          echo "======================================"

          UPDATE_ZIP=""

          if [ -f "./MENTEX_CORRECAO_SIMPLES_SEM_DUPLICAR_TELA_E_MUSICA.zip" ]; then
            UPDATE_ZIP="./MENTEX_CORRECAO_SIMPLES_SEM_DUPLICAR_TELA_E_MUSICA.zip"

          elif [ -f "./MENTEX_CORRIGIDO_ABERTURA_COMECAR_LOJA_10_CORACOES.zip" ]; then
            UPDATE_ZIP="./MENTEX_CORRIGIDO_ABERTURA_COMECAR_LOJA_10_CORACOES.zip"

          else
            echo "ERRO: ZIP de atualização não encontrado."
            echo ""
            echo "Coloque o ZIP de atualização na raiz do repositório."
            exit 1
          fi

          echo "ZIP de atualização:"
          echo "$UPDATE_ZIP"

          rm -rf atualizacao
          mkdir -p atualizacao

         

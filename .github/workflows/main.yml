
name: Atualizar icone MENTEX

on:
  workflow_dispatch:
  push:
    paths:
      - "MENTEX-V4.17-APK.zip"
      - "mentex_icon.png"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jre-headless \
            zip unzip curl jq python3-pil

          URL=$(curl -fsSL \
            https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
            | jq -r '.assets[]
              | select(.name | test("^apktool_[0-9.]+\\.jar$"))
              | .browser_download_url' | head -n 1)

          test -n "$URL"
          test "$URL" != "null"
          curl -fL "$URL" -o "$RUNNER_TEMP/apktool.jar"

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/sdk-tools.zip"
          mkdir -p "$RUNNER_TEMP/sdk-unpack"
          unzip -q "$RUNNER_TEMP/sdk-tools.zip" -d "$RUNNER_TEMP/sdk-unpack"
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/sdk-unpack/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" "build-tools;35.0.0"

      - name: Localizar APK original
        shell: bash
        run: |
          set -e

          test -f "MENTEX-V4.17-APK.zip" || {
            echo "::error::Falta MENTEX-V4.17-APK.zip na raiz."
            exit 1
          }

          test -f "mentex_icon.png" || {
            echo "::error::Falta mentex_icon.png na raiz."
            exit 1
          }

          mkdir -p entrada
          unzip -o MENTEX-V4.17-APK.zip -d entrada

          APK=$(find entrada -type f -iname "*.apk" | head -n 1)
          test -n "$APK" || {
            echo "::error::Nenhum APK encontrado no ZIP."
            exit 1
          }

          cp "$APK" original.apk

      - name: Preparar imagem sem margens
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from PIL import Image

          im = Image.open("mentex_icon.png").convert("RGBA")

          # Remove margens externas transparentes, se existirem.
          alpha = im.getchannel("A")
          bbox = alpha.getbbox()
          if bbox:
              im = im.crop(bbox)

          # Ajusta a arte para preencher um quadrado sem adicionar bordas.
          w, h = im.size
          side = min(w, h)
          left = (w - side) // 2
          top = (h - side) // 2
          im = im.crop((left, top, left + side, top + side))
          im = im.resize((1024, 1024), Image.Resampling.LANCZOS)
          im.save("mentex_icon_preparado.png")
          PY

      - name: Desmontar APK
        shell: bash
        run: |
          set -e
          java -jar "$RUNNER_TEMP/apktool.jar" \
            d -f original.apk -o projeto

      - name: Atualizar icones normais e adaptativos
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re

          res = Path("projeto/res")
          source = Image.open("mentex_icon_preparado.png").convert("RGBA")
          names = (
              "ic_launcher",
              "ic_launcher_round",
              "launcher_icon",
              "app_icon",
              "appicon"
          )
          changed = 0

          # Substitui arquivos de imagem existentes pelos novos.
          for folder in res.iterdir():
              if not folder.is_dir():
                  continue
              if not (folder.name.startswith("mipmap")
                      or folder.name.startswith("drawable")):
                  continue

              for file in folder.iterdir():
                  if not file.is_file():
                      continue
                  if file.suffix.lower() not in (".png", ".webp"):
                      continue
                  if not any(name in file.stem.lower() for name in names):
                      continue

                  try:
                      with Image.open(file) as old:
                          size = old.size
                      new = source.resize(size, Image.Resampling.LANCZOS)

                      if file.suffix.lower() == ".webp":
                          new.save(file, "WEBP")
                      else:
                          new.save(file, "PNG")

                      print("Icone atualizado:", file)
                      changed += 1
                  except Exception as e:
                      print("Aviso:", file, e)

          # A mesma arte ocupa o fundo e o primeiro plano do icone
          # adaptativo, evitando uma pequena logo centralizada sobre branco.
          nd = res / "drawable-nodpi"
          nd.mkdir(parents=True, exist_ok=True)
          source.save(nd / "mentex_launcher_background.png")
          source.save(nd / "mentex_launcher_foreground.png")

          for xml in res.rglob("*.xml"):
              try:
                  content = xml.read_text(encoding="utf-8")
              except Exception:
                  continue

              if "<adaptive-icon" not in content:
                  continue

              content = re.sub(
                  r'(<foreground\b[^>]*android:drawable=")[^"]+(")',
                  r'\g<1>@drawable/mentex_launcher_foreground\g<2>',
                  content
              )
              content = re.sub(
                  r'(<background\b[^>]*android:drawable=")[^"]+(")',
                  r'\g<1>@drawable/mentex_launcher_background\g<2>',
                  content
              )

              xml.write_text(content, encoding="utf-8")
              print("Icone adaptativo ajustado:", xml)

          print("Imagens substituidas:", changed)
          PY

      - name: Reconstruir APK
        shell: bash
        run: |
          set -e
          java -jar "$RUNNER_TEMP/apktool.jar" \
            b projeto -o mentex-unsigned.apk

      - name: Alinhar e assinar APK
        shell: bash
        run: |
          set -e

          zipalign -f -p 4 \
            mentex-unsigned.apk mentex-aligned.apk

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mentex.keystore" \
            -storepass android \
            -keypass android \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX, OU=App, O=MENTEX, L=Brasil, ST=SP, C=BR"

          apksigner sign \
            --ks "$RUNNER_TEMP/mentex.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out MENTEX-assinado.apk \
            mentex-aligned.apk

          apksigner verify MENTEX-assinado.apk

      - name: Criar ZIP final
        shell: bash
        run: |
          set -e
          mkdir -p entrega
          cp MENTEX-assinado.apk entrega/
          cp mentex_icon.png entrega/
          (cd entrega && zip -j ../MENTEX-APK-final.zip *)

      - name: Disponibilizar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-final
          path: |
            MENTEX-assinado.apk
            MENTEX-APK-final.zip
          if-no-files-found: error
          

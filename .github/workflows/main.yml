name: Construir APK MENTEX Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK MENTEX Final
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar arquivo do APK
        run: |
          echo "Verificando APK MENTEX..."

          if [ -f "MENTEX_Android_Projeto/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK encontrado!"
            ls -lh "MENTEX_Android_Projeto/app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "APK não encontrado."
            echo "Arquivos disponíveis:"
            find . -type f | head -100
            exit 1
          fi

      - name: Preparar APK
        run: |
          mkdir -p resultado
          cp "MENTEX_Android_Projeto/app/build/outputs/apk/debug/app-debug.apk" \
             "resultado/MENTEX-APK-FINAL-SEM-VOZ.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-FINAL-SEM-VOZ
          path: resultado/MENTEX-APK-FINAL-SEM-VOZ.apk
          if-no-files-found: error

      - name: Finalizado
        run: |
          echo "======================================"
          echo "       MENTEX APK FINALIZADO"
          echo "======================================"
          ls -lh resultado/

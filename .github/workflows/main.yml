
name: Gerar APK MENTEX V5.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar e preparar MENTEX
        run: |
          set -e
          mkdir -p /tmp/mentex

          if [ -f config.xml ]; then
            cp -a . /tmp/mentex/
          else
            ZIP=$(find . -type f -iname '*.zip' | head -n 1)
            if [ -n "$ZIP" ]; then
              unzip -q "$ZIP" -d /tmp/mentex
            else
              cp -a . /tmp/mentex/
            fi
          fi

          PROJECT=$(find /tmp/mentex -type f -name config.xml | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: config.xml não encontrado."
            find /tmp/mentex -maxdepth 3 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$PROJECT")

          if [ ! -f "$DIR/www/index.html" ]; then
            echo "ERRO: www/index.html não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Projeto localizado em: $DIR"

      - name: Instalar Cordova
        run: npm install -g cordova@12.0.0

      - name: Adicionar Android
        run: |
          cd "$PROJECT_DIR"
          cordova platform add android@13.0.0

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          cordova build android --debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-V5.2
          path: /tmp/mentex/**/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

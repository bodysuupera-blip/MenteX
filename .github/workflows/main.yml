
name: NEXUS 350 - RECUPERAR E GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair projeto Nexus
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 4 -name "NEXUS-PROJETO-RECUPERADO-APK-ICON.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP do Nexus não encontrado"
            exit 1
          fi

          mkdir -p recovered
          unzip -o "$ZIP" -d recovered

          PROJECT=$(find recovered -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json não encontrado"
            find recovered -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $PROJECT"

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar versões
        run: |
          node --version
          npm --version
          java -version

      - name: Instalar dependências
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Preparar Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Aplicar ícone Nexus
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DEST="android/app/src/main/res/mipmap-$density"
            SRC="assets/icons/mipmap-$density"

            mkdir -p "$DEST"

            if [ -f "$SRC/ic_launcher.png" ]; then
              cp "$SRC/ic_launcher.png" "$DEST/ic_launcher.png"
            fi

            if [ -f "$SRC/ic_launcher_round.png" ]; then
              cp "$SRC/ic_launcher_round.png" "$DEST/ic_launcher_round.png"
            fi
          done

          echo "Ícones aplicados."

      - name: Configurar permissões Gradle
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew

      - name: Compilar APK Debug
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK não foi gerado"
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-APK-NOVO-ICONE
          path: recovered/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

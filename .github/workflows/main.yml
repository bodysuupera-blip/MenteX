
name: CAO FUJAO - GERAR APK ATUALIZADO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Localizar e extrair projeto
        run: |
          set -e

          mkdir -p _projeto

          ZIP=$(find . -type f -iname "*.zip" \
            ! -path "./_projeto/*" | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "ZIP encontrado: $ZIP"
            unzip -o "$ZIP" -d _projeto
          fi

          PROJECT=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            ! -path "*/build/*" \
            -printf '%h\n' | while read DIR; do
              if [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then
                echo "$DIR"
                break
              fi
            done)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android completo nao encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Compilar aplicativo
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --version
          gradle clean
          gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK-ATUALIZADO
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          

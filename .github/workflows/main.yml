name: Build MENTEX V4.6 Compacto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6 Compacto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar projeto Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO PROJETO ANDROID"
          echo "======================================"

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo ""
            echo "Arquivos Gradle encontrados:"
            find . -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Ajustar tela cheia do MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERRO: AndroidManifest.xml não encontrado."
            exit 1
          fi

          echo "Aplicando configuração de tela cheia..."

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          # Permite que o conteúdo ocupe a área completa da tela.
          if "android:windowLayoutInDisplayCutoutMode=" not in text:
              text = text.replace(
                  "<application",
                  '<application android:windowLayoutInDisplayCutoutMode="shortEdges"',
                  1
              )

          # Remove barras de sistema da Activity principal quando possível.
          text = re.sub(
              r'\s+android:screenOrientation="[^"]*"',
              '',
              text
          )

          manifest.write_text(text, encoding="utf-8")

          print("Manifest ajustado.")
          PY

      - name: Criar arquivo de configuração de tela
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/mentex_fullscreen.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="MENTEX_Fullscreen">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>

          </resources>
          EOF

          echo "Configuração criada."

      - name: Verificar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle:"
          gradle --version

      - name: Compilar MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COMPILANDO MENTEX V4.6"
          echo "======================================"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO APK"
          echo "======================================"

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | grep -v "androidTest" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-COMPACTO
          path: MENTEX-V4.6-COMPACTO.apk
          if-no-files-found: error

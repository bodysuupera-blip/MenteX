
name: Gerar APK do Cao Fujao

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  construir:
    name: Compilar Cão Fujão
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto atualizado
        run: |
          unzip -o CaoFujao_setas_100_moedas_10_vidas.zip -d .
          ls -la CaoFujaoAndroid

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: gradle -p CaoFujaoAndroid assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cao-Fujao-Atualizado
          path: CaoFujaoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

name: MENTEX - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/mentex

          while IFS= read -r ZIP; do
            DEST="/tmp/mentex/$(basename "$ZIP" .zip)"
            mkdir -p "$DEST"

            echo "Analisando $ZIP"
            unzip -oq "$ZIP" -d "$DEST" || continue

          done < <(find . -maxdepth 2 -type f \
            -name '*.zip' -not -path './.git/*' | sort)

          FOUND=""

          while IFS= read -r SETTINGS; do
            ROOT=$(dirname "$SETTINGS")

            if [ -f "$ROOT/app/build.gradle" ] || \
               [ -f "$ROOT/app/build.gradle.kts" ]; then
              FOUND="$ROOT"
              break
            fi
          done < <(find /tmp/mentex . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/build/*' 2>/dev/null)

          if [ -z "$FOUND" ]; then
            echo "ERRO: projeto com módulo app não encontrado."
            find /tmp/mentex . -type f \
              \( -name settings.gradle -o -name build.gradle \
              -o -name build.gradle.kts \) 2>/dev/null | head -200
            exit 1
          fi

          echo "Projeto encontrado: $FOUND"
          echo "PROJECT_DIR=$FOUND" >> "$GITHUB_ENV"

      - name: Instalar Gradle para criar wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "Wrapper ausente. Preparando Gradle 8.7..."

            cd /tmp
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -oq gradle-8.7-bin.zip

            cd "$PROJECT_DIR"
            /tmp/gradle-8.7/bin/gradle wrapper \
              --gradle-version 8.7
          fi

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: /tmp/mentex/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

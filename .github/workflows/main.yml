
name: CAO FUJAO 2.1 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 2.1
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair exclusivamente Cão Fujão 2.1
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./CAO-FUJAO-2.1-ATUALIZACAO-PARA-GERAR-APK.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP Cão Fujão 2.1 não encontrado!"
            exit 1
          fi

          mkdir -p /tmp/cao-fujao-21

          unzip -oq "$ZIP" -d /tmp/cao-fujao-21

          PROJECT="/tmp/cao-fujao-21"

          echo "Conferindo projeto..."

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/build.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/app/src/main/assets/index.html"
          test -f "$PROJECT/app/src/main/assets/intro.png"

          grep -q 'com.caofujao.game' \
            "$PROJECT/app/build.gradle"

          echo "Projeto Cão Fujão 2.1 confirmado!"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Compilar aplicativo
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Verificar APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.1-APK
          path: /tmp/cao-fujao-21/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          


name: NEXUS 350 - V6 HORIZONTAL FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Localizar ZIP V5
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 4 -type f \
            -name 'Nexus350_Labirinto_Fantasmas_TELAS_ANIMADAS_V5.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP V5 nao encontrado."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "ZIP extraido com sucesso."

      - name: Localizar projeto
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -name package.json \
            -not -path '*/node_modules/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json nao encontrado."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          npm pkg set \
            "dependencies.@capacitor/core=^7.0.0" \
            "dependencies.@capacitor/android=^7.0.0" \
            "devDependencies.@capacitor/cli=^7.0.0"

          npm install

      - name: Preparar Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Corrigir orientacao sem corromper XML
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml nao encontrado."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              xml = f.read()

          # Preserva a declaracao original do XML.
          # Garante que o namespace Android exista no elemento manifest.
          if not re.search(r'xmlns:android\s*=', xml):
              xml = re.sub(
                  r'<manifest\b',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  xml,
                  count=1
              )

          # Altera apenas activities, sem modificar permissões.
          def fix_activity(match):
              tag = match.group(0)

              tag = re.sub(
                  r'\s+android:screenOrientation="[^"]*"',
                  '',
                  tag
              )

              tag = re.sub(
                  r'\s+android:resizeableActivity="[^"]*"',
                  '',
                  tag
              )

              tag = tag[:-1] + ' android:screenOrientation="landscape" android:resizeableActivity="false">'

              return tag

          xml = re.sub(
              r'<activity\b[^>]*>',
              fix_activity,
              xml
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(xml)

          print("Orientacao horizontal aplicada.")
          print("Namespace Android preservado.")
          PY

          # Verifica se o XML continua valido
          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ET.parse(sys.argv[1])
          print("AndroidManifest.xml valido.")
          PY

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT/android"

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT/android/app/build/outputs/apk" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK nao encontrado."
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/NEXUS350_HORIZONTAL_FIX.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-HORIZONTAL-FIX
          path: resultado/NEXUS350_HORIZONTAL_FIX.apk
          if-no-files-found: error
          retention-days: 30
          

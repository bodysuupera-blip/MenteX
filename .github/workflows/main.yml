
name: NEXUS - APK com novo ícone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar projeto Android
        run: |
          if [ ! -d android/app/src/main ]; then
            echo "ERRO: android/app/src/main não encontrado"
            exit 1
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERRO: gradlew não encontrado"
            exit 1
          fi

      - name: Aplicar novo ícone Nexus
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density

            cp assets/icons/mipmap-$density/ic_launcher.png \
            android/app/src/main/res/mipmap-$density/ic_launcher.png

            cp assets/icons/mipmap-$density/ic_launcher_round.png \
            android/app/src/main/res/mipmap-$density/ic_launcher_round.png
          done

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-APK-NOVO-ICONE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

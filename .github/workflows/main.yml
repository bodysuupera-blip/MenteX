
name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Preparar MENTEX 4.13
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto ou APK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/mentex /tmp/mentex-apk
          mkdir -p "$GITHUB_WORKSPACE/saida"

          echo "Procurando ZIPs do MENTEX..."

          # Priorizar o ZIP ajustado, se estiver no repositório.
          ZIP="$(find . -maxdepth 4 -type f \
            -iname 'MENTEX-V4.13-AJUSTADO-ROLAGEM.zip' \
            -not -path './.git/*' | head -1 || true)"

          if [[ -z "$ZIP" ]]; then
            ZIP="$(find . -maxdepth 4 -type f \
              -iname 'MENTEX-V4.13-APK.zip' \
              -not -path './.git/*' | head -1 || true)"
          fi

          if [[ -n "$ZIP" ]]; then
            echo "ZIP encontrado: $ZIP"
            unzip -oq "$ZIP" -d /tmp/mentex-apk
          fi

          # Procurar um APK diretamente no repositório ou no ZIP.
          APK="$(find /tmp/mentex-apk . \
            -type f -iname '*.apk' \
            -not -path './.git/*' \
            | head -1 || true)"

          # Procurar projeto-fonte Android com Wrapper.
          PROJETO=""

          while IFS= read -r -d '' arquivo; do
            pasta="$(dirname "$arquivo")"

            if [[ -f "$pasta/gradlew" &&
                  -f "$pasta/gradle/wrapper/gradle-wrapper.properties" &&
                  ( -f "$pasta/app/build.gradle" ||
                    -f "$pasta/app/build.gradle.kts" ) ]]; then
              PROJETO="$pasta"
              break
            fi
          done < <(
            find . /tmp/mentex -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' -print0
          )

          if [[ -n "$PROJETO" ]]; then
            echo "Projeto Android completo encontrado: $PROJETO"
            echo "MODO=compilar" >> "$GITHUB_ENV"
            echo "PROJETO=$PROJETO" >> "$GITHUB_ENV"
          elif [[ -n "$APK" && -f "$APK" ]]; then
            echo "Projeto-fonte não encontrado."
            echo "Será disponibilizado o APK existente: $APK"
            cp "$APK" "$GITHUB_WORKSPACE/saida/MENTEX-V4.13.apk"
            echo "MODO=apk_existente" >> "$GITHUB_ENV"
          else
            echo "::error::Não encontrei projeto Android nem APK."
            echo "Envie o ZIP do MENTEX para a raiz do repositório."
            exit 1
          fi

      - name: Compilar projeto Android
        if: env.MODO == 'compilar'
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJETO"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          APK="$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -1 || true)"

          if [[ -z "$APK" ]]; then
            echo "::error::A compilação não gerou APK."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/saida/MENTEX-V4.13.apk"

      - name: Informar modo de execução
        shell: bash
        run: |
          if [[ "$MODO" == "apk_existente" ]]; then
            echo "::notice::O artefato contém o APK existente. Nenhuma recompilação ou alteração no jogo foi realizada."
          else
            echo "APK compilado a partir do projeto Android."
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.13-APK
          path: saida/MENTEX-V4.13.apk
          if-no-files-found: error
          retention-days: 14
          


name: Gerar APK MENTEX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -e
          mkdir -p projeto
          encontrado=""

          for arquivo in ./*.zip; do
            [ -f "$arquivo" ] || continue
            unzip -oq "$arquivo" -d projeto

            encontrado=$(find projeto -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -n "$encontrado" ]; then
              break
            fi
          done

          if [ -z "$encontrado" ]; then
            echo "ERRO: projeto Android não encontrado."
            echo "O APK sozinho não substitui o projeto-fonte."
            exit 1
          fi

          echo "PROJETO=$(dirname "$encontrado")" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          set -e
          cd "$PROJETO"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          

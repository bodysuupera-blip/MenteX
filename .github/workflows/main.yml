name: MENTEX V4.8 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto Android
        id: project
        shell: bash
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE"
          DEST="$RUNNER_TEMP/mentex-project"
          mkdir -p "$DEST"

          # Procurar um projeto que já esteja extraído
          PROJECT=""
          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$ROOT" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' -print0)

          # Se não encontrou, extrair os ZIPs do repositório
          if [ -z "$PROJECT" ]; then
            while IFS= read -r -d '' ZIP; do
              echo "Analisando ZIP: $ZIP"
              unzip -oq "$ZIP" -d "$DEST" || continue

              while IFS= read -r -d '' FILE; do
                DIR="$(dirname "$FILE")"
                if [ -f "$DIR/app/build.gradle" ] || \
                   [ -f "$DIR/app/build.gradle.kts" ]; then
                  PROJECT="$DIR"
                  break
                fi
              done < <(find "$DEST" -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print0)

              [ -n "$PROJECT" ] && break
            done < <(find "$ROOT" -type f \
              -name '*.zip' -not -path '*/.git/*' -print0)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android não encontrado."
            echo "Envie o ZIP completo do projeto V4.8 ao repositório."
            echo "Arquivos encontrados:"
            find "$ROOT" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd "$RUNNER_TEMP"
            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o android-tools.zip
            mkdir -p android-tools
            unzip -oq android-tools.zip -d android-tools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -a android-tools/cmdline-tools/. \
              "$SDK/cmdline-tools/latest/"
          fi

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


name: CAO FUJAO - ATUALIZAR ITENS E GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gerar Cão Fujão Atualizado
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar ferramentas Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Verificar arquivos
        run: |
          test -f CAO-FUJAO.apk || {
            echo "ERRO: CAO-FUJAO.apk não encontrado"
            exit 1
          }

          test -f assets/index.html || {
            echo "ERRO: assets/index.html não encontrado"
            exit 1
          }

      - name: Atualizar jogo
        run: |
          set -e

          mkdir -p trabalho resultado

          cd trabalho
          unzip -oq ../CAO-FUJAO.apk

          mkdir -p assets
          cp ../assets/index.html assets/index.html

          if [ -f ../assets/intro.png ]; then
            cp ../assets/intro.png assets/intro.png
          fi

          zip -qr ../resultado/CAO-FUJAO-UNSIGNED.apk .

          cd ..

      - name: Alinhar APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -f 4 \
            resultado/CAO-FUJAO-UNSIGNED.apk \
            resultado/CAO-FUJAO-ALIGNED.apk

      - name: Assinar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MENTEX_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.MENTEX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MENTEX_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.MENTEX_STORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "ERRO: chave original de assinatura não configurada."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > assinatura.jks

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks assinatura.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out resultado/CAO-FUJAO-ATUALIZADO.apk \
            resultado/CAO-FUJAO-ALIGNED.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            resultado/CAO-FUJAO-ATUALIZADO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-ATUALIZADO
          path: resultado/CAO-FUJAO-ATUALIZADO.apk
          if-no-files-found: error
          


name: NEXUS - APK com novo ícone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Aplicar ícone Nexus
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density

            cp assets/icons/mipmap-$density/ic_launcher.png \
            android/app/src/main/res/mipmap-$density/

            cp assets/icons/mipmap-$density/ic_launcher_round.png \
            android/app/src/main/res/mipmap-$density/
          done

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-NOVO-ICONE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

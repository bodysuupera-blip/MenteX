
name: MENTEX V5.0 - Atualizar boas-vindas e ícone

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  atualizar:
    name: Gerar APK MENTEX 5.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      # CORREÇÃO: Java 17 precisa vir antes do Android SDK
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Instalar ferramentas
        run: |
          python -m pip install --upgrade pip pillow
          sdkmanager "build-tools;35.0.0"

      - name: Conferir arquivos
        run: |
          test -f MENTEX-V5.0.apk
          test -f mentex_welcome.jpg
          test -f mentex_icon.png

      - name: Aplicar atualizações
        run: |
          python patch.py

      - name: Alinhar APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -f -p 4 \
            MENTEX-V5.0-ATUALIZADO-UNSIGNED.apk \
            MENTEX-V5.0-ALINHADO.apk

      - name: Assinar APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE"
          echo "$KEYSTORE" | base64 --decode > mentex.jks

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks mentex.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out MENTEX-V5.0-ATUALIZADO.apk \
            MENTEX-V5.0-ALINHADO.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            MENTEX-V5.0-ATUALIZADO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.0-ATUALIZADO
          path: MENTEX-V5.0-ATUALIZADO.apk
          retention-days: 30
          

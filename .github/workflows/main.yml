name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Procurar MENTEX 3.9 correto
        shell: bash
        run: |
          set -e

          ZIP="./MENTEX_Android_3_9_PASTA_CORRETA.zip"

          echo "================================="
          echo " PROCURANDO MENTEX 3.9"
          echo "================================="

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: o arquivo correto não está no GitHub:"
            echo "$ZIP"
            echo ""
            echo "ZIPs encontrados no repositório:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP CORRETO ENCONTRADO:"
          echo "$ZIP"

          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          unzip -o "$ZIP" -d /tmp/mentex

          echo ""
          echo "Conteúdo:"
          find /tmp/mentex -maxdepth 4 -type f

      - name: Encontrar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find /tmp/mentex \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar MENTEX 3.9
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================="
          echo " COMPILANDO MENTEX 3.9"
          echo "================================="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-3.9-NOVO
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Finalizado
        run: |
          echo "================================="
          echo " MENTEX 3.9 NOVO GERADO"
          echo "================================="
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper encontrado."
          else
            echo "Gradle Wrapper não encontrado."
            echo "Será usado o Gradle do GitHub Actions."
            gradle --version
          fi

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================="
          echo " VERIFICANDO PROJETO"
          echo "================================="

          echo "Diretório:"
          pwd

          echo ""
          echo "Arquivos:"
          find . -maxdepth 3 -type f | sort

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

      - name: Compilar APK MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================="
          echo " COMPILANDO MENTEX"
          echo "================================="

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          echo "================================="
          echo " PROCURANDO APK"
          echo "================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-3.9
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Concluído
        run: |
          echo "================================="
          echo " MENTEX APK GERADO COM SUCESSO"
          echo "================================="

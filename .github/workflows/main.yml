name: MENTEX - Preparar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Preparar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extrair APK do ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/mentex-extraido artifacts

          while IFS= read -r -d '' arquivo; do
            echo "Verificando: $arquivo"
            unzip -oq "$arquivo" -d /tmp/mentex-extraido
          done < <(
            find . -maxdepth 3 -type f -iname '*.zip' \
              ! -path './.git/*' -print0
          )

          APK="$(find /tmp/mentex-extraido . \
            -type f -name '*.apk' \
            ! -path './.git/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi encontrado."
            exit 1
          fi

          cp "$APK" artifacts/MENTEX.apk
          echo "APK preparado com sucesso."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: artifacts/MENTEX.apk
          if-no-files-found: error

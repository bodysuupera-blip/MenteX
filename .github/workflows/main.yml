
name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX Nova Geração
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./MENTEX-NOVA-GERACAO-PROJETO.zip"
          DEST="$RUNNER_TEMP/mentex-novo"

          echo "Procurando ZIP..."

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP da nova plataforma não encontrado."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          echo "Procurando package.json..."

          PACKAGE=$(find "$DEST" -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: projeto não encontrado dentro do ZIP."
            find "$DEST" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "Projeto encontrado: $PROJECT_DIR"

          echo "$PROJECT_DIR" > "$RUNNER_TEMP/mentex-dir.txt"

      - name: Instalar e preparar Android
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/mentex-dir.txt")
          cd "$PROJECT_DIR"

          test -f www/index.html
          test -f capacitor.config.json

          npm install

          npx cap add android

          npx cap sync android

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/mentex-dir.txt")
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-NOVA-GERACAO.apk"

          echo "APK GERADO COM SUCESSO!"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-NOVA-GERACAO-APK
          path: MENTEX-NOVA-GERACAO.apk
          if-no-files-found: error
          

name: NEXUS 350 - SONS LOJA VOLTAR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS350-SONS-LOJA-VOLTAR.zip'
      - '.github/workflows/nexus350.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Encontrar ZIP atualizado
        run: |
          set -e
          ZIP="$(find . -maxdepth 4 -type f -name 'NEXUS350-SONS-LOJA-VOLTAR.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ZIP atualizado não encontrado no repositório."
            exit 1
          fi
          echo "ZIP encontrado: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        run: |
          set -e
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

          PROJECT="$(find extracted -type f -name package.json \
            -not -path '*/node_modules/*' \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "package.json não encontrado dentro do ZIP."
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Instalar dependências
        working-directory: extracted
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install

      - name: Preparar Capacitor Android
        working-directory: extracted
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Fixar orientação horizontal
        working-directory: extracted
        run: |
          set -e
          cd "$PROJECT_DIR"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml não encontrado."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest_path = sys.argv[1]
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          attr_orientation = f"{{{android_ns}}}screenOrientation"
          attr_resize = f"{{{android_ns}}}resizeableActivity"

          app = root.find("application")
          if app is None:
              raise SystemExit("Tag application não encontrada.")

          activities = app.findall("activity")
          if not activities:
              raise SystemExit("Nenhuma activity encontrada.")

          main_activity = None
          for activity in activities:
              for intent in activity.findall("intent-filter"):
                  actions = [
                      a.get(f"{{{android_ns}}}name")
                      for a in intent.findall("action")
                  ]
                  categories = [
                      c.get(f"{{{android_ns}}}name")
                      for c in intent.findall("category")
                  ]
                  if "android.intent.action.MAIN" in actions and \
                     "android.intent.category.LAUNCHER" in categories:
                      main_activity = activity
                      break
              if main_activity is not None:
                  break

          if main_activity is None:
              main_activity = activities[0]

          main_activity.set(attr_orientation, "landscape")
          main_activity.set(attr_resize, "false")

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          # Confere se o XML continua válido
          ET.parse(manifest_path)
          print("Manifest validado e orientação horizontal aplicada.")
          PY

      - name: Compilar APK
        working-directory: extracted
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Localizar APK
        run: |
          set -e
          APK="$(find extracted -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK não foi gerado."
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/NEXUS350-SONS-LOJA-VOLTAR.apk
          ls -lh resultado/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-SONS-LOJA-VOLTAR-APK
          path: resultado/NEXUS350-SONS-LOJA-VOLTAR.apk
          if-no-files-found: error
          retention-days: 30

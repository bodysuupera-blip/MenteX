
name: NEXUS 350 - DIAGNOSTICO DO PROJETO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Mostrar estrutura do projeto
        run: |
          echo "===== RAIZ DO REPOSITORIO ====="
          ls -la

          echo "===== ARQUIVOS DO PROJETO =====
          "
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./.github/*" \
            | sort | head -n 300

      - name: Criar ZIP do projeto original
        run: |
          zip -r NEXUS350-PROJETO-ORIGINAL.zip . \
            -x ".git/*" \
            -x "*/node_modules/*"

      - name: Disponibilizar projeto para download
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-PROJETO-DIAGNOSTICO
          path: NEXUS350-PROJETO-ORIGINAL.zip
          retention-days: 7

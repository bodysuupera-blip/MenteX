
name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verificar estrutura
        run: |
          echo "Arquivos encontrados:"
          ls -la
          find . -maxdepth 4 -type f | sort

      - name: Criar settings.gradle
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            if [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; then
              cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CaoFujao"
          include ':app'
          EOF
            else
              echo "ERRO: Pasta app ou arquivo build.gradle nao encontrado."
              exit 1
            fi
          fi

      - name: Verificar arquivos obrigatorios
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/intro.png

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p resultado
          cp app/build/outputs/apk/debug/app-debug.apk resultado/CAO-FUJAO.apk
          test -s resultado/CAO-FUJAO.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-INDEPENDENTE
          path: resultado/CAO-FUJAO.apk
          if-no-files-found: error
          

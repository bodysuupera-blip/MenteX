
name: MENTEX V5.0 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX 5.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Preparar arquivos do MENTEX
        shell: bash
        run: |
          set -e

          if [ ! -f "mentex-package/www/index.html" ]; then
            ZIP=$(find . -maxdepth 2 -name "MENTEX-5.0-Nova-Plataforma.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ZIP do MENTEX não encontrado!"
              exit 1
            fi

            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
          fi

          WWW=$(find . -type f -path "*/www/index.html" | head -n 1)

          if [ -z "$WWW" ]; then
            echo "index.html não encontrado!"
            exit 1
          fi

          echo "WWW=$(dirname "$WWW")" >> "$GITHUB_ENV"

      - name: Criar projeto Android
        run: |
          cordova create mentex-build br.com.mentex.app MENTEX

          rm -rf mentex-build/www
          cp -r "$WWW" mentex-build/www

          cd mentex-build

          cordova platform add android@14.0.1

      - name: Compilar MENTEX APK
        run: |
          cd mentex-build
          cordova build android --debug

      - name: Preparar APK
        run: |
          mkdir -p apk-final

          APK=$(find mentex-build/platforms/android \
            -type f -name "*debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK não encontrado!"
            exit 1
          fi

          cp "$APK" apk-final/MENTEX-V5.0.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.0-APK
          path: apk-final/MENTEX-V5.0.apk
          retention-days: 7
          

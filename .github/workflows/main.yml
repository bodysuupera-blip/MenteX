
name: LABIRINTO MORTAL - Gerar APK Sombrio 2.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir arquivos do projeto
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Gerar APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Salvar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-SOMBRIO-2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

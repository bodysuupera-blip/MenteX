
name: CAO FUJAO - GERAR APK INDEPENDENTE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Verificar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/intro.png

          echo "Projeto independente encontrado!"

      - name: Compilar APK
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p resultado

          cp "$APK" resultado/CAO-FUJAO-INDEPENDENTE.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose resultado/CAO-FUJAO-INDEPENDENTE.apk

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-INDEPENDENTE
          path: resultado/CAO-FUJAO-INDEPENDENTE.apk
          if-no-files-found: error
          

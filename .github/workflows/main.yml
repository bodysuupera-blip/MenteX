name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar projeto MENTEX 3.1
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          ZIP="./MENTEX_Android_3_1_Nova_Tela_Inicial.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado."
            exit 1
          fi

          unzip -o "$ZIP" -d /tmp/mentex

          echo "=== PROJETO MENTEX ==="
          find /tmp/mentex -maxdepth 3 -type f | head -100

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparação Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permissão ao Gradle
        run: |
          find /tmp/mentex -name "gradlew" -exec chmod +x {} \;

      - name: Localizar projeto Android
        run: |
          ROOT=$(find /tmp/mentex -type f -name "settings.gradle*" -o -name "build.gradle*" | head -1)

          if [ -z "$ROOT" ]; then
            echo "ERRO: projeto Gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$ROOT")
          echo "Projeto encontrado em: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

      - name: Localizar APK
        run: |
          echo "=== APK GERADO ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-Android-3.1
          path: |
            /tmp/mentex/**/*.apk
            /tmp/mentex/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

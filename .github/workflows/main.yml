
name: MENTEX - Extrair Projeto e Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Extrair projeto MENTEX
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-4.7-PROJETO-RECONSTRUIDO-CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Projeto ZIP nao encontrado"
            exit 1
          fi

          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

          ROOT=$(find projeto -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERRO: projeto Android sem settings.gradle"
            find projeto -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$ROOT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado em $PROJECT_DIR"

      - name: Configurar icone MENTEX
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/app/src/main/res"

          if [ -f MENTEX-ICONE-MELHORADO.zip ]; then
            mkdir -p /tmp/icone
            unzip -q MENTEX-ICONE-MELHORADO.zip -d /tmp/icone

            ICONS=$(find /tmp/icone -path '*/android/app/src/main/res' -type d | head -1)

            if [ -n "$ICONS" ] && [ -d "$APP" ]; then
              cp -R "$ICONS"/. "$APP"/
            fi
          else
            echo "ZIP do icone nao encontrado; mantendo icone do projeto."
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

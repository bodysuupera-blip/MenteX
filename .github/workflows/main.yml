
name: Ampliar icone MENTEX

on:
  workflow_dispatch:
  push:
    paths:
      - "MENTEX-V4.17-APK.zip"
      - "mentex_icon.png"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zip unzip curl jq python3-pil
          URL=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | test("^apktool_[0-9.]+\\.jar$")) | .browser_download_url' | head -n 1)
          test -n "$URL"
          test "$URL" != "null"
          curl -fL "$URL" -o "$RUNNER_TEMP/apktool.jar"

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$RUNNER_TEMP/sdk-unpack" "$SDK/cmdline-tools/latest"
          curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/sdk.zip"
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk-unpack"
          cp -a "$RUNNER_TEMP/sdk-unpack/cmdline-tools/." "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.0"

      - name: Localizar APK
        shell: bash
        run: |
          set -e
          test -f MENTEX-V4.17-APK.zip
          test -f mentex_icon.png
          mkdir entrada
          unzip -o MENTEX-V4.17-APK.zip -d entrada
          APK=$(find entrada -type f -iname "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" original.apk

      - name: Preparar logo ampliado
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from PIL import Image

          im = Image.open("mentex_icon.png").convert("RGBA")

          # Recorta margens transparentes externas.
          bbox = im.getchannel("A").getbbox()
          if bbox:
              im = im.crop(bbox)

          # Usa um quadro quadrado.
          w, h = im.size
          side = min(w, h)
          x = (w - side) // 2
          y = (h - side) // 2
          im = im.crop((x, y, x + side, y + side))

          # Zoom de 35%: amplia e recorta as bordas.
          im = im.resize((1350, 1350), Image.Resampling.LANCZOS)
          im = im.crop((163, 163, 1187, 1187))
          im = im.resize((1024, 1024), Image.Resampling.LANCZOS)
          im.save("mentex_icon_ampliado.png")
          print("Logo ampliado em 35%.")
          PY

      - name: Desmontar APK
        shell: bash
        run: |
          set -e
          java -jar "$RUNNER_TEMP/apktool.jar" d -f original.apk -o projeto

      - name: Atualizar recursos de icone
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          res = Path("projeto/res")
          source = Image.open("mentex_icon_ampliado.png").convert("RGBA")
          names = ("ic_launcher", "ic_launcher_round", "launcher_icon", "app_icon", "appicon")
          count = 0

          for folder in res.iterdir():
              if not folder.is_dir():
                  continue
              if not (folder.name.startswith("mipmap") or folder.name.startswith("drawable")):
                  continue

              for file in folder.iterdir():
                  if not file.is_file() or file.suffix.lower() not in (".png", ".webp"):
                      continue
                  if not any(n in file.stem.lower() for n in names):
                      continue

                  with Image.open(file) as old:
                      size = old.size

                  out = source.resize(size, Image.Resampling.LANCZOS)
                  out.save(file, "WEBP" if file.suffix.lower() == ".webp" else "PNG")
                  print("Atualizado:", file)
                  count += 1

          if count == 0:
              raise SystemExit("Nenhum icone reconhecido. Verifique os nomes dos recursos do APK.")

          # Prepara imagens de apoio para recursos adaptativos.
          nd = res / "drawable-nodpi"
          nd.mkdir(parents=True, exist_ok=True)
          source.save(nd / "mentex_launcher_foreground.png")
          source.save(nd / "mentex_launcher_background.png")
          print("Total de imagens atualizadas:", count)
          PY

      - name: Reconstruir APK
        shell: bash
        run: |
          set -e
          java -jar "$RUNNER_TEMP/apktool.jar" b projeto -o mentex-unsigned.apk

      - name: Alinhar e assinar
        shell: bash
        env:
          BUILD_TOOLS: ${{ runner.temp }}/android-sdk/build-tools/35.0.0
        run: |
          set -e
          "$BUILD_TOOLS/zipalign" -f -p 4 mentex-unsigned.apk mentex-aligned.apk
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mentex.keystore" \
            -storepass android -keypass android -alias mentex \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MENTEX, O=MENTEX, C=BR"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/mentex.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out MENTEX-assinado.apk mentex-aligned.apk
          "$BUILD_TOOLS/apksigner" verify MENTEX-assinado.apk

      - name: Criar ZIP final
        shell: bash
        run: |
          set -e
          mkdir entrega
          cp MENTEX-assinado.apk entrega/
          cp mentex_icon_ampliado.png entrega/mentex_icon.png
          (cd entrega && zip -j ../MENTEX-APK-final.zip *)

      - name: Disponibilizar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-final
          path: |
            MENTEX-assinado.apk
            MENTEX-APK-final.zip
          if-no-files-found: error
          

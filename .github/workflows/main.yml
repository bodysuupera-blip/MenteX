
name: MENTEX - Atualizar Icone pelo APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Verificar arquivos necessarios
        shell: bash
        run: |
          test -f MENTEX-V4.17-APK.zip || {
            echo "::error::Coloque MENTEX-V4.17-APK.zip na raiz do repositorio."
            exit 1
          }

          test -f mentex_icon.png || {
            echo "::error::Coloque mentex_icon.png na raiz do repositorio."
            exit 1
          }

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool python3-pip
          python3 -m pip install --break-system-packages pillow
          
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: sdkmanager "build-tools;35.0.0"

      - name: Extrair APK original
        run: |
          mkdir -p original
          unzip -o MENTEX-V4.17-APK.zip -d original
          APK=$(find original -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK encontrado no ZIP."
            exit 1
          fi

          cp "$APK" original.apk

      - name: Desmontar aplicativo
        run: apktool d -f original.apk -o projeto

      - name: Substituir imagens dos icones
        shell: bash
        run: |
          cat > trocar_icone.py <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          raiz = Path("projeto/res")
          origem = Image.open("mentex_icon.png").convert("RGBA")

          nomes = re.compile(
              r"(ic_launcher|launcher_icon|app_icon|appicon)",
              re.IGNORECASE
          )

          alterados = 0

          for pasta in raiz.rglob("*"):
              if not pasta.is_dir():
                  continue

              if not (
                  pasta.name.startswith("mipmap")
                  or pasta.name.startswith("drawable")
              ):
                  continue

              for arquivo in pasta.iterdir():
                  if not arquivo.is_file():
                      continue

                  if arquivo.suffix.lower() not in (".png", ".webp"):
                      continue

                  if not nomes.search(arquivo.stem):
                      continue

                  try:
                      with Image.open(arquivo) as antiga:
                          tamanho = antiga.size
                          formato = antiga.format

                      imagem = origem.resize(
                          tamanho, Image.Resampling.LANCZOS
                      )

                      if formato == "WEBP":
                          imagem.save(arquivo, "WEBP", lossless=True)
                      else:
                          imagem.save(arquivo, "PNG")

                      print("Icone substituido:", arquivo)
                      alterados += 1

                  except Exception as erro:
                      print("Aviso:", arquivo, erro)

          print("Total de imagens substituidas:", alterados)

          if alterados == 0:
              raise SystemExit(
                  "Nenhuma imagem de icone reconhecida. "
                  "Os recursos precisam ser identificados manualmente."
              )
          PY

          python3 trocar_icone.py

      - name: Reconstruir APK
        run: apktool b projeto -o mentex-unsigned.apk

      - name: Alinhar e assinar APK
        shell: bash
        run: |
          set -e

          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/zipalign" -f 4 \
            mentex-unsigned.apk mentex-aligned.apk

          keytool -genkeypair \
            -keystore mentex-test.keystore \
            -storepass android \
            -keypass android \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX, OU=Test, O=MENTEX, L=SP, ST=SP, C=BR"

          "$BT/apksigner" sign \
            --ks mentex-test.keystore \
            --ks-key-alias mentex \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out MENTEX-V4.18-ICON-REDONDO.apk \
            mentex-aligned.apk

          "$BT/apksigner" verify \
            MENTEX-V4.18-ICON-REDONDO.apk

      - name: Criar ZIP para download
        run: |
          mkdir pacote
          cp MENTEX-V4.18-ICON-REDONDO.apk pacote/
          cd pacote
          zip ../MENTEX-V4.18-ICON-REDONDO.zip *.apk

      - name: Disponibilizar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.18-ICON-REDONDO
          path: |
            MENTEX-V4.18-ICON-REDONDO.zip
            MENTEX-V4.18-ICON-REDONDO.apk
          if-no-files-found: error
          

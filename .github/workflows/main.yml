name: MENTEX V4.6.3 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6.3
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto Android
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/mentex-projects
          FOUND=""

          while IFS= read -r ZIP; do
            echo "Verificando: $ZIP"

            if ! unzip -tq "$ZIP" >/dev/null 2>&1; then
              continue
            fi

            DEST="/tmp/mentex-projects/$(basename "$ZIP" .zip)"
            mkdir -p "$DEST"
            unzip -oq "$ZIP" -d "$DEST"

            SETTINGS=$(find "$DEST" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit)

            if [ -n "$SETTINGS" ]; then
              ROOT=$(dirname "$SETTINGS")

              if [ -f "$ROOT/gradlew" ]; then
                FOUND="$ROOT"
                echo "Projeto Android encontrado em: $ROOT"
                break
              fi

              echo "Projeto encontrado, mas sem gradlew: $ROOT"
            fi
          done < <(find . -maxdepth 2 -type f -name '*.zip' \
            -not -path './.git/*' | sort)

          if [ -z "$FOUND" ]; then
            echo "ERRO: nenhum ZIP continha projeto Android com gradlew."
            echo "Arquivos Gradle encontrados no repositório:"
            find . /tmp/mentex-projects -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \
              -o -name gradlew \) 2>/dev/null | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$FOUND" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.3-APK
          path: |
            /tmp/mentex-projects/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

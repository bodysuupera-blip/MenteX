name: MENTEX V4.6 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      # 1. Baixar o projeto
      - name: Baixar projeto
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Dar permissão ao Gradle
      - name: Permitir execução do Gradle
        run: chmod +x gradlew

      # 4. Limpar projeto
      - name: Limpar projeto
        run: ./gradlew clean

      # 5. Gerar APK
      - name: Gerar APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Publicar APK
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

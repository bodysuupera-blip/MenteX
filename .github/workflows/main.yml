
name: MENTEX V4.9 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar SDK Manager
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Aceitar licenças Android
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Instalar pacotes Android
        shell: bash
        run: |
          set -e
          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          set -e

          GRADLEW="$(find . \
            -type f \
            -name gradlew \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: não existe arquivo gradlew no repositório."
            echo "Arquivos encontrados na raiz:"
            ls -la
            echo "Arquivos de configuração Gradle encontrados:"
            find . -maxdepth 5 \
              \( -name settings.gradle -o \
                 -name settings.gradle.kts -o \
                 -name build.gradle -o \
                 -name build.gradle.kts \) \
              -not -path './.git/*' -print
            echo "Verifique se o projeto Android completo foi enviado ao GitHub."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=""
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Diretório do projeto encontrado: ${PROJECT_DIR:-raiz}"

          if [ ! -f "${PROJECT_DIR:+$PROJECT_DIR/}settings.gradle" ] && \
             [ ! -f "${PROJECT_DIR:+$PROJECT_DIR/}settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado junto do gradlew."
            exit 1
          fi

          if [ ! -d "${PROJECT_DIR:+$PROJECT_DIR/}app" ]; then
            echo "ERRO: pasta app não encontrada junto do gradlew."
            exit 1
          fi

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e
          cd "${PROJECT_DIR:-.}"
          chmod +x ./gradlew

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "${PROJECT_DIR:-.}"
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.9-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
          

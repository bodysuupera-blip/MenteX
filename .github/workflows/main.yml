name: NEXUS 350 - LOCALIZAR ESTRUTURA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Identificar arquivos de compilacao
        shell: bash
        run: |
          echo "===== RAIZ ====="
          ls -lah

          echo "===== CONFIGURACOES ====="
          find . -type f \
            \( -name "package.json" \
            -o -name "config.xml" \
            -o -name "capacitor.config.*" \
            -o -name "build.gradle" \
            -o -name "settings.gradle" \
            -o -name "gradlew" \
            -o -name "AndroidManifest.xml" \ \
            -o -name "*.apk" \) \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./build/*" \
            | head -n 150

          echo "===== DIRETORIOS PRINCIPAIS ====="
          find . -maxdepth 3 -type d \
            ! -path "./.git*" \
            ! -path "./node_modules*" \
            | head -n 100


name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MENTEX - Ícone e Respostas Atualizados
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair pacote MENTEX atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$GITHUB_WORKSPACE/MENTEX-ESTILO-ORIGINAL-MELHORADO-ICONE-NOVO.zip"
          DEST="$RUNNER_TEMP/mentex-final"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP atualizado não encontrado na raiz do GitHub."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          PACKAGE=$(find "$DEST" -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "$PROJECT_DIR" > "$RUNNER_TEMP/project-dir.txt"

          echo "Projeto atualizado: $PROJECT_DIR"

      - name: Conferir imagens novas
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")

          for FILE in \
            www/index.html \
            www/mentex_icon.png \
            www/brain_happy.png \
            www/brain_sad.png \
            android-icon-res/mipmap-mdpi/ic_launcher.png \
            android-icon-res/mipmap-hdpi/ic_launcher.png \
            android-icon-res/mipmap-xhdpi/ic_launcher.png \
            android-icon-res/mipmap-xxhdpi/ic_launcher.png \
            android-icon-res/mipmap-xxxhdpi/ic_launcher.png \
            android-icon-res/mipmap-anydpi-v26/ic_launcher.xml \
            android-icon-res/drawable-nodpi/mentex_icon_foreground.png
          do
            if [ ! -s "$PROJECT_DIR/$FILE" ]; then
              echo "ERRO: arquivo ausente: $FILE"
              exit 1
            fi
          done

          echo "Todas as imagens atualizadas foram encontradas."

      - name: Instalar dependências
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR"

          npm install
          npx cap add android
          npx cap sync android

      - name: Aplicar ícone original do MENTEX
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          SRC="$PROJECT_DIR/android-icon-res"
          DST="$PROJECT_DIR/android/app/src/main/res"

          for DENSITY in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$DST/$DENSITY"

            cp "$SRC/$DENSITY/ic_launcher.png" "$DST/$DENSITY/"
            cp "$SRC/$DENSITY/ic_launcher_round.png" "$DST/$DENSITY/"
          done

          mkdir -p "$DST/mipmap-anydpi-v26"
          mkdir -p "$DST/drawable-nodpi"
          mkdir -p "$DST/values"

          cp "$SRC/mipmap-anydpi-v26/ic_launcher.xml" "$DST/mipmap-anydpi-v26/"
          cp "$SRC/mipmap-anydpi-v26/ic_launcher_round.xml" "$DST/mipmap-anydpi-v26/"
          cp "$SRC/drawable-nodpi/mentex_icon_foreground.png" "$DST/drawable-nodpi/"
          cp "$SRC/values/colors.xml" "$DST/values/"

          echo "Ícone original instalado."

      - name: Compilar APK atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-ATUALIZADO.apk"

          echo "APK atualizado com sucesso."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-ATUALIZADO-APK
          path: MENTEX-ATUALIZADO.apk
          if-no-files-found: error
          

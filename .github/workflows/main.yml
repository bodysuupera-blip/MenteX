
name: NEXUS 350 - GERAR APK ANDROID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Localizar ZIP do Nexus 350
        shell: bash
        run: |
          set -e

          ZIP="Nexus350_Labirinto_Fantasmas.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP não encontrado: $ZIP"
            echo "Coloque o ZIP Nexus 350 na raiz do repositorio."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Localizar projeto
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json não encontrado dentro do ZIP."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT"

      - name: Instalar dependencias
        working-directory: extracted
        run: |
          set -e

          cd "$PROJECT"

          npm pkg set dependencies.@capacitor/core="^7.0.0"
          npm pkg set dependencies.@capacitor/android="^7.0.0"
          npm pkg set devDependencies.@capacitor/cli="^7.0.0"

          npm install

      - name: Preparar Android
        shell: bash
        run: |
          set -e

          cd "extracted/$PROJECT"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configurar jogo horizontal
        shell: bash
        run: |
          set -e

          MANIFEST="extracted/$PROJECT/android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/g' "$MANIFEST"

            if ! grep -q 'android:screenOrientation="landscape"' "$MANIFEST"; then
              sed -i 's/<activity /<activity android:screenOrientation="landscape" /' "$MANIFEST"
            fi
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "extracted/$PROJECT/android"

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-APK
          path: extracted/**/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          


name: NEXUS 350 - RECUPERAR E GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair projeto Nexus
        run: |
          ZIP=$(find . -maxdepth 3 -name "NEXUS-PROJETO-RECUPERADO-APK-ICON.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP do Nexus não encontrado no repositório"
            exit 1
          fi

          mkdir -p recovered
          unzip -o "$ZIP" -d recovered

          PROJECT=$(find recovered -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json não encontrado após extração"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV
          echo "Projeto encontrado: $PROJECT"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Preparar Android
        run: |
          cd "$PROJECT_DIR"
          npx cap add android
          npx cap sync android

      - name: Aplicar ícones
        run: |
          cd "$PROJECT_DIR"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DEST="android/app/src/main/res/mipmap-$density"
            SRC="assets/icons/mipmap-$density"

            mkdir -p "$DEST"

            cp "$SRC/ic_launcher.png" "$DEST/ic_launcher.png"
            cp "$SRC/ic_launcher_round.png" "$DEST/ic_launcher_round.png"
          done

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-APK
          path: recovered/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          


name: MENTE EM FUGA - APK INDEPENDENTE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMAN" >> $GITHUB_ENV

      - name: Instalar componentes Android
        run: |
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Localizar ZIP correto
        run: |
          ZIP="Mente-em-Fuga-Independente-NOVO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP do Mente em Fuga nao encontrado!"
            find . -maxdepth 3 -type f -name "*Mente*Fuga*.zip"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

      - name: Extrair jogo
        run: |
          rm -rf /tmp/mente-fuga
          mkdir -p /tmp/mente-fuga
          unzip -q "Mente-em-Fuga-Independente-NOVO.zip" -d /tmp/mente-fuga

          HTML=$(find /tmp/mente-fuga -type f -name "index.html" | head -n 1)

          if [ -z "$HTML" ]; then
            echo "index.html nao encontrado dentro do ZIP"
            find /tmp/mente-fuga -maxdepth 5 -type f
            exit 1
          fi

          WEB_DIR=$(dirname "$HTML")

          rm -rf mente-em-fuga/www
          mkdir -p mente-em-fuga/www
          cp -a "$WEB_DIR/." mente-em-fuga/www/

          echo "Jogo extraido:"
          ls -la mente-em-fuga/www

      - name: Criar projeto Android independente
        working-directory: mente-em-fuga
        run: |
          cat > package.json <<'EOF'
          {
            "name": "mente-em-fuga",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web game ready"
            },
            "dependencies": {
              "@capacitor/core": "6.1.2"
            },
            "devDependencies": {
              "@capacitor/cli": "6.1.2",
              "@capacitor/android": "6.1.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rafaelheranca.menteemfuga",
            "appName": "Mente em Fuga",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npm install

          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: mente-em-fuga/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK
        run: |
          APK="mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK nao foi gerado"
            find mente-em-fuga/android -name "*.apk"
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTE-EM-FUGA-APK
          path: mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          


name: MENTEX - Atualizar Icone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Localizar APK ZIP e imagem
        id: arquivos
        shell: bash
        run: |
          ZIP=$(find . -type f -iname '*V4.17*APK*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -type f -iname '*.zip' \
              -not -path './.git/*' | head -n 1)
          fi

          IMG=$(find . -type f -iname 'mentex_icon.png' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Envie o ZIP original do MENTEX ao repositorio."
            exit 1
          fi

          if [ -z "$IMG" ]; then
            echo "::error::Envie mentex_icon.png ao repositorio."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool python3-pip zip
          python3 -m pip install --break-system-packages pillow

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas de assinatura
        run: sdkmanager "build-tools;35.0.0"

      - name: Extrair APK
        shell: bash
        run: |
          mkdir -p original
          unzip -o "${{ steps.arquivos.outputs.zip }}" -d original

          APK=$(find original -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::O ZIP nao contem um APK."
            exit 1
          fi

          cp "$APK" original.apk

      - name: Desmontar APK
        run: apktool d -f original.apk -o projeto

      - name: Trocar icones reconhecidos
        env:
          ICON: ${{ steps.arquivos.outputs.img }}
        run: |
          cat > trocar.py <<'PY'
          from pathlib import Path
          from PIL import Image
          import re, os

          root = Path("projeto/res")
          src = Image.open(os.environ["ICON"]).convert("RGBA")
          pattern = re.compile(
              r"(ic_launcher|launcher_icon|app_icon|appicon)",
              re.I
          )
          count = 0

          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in (".png", ".webp"):
                  continue
              if not (p.parent.name.startswith("mipmap") or
                      p.parent.name.startswith("drawable")):
                  continue
              if not pattern.search(p.stem):
                  continue

              try:
                  with Image.open(p) as old:
                      size = old.size
                      fmt = old.format

                  im = src.resize(size, Image.Resampling.LANCZOS)
                  if fmt == "WEBP":
                      im.save(p, "WEBP", lossless=True)
                  else:
                      im.save(p, "PNG")
                  print("Atualizado:", p)
                  count += 1
              except Exception as e:
                  print("Ignorado:", p, e)

          if count == 0:
              raise SystemExit(
                  "Nenhum icone reconhecido. "
                  "O APK pode usar nomes de recursos diferentes."
              )
          print("Total de imagens alteradas:", count)
          PY

          python3 trocar.py

      - name: Reconstruir APK
        run: apktool b projeto -o mentex-unsigned.apk

      - name: Assinar APK
        shell: bash
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"

          keytool -genkeypair -v \
            -keystore teste.keystore \
            -storepass android \
            -keypass android \
            -alias mentex \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX"

          "$BT/zipalign" -f 4 \
            mentex-unsigned.apk mentex-aligned.apk

          "$BT/apksigner" sign \
            --ks teste.keystore \
            --ks-key-alias mentex \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out MENTEX-ICON-REDONDO.apk \
            mentex-aligned.apk

          "$BT/apksigner" verify MENTEX-ICON-REDONDO.apk

      - name: Criar ZIP final
        run: |
          mkdir pacote
          cp MENTEX-ICON-REDONDO.apk pacote/
          cd pacote
          zip ../MENTEX-ICON-REDONDO.zip *.apk

      - name: Disponibilizar para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-ICON-REDONDO
          path: |
            MENTEX-ICON-REDONDO.zip
            MENTEX-ICON-REDONDO.apk
            

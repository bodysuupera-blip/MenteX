
name: NEXUS 350 EVOLUTION - APK COMPLETO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extrair jogo verdadeiro
        run: |
          set -e

          if [ -f NEXUS_350_EVOLUTION_FONTE.zip ]; then
            unzip -o NEXUS_350_EVOLUTION_FONTE.zip -d .
          fi

          test -f www/index.html
          test -f package.json
          test -f capacitor.config.json

          echo "Fonte do jogo encontrada:"
          ls -lah www/

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Unificar Kotlin
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.jetbrains.kotlin") {
                  details.useVersion "1.8.22"
                }
              }
            }
          }
          EOF

      - name: Conferir jogo antes de compilar
        run: |
          grep -q "NEXUS 350" www/index.html
          grep -q "COMO JOGAR" www/index.html
          echo "Jogo encontrado!"

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-EVOLUTION-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          


name: CAO FUJAO - ATUALIZAR ITENS E GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão Atualizado
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar ferramentas Android
        run: |
          set -e
          command -v sdkmanager
          yes | sdkmanager --licenses
          sdkmanager "build-tools;35.0.0"

      - name: Extrair ZIP atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP=$(find . -type f \
            -name 'CAO-FUJAO-ATUALIZACAO-ITENS-CORRIGIDO.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP corrigido não encontrado no repositório."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/cao-fujao"

          unzip -oq "$ZIP" -d "$RUNNER_TEMP/cao-fujao"

          APK=$(find "$RUNNER_TEMP/cao-fujao" \
            -type f -name 'CAO-FUJAO.apk' -print -quit)

          HTML=$(find "$RUNNER_TEMP/cao-fujao" \
            -type f -path '*/assets/index.html' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK original não encontrado."
            exit 1
          fi

          if [ -z "$HTML" ]; then
            echo "ERRO: HTML atualizado não encontrado."
            exit 1
          fi

          echo "APK_ORIGINAL=$APK" >> "$GITHUB_ENV"
          echo "HTML_ATUALIZADO=$HTML" >> "$GITHUB_ENV"

          echo "APK encontrado: $APK"
          echo "HTML encontrado: $HTML"

      - name: Atualizar arquivos do jogo
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p trabalho resultado

          cd trabalho

          unzip -oq "$APK_ORIGINAL"

          mkdir -p assets

          cp "$HTML_ATUALIZADO" assets/index.html

          # Remover assinaturas antigas do APK
          rm -f META-INF/*.RSA
          rm -f META-INF/*.DSA
          rm -f META-INF/*.EC
          rm -f META-INF/*.SF
          rm -f META-INF/*.MF

          zip -qr ../resultado/CAO-FUJAO-UNSIGNED.apk .

          cd ..

          echo "Arquivos atualizados no APK."

      - name: Alinhar APK
        run: |
          set -e

          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -f 4 \
            resultado/CAO-FUJAO-UNSIGNED.apk \
            resultado/CAO-FUJAO-ALIGNED.apk

      - name: Assinar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MENTEX_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.MENTEX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MENTEX_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.MENTEX_STORE_PASSWORD }}

        run: |
          set -Eeuo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ] || \
             [ -z "$STORE_PASSWORD" ]; then
            echo "ERRO: configure os quatro Secrets da assinatura original."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > assinatura.jks

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks assinatura.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out resultado/CAO-FUJAO-ATUALIZADO.apk \
            resultado/CAO-FUJAO-ALIGNED.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose resultado/CAO-FUJAO-ATUALIZADO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-ATUALIZADO
          path: resultado/CAO-FUJAO-ATUALIZADO.apk
          if-no-files-found: error
          

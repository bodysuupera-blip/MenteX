name: Construir APK MENTEX Atualizado

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK MENTEX Atualizado
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Procurar ZIP atualizado
        shell: bash
        run: |
          echo "======================================"
          echo "PROCURANDO ZIP MENTEX"
          echo "======================================"

          ZIP="MENTEX_ANDROID_ABERTURA_NOVA_IMAGEM_REGRA_MUSICA_SEM_VOZ_10_MOEDAS_MUSICA_CORRIGIDA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado:"
            echo "$ZIP"
            echo ""
            echo "Arquivos disponíveis:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP" -d android_project

          echo "Projeto extraído com sucesso."

      - name: Encontrar projeto Gradle
        id: projeto
        shell: bash
        run: |
          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find android_project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar atualização
        shell: bash
        run: |
          echo "======================================"
          echo "MENTEX ATUALIZADO"
          echo "======================================"
          echo "🖼️ Nova imagem de abertura"
          echo "📖 Tela de regras"
          echo "🎵 Música na introdução"
          echo "🔇 Sem voz"
          echo "❤️ 10 corações"
          echo "🪙 +10 moedas por acerto"
          echo "⭐ +10 pontos por acerto"
          echo "🛡️ Escudo na fase"
          echo "🛒 Loja"
          echo "💳 Google Play"
          echo "======================================"

      - name: Construir APK
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.project_dir }}"

          gradle clean --no-daemon
          gradle assembleDebug --no-daemon

      - name: Procurar APK
        shell: bash
        run: |
          echo "APKs encontrados:"
          find android_project -type f -name "*.apk"

      - name: Verificar APK
        shell: bash
        run: |
          APK=$(find android_project -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-FINAL
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

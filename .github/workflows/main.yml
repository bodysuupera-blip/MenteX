name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          echo "Verificando projeto MENTEX..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Projeto Android encontrado."

      - name: Verificar jogo
        shell: bash
        run: |
          set -e

          echo "Verificando jogo..."

          grep -q "Desafio Insano #250" \
            app/src/main/assets/index.html

          grep -q "lives:10" \
            app/src/main/assets/index.html

          grep -q "LOJA" \
            app/src/main/assets/index.html

          grep -q "JOGAR AGORA" \
            app/src/main/assets/index.html

          echo "250 fases encontradas."
          echo "10 corações encontrados."
          echo "Loja encontrada."
          echo "JOGAR AGORA encontrado."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find app/build/outputs -type f -print
            exit 1
          fi

          echo "APK gerado:"
          ls -lh "$APK"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

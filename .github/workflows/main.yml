name: MENTEX V4.7 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Reconstruir e assinar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            curl unzip zip jq \
            apksigner zipalign

      - name: Instalar Android SDK Build Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/cmdline-tools.zip"

          mkdir -p "$RUNNER_TEMP/cmdline-unpack"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" \
            -d "$RUNNER_TEMP/cmdline-unpack"

          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/cmdline-unpack/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "build-tools;35.0.0"

          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Localizar APK e interface
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . -type f -iname '*.apk' \
            -not -path './.git/*' \
            -not -path './saida/*' \
            -print -quit)"

          UI_ZIP="$(find . -type f \
            -iname 'MENTEX-PERGUNTAS-INTERFACE-MELHORADA.zip' \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK original nao encontrado."
            exit 1
          fi

          if [ -z "$UI_ZIP" ]; then
            echo "::error::ZIP da interface melhorada nao encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/mentex/interface"

          cp "$APK" "$RUNNER_TEMP/mentex/original.apk"

          unzip -q "$UI_ZIP" \
            -d "$RUNNER_TEMP/mentex/interface"

          HTML="$(find "$RUNNER_TEMP/mentex/interface" \
            -type f -name index.html -print -quit)"

          if [ -z "$HTML" ]; then
            echo "::error::index.html nao encontrado no ZIP."
            exit 1
          fi

          echo "HTML_FILE=$HTML" >> "$GITHUB_ENV"

      - name: Baixar Apktool
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"

          URL="$(curl -fsSL "$API" | jq -r \
            '.assets[] |
            select(.name | test("^apktool_.*\\.jar$")) |
            .browser_download_url' | head -n 1)"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Nao foi possivel baixar Apktool."
            exit 1
          fi

          curl -fL "$URL" -o "$RUNNER_TEMP/apktool.jar"

          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Extrair APK original
        shell: bash
        run: |
          set -euo pipefail

          java -jar "$RUNNER_TEMP/apktool.jar" d -f \
            "$RUNNER_TEMP/mentex/original.apk" \
            -o "$RUNNER_TEMP/mentex/extraido"

          if [ ! -f "$RUNNER_TEMP/mentex/extraido/assets/index.html" ]; then
            echo "::error::O APK nao possui assets/index.html."
            exit 1
          fi

      - name: Atualizar tela de perguntas
        shell: bash
        run: |
          set -euo pipefail

          cp "$HTML_FILE" \
            "$RUNNER_TEMP/mentex/extraido/assets/index.html"

          echo "Tela HTML substituida."

      - name: Reconstruir APK com AAPT2
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "::error::AAPT2 nao encontrado em $AAPT2"
            exit 1
          fi

          java -jar "$RUNNER_TEMP/apktool.jar" b \
            "$RUNNER_TEMP/mentex/extraido" \
            --aapt "$AAPT2" \
            -o "$RUNNER_TEMP/mentex/reconstruido.apk"

          test -s "$RUNNER_TEMP/mentex/reconstruido.apk"

      - name: Criar chave de teste
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mentex/teste.jks" \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=MENTEX"

      - name: Alinhar e assinar APK
        shell: bash
        run: |
          set -euo pipefail

          zipalign -f 4 \
            "$RUNNER_TEMP/mentex/reconstruido.apk" \
            "$RUNNER_TEMP/mentex/alinhado.apk"

          apksigner sign \
            --ks "$RUNNER_TEMP/mentex/teste.jks" \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --ks-key-alias mentex \
            --out "$RUNNER_TEMP/mentex/MENTEX-V4.7.apk" \
            "$RUNNER_TEMP/mentex/alinhado.apk"

          apksigner verify --verbose \
            "$RUNNER_TEMP/mentex/MENTEX-V4.7.apk"

          unzip -t "$RUNNER_TEMP/mentex/MENTEX-V4.7.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK
          path: ${{ runner.temp }}/mentex/MENTEX-V4.7.apk
          if-no-files-found: error
          retention-days: 7

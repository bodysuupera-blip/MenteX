
name: CAO FUJAO 1.4 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 1.4
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extrair projeto Cão Fujão 1.4
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="CAO-FUJAO-1.4-MAIS-MOVIMENTO-RANKING.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo $ZIP não encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/cao-fujao"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/cao-fujao"

          echo "Conteúdo extraído:"
          find "$RUNNER_TEMP/cao-fujao" -maxdepth 3 -type f | head -n 80

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE="$RUNNER_TEMP/cao-fujao"

          SETTINGS="$(find "$BASE" -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
            \) | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado após extrair o ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Projeto Android encontrado:"
          echo "$PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.dir }}" \
            clean :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-1.4-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

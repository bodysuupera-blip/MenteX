
name: MENTEX - Assinar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assinar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar assinatura
        run: |
          mkdir -p assinatura
          echo "${{ secrets.MENTEX_KEYSTORE_BASE64 }}" | base64 -d > assinatura/mentex.jks

      - name: Assinar APK
        run: |
          APK="MENTEX-original.apk"

          if [ ! -f "$APK" ]; then
            echo "APK nao encontrado: $APK"
            exit 1
          fi

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks assinatura/mentex.jks \
            --ks-key-alias "${{ secrets.MENTEX_KEY_ALIAS }}" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out MENTEX-assinado.apk \
            "$APK"

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose MENTEX-assinado.apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MENTEX_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MENTEX_KEY_PASSWORD }}

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-ASSINADO
          path: MENTEX-assinado.apk
          


name: MENTEX V4.7 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar ou extrair projeto
        id: project
        shell: bash
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE"
          DEST="$RUNNER_TEMP/mentex-source"
          PROJECT=""

          # Procurar projeto já extraído
          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -f "$DIR/app/build.gradle" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$ROOT" -type f \
            -name settings.gradle \
            -not -path '*/.git/*' -print0)

          # Se não estiver extraído, procurar ZIP
          if [ -z "$PROJECT" ]; then
            mkdir -p "$DEST"
            while IFS= read -r -d '' ZIP; do
              TEMP="$RUNNER_TEMP/mentex-test"
              rm -rf "$TEMP"
              mkdir -p "$TEMP"
              if unzip -oq "$ZIP" -d "$TEMP"; then
                while IFS= read -r -d '' FILE; do
                  DIR="$(dirname "$FILE")"
                  if [ -f "$DIR/app/build.gradle" ]; then
                    PROJECT="$DIR"
                    break
                  fi
                done < <(find "$TEMP" -type f \
                  -name settings.gradle -print0)
              fi
              if [ -n "$PROJECT" ]; then
                break
              fi
            done < <(find "$ROOT" -type f -name '*.zip' \
              -not -path '*/.git/*' -print0)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android não encontrado."
            echo "Envie o ZIP do projeto reconstruído para o repositório."
            find "$ROOT" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Localizar SDK Manager
        id: sdk
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: SDK Manager não encontrado."
            exit 1
          fi

          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Instalar componentes Android
        shell: bash
        run: |
          SDKMANAGER="${{ steps.sdk.outputs.path }}"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

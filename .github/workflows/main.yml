name: MENTEX V4.6 - Preparar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find APK
        run: |
          set -e

          mkdir -p output
          found=""

          echo "Procurando APK no repositorio..."

          for file in $(find . -type f -name "*.apk"); do
            echo "APK encontrado: $file"
            cp "$file" output/MENTEX-V4.6-ATUALIZADO.apk
            found="yes"
            break
          done

          if [ -z "$found" ]; then
            echo "Procurando APK dentro dos ZIPs..."

            for zipfile in $(find . -type f -name "*.zip"); do
              echo "Analisando: $zipfile"

              mkdir -p temp_extract
              unzip -o "$zipfile" -d temp_extract >/dev/null 2>&1 || true

              apk=$(find temp_extract -type f -name "*.apk" | head -n 1)

              if [ -n "$apk" ]; then
                echo "APK encontrado: $apk"
                cp "$apk" output/MENTEX-V4.6-ATUALIZADO.apk
                found="yes"
                break
              fi

              rm -rf temp_extract
            done
          fi

          if [ -z "$found" ]; then
            echo "ERRO: APK nao encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-ATUALIZADO
          path: output/MENTEX-V4.6-ATUALIZADO.apk


name: MENTEX V4.16 - Corrigir Rolagem e Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Localizar e extrair projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mentex-projetos"

          FOUND=""

          while IFS= read -r -d '' ZIP; do
            echo "Verificando: $ZIP"

            DEST="$RUNNER_TEMP/mentex-projetos/$(basename "$ZIP" .zip)"
            mkdir -p "$DEST"

            if ! unzip -oq "$ZIP" -d "$DEST"; then
              echo "ZIP inválido; ignorando."
              continue
            fi

            while IFS= read -r -d '' WRAPPER; do
              DIR="$(dirname "$WRAPPER")"

              if { [ -f "$DIR/settings.gradle" ] || \
                   [ -f "$DIR/settings.gradle.kts" ]; } && \
                 { [ -f "$DIR/app/build.gradle" ] || \
                   [ -f "$DIR/app/build.gradle.kts" ]; }; then
                FOUND="$DIR"
                break 2
              fi
            done < <(find "$DEST" -type f -name gradlew -print0)

          done < <(find . -maxdepth 1 -type f -iname '*.zip' -print0)

          if [ -z "$FOUND" ]; then
            echo "::error::Nenhum ZIP continha um projeto Android completo com gradlew, settings.gradle e app/build.gradle."
            exit 1
          fi

          echo "Projeto encontrado em: $FOUND"
          echo "PROJECT_DIR=$FOUND" >> "$GITHUB_ENV"
          chmod +x "$FOUND/gradlew"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug --stacktrace

      - name: Localizar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist"

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::A compilação terminou sem gerar APK."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/dist/MENTEX-V4.16-ROLAGEM.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.16-ROLAGEM-APK
          path: dist/MENTEX-V4.16-ROLAGEM.apk
          if-no-files-found: error
          

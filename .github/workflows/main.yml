name: MENTEX V4.6 - Preparar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    name: Preparar MENTEX V4.6
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Procurar APK dentro dos ZIPs
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO APK DO MENTEX"
          echo "======================================"

          mkdir -p /tmp/mentex-apk

          # Procurar APK diretamente no repositório
          find . -type f -iname "*.apk" \
            -not -path "./.git/*" \
            -print \
            -exec cp "{}" /tmp/mentex-apk/ \;

          # Procurar APK dentro de todos os ZIPs
          find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' ZIP; do
            echo ""
            echo "Analisando: $ZIP"

            PASTA="/tmp/extrair-$(date +%s%N)"
            mkdir -p "$PASTA"

            if unzip -q "$ZIP" -d "$PASTA"; then
              find "$PASTA" -type f -iname "*.apk" \
                -print \
                -exec cp "{}" /tmp/mentex-apk/ \;
            else
              echo "Aviso: não foi possível extrair $ZIP"
            fi
          done

          echo ""
          echo "======================================"
          echo "APKs ENCONTRADOS"
          echo "======================================"

          find /tmp/mentex-apk -type f -iname "*.apk" -print

          if ! find /tmp/mentex-apk -type f -iname "*.apk" | grep -q .; then
            echo ""
            echo "ERRO: nenhum APK foi encontrado."
            echo ""
            echo "Arquivos ZIP existentes:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

      - name: Organizar APK final
        shell: bash
        run: |
          set -e

          mkdir -p resultado

          APK="$(find /tmp/mentex-apk -type f -iname "*.apk" | head -n 1)"

          echo "APK selecionado:"
          echo "$APK"

          cp "$APK" "resultado/MENTEX-V4.6-ATUALIZADO.apk"

          ls -lh resultado/

      - name: Enviar APK para os artefatos
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-ATUALIZADO
          path: resultado/MENTEX-V4.6-ATUALIZADO.apk
          if-no-files-found: error
          retention-days: 30


name: MENTEX INDEPENDENTE - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extrair projeto MENTEX
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            ZIP=""

            while IFS= read -r arquivo; do
              ZIP="$arquivo"
              break
            done < <(find . -maxdepth 1 -type f -iname "*.zip")

            if [ -z "$ZIP" ]; then
              echo "ERRO: Nenhum ZIP encontrado."
              ls -la
              exit 1
            fi

            echo "Extraindo: $ZIP"

            mkdir -p /tmp/mentex
            unzip -oq "$ZIP" -d /tmp/mentex

            PACKAGE=""

            while IFS= read -r arquivo; do
              PACKAGE="$arquivo"
              break
            done < <(find /tmp/mentex -type f -name package.json)

            if [ -z "$PACKAGE" ]; then
              echo "ERRO: package.json não encontrado dentro do ZIP."
              find /tmp/mentex -maxdepth 4 -type f -print
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PACKAGE")
            cp -a "$PROJECT_DIR"/. .
          fi

      - name: Verificar arquivos
        run: |
          set -e
          echo "Verificando projeto MENTEX..."
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          echo "Arquivos encontrados!"

      - name: Instalar dependências
        run: npm install

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          while IFS= read -r arquivo; do
            SDKMANAGER="$arquivo"
            break
          done < <(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Adicionar Android
        run: npx cap add android

      - name: Sincronizar MENTEX
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-INDEPENDENTE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

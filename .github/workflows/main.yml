name: MENTEX - Gerar APK Atualizado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip apksigner aapt

      - name: Localizar APK original
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -type f -iname '*.apk' \
            ! -path './output/*' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERRO: coloque o APK original na raiz do repositorio."
            exit 1
          fi

          cp "$APK" /tmp/original.apk
          mkdir -p output

      - name: Extrair APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/mentex
          cd /tmp/mentex
          unzip -q /tmp/original.apk

          HTML="$(find . -type f \
            -path '*/assets/www/index.html' | head -n 1)"

          if [ -z "$HTML" ]; then
            echo "ERRO: este APK nao contem assets/www/index.html."
            echo "Nao e possivel aplicar esta correcao automaticamente."
            exit 1
          fi

          echo "$HTML" > /tmp/html-path.txt

      - name: Corrigir rolagem Jogador e Perfil
        run: |
          set -euo pipefail
          HTML="$(cat /tmp/html-path.txt)"

          python3 - "$HTML" <<'PY'
          import sys
          p = sys.argv[1]
          with open(p, encoding="utf-8") as f:
              s = f.read()

          css = """
          <style id="mentex-scroll-fix">
          html, body {
            overflow-x: hidden !important;
          }
          body:has(#home:not(.hidden)),
          body:has(#profile:not(.hidden)) {
            height: auto !important;
            min-height: 100vh !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
            touch-action: pan-y !important;
          }
          .app:has(#home:not(.hidden)),
          .app:has(#profile:not(.hidden)) {
            height: auto !important;
            min-height: 100vh !important;
            overflow: visible !important;
            padding-bottom: 40px !important;
          }
          #home:not(.hidden),
          #profile:not(.hidden) {
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
            padding-bottom: 32px !important;
          }
          </style>
          """

          if "mentex-scroll-fix" not in s:
              if "</head>" not in s:
                  raise SystemExit("ERRO: tag </head> nao encontrada.")
              s = s.replace("</head>", css + "\n</head>", 1)

          with open(p, "w", encoding="utf-8") as f:
              f.write(s)
          PY

      - name: Reempacotar APK
        run: |
          set -euo pipefail
          cd /tmp/mentex

          rm -rf META-INF
          find . -type f \( -iname '*.RSA' -o -iname '*.SF' \
            -o -iname '*.DSA' -o -iname '*.EC' \) -delete

          zip -qr /tmp/mentex-unsigned.apk .

      - name: Criar chave de assinatura
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/mentex.jks" \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX,O=MENTEX,C=BR"

      - name: Assinar e validar APK
        run: |
          set -euo pipefail

          apksigner sign \
            --ks "$RUNNER_TEMP/mentex.jks" \
            --ks-key-alias mentex \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out output/MENTEX-ATUALIZADO.apk \
            /tmp/mentex-unsigned.apk

          apksigner verify --verbose output/MENTEX-ATUALIZADO.apk
          aapt dump badging output/MENTEX-ATUALIZADO.apk

      - name: Gerar ZIP
        run: |
          set -euo pipefail
          cd output
          zip MENTEX-ATUALIZADO.zip MENTEX-ATUALIZADO.apk
          test -s MENTEX-ATUALIZADO.apk
          test -s MENTEX-ATUALIZADO.zip

      - name: Disponibilizar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-ATUALIZADO
          path: |
            output/MENTEX-ATUALIZADO.apk
            output/MENTEX-ATUALIZADO.zip
          if-no-files-found: error

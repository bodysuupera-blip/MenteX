
name: CAO FUJAO 2.0 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 2.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p _cao_source

          PROJECT_FILE=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' -print -quit || true)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Projeto ainda nao extraido. Procurando ZIP..."

            FOUND=false

            while IFS= read -r -d '' ZIP; do
              if unzip -Z1 "$ZIP" | grep -qE '(^|/)settings.gradle$'; then
                echo "Extraindo: $ZIP"
                unzip -oq "$ZIP" -d _cao_source
                FOUND=true
                break
              fi
            done < <(find . -type f -name '*.zip' \
              -not -path './.git/*' -print0)

            if [ "$FOUND" = false ]; then
              echo "ERRO: nenhum ZIP de projeto Android encontrado."
              find . -maxdepth 4 -type f
              exit 1
            fi
          fi

          PROJECT_FILE=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' -print -quit)

          PROJECT_DIR="${PROJECT_FILE%/*}"

          if [ "$PROJECT_DIR" = "$PROJECT_FILE" ]; then
            PROJECT_DIR="."
          fi

          echo "Projeto localizado: $PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle" || {
            echo "ERRO: app/build.gradle ausente."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/assets/index.html" || {
            echo "ERRO: index.html ausente."
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.0-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          


name: MENTE EM FUGA - APK INDEPENDENTE

on:
  workflow_dispatch:
  push:
    paths:
      - 'mente-em-fuga/**'
      - '.github/workflows/mente-em-fuga.yml'

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas Android
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verificar projeto independente
        run: |
          test -f mente-em-fuga/www/index.html
          test -f mente-em-fuga/package.json

      - name: Instalar dependencias
        working-directory: mente-em-fuga
        run: npm install

      - name: Preparar Android
        working-directory: mente-em-fuga
        run: |
          npx cap sync android

      - name: Compilar APK
        working-directory: mente-em-fuga/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTE-EM-FUGA-APK
          path: mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk
          

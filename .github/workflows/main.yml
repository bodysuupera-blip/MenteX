name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v6

      - name: Verificar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          ZIP="./MENTEX_Android_4_0_10_CORACOES_250_FASES.zip"

          echo "======================================"
          echo "       MENTEX 4.0"
          echo "       10 CORAÇÕES"
          echo "       250 FASES"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado:"
            echo "$ZIP"
            echo ""
            echo "ZIPs encontrados:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      - name: Extrair MENTEX
        shell: bash
        run: |
          set -e

          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          unzip -o \
            "./MENTEX_Android_4_0_10_CORACOES_250_FASES.zip" \
            -d /tmp/mentex

          echo "MENTEX extraído."

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find /tmp/mentex -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find /tmp/mentex -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compilar MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "       COMPILANDO MENTEX"
          echo "       10 CORAÇÕES"
          echo "       250 FASES"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-4.0-10-CORACOES-250-FASES-${{ github.run_number }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Finalizado
        run: |
          echo "======================================"
          echo " MENTEX GERADO COM SUCESSO!"
          echo " 10 CORAÇÕES"
          echo " 250 FASES"
          echo "======================================"

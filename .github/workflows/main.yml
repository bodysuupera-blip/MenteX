name: Construir APK MENTEX Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK MENTEX Final
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Procurar APK
        shell: bash
        run: |
          echo "Procurando APK..."

          APK=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum arquivo APK foi encontrado no repositório."
            echo ""
            echo "Coloque o arquivo app-debug.apk no repositório e execute novamente."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verificar APK
        shell: bash
        run: |
          echo "Verificando APK..."

          if [ ! -f "$APK_PATH" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          ls -lh "$APK_PATH"

          echo "APK encontrado corretamente."

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-FINAL
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Finalizado
        run: |
          echo "======================================"
          echo "       MENTEX APK FINALIZADO"
          echo "======================================"
          echo "O APK está disponível em Artifacts."


name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar ZIP do Cão Fujão
        shell: bash
        run: |
          set -e

          ZIP="./Cao_Fujao_ATUALIZADO_GOOGLE_PLAY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP do Cão Fujão não encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$RUNNER_TEMP/build-cao-fujao"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          unzip -q "./Cao_Fujao_ATUALIZADO_GOOGLE_PLAY.zip" \
            -d "$PROJECT_DIR"

          SETTINGS=$(find "$PROJECT_DIR" \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$ROOT_DIR/app/build.gradle" ] && \
             [ ! -f "$ROOT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: app/build.gradle não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $ROOT_DIR"

      - name: Corrigir Google Play Billing no Java
        shell: bash
        run: |
          set -e

          JAVA_FILE="$PROJECT_DIR/app/src/main/java/com/caofujao/game/MainActivity.java"

          if [ ! -f "$JAVA_FILE" ]; then
            echo "ERRO: MainActivity.java não encontrado."
            exit 1
          fi

          python3 - "$JAVA_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          code = path.read_text(encoding="utf-8")

          replacements = {
              "queryResult.getProductDetailsList().isEmpty()":
                  "queryResult.isEmpty()",

              "queryResult.getProductDetailsList().get(0)":
                  "queryResult.get(0)",

              "queryResult.getProductDetailsList()":
                  "queryResult",
          }

          for old, new in replacements.items():
              code = code.replace(old, new)

          if "getProductDetailsList()" in code:
              raise SystemExit(
                  "ERRO: ainda existe chamada getProductDetailsList() no Java."
              )

          path.write_text(code, encoding="utf-8")

          print("MainActivity.java corrigido com sucesso.")
          PY

          echo "Verificando correção:"
          if grep -n "getProductDetailsList" "$JAVA_FILE"; then
            echo "ERRO: chamada antiga ainda existe."
            exit 1
          fi

          echo "Nenhuma chamada antiga encontrada."

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --no-daemon clean :app:assembleDebug

      - name: Preparar APK final
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -path "*/build/outputs/apk/debug/app-debug.apk" \
            -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p resultado-cao-fujao

          cp "$APK" \
            resultado-cao-fujao/CAO-FUJAO-ATUALIZADO.apk

          ls -lh resultado-cao-fujao/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK-EXCLUSIVO
          path: resultado-cao-fujao/CAO-FUJAO-ATUALIZADO.apk
          if-no-files-found: error
          


name: NEXUS 350 - CORRIGIR JOGO E ICONE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extrair fonte
        run: |
          set -e
          mkdir -p /tmp/nexus
          unzip -oq NEXUS350_ATUALIZACAO_ICONE_REDONDO_FONTE.zip -d /tmp/nexus

          DIR=$(find /tmp/nexus -name package.json -printf '%h\n' | head -1)

          if [ -z "$DIR" ]; then
            echo "package.json nao encontrado"
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Fonte: $DIR"

      - name: Verificar jogo
        run: |
          cd "$PROJECT_DIR"
          test -f www/index.html
          grep -q '<canvas' www/index.html
          grep -q 'id="start"' www/index.html
          grep -q 'function generate' www/index.html
          echo "JOGO HTML CONFIRMADO"

      - name: Instalar dependencias
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Preparar Android
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Copiar jogo para Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html
          grep -q '<canvas' android/app/src/main/assets/public/index.html
          echo "JOGO COPIADO PARA ANDROID"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-JOGO-CORRIGIDO
          path: /tmp/nexus/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

name: MENTEX V4.7 - Atualizar tela de perguntas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualizar:
    name: Atualizar e compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk curl unzip zip jq apksigner zipalign

      - name: Localizar arquivos
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . -type f -iname '*.apk' \
            -not -path './.git/*' -print -quit)"

          UI_ZIP="$(find . -type f \
            -iname 'MENTEX-PERGUNTAS-INTERFACE-MELHORADA.zip' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK original nao encontrado."
            exit 1
          fi

          if [ -z "$UI_ZIP" ]; then
            echo "::error::ZIP da interface melhorada nao encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/mentex/ui"

          cp "$APK" "$RUNNER_TEMP/mentex/original.apk"
          unzip -q "$UI_ZIP" -d "$RUNNER_TEMP/mentex/ui"

          HTML="$(find "$RUNNER_TEMP/mentex/ui" \
            -type f -name index.html -print -quit)"

          if [ -z "$HTML" ]; then
            echo "::error::Nao encontrei index.html dentro do ZIP."
            exit 1
          fi

          echo "HTML_FILE=$HTML" >> "$GITHUB_ENV"

      - name: Baixar Apktool
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"

          URL="$(curl -fsSL "$API" | jq -r \
            '.assets[] | select(.name | test("^apktool_.*\\.jar$")) | .browser_download_url' \
            | head -n 1)"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Nao foi possivel obter o Apktool."
            exit 1
          fi

          curl -fL "$URL" -o "$RUNNER_TEMP/apktool.jar"

      - name: Extrair APK
        shell: bash
        run: |
          set -euo pipefail

          java -jar "$RUNNER_TEMP/apktool.jar" d -f \
            "$RUNNER_TEMP/mentex/original.apk" \
            -o "$RUNNER_TEMP/mentex/decoded"

      - name: Substituir tela HTML
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$RUNNER_TEMP/mentex/decoded/assets"

          if [ ! -d "$ASSETS" ]; then
            echo "::error::O APK nao possui a pasta assets."
            exit 1
          fi

          if [ ! -f "$ASSETS/index.html" ]; then
            echo "::error::O APK nao possui assets/index.html."
            exit 1
          fi

          cp "$HTML_FILE" "$ASSETS/index.html"

      - name: Reconstruir APK
        shell: bash
        run: |
          set -euo pipefail

          java -jar "$RUNNER_TEMP/apktool.jar" b \
            "$RUNNER_TEMP/mentex/decoded" \
            -o "$RUNNER_TEMP/mentex/rebuilt.apk"

      - name: Assinar APK
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mentex/test.jks" \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=MENTEX"

          zipalign -f 4 \
            "$RUNNER_TEMP/mentex/rebuilt.apk" \
            "$RUNNER_TEMP/mentex/aligned.apk"

          apksigner sign \
            --ks "$RUNNER_TEMP/mentex/test.jks" \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out "$RUNNER_TEMP/mentex/MENTEX-V4.7.apk" \
            "$RUNNER_TEMP/mentex/aligned.apk"

          apksigner verify "$RUNNER_TEMP/mentex/MENTEX-V4.7.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK
          path: ${{ runner.temp }}/mentex/MENTEX-V4.7.apk
          if-no-files-found: error
          retention-days: 7

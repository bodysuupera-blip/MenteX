
name: MENTEX V4.6.5 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Localizar projeto Android
        id: android
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
            echo "gradlew=$GRADLEW" >> "$GITHUB_OUTPUT"
          else
            PROJECT_DIR=$(dirname "$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
            if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
              PROJECT_DIR="."
            fi
            if ! find "$PROJECT_DIR" -maxdepth 2 -name build.gradle -o -name build.gradle.kts | grep -q .; then
              echo "ERRO: Projeto Android não encontrado."
              exit 1
            fi
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto: $PROJECT_DIR"

      - name: Configurar Gradle 8.7
        if: steps.android.outputs.wrapper == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar Gradle
        if: steps.android.outputs.wrapper == 'true'
        run: |
          chmod +x "${{ steps.android.outputs.gradlew }}"

      - name: Compilar APK
        run: |
          cd "${{ steps.android.outputs.dir }}"

          if [ "${{ steps.android.outputs.wrapper }}" = "true" ]; then
            "${{ github.workspace }}/${{ steps.android.outputs.gradlew }}" assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Localizar APK
        run: |
          mkdir -p apk-final
          APK=$(find . -type f -path "*/build/outputs/apk/*/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" apk-final/MENTEX-V4.6.5.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.5-APK
          path: apk-final/MENTEX-V4.6.5.apk
          retention-days: 7
          

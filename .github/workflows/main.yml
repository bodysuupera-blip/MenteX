
name: CAO FUJAO - GERAR APK ATUALIZADO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK manualmente
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Aceitando licencas..."
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e
          mkdir -p _projeto

          while IFS= read -r ZIP; do
            echo "Extraindo: $ZIP"
            unzip -oq "$ZIP" -d _projeto
          done < <(find . -type f -iname "*.zip" \
            ! -path "./_projeto/*")

          PROJECT=""

          while IFS= read -r FILE; do
            DIR=$(dirname "$FILE")

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find . -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            ! -path "*/build/*")

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android completo nao encontrado"
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Projeto localizado: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "ERRO: Gradle Wrapper nao encontrado"
            exit 1
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK-ATUALIZADO
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
          

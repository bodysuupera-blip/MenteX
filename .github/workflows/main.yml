
name: LABIRINTO FANTASMA - APK ANDROID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Localizar ZIP do Labirinto Fantasma
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname 'Labirinto_Fantasma_Primeira_Versao_ANDROID.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ZIP do Labirinto Fantasma nao encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          mkdir -p labirinto-build

          ZIP=$(find . -maxdepth 1 -type f -iname 'Labirinto_Fantasma_Primeira_Versao_ANDROID.zip' -print -quit)

          unzip -oq "$ZIP" -d labirinto-build

          PACKAGE=$(find labirinto-build -type f -name package.json -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "package.json nao encontrado"
            exit 1
          fi

          PROJECT=$(dirname "$PACKAGE")

          test -f "$PROJECT/www/index.html"
          test -f "$PROJECT/capacitor.config.json"

          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV

      - name: Instalar dependencias
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npm install

          npx cap add android

          npx cap sync android

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-FANTASMA-ANDROID
          path: labirinto-build/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

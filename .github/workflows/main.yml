
name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/caofujao
          find . -maxdepth 2 -name "*.zip" -print0 |
          while IFS= read -r -d '' file; do
            unzip -oq "$file" -d /tmp/caofujao
          done

          PROJECT=$(find . /tmp/caofujao \
            -type f -name gradlew \
            -not -path '*/.gradle/*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android com gradlew não encontrado."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          chmod +x "$PROJECT/gradlew"

      - name: Compilar APK
        run: |
          cd "$PROJECT"
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-ATUALIZADO
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

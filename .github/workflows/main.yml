name: MENTEX V4.9 - Gerar APK Corrigido

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Aceitar licenças Android
        run: yes | sdkmanager --licenses || true

      - name: Verificar estrutura do projeto
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERRO: gradlew não encontrado na raiz."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

      - name: Preparar Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.9-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

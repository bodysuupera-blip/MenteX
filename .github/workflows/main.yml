
name: LABIRINTO MORTAL - APK 3D 3.0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL 3D
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair ZIP 3D atualizado
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$GITHUB_WORKSPACE/LABIRINTO-MORTAL-3.0.1-3D-CENARIOS-NOVOS.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP 3D atualizado não encontrado."
            echo "Envie LABIRINTO-MORTAL-3.0.1-3D-CENARIOS-NOVOS.zip para a raiz do GitHub."
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/labirinto-atualizado"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/labirinto-atualizado"

          PROJECT_DIR="$RUNNER_TEMP/labirinto-atualizado/LabirintoMortal"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find "$RUNNER_TEMP/labirinto-atualizado" -maxdepth 5 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRO: módulo Android app não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto 3D encontrado corretamente."

      - name: Confirmar versão 3.0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          cat app/build.gradle

          grep -Eq 'versionCode[[:space:]]+6' app/build.gradle
          grep -Eq 'versionName[[:space:]]+["\x27]3\.0\.1["\x27]' app/build.gradle

          echo "Versão 3.0.1 confirmada."

      - name: Compilar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean assembleDebug \
            --stacktrace

      - name: Conferir APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find "$PROJECT_DIR" -type f -name '*.apk'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/saida"

          cp "$APK" \
            "$GITHUB_WORKSPACE/saida/LABIRINTO-MORTAL-3.0.1-3D.apk"

          echo "APK gerado:"
          ls -lh "$GITHUB_WORKSPACE/saida"
          sha256sum "$GITHUB_WORKSPACE/saida/LABIRINTO-MORTAL-3.0.1-3D.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-3.0.1-3D-ATUALIZADO
          path: saida/LABIRINTO-MORTAL-3.0.1-3D.apk
          if-no-files-found: error
          

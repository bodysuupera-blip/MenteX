
name: MENTEX INDEPENDENTE - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar e extrair projeto correto
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/MENTEX-INDEPENDENTE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: MENTEX-INDEPENDENTE.zip não encontrado na raiz."
            echo "Arquivos disponíveis:"
            ls -la
            exit 1
          fi

          mkdir -p /tmp/mentex
          unzip -oq "$ZIP" -d /tmp/mentex

          PACKAGE=""

          while IFS= read -r arquivo; do
            PACKAGE="$arquivo"
            break
          done < <(find /tmp/mentex -type f -name package.json)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não encontrado no projeto independente."
            find /tmp/mentex -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE")"

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          echo "Projeto independente localizado e extraído."

      - name: Verificar estrutura
        shell: bash
        run: |
          set -e

          echo "Verificando projeto MENTEX..."

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

          echo "Todos os arquivos necessários foram encontrados."

      - name: Instalar dependências
        run: npm install

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          while IFS= read -r arquivo; do
            SDKMANAGER="$arquivo"
            break
          done < <(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: SDK Manager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Conferir APK gerado
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK gerado com sucesso!"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-INDEPENDENTE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

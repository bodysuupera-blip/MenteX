
name: CAO FUJAO 3.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'cao_fujao_atualizacao/**'
      - '.github/workflows/CAO-FUJAO-3-0.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Identificar projeto Cao Fujão
        id: projeto
        shell: bash
        run: |
          set -euo pipefail

          UPDATE="cao_fujao_atualizacao/index.html"

          if [ ! -f "$UPDATE" ]; then
            echo "ERRO: arquivo atualizado nao encontrado."
            exit 1
          fi

          mapfile -t WRAPPERS < <(
            find . -type f -name gradlew \
              -not -path '*/.gradle/*'
          )

          FOUND=""
          ASSET=""

          for W in "${WRAPPERS[@]}"; do
            DIR="$(dirname "$W")"

            for A in \
              "$DIR/app/src/main/assets/index.html" \
              "$DIR/src/main/assets/index.html" \
              "$DIR/assets/index.html"
            do
              if [ -f "$A" ] && \
                grep -Eiq 'CAO FUJAO|CÃO FUJÃO' "$A"; then

                if [ -n "$FOUND" ]; then
                  echo "ERRO: mais de um projeto Cao Fujão encontrado."
                  exit 1
                fi

                FOUND="$DIR"
                ASSET="$A"
              fi
            done
          done

          if [ -z "$FOUND" ]; then
            echo "ERRO: projeto Android original do Cao Fujão nao encontrado."
            echo "Nenhum outro aplicativo sera compilado."
            exit 1
          fi

          cp "$UPDATE" "$ASSET"

          echo "project=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Projeto identificado: $FOUND"
          echo "Arquivo atualizado: $ASSET"

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.projeto.outputs.project }}"
          chmod +x gradlew

          ./gradlew --no-daemon :app:assembleDebug

      - name: Localizar APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p saida

          PROJECT="${{ steps.projeto.outputs.project }}"

          APK="$(find "$PROJECT" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          cp "$APK" saida/CAO-FUJAO-3.0.apk

          echo "APK gerado com sucesso!"
          ls -lh saida/

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-3.0-APK
          path: saida/CAO-FUJAO-3.0.apk
          if-no-files-found: error
          

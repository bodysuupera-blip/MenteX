
name: MENTEX - Gerar APK com Atualização

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Atualizar e Compilar MENTEX
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar ferramentas
        run: |
          npm install -g cordova
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Localizar projeto
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name config.xml \
            -not -path '*/platforms/*' \
            -not -path '*/node_modules/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: config.xml não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Aplicar atualização do MENTEX
        shell: bash
        run: |
          ZIP="MENTEX-ATUALIZACAO-PRONTA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado na raiz do repositório."
            exit 1
          fi

          mkdir -p /tmp/mentex-update
          unzip -o "$ZIP" -d /tmp/mentex-update

          SOURCE="/tmp/mentex-update/MENTEX-ATUALIZACAO-PRONTA/assets/public"
          DEST="$PROJECT_DIR/www"

          if [ ! -f "$SOURCE/index.html" ]; then
            echo "ERRO: index.html não encontrado dentro do ZIP."
            exit 1
          fi

          mkdir -p "$DEST"
          cp -a "$SOURCE/." "$DEST/"

          echo "Arquivos atualizados:"
          ls -lh "$DEST"

      - name: Instalar dependências
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f package.json ]; then
            npm install
          fi

      - name: Preparar Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d platforms/android ]; then
            cordova platform add android@14.0.1
          fi

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"
          cordova build android

      - name: Localizar APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/platforms/android" \
            -type f -name '*debug.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            find "$PROJECT_DIR/platforms/android" -type f -name '*.apk'
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/MENTEX-ATUALIZADO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-ATUALIZADO
          path: resultado/MENTEX-ATUALIZADO.apk
          if-no-files-found: error
          

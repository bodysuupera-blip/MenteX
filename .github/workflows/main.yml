
name: MENTEX - Gerar APK Corrigido

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          SETTINGS="$(find . \
            -type d -name .git -prune -o \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -n "$SETTINGS" ]; then
            ROOT="$(dirname "$SETTINGS")"
          else
            echo "Projeto não encontrado nas pastas. Procurando ZIPs..."

            mkdir -p "$RUNNER_TEMP/mentex-extraido"

            while IFS= read -r ZIP; do
              [ -n "$ZIP" ] || continue

              echo "Verificando: $ZIP"

              DEST="$RUNNER_TEMP/mentex-extraido/$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"
              unzip -oq "$ZIP" -d "$DEST"

              SETTINGS="$(find "$DEST" \
                -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print -quit)"

              if [ -n "$SETTINGS" ]; then
                ROOT="$(dirname "$SETTINGS")"
                break
              fi
            done < <(find . -maxdepth 3 -type f -iname 'MENTEX*.zip' \
              -not -path './.git/*' | sort)

          fi

          if [ -z "$ROOT" ]; then
            echo "ERRO: nenhum projeto Android foi encontrado."
            echo "O repositório precisa conter o projeto ou um ZIP com ele."
            find . -maxdepth 4 -type f \
              -not -path './.git/*' | sort | head -200
            exit 1
          fi

          echo "Projeto encontrado em: $ROOT"

          if [ ! -f "$ROOT/build.gradle" ] && \
             [ ! -f "$ROOT/build.gradle.kts" ]; then
            echo "ERRO: build.gradle não encontrado na pasta do projeto."
            exit 1
          fi

          if [ ! -d "$ROOT/app" ]; then
            echo "ERRO: pasta app não encontrada em $ROOT."
            exit 1
          fi

          echo "MENTEX_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$MENTEX_ROOT/gradlew" ]; then
            chmod +x "$MENTEX_ROOT/gradlew"
          else
            echo "Gradle Wrapper ausente. Instalando Gradle 8.7..."
            cd "$RUNNER_TEMP"
            curl -fL \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -o gradle-8.7-bin.zip
            unzip -oq gradle-8.7-bin.zip
            echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$MENTEX_ROOT"

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Localizar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$MENTEX_ROOT" -type f \
            -path '*/build/outputs/apk/*/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: a compilação terminou sem gerar APK."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/MENTEX.apk
          echo "APK pronto: release/MENTEX.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: release/MENTEX.apk
          if-no-files-found: error
          

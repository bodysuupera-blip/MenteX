
name: Nexus 350 Ghost Run - APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Localizar projeto
        id: projeto
        run: |
          PROJECT=$(find . -type f -name package.json \
            -not -path './node_modules/*' \
            -not -path './android/*' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json não encontrado"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $DIR"

      - name: Instalar dependências
        run: |
          cd "${{ steps.projeto.outputs.dir }}"
          npm install

      - name: Preparar Android
        run: |
          cd "${{ steps.projeto.outputs.dir }}"
          npx cap add android || true
          npx cap sync android

      - name: Gerar APK
        run: |
          cd "${{ steps.projeto.outputs.dir }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-GhostRun-APK
          path: ${{ steps.projeto.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          


name: MENTEX V4.8 - Gerar APK com ícone ampliado

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Java
        run: |
          set -euo pipefail
          java -version
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Instalar ferramentas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip zip wget python3

      - name: Localizar APK e ícone
        id: localizar
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . -type f -name '*.apk' \
            ! -path '*/build/*' | head -1 || true)"

          ICON="$(find . -type f \
            \( -iname 'mentex_icon_ampliado.png' \
            -o -iname 'mentex_icon.png' \) \
            | head -1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK encontrado no repositório."
            exit 1
          fi

          if [ -z "$ICON" ]; then
            echo "::error::Imagem do ícone não encontrada."
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "icon=$ICON" >> "$GITHUB_OUTPUT"

          echo "APK encontrado: $APK"
          echo "Ícone encontrado: $ICON"

      - name: Instalar Apktool
        run: |
          set -euo pipefail
          wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            -O "$RUNNER_TEMP/apktool.jar"

      - name: Desmontar APK original
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" \
            d "${{ steps.localizar.outputs.apk }}" \
            -o "$RUNNER_TEMP/mentex" -f

      - name: Substituir recursos do ícone
        env:
          ICON: ${{ steps.localizar.outputs.icon }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "mentex"
          icon = Path(os.environ["ICON"])

          folders = [root / "res"]
          targets = []

          for base in folders:
              if not base.exists():
                  continue

              for folder in base.iterdir():
                  if not folder.is_dir():
                      continue

                  if not folder.name.startswith(
                      ("mipmap", "drawable")
                  ):
                      continue

                  for name in (
                      "ic_launcher.png",
                      "ic_launcher_round.png",
                      "mentex_icon.png",
                  ):
                      target = folder / name
                      if target.is_file():
                          targets.append(target)

          if not targets:
              raise SystemExit(
                  "Nenhum ícone PNG conhecido foi encontrado. "
                  "Verifique os nomes dos recursos no APK."
              )

          for target in targets:
              shutil.copyfile(icon, target)
              print("Ícone atualizado:", target)

          print("Total de recursos atualizados:", len(targets))
          PY

      - name: Reconstruir APK
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" b \
            "$RUNNER_TEMP/mentex" \
            -o "$RUNNER_TEMP/MENTEX-reconstruido.apk"

          test -s "$RUNNER_TEMP/MENTEX-reconstruido.apk"

      - name: Preparar ferramentas Android
        uses: android-actions/setup-android@v3

      - name: Assinar APK
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(find "$SDK/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -1)"

          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mentex.keystore" \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX"

          mkdir -p resultado

          "$ZIPALIGN" -f -v 4 \
            "$RUNNER_TEMP/MENTEX-reconstruido.apk" \
            "$RUNNER_TEMP/MENTEX-alinhado.apk"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/mentex.keystore" \
            --ks-key-alias mentex \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out resultado/MENTEX-V4.8-icone-ampliado.apk \
            "$RUNNER_TEMP/MENTEX-alinhado.apk"

          "$APKSIGNER" verify --verbose \
            resultado/MENTEX-V4.8-icone-ampliado.apk

          test -s resultado/MENTEX-V4.8-icone-ampliado.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-APK
          path: resultado/MENTEX-V4.8-icone-ampliado.apk
          if-no-files-found: error
          

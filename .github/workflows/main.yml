
name: MENTEX V4.8 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.8
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto ou ZIP
        id: project
        shell: bash
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -f "$DIR/app/build.gradle" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$ROOT" -type f \
            -name settings.gradle \
            -not -path '*/.git/*' -print0)

          if [ -z "$PROJECT" ]; then
            while IFS= read -r -d '' ZIP; do
              DEST="$RUNNER_TEMP/mentex-extract"
              rm -rf "$DEST"
              mkdir -p "$DEST"
              unzip -oq "$ZIP" -d "$DEST" || continue

              while IFS= read -r -d '' FILE; do
                DIR="$(dirname "$FILE")"
                if [ -f "$DIR/app/build.gradle" ]; then
                  PROJECT="$DIR"
                  break
                fi
              done < <(find "$DEST" -type f \
                -name settings.gradle -print0)

              [ -n "$PROJECT" ] && break
            done < <(find "$ROOT" -type f \
              -name '*.zip' -not -path '*/.git/*' -print0)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android não encontrado."
            echo "Envie o ZIP MENTEX V4.8 ou extraia os arquivos no repositório."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: SDK Manager não encontrado."
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

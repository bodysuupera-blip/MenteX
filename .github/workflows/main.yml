name: Gerar APK MENTEX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        run: |
          unzip -o MENTEX_Android_1_2_Corrigido_JVM17.zip -d mentex
          find mentex -maxdepth 3 -type f | head -50

      - name: Corrigir compatibilidade JVM
        run: |
          APP_GRADLE=$(find mentex -path '*/app/build.gradle' -type f | head -1)
          echo "Arquivo encontrado: $APP_GRADLE"

          cat >> "$APP_GRADLE" <<'EOF'

          // Correção para compatibilidade Java/Kotlin JVM 17
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd mentex
          gradle assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: mentex/app/build/outputs/apk/debug/app-debug.apk

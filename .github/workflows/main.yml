
name: Nexus 350 - Gerar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Localizar ZIP Nexus 350
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "*Nexus350*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ZIP do Nexus 350 nao encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p nexus_build
          unzip -oq "$ZIP" -d nexus_build

          PROJECT=$(find nexus_build -name package.json -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "package.json nao encontrado dentro do ZIP."
            find nexus_build -maxdepth 5 -type f
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Projeto: $DIR"

      - name: Instalar dependencias
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Adicionar Android
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sincronizar Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Preparar icones
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -d "resources/android" ]; then
            cp -r resources/android/* android/app/src/main/res/
          fi

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          

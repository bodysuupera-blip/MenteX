
      name: Ampliar logo e atualizar icones
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path

          res = Path("projeto/res")
          im = Image.open("mentex_icon.png").convert("RGBA")

          # Remove o fundo quase branco externo, se existir.
          bg = Image.new("RGBA", im.size, (255, 255, 255, 255))
          diff = ImageChops.difference(im, bg).convert("RGB")
          mask = diff.point(lambda p: 255 if p > 35 else 0)
          bbox = mask.getbbox()

          if bbox:
              im = im.crop(bbox)

          # Recorta em quadrado e amplia a arte.
          w, h = im.size
          side = min(w, h)
          x = (w - side) // 2
          y = (h - side) // 2
          im = im.crop((x, y, x + side, y + side))
          im = im.resize((1024, 1024), Image.Resampling.LANCZOS)

          # Atualiza os recursos de icone reconhecidos.
          names = (
              "ic_launcher",
              "ic_launcher_round",
              "launcher_icon",
              "app_icon",
              "appicon"
          )
          count = 0

          for folder in res.iterdir():
              if not folder.is_dir():
                  continue
              if not (folder.name.startswith("mipmap")
                      or folder.name.startswith("drawable")):
                  continue

              for file in folder.iterdir():
                  if not file.is_file():
                      continue
                  if file.suffix.lower() not in (".png", ".webp"):
                      continue
                  if not any(n in file.stem.lower() for n in names):
                      continue

                  try:
                      with Image.open(file) as old:
                          size = old.size

                      # Amplia o conteudo para ocupar melhor o recurso.
                      out = im.resize(size, Image.Resampling.LANCZOS)
                      out.save(
                          file,
                          "WEBP" if file.suffix.lower() == ".webp" else "PNG"
                      )
                      print("Atualizado:", file)
                      count += 1
                  except Exception as e:
                      print("Aviso:", file, e)

          print("Total de recursos atualizados:", count)
          if count == 0:
              raise SystemExit(
                  "Nenhum icone encontrado. Precisamos verificar os nomes "
                  "dos recursos do APK."
              )
          PY
          

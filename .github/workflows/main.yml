
name: CAO FUJAO 3.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CAO_FUJAO_ATUALIZACAO_CODIGO.zip'
      - '.github/workflows/CAO-FUJAO-3.0.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar atualizacao do jogo
        id: update
        shell: bash
        run: |
          set -euo pipefail

          ZIP="CAO_FUJAO_ATUALIZACAO_CODIGO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP nao encontrado na raiz."
            exit 1
          fi

          mkdir -p /tmp/cao-fujao-update
          unzip -oq "$ZIP" -d /tmp/cao-fujao-update

          UPDATE="$(find /tmp/cao-fujao-update \
            -type f -name index.html -print -quit)"

          if [ -z "$UPDATE" ] || [ ! -s "$UPDATE" ]; then
            echo "ERRO: index.html nao encontrado."
            exit 1
          fi

          echo "update_file=$UPDATE" >> "$GITHUB_OUTPUT"

      - name: Identificar projeto original Cao Fujão
        id: project
        shell: bash
        run: |
          set -euo pipefail

          UPDATE="${{ steps.update.outputs.update_file }}"
          FOUND_PROJECT=""
          FOUND_ASSET=""

          while IFS= read -r WRAPPER; do
            PROJECT="$(dirname "$WRAPPER")"

            while IFS= read -r HTML; do
              if grep -Eiq 'Cão Fujão|Cao Fujao|CAO FUJAO' "$HTML"; then

                if [ -n "$FOUND_PROJECT" ] && \
                   [ "$FOUND_PROJECT" != "$PROJECT" ]; then
                  echo "ERRO: mais de um projeto encontrado."
                  exit 1
                fi

                FOUND_PROJECT="$PROJECT"
                FOUND_ASSET="$HTML"
              fi

            done < <(
              find "$PROJECT" -type f \
                -path '*/src/main/assets/*.html' \
                -not -path '*/build/*' \
                -not -path '*/.gradle/*'
            )

          done < <(
            find . -type f -name gradlew \
              -not -path '*/.gradle/*'
          )

          if [ -z "$FOUND_PROJECT" ]; then
            echo "ERRO: projeto Android original do Cao Fujão nao encontrado."
            echo "O MenteX nao sera compilado."
            exit 1
          fi

          cp "$UPDATE" "$FOUND_ASSET"

          echo "project_dir=$FOUND_PROJECT" >> "$GITHUB_OUTPUT"

          echo "Projeto encontrado: $FOUND_PROJECT"
          echo "Atualizacao aplicada: $FOUND_ASSET"

      - name: Preparar Gradle
        run: |
          set -euo pipefail
          chmod +x "${{ steps.project.outputs.project_dir }}/gradlew"

      - name: Compilar aplicativo Android
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Conferir APK
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project_dir }}"

          APK="$(find "$PROJECT" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          mkdir -p saida

          cp "$APK" saida/CAO-FUJAO-3.0-debug.apk

          sha256sum saida/CAO-FUJAO-3.0-debug.apk

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-3.0-APK-DEBUG
          path: saida/CAO-FUJAO-3.0-debug.apk
          if-no-files-found: error

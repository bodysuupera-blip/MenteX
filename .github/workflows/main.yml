name: Compilar MENTEX V4.6 - Reações

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto MENTEX V4.6
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-V4.6-CEREBRO-REACOES.zip"

          echo "=========================================="
          echo "       MENTEX V4.6 - REAÇÕES"
          echo "=========================================="

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não foi encontrado."
            echo ""
            echo "Arquivos ZIP encontrados:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          rm -rf projeto-mentex
          mkdir -p projeto-mentex

          unzip -o "$ZIP" -d projeto-mentex

          SETTINGS=$(find projeto-mentex \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "$PROJECT_DIR" > project_dir.txt

          echo ""
          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Arquivos do cérebro:"
          find "$PROJECT_DIR/app/src/main" \
            -type f \
            \( \
              -iname "*brain*" \
              -o -iname "*cerebro*" \
              -o -iname "*happy*" \
              -o -iname "*sad*" \
              -o -iname "*question*" \
            \) \
            -print || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Entrando no projeto:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x ./gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p resultado

          cp "$APK" \
            "resultado/MENTEX-V4.6-CEREBRO-REACOES.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-CEREBRO-REACOES
          path: resultado/MENTEX-V4.6-CEREBRO-REACOES.apk
          if-no-files-found: error


name: MENTEX V4.6.4 - APK Atualizado

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Compilar MENTEX atualizado
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar ferramentas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Localizar versao atualizada
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""
          DEST="$RUNNER_TEMP/mentex-atualizado"

          mkdir -p "$DEST"

          # Priorizar os ZIPs com as alteracoes desejadas.
          for ZIP_NAME in \
            "MENTEX-V4.6.3-TELA-PERGUNTAS-ATUALIZADA.zip" \
            "MENTEX-V4.6.3-INTERFACE-COMPLETA.zip"; do

            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f -name "$ZIP_NAME" \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ZIP nao encontrado: $ZIP_NAME"
              continue
            fi

            echo "Verificando ZIP: $ZIP_FILE"

            rm -rf "$DEST"
            mkdir -p "$DEST"
            unzip -oq "$ZIP_FILE" -d "$DEST"

            FOUND="$(find "$DEST" \
              -type d -name build -prune -o \
              -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -print -quit)"

            if [ -n "$FOUND" ]; then
              CANDIDATE="$(dirname "$FOUND")"

              if [ -f "$CANDIDATE/app/build.gradle" ] ||
                 [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
                PROJECT_DIR="$CANDIDATE"
                echo "Projeto encontrado no ZIP prioritario."
                break
              fi
            fi

            echo "Este ZIP nao contem um projeto Android completo."
          done

          # Se os ZIPs nao contiverem o projeto, procurar no repositorio.
          if [ -z "$PROJECT_DIR" ]; then
            FOUND="$(find "$GITHUB_WORKSPACE" \
              -type d \( -name .git -o -name build \) -prune \
              -o -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -print -quit)"

            if [ -n "$FOUND" ]; then
              CANDIDATE="$(dirname "$FOUND")"

              if [ -f "$CANDIDATE/app/build.gradle" ] ||
                 [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
                PROJECT_DIR="$CANDIDATE"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Nenhum projeto Android completo foi encontrado."
            echo "Verifique se o ZIP atualizado contem settings.gradle"
            echo "e app/build.gradle ou app/build.gradle.kts."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto selecionado: $PROJECT_DIR"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::A compilacao terminou sem gerar APK."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$APK" \
            "$GITHUB_WORKSPACE/dist/MENTEX-V4.6.4-ATUALIZADO.apk"

          echo "APK produzido a partir de:"
          echo "$PROJECT_DIR"
          ls -lh "$GITHUB_WORKSPACE/dist/MENTEX-V4.6.4-ATUALIZADO.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-ATUALIZADO
          path: dist/MENTEX-V4.6.4-ATUALIZADO.apk
          if-no-files-found: error
          retention-days: 14
          

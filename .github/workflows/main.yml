name: Compilar MENTEX V4.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos encontrados:"
          ls -la

          ZIP="MENTEX-V4.6-CEREBRO-PERGUNTA-ACERTO-ERRO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: Arquivo ZIP não encontrado: $ZIP"
            echo "Arquivos disponíveis:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          echo "Extraindo: $ZIP"
          mkdir -p projeto
          unzip -o "$ZIP" -d projeto

          echo "Conteúdo extraído:"
          find projeto -maxdepth 3 -type f | head -100

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          if [ -f "projeto/gradlew" ]; then
            echo "Projeto encontrado na raiz."
            echo "PROJECT_DIR=projeto" >> "$GITHUB_ENV"
            exit 0
          fi

          GRADLEW=$(find projeto -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado dentro do ZIP."
            find projeto -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Projeto Android encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Dar permissão ao Gradle
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Compilar APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Procurar APK
        shell: bash
        run: |
          echo "APKs gerados:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

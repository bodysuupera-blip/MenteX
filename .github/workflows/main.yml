
name: CAO FUJAO 2.1 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 2.1
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Conferir projeto Cão Fujão
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Verificando arquivos..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/intro.png
          test -f app/src/main/java/com/caofujao/game/MainActivity.java

          grep -q "com.caofujao.game" app/build.gradle

          echo "Projeto Cão Fujão confirmado!"

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Conferir APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

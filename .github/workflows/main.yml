name: MENTEX V5.0 - Gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MENTEX-V5.0-PROJETO.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V5.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -e

          if [ -f "MENTEX-V5.0-PROJETO.zip" ]; then
            mkdir -p "$RUNNER_TEMP/mentex-project"
            unzip -o "MENTEX-V5.0-PROJETO.zip" \
              -d "$RUNNER_TEMP/mentex-project"
            ROOT="$RUNNER_TEMP/mentex-project"
          else
            ROOT="$GITHUB_WORKSPACE"
          fi

          SETTINGS=$(find "$ROOT" -type f \
            -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Não encontrei settings.gradle."
            echo "Confira se MENTEX-V5.0-PROJETO.zip está na raiz do repositório."
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Não encontrei app/build.gradle."
            find "$PROJECT" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT"

      - name: Criar Gradle Wrapper se necessário
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Criando Gradle Wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

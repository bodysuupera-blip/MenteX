
name: Gerar APK MENTEX V5.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar projeto MENTEX
        run: |
          echo "Procurando config.xml..."
          find . -name config.xml -type f
          if [ -f config.xml ] && [ -f www/index.html ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f MENTEX_NOVA_PLATAFORMA/config.xml ]; then
            echo "PROJECT_DIR=MENTEX_NOVA_PLATAFORMA" >> $GITHUB_ENV
          else
            echo "ERRO: Projeto Cordova não encontrado."
            exit 1
          fi

      - name: Instalar Cordova
        run: npm install -g cordova@12.0.0

      - name: Adicionar Android
        working-directory: MENTEX_NOVA_PLATAFORMA
        run: cordova platform add android@13.0.0

      - name: Compilar APK
        working-directory: MENTEX_NOVA_PLATAFORMA
        run: cordova build android --debug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-V5.1
          path: MENTEX_NOVA_PLATAFORMA/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

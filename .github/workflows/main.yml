
name: Labirinto de Fantasmas - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Localizar e extrair fonte
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -iname "Labirinto_de_Fantasmas_Fonte_Nova.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP da fonte não encontrado no repositório."
            exit 1
          fi

          mkdir -p appsource
          unzip -o "$ZIP" -d appsource

      - name: Localizar projeto
        run: |
          set -e
          PROJECT=$(find appsource -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json não encontrado."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Instalar dependências
        run: |
          cd "$PROJECT"
          npm install

      - name: Preparar Capacitor Android
        run: |
          cd "$PROJECT"
          npx cap sync android

      - name: Gerar APK
        run: |
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Labirinto-de-Fantasmas-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

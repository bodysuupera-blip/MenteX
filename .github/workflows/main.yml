
name: CAO FUJAO ANDROID NOVO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        run: |
          echo "Verificando arquivos..."
          ls -la

          if [ ! -f settings.gradle ]; then
            if [ ! -f app/build.gradle ]; then
              echo "ERRO: app/build.gradle não encontrado."
              find . -maxdepth 5 -type f
              exit 1
            fi

            cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CaoFujao"
          include ':app'
          EOF
          fi

          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/br/com/caofujao/game/MainActivity.java
          test -f app/src/main/assets/index.html

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verificar APK
        run: |
          mkdir -p resultado
          cp app/build/outputs/apk/debug/app-debug.apk resultado/CAO-FUJAO.apk
          test -s resultado/CAO-FUJAO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-ANDROID
          path: resultado/CAO-FUJAO.apk
          if-no-files-found: error
          

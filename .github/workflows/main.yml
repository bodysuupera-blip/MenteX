
name: NEXUS 350 - LOCALIZAR FONTE REAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Procurar fontes ZIP
        shell: bash
        run: |
          set -e

          echo "===== ZIPs ENCONTRADOS ====="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            -printf "%s bytes | %p\n" \
            | sort -n

          echo "===== PROCURAR ZIP DA FONTE ORIGINAL ====="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*FONTE*ORIGINAL*.zip" \
            -not -path "*/.git/*"

          echo "===== PROCURAR CONFIGURACOES DO PROJETO ====="

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "package.json" \
            -o -name "config.xml" \
            -o -name "capacitor.config.js" \
            -o -name "capacitor.config.json" \
            -o -name "build.gradle" \
            -o -name "settings.gradle" \
            -o -name "gradlew" \) \
            -not -path "*/.git/*" \
            -not -path "*/node_modules/*" \
            | head -n 200

      - name: Inspecionar ZIP da fonte original
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "NEXUS350_FONTE_ORIGINAL_SEM_MUDANCAS.zip" \
            -not -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Fonte original nao encontrada com esse nome."
            exit 0
          fi

          echo "===== ZIP SELECIONADO ====="
          echo "$ZIP"

          echo "===== CONTEUDO INTERNO ====="
          unzip -Z1 "$ZIP" | head -n 200

          echo "===== ARQUIVOS DE COMPILACAO DENTRO DO ZIP ====="
          unzip -Z1 "$ZIP" | grep -Ei \
            '(^|/)(package.json|config.xml|gradlew|build.gradle|settings.gradle|capacitor.config.*|AndroidManifest.xml)$' \
            | head -n 100 || true
            

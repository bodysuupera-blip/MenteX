name: Construir APK MENTEX Atualizado

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Construir APK MENTEX Atualizado
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Procurar ZIP corrigido
        shell: bash
        run: |
          echo "======================================"
          echo "PROCURANDO PROJETO MENTEX CORRIGIDO"
          echo "======================================"

          ZIP="MENTEX_ANDROID_ATUALIZADO_10_CORACOES_10_MOEDAS_ESCUDO_LOJA_CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado:"
            echo "$ZIP"
            echo ""
            echo "Arquivos disponíveis:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP" -d android_project

          echo ""
          echo "Projeto extraído com sucesso."

      - name: Encontrar projeto Gradle
        id: projeto
        shell: bash
        run: |
          echo "======================================"
          echo "PROCURANDO PROJETO GRADLE"
          echo "======================================"

          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo ""
            echo "Arquivos encontrados:"
            find android_project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar projeto MENTEX
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.projeto.outputs.project_dir }}"

          echo "======================================"
          echo "VERIFICANDO PROJETO"
          echo "======================================"

          echo "Diretório:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Arquivos principais:"

          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "AndroidManifest.xml" \
            -o -name "MainActivity.java" \
            -o -name "index.html" \) \
            -print

      - name: Mostrar atualização MENTEX
        shell: bash
        run: |
          echo "======================================"
          echo "ATUALIZAÇÃO MENTEX"
          echo "======================================"
          echo "❤️ 10 corações"
          echo "🪙 +10 moedas por resposta correta"
          echo "⭐ +10 pontos por resposta correta"
          echo "🛡️ Escudo na tela da fase"
          echo "🛒 Loja de moedas"
          echo "💳 Compra de moedas pelo Google Play"
          echo "======================================"

      - name: Construir APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.projeto.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "INICIANDO COMPILAÇÃO"
          echo "======================================"

          gradle clean assembleDebug --no-daemon

      - name: Procurar APK
        shell: bash
        run: |
          echo "======================================"
          echo "APK GERADO"
          echo "======================================"

          find android_project \
            -type f \
            -name "*.apk" \
            -print

      - name: Verificar se APK existe
        shell: bash
        run: |
          APK=$(find android_project \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-ATUALIZADO
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

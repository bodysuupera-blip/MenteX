
name: MENTEX V5.0 - Boas-vindas e Novo Ícone

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK MENTEX 5.0
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Instalar Android Build Tools
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Localizar e extrair MENTEX 5.0
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "MENTEX-5.0-Nova-Plataforma.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: MENTEX-5.0-Nova-Plataforma.zip não encontrado."
            echo "Coloque o ZIP na raiz do repositório."
            exit 1
          fi

          mkdir -p extraido
          unzip -o "$ZIP" -d extraido

          WWW_FILE=$(find extraido -type f -path "*/www/index.html" | head -n 1)

          if [ -z "$WWW_FILE" ]; then
            echo "ERRO: www/index.html não encontrado."
            exit 1
          fi

          echo "WWW=$(dirname "$WWW_FILE")" >> "$GITHUB_ENV"

      - name: Atualizar tela de boas-vindas
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          www = Path(os.environ["WWW"])
          html_file = www / "index.html"

          html = html_file.read_text(encoding="utf-8")

          start = html.find('<section id="openingFirst"')

          if start < 0:
              raise SystemExit("Tela openingFirst não encontrada.")

          end = html.find("</section>", start)

          if end < 0:
              raise SystemExit("Fim da tela inicial não encontrado.")

          end += len("</section>")

          novo = """
          <section id="openingFirst" class="opening-screen opening-first">
            <button type="button"
              class="mentex-welcome-button"
              onclick="showOpeningRules()"
              aria-label="Começar MENTEX">
              <img src="opening_screen.png" alt="Bem-vindo ao MENTEX">
            </button>
          </section>
          """

          html = html[:start] + novo + html[end:]

          css = """
          <style>
          #openingFirst.opening-first {
            padding: 0 !important;
            margin: 0 !important;
            width: 100% !important;
            height: 100dvh !important;
            min-height: 100vh !important;
            overflow: hidden !important;
            background: #003bce !important;
          }

          .mentex-welcome-button {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: #003bce !important;
            overflow: hidden !important;
          }

          .mentex-welcome-button img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            object-position: center !important;
          }
          </style>
          """

          if "</head>" not in html:
              raise SystemExit("Cabeçalho HTML não encontrado.")

          html = html.replace("</head>", css + "\n</head>", 1)

          html_file.write_text(html, encoding="utf-8")

          for asset in ["opening_screen.png", "mentex_icon.png"]:
              if not (www / asset).exists():
                  raise SystemExit(f"Imagem {asset} não encontrada.")

          print("Tela de boas-vindas atualizada.")

          PY

      - name: Criar aplicativo Android
        run: |
          cordova create mentex-build br.com.mentex.app MENTEX
          rm -rf mentex-build/www
          cp -r "$WWW" mentex-build/www

      - name: Configurar ícone do MENTEX
        working-directory: mentex-build
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("config.xml")
          xml = path.read_text(encoding="utf-8")

          # Corrige o nome da raiz e remove prefixos de namespace
          xml = re.sub(r'\bns0:', '', xml)
          xml = re.sub(r'\s+xmlns:ns0="[^"]+"', '', xml)

          # Remove declarações de ícones anteriores
          xml = re.sub(r'\s*<icon\b[^>]*/>', '', xml)

          # Insere o novo ícone antes do fechamento de widget
          if not re.search(r'<widget(?:\s|>)', xml):
              raise SystemExit("ERRO: tag widget não encontrada.")

          if '</widget>' not in xml:
              raise SystemExit("ERRO: fechamento de widget não encontrado.")

          xml = xml.replace(
              '</widget>',
              '  <icon src="www/mentex_icon.png" />\n</widget>',
              1
          )

          path.write_text(xml, encoding="utf-8")

          print("config.xml corrigido e ícone configurado.")
          PY

      - name: Adicionar plataforma Android
        working-directory: mentex-build
        run: cordova platform add android@14.0.1

      - name: Gerar APK
        working-directory: mentex-build
        run: cordova build android --debug

      - name: Preparar APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-final

          APK=$(find mentex-build/platforms/android -type f -name "*debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" apk-final/MENTEX-V5.0-ATUALIZADO.apk

          echo "APK preparado com sucesso."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.0-ATUALIZADO
          path: apk-final/MENTEX-V5.0-ATUALIZADO.apk
          retention-days: 30
          

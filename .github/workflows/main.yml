
name: MENTEX V4.7 - Atualizar Icone e Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: sudo apt-get update && sudo apt-get install -y unzip findutils

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e
          GRADLE_FILE=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Aplicar novo ícone MENTEX
        shell: bash
        run: |
          set -e
          if [ ! -f MENTEX-ICONE-MELHORADO.zip ]; then
            echo "ERRO: coloque MENTEX-ICONE-MELHORADO.zip na raiz do repositorio."
            exit 1
          fi

          mkdir -p /tmp/mentex-icon
          unzip -o MENTEX-ICONE-MELHORADO.zip -d /tmp/mentex-icon

          APP_DIR="$PROJECT_DIR/app"
          ICON_DIR="/tmp/mentex-icon/android/app/src/main/res"

          if [ ! -d "$APP_DIR/src/main/res" ]; then
            echo "ERRO: pasta de recursos Android não encontrada."
            exit 1
          fi

          if [ ! -d "$ICON_DIR" ]; then
            echo "ERRO: arquivos do ícone não encontrados no ZIP."
            exit 1
          fi

          cp -R "$ICON_DIR"/. "$APP_DIR/src/main/res/"
          echo "Novo ícone aplicado."

      - name: Gerar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-ATUALIZADO
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

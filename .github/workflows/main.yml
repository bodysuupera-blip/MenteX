name: MENTEX V4.6.4 - Preparar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Compilar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar ferramentas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # Procurar projeto diretamente no repositorio.
          FOUND="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -n "$FOUND" ]; then
            PROJECT_DIR="$(dirname "$FOUND")"
          fi

          # Se nao encontrou, procurar projetos dentro dos ZIPs.
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r ZIP_FILE; do
              [ -n "$ZIP_FILE" ] || continue

              DEST="$RUNNER_TEMP/mentex-$(basename "$ZIP_FILE" .zip)"
              mkdir -p "$DEST"

              echo "Extraindo: $ZIP_FILE"
              unzip -oq "$ZIP_FILE" -d "$DEST"

              FOUND="$(find "$DEST" \
                -type f \
                \( -name settings.gradle \
                -o -name settings.gradle.kts \) \
                -print -quit)"

              if [ -n "$FOUND" ]; then
                PROJECT_DIR="$(dirname "$FOUND")"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f -name '*.zip' \
                -not -path '*/.git/*' \
                -print
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Android nao encontrado."
            echo "O repositorio precisa conter o codigo-fonte Android,"
            echo "incluindo settings.gradle ou settings.gradle.kts."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Arquivo build.gradle nao encontrado na raiz do projeto."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" \
            "$GITHUB_WORKSPACE/dist/MENTEX-V4.6.4-APK.apk"

          test -s "$GITHUB_WORKSPACE/dist/MENTEX-V4.6.4-APK.apk"

          echo "APK gerado com sucesso."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: dist/MENTEX-V4.6.4-APK.apk
          if-no-files-found: error
          retention-days: 14

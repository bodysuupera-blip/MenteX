name: MENTEX V4.8 - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.8
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar ZIP V4.8
        shell: bash
        run: |
          ZIP="./MENTEX-V4.8-PERGUNTAS-SEM-ROLAGEM.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: O arquivo V4.8 não foi encontrado:"
            echo "$ZIP"
            echo ""
            echo "Arquivos ZIP disponíveis:"
            find . -maxdepth 2 -type f -name "*.zip"
            exit 1
          fi

          echo "ZIP correto encontrado:"
          echo "$ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mentex"
          mkdir -p "$RUNNER_TEMP/mentex"

          unzip -o "$ZIP_PATH" -d "$RUNNER_TEMP/mentex"

          echo "Projeto extraído."

      - name: Localizar projeto Android
        shell: bash
        run: |
          SETTINGS=$(find "$RUNNER_TEMP/mentex" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo "Conteúdo do ZIP:"
            find "$RUNNER_TEMP/mentex" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto Android encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Arquivos do projeto:"
          ls -la

      - name: Configurar Java 17
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "app/build.gradle" ]; then
            cat >> app/build.gradle <<'EOF'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
EOF
          fi

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Encontrar APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-V4.8.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-APK
          path: MENTEX-V4.8.apk
          if-no-files-found: error

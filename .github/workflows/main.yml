
name: CAO FUJAO - GERAR APK INDEPENDENTE

on:
  workflow_dispatch:
  push:
    paths:
      - 'cao-fujao-project/**'
      - 'CAO-FUJAO-ATUALIZADO.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar projeto independente
        shell: bash
        run: |
          if [ -f "cao-fujao-project/settings.gradle" ] || [ -f "cao-fujao-project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=cao-fujao-project" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERRO: Projeto Android do Cão Fujão não encontrado."
            exit 1
          fi

      - name: Aplicar atualização do jogo
        shell: bash
        run: |
          if [ -f "CAO-FUJAO-ATUALIZADO.zip" ]; then
            mkdir -p /tmp/cao-update
            unzip -o CAO-FUJAO-ATUALIZADO.zip -d /tmp/cao-update

            mkdir -p "$PROJECT_DIR/app/src/main/assets"

            cp /tmp/cao-update/cao-package/assets/index.html \
              "$PROJECT_DIR/app/src/main/assets/index.html"

            echo "Atualização do jogo aplicada."
          else
            echo "ERRO: CAO-FUJAO-ATUALIZADO.zip não encontrado."
            exit 1
          fi

      - name: Verificar projeto
        run: |
          test -f "$PROJECT_DIR/app/build.gradle" -o \
               -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Gerar APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK-ATUALIZADO
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          

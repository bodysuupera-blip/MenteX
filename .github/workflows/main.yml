name: MENTEX V4.10 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    env:
      ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Android User Home
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_USER_HOME/.android"
          echo "Android User Home:"
          echo "$ANDROID_USER_HOME"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Android SDK:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERRO: Android SDK não encontrado."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print 2>/dev/null | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "sdkmanager encontrado:"
          echo "$SDKMANAGER"

          if [ ! -d "$SDK/platforms/android-35" ]; then
            echo "Instalando Android Platform 35..."
            sudo "$SDKMANAGER" "platforms;android-35"
          fi

          if [ ! -d "$SDK/build-tools/35.0.0" ]; then
            echo "Instalando Android Build Tools 35.0.0..."
            sudo "$SDKMANAGER" "build-tools;35.0.0"
          fi

          if [ ! -d "$SDK/platform-tools" ]; then
            echo "Instalando Android Platform Tools..."
            sudo "$SDKMANAGER" "platform-tools"
          fi

          echo "Android SDK pronto."

      - name: Verificar estrutura do MENTEX
        shell: bash
        run: |
          set -e

          echo "Verificando arquivos..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mentex/app/MainActivity.java
          test -f app/src/main/assets/index.html

          echo ""
          echo "========================================"
          echo "PROJETO MENTEX ENCONTRADO"
          echo "========================================"

          echo ""
          echo "settings.gradle:"
          ls -lh settings.gradle

          echo ""
          echo "app:"
          ls -la app

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar Java e Gradle
        shell: bash
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"
          gradle --version

      - name: Compilar APK MENTEX
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "COMPILANDO MENTEX V4.10"
          echo "========================================"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROCURANDO APK"
          echo "========================================"

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: APK não foi gerado."
            echo ""
            echo "Arquivos encontrados:"
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          mkdir -p apk

          cp "$APK" apk/MENTEX-V4.10.apk

          echo ""
          echo "APK preparado:"
          ls -lh apk/MENTEX-V4.10.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.10-APK
          path: apk/MENTEX-V4.10.apk
          if-no-files-found: error

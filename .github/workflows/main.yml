
name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Procurar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/mentex-extraido

          find "$GITHUB_WORKSPACE" -type f -name '*.zip' \
            -not -path '*/.git/*' -print0 |
          while IFS= read -r -d '' arquivo; do
            destino="/tmp/mentex-extraido/$(basename "${arquivo%.zip}")"
            mkdir -p "$destino"
            echo "Extraindo: $arquivo"
            unzip -oq "$arquivo" -d "$destino" || true
          done

          PROJECT=""

          for raiz in "$GITHUB_WORKSPACE" /tmp/mentex-extraido; do
            while IFS= read -r gradlew; do
              pasta="$(dirname "$gradlew")"

              if [[ -f "$pasta/settings.gradle" ||
                    -f "$pasta/settings.gradle.kts" ]]; then
                if [[ -f "$pasta/gradle/wrapper/gradle-wrapper.properties" ]]; then
                  PROJECT="$pasta"
                  break
                fi
              fi
            done < <(
              find "$raiz" -type f -name gradlew \
                -not -path '*/.git/*' 2>/dev/null
            )

            [[ -n "$PROJECT" ]] && break
          done

          if [[ -z "$PROJECT" ]]; then
            echo "ERRO: Projeto Android original não encontrado."
            echo "Arquivos encontrados no repositório:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
              | head -200
            echo "É necessário o projeto original com Gradle Wrapper."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT"

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
          

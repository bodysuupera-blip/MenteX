name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          ZIP="./MENTEX_Android_3_9_2_5_CORACOES_SEM_CRASH.zip"

          echo "======================================"
          echo "        VERIFICANDO MENTEX 3.9.2"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado:"
            echo "$ZIP"
            echo ""
            echo "Arquivos ZIP encontrados no repositório:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      - name: Extrair MENTEX 3.9.2
        shell: bash
       

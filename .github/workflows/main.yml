
name: BRIGA DE BAR - DUELO DA PAQUERA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar ZIP do jogo
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -type f -iname 'Briga_de_Bar_Duelo_da_Paquera_Projeto.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ZIP do Briga de Bar nao encontrado."
            find . -type f -iname '*.zip'
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK nao encontrado."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/briga-de-bar"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/briga-de-bar"

          PROJECT=$(find "$RUNNER_TEMP/briga-de-bar" -type f -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json nao encontrado."
            find "$RUNNER_TEMP/briga-de-bar" -maxdepth 4 -type f
            exit 1
          fi

          test -f "$PROJECT/www/index.html"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"
          npm install
          npm install @capacitor/android@^6.2.0
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK nao foi gerado."
            find "$PROJECT/android" -type f -name '*.apk' || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: BRIGA-DE-BAR-DUELO-DA-PAQUERA-APK
          path: ${{ runner.temp }}/briga-de-bar/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

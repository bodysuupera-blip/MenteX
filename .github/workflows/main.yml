name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "=== LOCALIZANDO PROJETO ==="

          if [ -f "settings.gradle" ]; then
            PROJECT_DIR="$PWD"

          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$PWD"

          else
            ZIP=$(find . -type f -name "*.zip" | head -1 || true)

            if [ -z "$ZIP" ]; then
              echo "ERRO: nenhum projeto ou ZIP encontrado."
              find . -maxdepth 4 -type f | sort
              exit 1
            fi

            echo "ZIP encontrado:"
            echo "$ZIP"

            rm -rf /tmp/mentex
            mkdir -p /tmp/mentex

            unzip -o "$ZIP" -d /tmp/mentex

            SETTINGS=$(find /tmp/mentex -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "ERRO: settings.gradle não encontrado dentro do ZIP."
              find /tmp/mentex -maxdepth 5 -type f | sort
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "PROJETO:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          echo "=== VERIFICANDO PROJETO MENTEX ==="

          test -d "$PROJECT_DIR/app"

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "settings.gradle OK"
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "settings.gradle.kts OK"
          else
            echo "ERRO: settings.gradle não encontrado"
            exit 1
          fi

          if [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "build.gradle OK"
          elif [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "build.gradle.kts OK"
          else
            echo "ERRO: build.gradle não encontrado"
            exit 1
          fi

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo ""
          echo "================================"
          echo " PROJETO MENTEX ENCONTRADO"
          echo "================================"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== COMPILANDO MENTEX ==="

          gradle assembleDebug --stacktrace

          echo ""
          echo "=== APK GERADO ==="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

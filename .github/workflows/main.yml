
name: MENTEX V4.8 - Interface Moderna

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair obrigatoriamente o ZIP V4.8
        id: project
        shell: bash
        run: |
          set -e

          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 2 \
            -type f \
            -iname 'MENTEX-V4.8-INTERFACE-MODERNA.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP da interface moderna não encontrado."
            echo "Envie MENTEX-V4.8-INTERFACE-MODERNA.zip para a raiz do GitHub."
            exit 1
          fi

          DEST="$RUNNER_TEMP/mentex-v48"
          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          PROJECT=$(find "$DEST" -type f \
            -path '*/app/src/main/assets/www/index.html' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: index.html da versão V4.8 não encontrado."
            exit 1
          fi

          ASSETS="$PROJECT"
          APP_DIR="${ASSETS%/src/main/assets/www}"
          ROOT_DIR="${APP_DIR%/app}"

          if [ ! -f "$ROOT_DIR/settings.gradle" ] || \
             [ ! -f "$APP_DIR/build.gradle" ]; then
            echo "ERRO: arquivos Gradle da V4.8 não encontrados."
            exit 1
          fi

          if ! grep -q 'Interface Moderna' "$ASSETS/index.html"; then
            echo "ERRO: o index.html não corresponde à interface V4.8."
            exit 1
          fi

          echo "Projeto V4.8 confirmado: $ROOT_DIR"
          echo "dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd "$RUNNER_TEMP"
            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o android-tools.zip

            mkdir -p android-tools
            unzip -oq android-tools.zip -d android-tools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -a android-tools/cmdline-tools/. \
              "$SDK/cmdline-tools/latest/"
          fi

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK V4.8
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verificar APK gerado
        shell: bash
        run: |
          APK="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-INTERFACE-MODERNA
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

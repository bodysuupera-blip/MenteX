name: MENTEX - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair ZIPs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/mentex-zips

          while IFS= read -r -d '' ZIP; do
            DEST="/tmp/mentex-zips/$(basename "$ZIP" .zip)"
            mkdir -p "$DEST"

            echo "Extraindo: $ZIP"
            unzip -oq "$ZIP" -d "$DEST"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f -name '*.zip' \
              -not -path '*/.git/*' \
              -print0
          )

      - name: Encontrar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          # Prioriza projetos presentes no repositório.
          for BASE in "$GITHUB_WORKSPACE" /tmp/mentex-zips; do
            while IFS= read -r -d '' SETTINGS; do
              ROOT="$(dirname "$SETTINGS")"

              if [[ -f "$ROOT/app/build.gradle" ||
                    -f "$ROOT/app/build.gradle.kts" ]]; then
                FOUND="$ROOT"
                break 2
              fi
            done < <(
              find "$BASE" -type f \
                \( -name settings.gradle \
                   -o -name settings.gradle.kts \) \
                -not -path '*/.git/*' \
                -not -path '*/build/*' \
                -print0 2>/dev/null
            )
          done

          if [[ -z "$FOUND" ]]; then
            echo "::error::Projeto Android completo não encontrado."
            echo "É necessário incluir settings.gradle e o módulo app."
            echo "Arquivos Gradle encontrados:"
            find "$GITHUB_WORKSPACE" /tmp/mentex-zips \
              -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \
                 -o -name build.gradle \
                 -o -name build.gradle.kts \) \
              -not -path '*/.git/*' \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "Projeto selecionado: $FOUND"
          echo "PROJECT_DIR=$FOUND" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ ! -f gradlew ]]; then
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon

      - name: Localizar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          APK=""

          while IFS= read -r -d '' FILE; do
            if [[ "$FILE" == */debug/*.apk ]]; then
              APK="$FILE"
              break
            fi
          done < <(
            find "$PROJECT_DIR" \
              -type f -path '*/build/outputs/apk/*/*.apk' \
              -print0
          )

          if [[ -z "$APK" ]]; then
            echo "::error::Nenhum APK foi gerado."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/MENTEX.apk"

          echo "APK encontrado: $APK"
          ls -lh "$GITHUB_WORKSPACE/apk-final/MENTEX.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: apk-final/MENTEX.apk
          if-no-files-found: error
          retention-days: 7
          

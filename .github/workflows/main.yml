name: MENTEX V4.6.4 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extrair e compilar MENTEX
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar ZIP com projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p projeto

          ZIP_ESCOLHIDO=""

          for ZIP in \
            "MENTEX-V4.6.4.zip" \
            "MENTEX-V4.6-ATUALIZADO.zip" \
            "MENTEX-V4.6-CORRETO-ATUALIZACAO.zip" \
            "MENTEX-V4.6-GITHUB-PRONTO.zip"; do

            if [ -f "$ZIP" ] && \
               unzip -Z1 "$ZIP" | grep -Eq '(^|/)gradlew$'; then
              ZIP_ESCOLHIDO="$ZIP"
              break
            fi
          done

          if [ -z "$ZIP_ESCOLHIDO" ]; then
            while IFS= read -r ZIP; do
              if unzip -Z1 "$ZIP" 2>/dev/null |
                 grep -Eq '(^|/)gradlew$'; then
                ZIP_ESCOLHIDO="$ZIP"
                break
              fi
            done < <(find . -maxdepth 1 -type f \
              -iname '*.zip' | sort)
          fi

          if [ -z "$ZIP_ESCOLHIDO" ]; then
            echo "::error::Nenhum ZIP contém gradlew."
            echo "É necessário verificar a estrutura do código-fonte."
            exit 1
          fi

          echo "ZIP escolhido: $ZIP_ESCOLHIDO"
          unzip -q "$ZIP_ESCOLHIDO" -d projeto

          GRADLEW=$(find projeto -type f -name gradlew \
            | head -n 1 || true)

          if [ -z "$GRADLEW" ]; then
            echo "::error::Não encontrei gradlew após extrair o ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado no runner."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Compilar aplicativo
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Localizar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "::error::A compilação não gerou um APK."
            exit 1
          fi

          mkdir -p apk-final
          cp "$APK" apk-final/MENTEX-V4.6.4.apk
          ls -lh apk-final/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: apk-final/MENTEX-V4.6.4.apk
          if-no-files-found: error
          retention-days: 7

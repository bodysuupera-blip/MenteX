
name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX - Ícone e Acerto/Erro
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./MENTEX-ESTILO-ORIGINAL-MELHORADO-ICONE-NOVO.zip"
          DEST="$RUNNER_TEMP/mentex-original"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP do MENTEX não encontrado."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          PACKAGE=$(find "$DEST" -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "$PROJECT_DIR" > "$RUNNER_TEMP/project-dir.txt"

          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Instalar dependências
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR"

          test -f www/index.html
          test -f capacitor.config.json

          npm install
          npx cap add android
          npx cap sync android

      - name: Aplicar novo ícone MENTEX
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          SRC="$PROJECT_DIR/android-icon-res"
          DST="$PROJECT_DIR/android/app/src/main/res"

          echo "Aplicando ícones PNG..."

          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$DST/$density"

            if [ -f "$SRC/$density/ic_launcher.png" ]; then
              cp "$SRC/$density/ic_launcher.png" "$DST/$density/"
            else
              echo "Aviso: ícone PNG ausente em $density"
            fi

            if [ -f "$SRC/$density/ic_launcher_round.png" ]; then
              cp "$SRC/$density/ic_launcher_round.png" "$DST/$density/"
            fi
          done

          echo "Verificando ícone adaptativo..."

          if [ -f "$SRC/drawable-nodpi/mentex_icon_foreground.png" ]; then
            mkdir -p "$DST/mipmap-anydpi-v26"
            mkdir -p "$DST/drawable-nodpi"
            mkdir -p "$DST/values"

            cp "$SRC/drawable-nodpi/mentex_icon_foreground.png" \
              "$DST/drawable-nodpi/"

            if [ -f "$SRC/values/colors.xml" ]; then
              cp "$SRC/values/colors.xml" "$DST/values/"
            else
              cat > "$DST/values/mentex_icon_colors.xml" <<'EOF'
          <resources>
              <color name="mentex_icon_background">#061B55</color>
          </resources>
          EOF
            fi

            if [ -f "$SRC/mipmap-anydpi-v26/ic_launcher.xml" ]; then
              cp "$SRC/mipmap-anydpi-v26/ic_launcher.xml" \
                "$DST/mipmap-anydpi-v26/"
            else
              cat > "$DST/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/mentex_icon_background"/>
              <foreground android:drawable="@drawable/mentex_icon_foreground"/>
          </adaptive-icon>
          EOF
            fi

            if [ -f "$SRC/mipmap-anydpi-v26/ic_launcher_round.xml" ]; then
              cp "$SRC/mipmap-anydpi-v26/ic_launcher_round.xml" \
                "$DST/mipmap-anydpi-v26/"
            else
              cp "$DST/mipmap-anydpi-v26/ic_launcher.xml" \
                "$DST/mipmap-anydpi-v26/ic_launcher_round.xml"
            fi

            echo "Ícone adaptativo instalado."
          else
            echo "Aviso: sem imagem adaptativa; serão usados os ícones PNG."
          fi

          echo "Ícone MENTEX aplicado."

      - name: Verificar imagens de acerto e erro
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")

          test -s "$PROJECT_DIR/www/index.html"
          test -s "$PROJECT_DIR/www/brain_happy.png"
          test -s "$PROJECT_DIR/www/brain_sad.png"
          test -s "$PROJECT_DIR/www/mentex_icon.png"

          echo "Imagens verificadas."

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-ATUALIZADO.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-ATUALIZADO-APK
          path: MENTEX-ATUALIZADO.apk
          if-no-files-found: error
          

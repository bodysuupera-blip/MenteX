name: Compilar MENTEX V4.5 - Nova Interface

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Compilar MENTEX V4.5
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar ZIP NOVO
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFICANDO PROJETO MENTEX V4.5"
          echo "========================================"

          ZIP="MENTEX-V4.5-NOVA-REAÇÃO.zip"

          echo ""
          echo "Procurando:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERRO: O ZIP NOVO NÃO FOI ENCONTRADO."
            echo ""
            echo "Coloque exatamente este arquivo na raiz do GitHub:"
            echo "$ZIP"
            echo ""
            echo "Nenhum outro ZIP será utilizado."
            exit 1
          fi

          echo ""
          echo "ZIP NOVO ENCONTRADO:"
          echo "$ZIP"

          echo ""
          echo "Tamanho do arquivo:"
          ls -lh "$ZIP"

      - name: Extrair projeto NOVO
        shell: bash
        run: |
          set -e

          rm -rf mentex

          mkdir -p mentex

          unzip -o "MENTEX-V4.5-NOVA-REAÇÃO.zip" -d mentex

          echo ""
          echo "========================================"
          echo "PROJETO EXTRAÍDO"
          echo "========================================"

          find mentex -maxdepth 4 -type f | head -150

      - name: Encontrar projeto Android
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "PROCURANDO PROJETO ANDROID NOVO"
          echo "========================================"

          SETTINGS=$(find mentex -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERRO: settings.gradle NÃO encontrado."
            echo ""
            echo "O ZIP NOVO não contém um projeto Android Gradle válido."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "Projeto Android encontrado em:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Verificar nova interface
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo ""
          echo "========================================"
          echo "VERIFICANDO ARQUIVOS DA NOVA REAÇÃO"
          echo "========================================"

          echo ""
          echo "Arquivos brain encontrados:"

          find "$PROJECT_DIR" -type f \
            \( -iname "*brain*" -o -iname "*cerebro*" \) \
            -print || true

          echo ""
          echo "Arquivos de imagens encontrados:"

          find "$PROJECT_DIR" -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) \
            | head -100

      - name: Corrigir permissão do Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "gradlew configurado."
          else
            echo "gradlew não encontrado."
          fi

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK V4.5
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo ""
          echo "========================================"
          echo "COMPILANDO MENTEX V4.5"
          echo "========================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "PROCURANDO APK V4.5"
          echo "========================================"

          APK=$(find mentex -type f \
            \( -name "app-debug.apk" -o -name "*.apk" \) \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          mkdir -p resultado

          cp "$APK" "resultado/MENTEX-V4.5-NOVA-INTERFACE.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.5-NOVA-INTERFACE
          path: resultado/MENTEX-V4.5-NOVA-INTERFACE.apk
          if-no-files-found: error

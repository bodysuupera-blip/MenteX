
name: NEXUS 350 - APK DA FONTE ORIGINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verificar fonte original
        run: |
          set -e
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/game.js
          test -f www/style.css

          echo "FONTE NEXUS 350 CONFIRMADA"
          ls -lh www

      - name: Instalar dependencias
        run: npm install

      - name: Verificar arquivos do jogo
        run: |
          test -s www/index.html
          test -s www/game.js
          test -s www/style.css

      - name: Adicionar Android
        run: npx cap add android

      - name: Sincronizar jogo original
        run: npx cap sync android

      - name: Conferir arquivos copiados
        run: |
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/game.js
          test -f android/app/src/main/assets/public/style.css

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-APK-FONTE-ORIGINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

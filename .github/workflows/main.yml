name: MENTEX V4.7 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Compilar MENTEX V4.7
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK
        shell: bash
        run: |
          set -e

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERRO: Android SDK não encontrado."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Android SDK localizado com sucesso."

      - name: Aceitar licenças Android
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -e

          echo "Conteúdo da raiz:"
          ls -la

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERRO: settings.gradle não encontrado na raiz."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "ERRO: arquivo Gradle do módulo app não encontrado."
            exit 1
          fi

      - name: Instalar Gradle 8.7
        shell: bash
        run: |
          set -e

          curl -fL \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Verificar versão do Gradle
        shell: bash
        run: |
          set -e
          gradle --version

      - name: Compilar APK MENTEX V4.7
        shell: bash
        run: |
          set -e

          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

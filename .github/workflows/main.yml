name: MENTEX V4.8 - Compilador APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Procurar projeto Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO PROJETO ANDROID"
          echo "======================================"

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            ROOT=$(dirname "$SETTINGS")
            echo "Projeto encontrado diretamente em:"
            echo "$ROOT"
            echo "MENTEX_ROOT=$ROOT" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Nenhum projeto encontrado na raiz."

          ZIP=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "MENTEX*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP MENTEX foi encontrado."
            find . -maxdepth 2 -type f -not -path "./.git/*"
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          rm -rf projeto_android
          mkdir -p projeto_android

          unzip -q "$ZIP" -d projeto_android

          SETTINGS=$(find projeto_android \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: o ZIP não contém settings.gradle."
            echo "Conteúdo do ZIP:"
            find projeto_android -maxdepth 5 -type f
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Projeto Android encontrado:"
          echo "$ROOT"

          echo "MENTEX_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFICANDO PROJETO MENTEX"
          echo "======================================"

          echo "Pasta:"
          echo "$MENTEX_ROOT"

          if [ ! -f "$MENTEX_ROOT/settings.gradle" ] &&
             [ ! -f "$MENTEX_ROOT/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          if [ ! -f "$MENTEX_ROOT/build.gradle" ] &&
             [ ! -f "$MENTEX_ROOT/build.gradle.kts" ]; then
            echo "ERRO: build.gradle não encontrado."
            exit 1
          fi

          echo "Projeto Android OK."

      - name: Instalar Gradle
        shell: bash
        run: |
          set -e

          if [ -f "$MENTEX_ROOT/gradlew" ]; then
            chmod +x "$MENTEX_ROOT/gradlew"
          else
            cd "$RUNNER_TEMP"

            curl -L \
              -o gradle.zip \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip

            unzip -q gradle.zip

            echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$MENTEX_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$MENTEX_ROOT" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            find "$MENTEX_ROOT" -type f | grep -E '\.apk$' || true
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            "release/MENTEX-V4.8-ATUALIZADO.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.8-ATUALIZADO
          path: release/MENTEX-V4.8-ATUALIZADO.apk
          if-no-files-found: error

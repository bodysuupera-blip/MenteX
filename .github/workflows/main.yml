name: Gerar APK MENTEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "=== PROCURANDO ARQUIVO ZIP DO MENTEX ==="

          ZIP_FILE=""

          if [ -f "./MENTEX_Android_3_9_2_5_CORACOES_SEM_CRASH.zip" ]; then
            ZIP_FILE="./MENTEX_Android_3_9_2_5_CORACOES_SEM_CRASH.zip"
          elif [ -f "./MENTEX_Android_3_1_Nova_Tela_Inicial_CORRIGIDO.zip" ]; then
            ZIP_FILE="./MENTEX_Android_3_1_Nova_Tela_Inicial_CORRIGIDO.zip"
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -not -path "./.git/*" -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado."
            echo ""
            echo "Arquivos disponíveis:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP ENCONTRADO:"
          echo "$ZIP_FILE"

          echo ""
          echo "=== EXTRAINDO PROJETO ==="

          mkdir -p extracted_mentex

          unzip -o "$ZIP_FILE" -d extracted_mentex

          echo ""
          echo "=== PROCURANDO PROJETO ANDROID ==="

          PROJECT_DIR=$(find extracted_mentex \
            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: Projeto Android não encontrado depois de extrair o ZIP."
            echo ""
            echo "Conteúdo extraído:"
            find extracted_mentex -maxdepth 5 -type f -print
            exit 1
          fi

          echo ""
          echo "=== PROJETO ENCONTRADO ==="
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== PROJETO OK ==="
          echo ""
          echo "Diretório:"
          pwd

          echo ""
          echo "Arquivos:"
          ls -la

          echo ""

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERRO: arquivo Gradle do app não encontrado."
            exit 1
          fi

          echo "PROJETO ANDROID VALIDADO COM SUCESSO"

      - name: Preparar abertura do MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== PREPARANDO ABERTURA DO MENTEX ==="

          ASSETS_DIR="app/src/main/assets"

          mkdir -p "$ASSETS_DIR"

          echo ""
          echo "=== PROCURANDO IMAGENS ==="

          INTRO=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "intro_screen.png" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$INTRO" ]; then
            echo "AVISO: intro_screen.png não encontrada."
          else
            echo "Primeira imagem:"
            echo "$INTRO"
            cp "$INTRO" "$ASSETS_DIR/intro_screen.png"
          fi

          RULES=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "opening_screen.png" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$RULES" ]; then
            echo "AVISO: opening_screen.png não encontrada."
          else
            echo "Segunda imagem:"
            echo "$RULES"
            cp "$RULES" "$ASSETS_DIR/opening_screen.png"
          fi

          MUSIC=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "mentex_musica_inicio.wav" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$MUSIC" ]; then
            echo "AVISO: mentex_musica_inicio.wav não encontrada."
          else
            echo "Música:"
            echo "$MUSIC"
            cp "$MUSIC" "$ASSETS_DIR/mentex_musica_inicio.wav"
          fi

          echo ""
          echo "=== ASSETS DO MENTEX ==="

          ls -lh "$ASSETS_DIR" || true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verificar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== VERSÃO DO GRADLE ==="

          grad

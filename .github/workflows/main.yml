name: MENTEX V4.6.4 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Instalar pacotes Android
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado no Android SDK."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find . -type f -name gradlew \
            -not -path "*/.git/*" | head -n 1 || true)

          if [ -z "$FILE" ]; then
            echo "::error::Não encontrei gradlew. O código-fonte Android precisa estar no repositório."
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.4.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: apk-final/MENTEX-V4.6.4.apk
          if-no-files-found: error
          retention-days: 7

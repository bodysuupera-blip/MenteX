name: Gerar APK MENTEX

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Encontrar e extrair ZIP do MENTEX
        shell: bash
        run: |
          set -e

          echo "================================="
          echo " PROCURANDO ZIP DO MENTEX"
          echo "================================="

          ZIP=$(find . -maxdepth 2 -type f \
            -iname "MENTEX_Android*.zip" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP MENTEX encontrado."
            echo ""
            echo "Arquivos ZIP encontrados:"
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          echo "Extraindo ZIP..."

          unzip -o "$ZIP" -d /tmp/mentex

          echo "================================="
          echo " ZIP EXTRAÍDO"
          echo "================================="

          find /tmp/mentex -maxdepth 5 -type f | head -200

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          echo "================================="
          echo " PROCURANDO PROJETO ANDROID"
          echo "================================="

          SETTINGS=$(find /tmp/mentex \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo ""
            echo "Estrutura encontrada:"
            find /tmp/mentex -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper encontrado."
          else
            echo "Gradle Wrapper não encontrado."
            echo "Será usado o Gradle do GitHub Actions."
            gradle --version
          fi

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================="
          echo " VERIFICANDO PROJETO"
          echo "================================="

          echo "Diretório:"
          pwd

          echo ""
          echo "Arquivos:"
          find . -maxdepth 3 -type f | sort

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

      - name: Compilar APK MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================="
          echo " COMPILANDO MENTEX"
          echo "================================="

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          echo "================================="
          echo " PROCURANDO APK"
          echo "================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-3.9
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Concluído
        run: |
          echo "================================="
          echo " MENTEX APK GERADO COM SUCESSO"
          echo "================================="

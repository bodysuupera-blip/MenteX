
name: MENTEX - Gerar APK com Atualização

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Atualizar e Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas
        run: |
          npm install -g cordova
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Localizar projeto
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name config.xml \
            -not -path '*/platforms/*' \
            -not -path '*/node_modules/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: config.xml não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projeto: $PROJECT_DIR"

      - name: Aplicar atualização do MENTEX
        shell: bash
        run: |
          ZIP="MENTEX-ATUALIZACAO-PRONTA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: coloque o ZIP na raiz do repositório."
            exit 1
          fi

          mkdir -p /tmp/mentex-update
          unzip -o "$ZIP" -d /tmp/mentex-update

          SOURCE="/tmp/mentex-update/MENTEX-ATUALIZACAO-PRONTA/assets/public"
          DEST="$PROJECT_DIR/www"

          if [ ! -f "$SOURCE/index.html" ]; then
            echo "ERRO: index.html não encontrado no ZIP."
            exit 1
          fi

          mkdir -p "$DEST"
          cp -a "$SOURCE/." "$DEST/"

          echo "Atualização aplicada:"
          ls -la "$DEST"

      - name: Instalar dependências
        run: |
          cd "$PROJECT_DIR"

          if [ -f package.json ]; then
            npm install
          fi

      - name: Preparar Android
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d platforms/android ]; then
            cordova platform add android@14.0.1
          fi

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          cordova build android

      - name: Localizar APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/platforms/android" \
            -type f -name '*debug.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/MENTEX-ATUALIZADO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-ATUALIZADO
          path: resultado/MENTEX-ATUALIZADO.apk
          if-no-files-found: error

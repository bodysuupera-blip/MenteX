
name: NEXUS 350 - BOAS VINDAS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS350-BOAS-VINDAS-CHAVE-FUGA.zip'
      - '.github/workflows/nexus350.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Android SDK
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMAN" --licenses || true
          "$SDKMAN" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar ZIP
        run: |
          set -e
          ZIP="$(find "$GITHUB_WORKSPACE" -type f -name 'NEXUS350-BOAS-VINDAS-CHAVE-FUGA.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ZIP nao encontrado."
            exit 1
          fi

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_PATH" -d "$GITHUB_WORKSPACE/extracted"

          PACKAGE="$(find "$GITHUB_WORKSPACE/extracted" -type f -name package.json -not -path '*/node_modules/*' | head -n 1)"

          if [ -z "$PACKAGE" ]; then
            echo "package.json nao encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install

      - name: Instalar Capacitor Android
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install @capacitor/android@^7.0.0

      - name: Criar Android
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configurar orientacao horizontal
        run: |
          set -e
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest_path = sys.argv[1]
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("Application nao encontrada")

          launcher = None

          for activity in app.findall("activity"):
              for intent in activity.findall("intent-filter"):
                  actions = [
                      a.get(f"{{{android}}}name")
                      for a in intent.findall("action")
                  ]
                  categories = [
                      c.get(f"{{{android}}}name")
                      for c in intent.findall("category")
                  ]

                  if (
                      "android.intent.action.MAIN" in actions
                      and "android.intent.category.LAUNCHER" in categories
                  ):
                      launcher = activity
                      break

              if launcher is not None:
                  break

          if launcher is None:
              raise SystemExit("Activity principal nao encontrada")

          launcher.set(f"{{{android}}}screenOrientation", "landscape")
          launcher.set(f"{{{android}}}resizeableActivity", "false")

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          ET.parse(manifest_path)
          print("Tela horizontal configurada.")
          PY

      - name: Compilar APK
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar APK
        run: |
          set -e
          APK="$(find "$PROJECT_DIR/android" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK nao encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/resultado"
          cp "$APK" "$GITHUB_WORKSPACE/resultado/NEXUS350-BOAS-VINDAS.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-BOAS-VINDAS-APK
          path: resultado/NEXUS350-BOAS-VINDAS.apk
          if-no-files-found: error
          retention-days: 30
          

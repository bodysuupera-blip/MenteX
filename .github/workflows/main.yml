name: MENTEX V4.6.4 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Compilar MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos encontrados no repositório:"
          find . -maxdepth 3 -type f | head -200

          SETTINGS="$(find . \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Projeto Android não encontrado. O repositório precisa conter settings.gradle ou settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Projeto localizado em: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::O projeto não contém gradlew na pasta raiz do Gradle."
            exit 1
          fi

      - name: Compilar APK Debug
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.projeto.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verificar APK gerado
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.projeto.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -not -path '*/intermediates/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::A compilação terminou sem produzir um APK Debug."
            exit 1
          fi

          echo "APK gerado: $APK"
          ls -lh "$APK"

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          

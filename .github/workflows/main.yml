name: MENTEX V4.6 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          echo "Procurando projeto Android..."

          if [ -f "settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"

          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"

          elif [ -f "MENTEX-V4.6-REDONDO-TELA-INTEIRA-PRONTO.zip" ]; then
            echo "ZIP encontrado."

            rm -rf android-project
            mkdir -p android-project

            unzip -q "MENTEX-V4.6-REDONDO-TELA-INTEIRA-PRONTO.zip" -d android-project

            SETTINGS=$(find android-project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERRO: settings.gradle não encontrado dentro do ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"

          elif [ -f "MENTEX-V4.6-GITHUB-PRONTO.zip" ]; then
            echo "ZIP antigo encontrado."

            rm -rf android-project
            mkdir -p android-project

            unzip -q "MENTEX-V4.6-GITHUB-PRONTO.zip" -d android-project

            SETTINGS=$(find android-project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERRO: settings.gradle não encontrado."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"

          else
            echo "ERRO: Projeto Android não encontrado."

            echo "Arquivos disponíveis:"
            find . -maxdepth 2 -type f | sort

            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "================================"
          echo "PROJETO ENCONTRADO:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          echo "=== Conteúdo do projeto ==="
          ls -la "$PROJECT_DIR"

          echo ""
          echo "=== settings.gradle ==="
          ls -l "$PROJECT_DIR"/settings.gradle* || true

          echo ""
          echo "=== Módulo app ==="
          ls -la "$PROJECT_DIR/app"

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" \
            || test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Limpando projeto ==="
          gradle clean --no-daemon --stacktrace

          echo "=== Compilando APK Debug ==="
          gradle assembleDebug --no-daemon --stacktrace

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "APKs GERADOS:"
          echo "================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.apk"

          echo ""
          echo "APK preparado para download:"
          ls -lh "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.apk"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: apk-final/MENTEX-V4.6.apk
          if-no-files-found: error
          retention-days: 7

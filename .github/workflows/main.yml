
name: MENTEX V4.16 - Diagnosticar Projeto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: Verificar arquivos do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Examinar ZIP de Jogador e Perfil
        shell: bash
        run: |
          set -eu

          ZIP="MENTEX_ANDROID_FINAL_PERFIL_JOGADOR_RANKING_BUILD_CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP não encontrado: $ZIP"
            echo "Arquivos ZIP disponíveis:"
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          echo "===== CONTEÚDO DO ZIP ====="
          unzip -l "$ZIP" | head -250

          mkdir -p "$RUNNER_TEMP/mentex-diagnostico"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/mentex-diagnostico"

          echo "===== ARQUIVOS IMPORTANTES ====="
          find "$RUNNER_TEMP/mentex-diagnostico" \
            -type f \( \
              -name 'gradlew' -o \
              -name 'settings.gradle' -o \
              -name 'settings.gradle.kts' -o \
              -name 'build.gradle' -o \
              -name 'build.gradle.kts' -o \
              -name 'AndroidManifest.xml' -o \
              -name 'index.html' -o \
              -name '*.css' -o \
              -name 'package.json' \
            \) -print | head -250

          echo "===== FIM DO DIAGNÓSTICO ====="
          

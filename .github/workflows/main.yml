
name: NEXUS 350 - GERAR ZIP DO ICONE

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS350-ICON-ROUND.png'
      - '.github/workflows/nexus350-icone.yml'

permissions:
  contents: read

jobs:
  gerar-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Localizar icone
        run: |
          set -e

          ICON="$(find "$GITHUB_WORKSPACE" -type f -name 'NEXUS350-ICON-ROUND.png' | head -n 1)"

          if [ -z "$ICON" ]; then
            echo "Icone PNG nao encontrado."
            exit 1
          fi

          echo "ICON_PATH=$ICON" >> "$GITHUB_ENV"

      - name: Criar ZIP
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/resultado"

          cp "$ICON_PATH" "$GITHUB_WORKSPACE/resultado/NEXUS350-ICON-ROUND.png"

          cd "$GITHUB_WORKSPACE/resultado"

          zip -9 NEXUS350-ICON-ROUND.zip NEXUS350-ICON-ROUND.png

          unzip -t NEXUS350-ICON-ROUND.zip

          ls -lh NEXUS350-ICON-ROUND.zip

      - name: Publicar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-ICON-ROUND-ZIP
          path: resultado/NEXUS350-ICON-ROUND.zip
          if-no-files-found: error
          retention-days: 30
          

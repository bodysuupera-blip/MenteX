
name: NEXUS 350 - GERAR ICONE E ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-icone:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick zip

      - name: Criar icone SVG
        run: |
          mkdir -p resultado

          cat > resultado/NEXUS350.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <radialGradient id="bg" cx="50%" cy="40%" r="70%">
                <stop offset="0%" stop-color="#35206e"/>
                <stop offset="100%" stop-color="#080714"/>
              </radialGradient>
              <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#b95cff"/>
                <stop offset="100%" stop-color="#00dcff"/>
              </linearGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fff58a"/>
                <stop offset="100%" stop-color="#ff9c00"/>
              </linearGradient>
            </defs>

            <circle cx="512" cy="512" r="500" fill="#090613"/>
            <circle cx="512" cy="512" r="475" fill="url(#bg)" stroke="url(#neon)" stroke-width="26"/>

            <path d="M180 720 L180 370 L310 370 L310 290 L710 290 L710 370 L840 370 L840 720"
                  fill="none" stroke="#7951ff" stroke-width="32" opacity="0.45"/>

            <path d="M280 720 L280 440 L430 440 L430 350 L600 350 L600 440 L750 440 L750 720"
                  fill="none" stroke="#00dfff" stroke-width="20" opacity="0.55"/>

            <g>
              <path d="M410 365 Q512 280 614 365 L650 540 Q512 610 374 540 Z"
                    fill="#e8e8ff" stroke="#7d70ff" stroke-width="18"/>
              <ellipse cx="465" cy="440" rx="30" ry="45" fill="#25204b"/>
              <ellipse cx="560" cy="440" rx="30" ry="45" fill="#25204b"/>
              <circle cx="475" cy="430" r="10" fill="#ffffff"/>
              <circle cx="570" cy="430" r="10" fill="#ffffff"/>
              <path d="M460 515 Q512 475 565 515" fill="none" stroke="#3c285e" stroke-width="22" stroke-linecap="round"/>
            </g>

            <g transform="rotate(-25 320 620)">
              <circle cx="320" cy="600" r="52" fill="none" stroke="url(#gold)" stroke-width="24"/>
              <path d="M365 600 L530 600 L530 635 L485 635 L485 670 L450 670 L450 635 L365 635"
                    fill="none" stroke="url(#gold)" stroke-width="25" stroke-linecap="round"/>
            </g>

            <text x="512" y="770" text-anchor="middle"
                  font-family="DejaVu Sans, sans-serif" font-size="120"
                  font-weight="900" fill="#00eaff" stroke="#11122e" stroke-width="15" paint-order="stroke">
              NEXUS
            </text>

            <text x="512" y="900" text-anchor="middle"
                  font-family="DejaVu Sans, sans-serif" font-size="170"
                  font-weight="900" fill="url(#gold)" stroke="#401d67" stroke-width="18" paint-order="stroke">
              350
            </text>
          </svg>
          SVG

      - name: Converter SVG em PNG
        run: |
          set -e

          convert -background none \
            resultado/NEXUS350.svg \
            -resize 1024x1024 \
            resultado/NEXUS350-ICON-ROUND.png

      - name: Criar ZIP
        run: |
          set -e
          cd resultado

          zip -9 NEXUS350-ICON-ROUND.zip \
            NEXUS350.svg \
            NEXUS350-ICON-ROUND.png

          unzip -t NEXUS350-ICON-ROUND.zip

      - name: Publicar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-ICON-ROUND
          path: |
            resultado/NEXUS350-ICON-ROUND.zip
            resultado/NEXUS350-ICON-ROUND.png
          if-no-files-found: error
          retention-days: 30
          

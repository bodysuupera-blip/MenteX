- name: Reconstruir APK com AAPT2
        shell: bash
        run: |
          set -euo pipefail

          java -jar "$RUNNER_TEMP/apktool.jar" b \
            "$RUNNER_TEMP/mentex/decoded" \
            --use-aapt2 \
            -o "$RUNNER_TEMP/mentex/rebuilt.apk"

          if [ ! -s "$RUNNER_TEMP/mentex/rebuilt.apk" ]; then
            echo "::error::O APK reconstruído está vazio."
            exit 1
          fi

      - name: Validar APK reconstruído
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$RUNNER_TEMP/mentex/rebuilt.apk"
          aapt dump badging "$RUNNER_TEMP/mentex/rebuilt.apk"

      - name: Assinar APK reconstruído
        shell: bash
        run: |
          set -euo pipefail

          apksigner sign \
            --ks "$RUNNER_TEMP/mentex/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$RUNNER_TEMP/mentex/rebuilt.apk"

          apksigner verify --verbose "$RUNNER_TEMP/mentex/rebuilt.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: mentex-apk
          path: ${{ runner.temp }}/mentex/rebuilt.apk

Mantenha as etapas de assinatura e publicação depois dessas duas etapas.

Depois, execute novamente

1. Salve o arquivo no GitHub.
2. Abra Actions e execute o workflow.
3. Se falhar em Validar APK reconstruído, envie o log dessa etapa.
4. Se passar, baixe o novo artefato e tente instalar.

Importante: ainda precisamos confirmar que o APK contém a nova tela de perguntas e preserva a animação do cérebro. Não desinstale o jogo antigo até termos um APK que passe na validação e possa ser instalado.

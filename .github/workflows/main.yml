
name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cao-fujao:
    name: Compilar somente Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Preparar somente Cão Fujão
        run: |
          set -Eeuo pipefail

          ZIP="$GITHUB_WORKSPACE/Cao_Fujao_ATUALIZADO_GOOGLE_PLAY.zip"
          DEST="$RUNNER_TEMP/build-cao-fujao"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP exclusivo do Cão Fujão não encontrado."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          PROJECT=$(find "$DEST" -name settings.gradle -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: Projeto Cão Fujão não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/java/com/caofujao/game/MainActivity.java"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto isolado encontrado: $PROJECT_DIR"

      - name: Compilar Cão Fujão
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean :app:assembleDebug

      - name: Preparar APK exclusivo
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p "$GITHUB_WORKSPACE/resultado-cao-fujao"

          cp "$APK" \
            "$GITHUB_WORKSPACE/resultado-cao-fujao/CAO-FUJAO-ATUALIZADO.apk"

      - name: Publicar APK Cão Fujão
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK-EXCLUSIVO
          path: resultado-cao-fujao/CAO-FUJAO-ATUALIZADO.apk
          if-no-files-found: error
          


name: LABIRINTO MORTAL - Gerar APK 2.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL 2.2
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto V2.2
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$GITHUB_WORKSPACE/LABIRINTO-MORTAL-V2.2-SEM-CHIADO-3D-ILUSTRADO.zip"

          if [[ ! -f "$ZIP" ]]; then
            echo "ERRO: ZIP V2.2 não encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/labirinto-v22"

          unzip -oq "$ZIP" -d "$RUNNER_TEMP/labirinto-v22"

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            if [[ -f "$DIR/app/build.gradle" ]]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find "$RUNNER_TEMP/labirinto-v22" -name settings.gradle -type f)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERRO: Projeto Android não encontrado no ZIP."
            find "$RUNNER_TEMP/labirinto-v22" -maxdepth 6 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -Eeuo pipefail

          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK gerado com sucesso:"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-V2.2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

name: MENTEX V4.6 - Compilar APK Atualizado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Verificar projeto
        run: |
          echo "Arquivos do projeto:"
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Compilar APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verificar APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK gerado com sucesso:"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-ATUALIZADO
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

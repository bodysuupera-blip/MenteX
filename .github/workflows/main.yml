name: MENTEX V4.7 - Preparar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Preparar APK para download
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar e validar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . -type f -iname '*.apk' \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Nenhum arquivo APK encontrado no repositório."
            exit 1
          fi

          echo "APK encontrado: $APK"

          mkdir -p "$RUNNER_TEMP/mentex-saida"
          cp "$APK" "$RUNNER_TEMP/mentex-saida/MENTEX-V4.7.apk"

          if [ ! -s "$RUNNER_TEMP/mentex-saida/MENTEX-V4.7.apk" ]; then
            echo "::error::O APK copiado está vazio."
            exit 1
          fi

          file "$RUNNER_TEMP/mentex-saida/MENTEX-V4.7.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK
          path: ${{ runner.temp }}/mentex-saida/MENTEX-V4.7.apk
          if-no-files-found: error
          retention-days: 7

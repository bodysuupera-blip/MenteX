name: Gerar APK MENTEX 3.7

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar projeto MENTEX 3.7
        run: |
          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          ZIP="./MENTEX_Android_3_7_Entrada_Garantida.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado na raiz do repositório."
            exit 1
          fi

          unzip -o "$ZIP" -d /tmp/mentex

          PROJECT_DIR=$(find /tmp/mentex -type f -name "settings.gradle*" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== ESTRUTURA DO PROJETO ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort | head -150

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Dar permissão ao Gradle
        run: |
          find "$PROJECT_DIR" -name "gradlew" -exec chmod +x {} \;

      - name: Verificar projeto Android
        run: |
          cd "$PROJECT_DIR"

          echo "=== PROJETO ANDROID ==="
          pwd

          echo "=== ARQUIVOS ==="
          find . -maxdepth 3 -type f | sort

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          echo "Projeto Android OK."

      - name: Compilar APK Debug
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Compilar AAB Release
        run: |
          cd "$PROJECT_DIR"
          gradle bundleRelease --stacktrace

      - name: Verificar APK e AAB
        run: |
          echo "=== APK GERADO ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

          echo "=== AAB GERADO ==="
          find "$PROJECT_DIR" -type f -name "*.aab" -print

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-3.7-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-3.7-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

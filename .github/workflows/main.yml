name: MENTEX V4.6 - Preparar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Preparar MENTEX V4.6
    runs-on: ubuntu-latest

    steps:

      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO APK DO MENTEX"
          echo "======================================"

          APK=$(find . \
            -type f \
            -iname "*.apk" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERRO: APK não encontrado."
            echo ""
            echo "Coloque o arquivo APK dentro do repositório."
            echo ""
            echo "Arquivos existentes:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK"
          echo ""

          mkdir -p saida

          cp "$APK" \
            "saida/MENTEX-V4.6-COMPACTO.apk"

          echo "Arquivo preparado:"
          ls -lh "saida/MENTEX-V4.6-COMPACTO.apk"

      - name: Criar informações da versão
        shell: bash
        run: |
          cat > saida/INFO.txt <<'EOF'
          MENTEX V4.6

          Arquivo:
          MENTEX-V4.6-COMPACTO.apk

          Esta versão foi preparada a partir do APK existente.
          EOF

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-COMPACTO
          path: |
            saida/MENTEX-V4.6-COMPACTO.apk
            saida/INFO.txt
          if-no-files-found: error
          retention-days: 30
          

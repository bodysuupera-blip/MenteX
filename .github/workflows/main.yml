
name: MenteX - Gerar APK Atualizado

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          DIR=""

          for FILE in settings.gradle settings.gradle.kts; do
            FOUND=$(find . -type f -name "$FILE" \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' | head -n 1)

            if [ -n "$FOUND" ]; then
              DIR=$(dirname "$FOUND")
              break
            fi
          done

          if [ -z "$DIR" ]; then
            echo "::error::Projeto Gradle não encontrado. Verifique se o código-fonte Android está no repositório."
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.dir }}"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Preparar ZIP
        shell: bash
        run: |
          mkdir -p release

          find . -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -exec cp {} release/ \;

          if [ -z "$(ls -A release)" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          cd release
          zip -j ../MENTEX-V4.18-ATUALIZADO.zip *.apk

      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.18-ATUALIZADO
          path: MENTEX-V4.18-ATUALIZADO.zip
          if-no-files-found: error
          

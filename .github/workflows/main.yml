
name: CAO FUJAO - GERAR APK INDEPENDENTE

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/cao-fujao.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar projeto Android
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/caofujao/game/MainActivity.java

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK-500-FASES
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          

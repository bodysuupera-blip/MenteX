name: Compilar MENTEX V4.6.4 Android Atualizado

on:
  workflow_dispatch:
  push:
    paths:
      - "MENTEX-V4.6.4-ANDROID-PROJETO-CORRIGIDO.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MENTEX-V4.6.4-ANDROID-PROJETO-CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP do projeto Android não encontrado: $ZIP"
            exit 1
          fi

          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

          if [ ! -f projeto/settings.gradle ] &&
             [ ! -f projeto/settings.gradle.kts ]; then
            echo "::error::settings.gradle ou settings.gradle.kts não encontrado na raiz extraída."
            find projeto -maxdepth 3 -type f | head -100
            exit 1
          fi

          if [ ! -f projeto/gradlew ]; then
            echo "::warning::Gradle Wrapper não encontrado; será usado o Gradle instalado."
          else
            chmod +x projeto/gradlew
          fi

      - name: Verificar arquivos de interface
        shell: bash
        run: |
          set -euo pipefail
          find projeto -type f \( \
            -name "index.html" -o \
            -name "brain_happy.png" -o \
            -name "brain_neutral.png" -o \
            -name "brain_sad.png" \
          \) -print

      - name: Compilar APK Debug
        shell: bash
        run: |
          set -euo pipefail
          cd projeto

          if [ -f gradlew ]; then
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

          APK="$(find app/build/outputs/apk/debug \
            -maxdepth 1 -name '*.apk' -print -quit)"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK Debug não foi gerado."
            exit 1
          fi

          echo "APK gerado: $APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: projeto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

name: Compilador MENTEX V4.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos do repositorio:"
          ls -la

          ZIP="MENTEX-V4.6-CEREBRO-PERGUNTA-ACERTO-ERRO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP nao encontrado:"
            echo "$ZIP"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf projeto
          mkdir -p projeto

          echo "Extraindo ZIP..."
          unzip -o "$ZIP" -d projeto

          echo "Conteudo extraido:"
          find projeto -maxdepth 5 -type f | sort

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          if [ -f "projeto/mentex/settings.gradle" ]; then
            PROJECT_DIR="projeto/mentex"

          elif [ -f "projeto/mentex/settings.gradle.kts" ]; then
            PROJECT_DIR="projeto/mentex"

          else
            SETTINGS=$(find projeto -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "ERRO: settings.gradle nao encontrado."
              find projeto -maxdepth 6 -type f | sort
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "Projeto Android:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Diretorio:"
          pwd

          echo "Arquivos:"
          ls -la

      - name: Compilar APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Compilando MENTEX V4.6..."

          gradle assembleDebug --stacktrace

      - name: Procurar APK
        shell: bash
        run: |
          echo "APKs gerados:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

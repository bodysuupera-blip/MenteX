name: Compilar MENTEX V4.6 - Cérebro Reações

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " MENTEX V4.6 - CÉREBRO / REAÇÕES"
          echo "========================================"

          echo "Arquivos ZIP encontrados:"
          find . -maxdepth 3 -type f -iname "*.zip" -print

          ZIP=$(find . -maxdepth 3 -type f \
            -iname "MENTEX-V4.6-CEREBRO-PERGUNTA-ACERTO-ERRO.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do MENTEX V4.6 não encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf mentex-projeto
          mkdir -p mentex-projeto

          unzip -o "$ZIP" -d mentex-projeto

          SETTINGS=$(find mentex-projeto \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "$PROJECT_DIR" > project_dir.txt

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "Compilando projeto..."
          echo "Diretório: $PWD"

          chmod +x ./gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p resultado

          cp "$APK" \
            resultado/MENTEX-V4.6-CEREBRO-PERGUNTA-ACERTO-ERRO.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-CEREBRO-PERGUNTA-ACERTO-ERRO
          path: resultado/MENTEX-V4.6-CEREBRO-PERGUNTA-ACERTO-ERRO.apk
          if-no-files-found: error

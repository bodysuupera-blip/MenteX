name: MENTEX V4.9 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. BAIXAR O REPOSITÓRIO
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. CONFIGURAR JAVA 17
      # =========================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. PREPARAR ANDROID SDK
      # =========================================================

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PREPARANDO ANDROID SDK"
          echo "======================================"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID SDK:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo ""
            echo "ERRO: Android SDK não encontrado."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print 2>/dev/null | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo ""
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          echo ""
          echo "======================================"
          echo "ANDROID PLATFORMS EXISTENTES"
          echo "======================================"

          ls -la "$SDK/platforms" 2>/dev/null || true

          echo ""
          echo "======================================"
          echo "ANDROID BUILD TOOLS EXISTENTES"
          echo "======================================"

          ls -la "$SDK/build-tools" 2>/dev/null || true

          echo ""
          echo "======================================"
          echo "ACEITANDO LICENÇAS"
          echo "======================================"

          yes | sudo "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo ""
          echo "======================================"
          echo "INSTALANDO COMPONENTES"
          echo "======================================"

          sudo "$SDKMANAGER" "platform-tools" || true

          sudo "$SDKMANAGER" "platforms;android-35" || true

          sudo "$SDKMANAGER" "build-tools;35.0.0" || true

          echo ""
          echo "ANDROID SDK PREPARADO."


      # =========================================================
      # 4. LOCALIZAR O ZIP DO MENTEX
      # =========================================================

      - name: Localizar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO PROJETO MENTEX"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/projeto"

          ZIP=""

          while IFS= read -r arquivo; do

            echo ""
            echo "Verificando:"
            echo "$arquivo"

            if unzip -l "$arquivo" 2>/dev/null | \
              grep -Eq '(^|/)(settings\.gradle|settings\.gradle\.kts)$'
            then
              ZIP="$arquivo"
              break
            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print
          )

          if [ -z "$ZIP" ]; then

            echo ""
            echo "======================================"
            echo "ERRO: PROJETO ANDROID NÃO ENCONTRADO"
            echo "======================================"

            echo ""
            echo "ZIPs encontrados no repositório:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print

            echo ""
            echo "Conteúdo do repositório:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -print \
              | head -200

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "ZIP DO MENTEX ENCONTRADO"
          echo "======================================"

          echo "$ZIP"

          rm -rf "$GITHUB_WORKSPACE/projeto"

          mkdir -p "$GITHUB_WORKSPACE/projeto"

          unzip -q "$ZIP" \
            -d "$GITHUB_WORKSPACE/projeto"

          echo ""
          echo "======================================"
          echo "PROCURANDO settings.gradle"
          echo "======================================"

          SETTINGS=$(find "$GITHUB_WORKSPACE/projeto" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS" ]; then

            echo ""
            echo "ERRO: settings.gradle não encontrado dentro do ZIP."

            echo ""
            echo "Conteúdo extraído:"

            find "$GITHUB_WORKSPACE/projeto" \
              -maxdepth 8 \
              -type f \
              -print \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "======================================"
          echo "PROJETO ANDROID ENCONTRADO"
          echo "======================================"

          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" \
            > "$GITHUB_WORKSPACE/project_dir.txt"


      # =========================================================
      # 5. CONFIGURAR GRADLE
      # =========================================================

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # =========================================================
      # 6. VERIFICAR PROJETO
      # =========================================================

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "======================================"
          echo "VERIFICANDO PROJETO"
          echo "======================================"

          echo ""
          echo "Diretório:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Arquivos:"

          ls -la "$PROJECT_DIR"

          echo ""

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then

            echo "ERRO: settings.gradle não encontrado."

            exit 1
          fi

          echo "Projeto Android OK."


      # =========================================================
      # 7. COMPILAR APK
      # =========================================================

      - name: Compilar APK MENTEX
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COMPILANDO MENTEX"
          echo "======================================"

          echo ""
          echo "Java:"
          java -version

          echo ""

          echo "Gradle:"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          fi


      # =========================================================
      # 8. PROCURAR APK GERADO
      # =========================================================

      - name: Encontrar APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "======================================"
          echo "PROCURANDO APK"
          echo "======================================"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo ""
            echo "======================================"
            echo "ERRO: APK NÃO ENCONTRADO"
            echo "======================================"

            echo ""
            echo "Arquivos encontrados:"

            find "$PROJECT_DIR" \
              -type f \
              | grep -E '\.(apk|aab)$' \
              || true

            echo ""
            echo "Diretórios de build:"

            find "$PROJECT_DIR" \
              -type d \
              -name "build" \
              -print \
              || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK ENCONTRADO"
          echo "======================================"

          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/MENTEX-V4.9.apk"

          echo ""
          echo "APK COPIADO COM SUCESSO."


      # =========================================================
      # 9. PUBLICAR APK
      # =========================================================

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.9-APK
          path: apk/MENTEX-V4.9.apk
          if-no-files-found: error

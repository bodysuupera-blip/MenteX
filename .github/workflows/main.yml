      - name: Instalar ferramentas atualizadas
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y zip python3-pil curl jq

          URL=$(curl -fsSL \
            https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
            | jq -r '.assets[]
              | select(.name | test("^apktool_[0-9.]+\\.jar$"))
              | .browser_download_url' \
            | head -n 1)

          if [ -z "$URL" ]; then
            echo "::error::Nao foi possivel encontrar o Apktool atualizado."
            exit 1
          fi

          curl -fL "$URL" -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

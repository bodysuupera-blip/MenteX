name: MENTEX V4.6.3 - Preparar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-apk:
    name: Preparar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Localizar e extrair APK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/mentex-extraido"
          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          echo "Procurando arquivos ZIP..."

          mapfile -d '' arquivos < <(
            find . -maxdepth 5 -type f \
              -iname '*.zip' \
              ! -path './.git/*' \
              -print0
          )

          if [ "${#arquivos[@]}" -eq 0 ]; then
            echo "::error::Nenhum arquivo ZIP encontrado no repositório."
            echo "Envie o ZIP do MENTEX para o repositório e tente novamente."
            exit 1
          fi

          encontrado=""

          for arquivo in "${arquivos[@]}"; do
            echo "Verificando: $arquivo"

            if unzip -tq "$arquivo" >/dev/null 2>&1; then
              if unzip -Z1 "$arquivo" |
                grep -Eiq '(^|/)MENTEX[^/]*\.apk$|(^|/)[^/]+\.apk$'; then
                encontrado="$arquivo"
                break
              fi
            fi
          done

          if [ -z "$encontrado" ]; then
            echo "::error::Nenhum APK foi encontrado dentro dos ZIPs."
            exit 1
          fi

          echo "ZIP selecionado: $encontrado"

          unzip -oq "$encontrado" \
            -d "$RUNNER_TEMP/mentex-extraido"

          apk=""

          while IFS= read -r -d '' candidato; do
            apk="$candidato"
            break
          done < <(
            find "$RUNNER_TEMP/mentex-extraido" \
              -type f -iname '*.apk' -print0
          )

          if [ -z "$apk" ]; then
            echo "::error::A extração terminou, mas nenhum APK foi encontrado."
            exit 1
          fi

          cp "$apk" "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.3.apk"

          echo "APK preparado:"
          ls -lh "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.6.3.apk"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.3-APK
          path: apk-final/MENTEX-V4.6.3.apk
          if-no-files-found: error
          retention-days: 14

name: MENTEX V4.17 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.17
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extrair projeto V4.17
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MENTEX-V4.17-FIGURAS-MELHOR-DIMENSIONADAS.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP nao encontrado: $ZIP"
            echo "Arquivos ZIP encontrados:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

          SETTINGS=$(find projeto -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle nao encontrado no ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/www/index.html" ]; then
            echo "::error::Arquivo index.html do jogo nao encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager nao encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | "$SDKMANAGER" --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK nao foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.17.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.17-APK
          path: apk-final/MENTEX-V4.17.apk
          if-no-files-found: error

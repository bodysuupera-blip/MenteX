
name: CAO FUJAO - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p /tmp/cao-fujao

          ZIP=$(find . -maxdepth 2 \
            -name 'CAO-FUJAO-PACOTES-MOEDAS-PRECOS.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP dos pacotes nao encontrado."
            exit 1
          fi

          unzip -oq "$ZIP" -d /tmp/cao-fujao

          SETTINGS=$(find /tmp/cao-fujao \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android nao encontrado."
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Localizar APK
        run: |
          set -Eeuo pipefail

          APK=$(find "$PROJECT" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/CAO-FUJAO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-PACOTES-MOEDAS
          path: resultado/CAO-FUJAO.apk
          if-no-files-found: error
          

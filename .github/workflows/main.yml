
name: NEXUS 350 - NOVA BUILD ORIGINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Extrair fonte original
        run: |
          set -e

          ZIP="NEXUS350_FONTE_ORIGINAL_SEM_MUDANCAS.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP=$(find . -type f -name "NEXUS350_FONTE_ORIGINAL_SEM_MUDANCAS.zip" | head -n 1)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERRO: Fonte original nao encontrada."
            exit 1
          fi

          mkdir -p /tmp/nexus350
          unzip -q "$ZIP" -d /tmp/nexus350

          cd /tmp/nexus350

          if [ ! -f package.json ]; then
            echo "ERRO: package.json nao encontrado."
            exit 1
          fi

          cat package.json

      - name: Instalar dependencias
        working-directory: /tmp/nexus350
        run: |
          set -e
          npm install

      - name: Preparar Android Capacitor
        working-directory: /tmp/nexus350
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Compilar APK
        working-directory: /tmp/nexus350/android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Localizar APK
        run: |
          set -e

          mkdir -p entrega

          find /tmp/nexus350/android \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -exec cp {} entrega/ \;

          if [ -z "$(ls -A entrega)" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          ls -lh entrega

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-NOVA-BUILD-ORIGINAL
          path: entrega/*.apk
          retention-days: 30
          

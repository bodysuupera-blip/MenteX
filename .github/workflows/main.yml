name: Gerar APK MENTEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4


      - name: Preparar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "     PROCURANDO ZIP DO PROJETO"
          echo "======================================"

          BASE_ZIP=""

          if [ -f "./MENTEX_Android_3_9_2_5_CORACOES_SEM_CRASH.zip" ]; then
            BASE_ZIP="./MENTEX_Android_3_9_2_5_CORACOES_SEM_CRASH.zip"

          elif [ -f "./MENTEX_Android_3_1_Nova_Tela_Inicial_CORRIGIDO.zip" ]; then
            BASE_ZIP="./MENTEX_Android_3_1_Nova_Tela_Inicial_CORRIGIDO.zip"

          else
            BASE_ZIP=$(find . -maxdepth 2 -type f -name "*.zip" \
              ! -name "MENTEX_ATUALIZACAO_LOJA_10_CORACOES.zip" \
              ! -path "./.git/*" \
              -print -quit)
          fi

          if [ -z "$BASE_ZIP" ]; then
            echo "ERRO: ZIP do projeto Android não encontrado."
            echo ""
            echo "ZIPs encontrados:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP BASE:"
          echo "$BASE_ZIP"


          echo ""
          echo "======================================"
          echo "   PROCURANDO ATUALIZAÇÃO DO MENTEX"
          echo "======================================"

          UPDATE_ZIP="./MENTEX_ATUALIZACAO_LOJA_10_CORACOES.zip"

          if [ ! -f "$UPDATE_ZIP" ]; then
            echo "ERRO: MENTEX_ATUALIZACAO_LOJA_10_CORACOES.zip não encontrado."
            echo ""
            echo "ZIPs encontrados:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP DE ATUALIZAÇÃO:"
          echo "$UPDATE_ZIP"


          echo ""
          echo "======================================"
          echo "       EXTRAINDO PROJETO BASE"
          echo "======================================"

          rm -rf extracted_mentex
          mkdir -p extracted_mentex

          unzip -o "$BASE_ZIP" -d extracted_mentex


          echo ""
          echo "======================================"
          echo "      VERIFICANDO PROJETO BASE"
          echo "======================================"

          if [ ! -d "extracted_mentex/app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          if [ ! -f "extracted_mentex/build.gradle" ] && \
             [ ! -f "extracted_mentex/build.gradle.kts" ]; then
            echo "ERRO: build.gradle não encontrado."
            exit 1
          fi


          echo ""
          echo "======================================"
          echo "      EXTRAINDO ATUALIZAÇÃO"
          echo "======================================"

          rm -rf update_mentex
          mkdir -p update_mentex

          unzip -o "$UPDATE_ZIP" -d update_mentex


          echo ""
          echo "Arquivos da atualização:"
          find update_mentex -maxdepth 3 -type f -print


          echo ""
          echo "======================================"
          echo "      PROCURANDO INDEX ATUALIZADO"
          echo "======================================"

          UPDATED_HTML=$(find update_mentex \
            -type f \
            -name "index.html" \
            -print -quit)

          if [ -z "$UPDATED_HTML" ]; then
            echo "ERRO: index.html atualizado não encontrado."
            exit 1
          fi

          echo "HTML ATUALIZADO:"
          echo "$UPDATED_HTML"


          echo ""
          echo "======================================"
          echo "   PROCURANDO HTML DO APLICATIVO"
          echo "======================================"

          TARGET_HTML=""

          if [ -f "extracted_mentex/app/src/main/assets/index.html" ]; then
            TARGET_HTML="extracted_mentex/app/src/main/assets/index.html"

          else
            TARGET_HTML=$(find extracted_mentex/app/src/main/assets \
              -type f \
              \( -name "*.html" -o -name "*.htm" \) \
              -print -quit)
          fi

          if [ -z "$TARGET_HTML" ]; then
            echo "ERRO: nenhum HTML encontrado em app/src/main/assets."
            echo ""
            echo "Arquivos HTML encontrados no projeto:"
            find extracted_mentex/app \
              -type f \
              \( -name "*.html" -o -name "*.htm" \) \
              -print

            exit 1
          fi

          echo ""
          echo "HTML ORIGINAL:"
          echo "$TARGET_HTML"


          echo ""
          echo "======================================"
          echo "      ATUALIZANDO HTML DO MENTEX"
          echo "======================================"

          cp "$UPDATED_HTML" "$TARGET_HTML"

          echo ""
          echo "HTML atualizado com sucesso."


          echo ""
          echo "======================================"
          echo "       VERIFICANDO ASSETS"
          echo "======================================"

          ASSETS_DIR="extracted_mentex/app/src/main/assets"

          if [ -d "$ASSETS_DIR" ]; then
            echo ""
            echo "Assets encontrados:"
            ls -lh "$ASSETS_DIR"
          else
            echo "ERRO: pasta assets não encontrada."
            exit 1
          fi


          echo ""
          echo "======================================"
          echo "      CONFIGURANDO PROJETO"
          echo "======================================"

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted_mentex"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJETO FINAL:"
          echo "$PROJECT_DIR"


      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "       VERIFICANDO PROJETO"
          echo "======================================"

          echo ""
          echo "Diretório:"
          pwd

          echo ""
          echo "Arquivos:"
          ls -la

          echo ""

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "ERRO: build.gradle não encontrado."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERRO: Gradle do aplicativo não encontrado."
            exit 1
          fi

          echo ""
          echo "PROJETO ANDROID OK"


      - name: Confirmar atualização MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "   CONFIRMANDO HTML ATUALIZADO"
          echo "======================================"

          HTML_FILE=$(find app/src/main/assets \
            -type f \
            -name "index.html" \
            -print -quit)

          if [ -z "$HTML_FILE" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          echo ""
          echo "HTML:"
          echo "$HTML_FILE"

          echo ""
          echo "Tamanho:"
          ls -lh "$HTML_FILE"

          echo ""
          echo "Procurando configuração de 10 corações..."

          if grep -qi "10" "$HTML_FILE"; then
            echo "OK: referência a 10 encontrada no HTML."
          else
            echo "AVISO: não foi encontrada referência simples a 10."
          fi

          echo ""
          echo "HTML PRONTO PARA O APK"


      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      - name: Verificar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "       VERSÃO DO GRADLE"
          echo "======================================"

          gradle --version


      - name: Gerar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo "       GERANDO APK MENTEX"
          echo "======================================"

          gradle assembleDebug --stacktrace

          echo ""
          echo "======================================"
          echo "           APK PRONTO"
          echo "======================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      - name: Verificar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi encontrado."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "       APK ENCONTRADO"
          echo "======================================"

          echo "$APK"

          echo ""
          ls -lh "$APK"


      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-${{ github.run_number }}
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          overwrite: true

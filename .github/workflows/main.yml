name: MENTEX V4.12 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Localizar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MENTEX-V4.12-TELA-JOGO-SEM-ZOOM.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP nao encontrado na raiz: $ZIP"
            echo "Arquivos ZIP encontrados no repositorio:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

          SETTINGS=$(find projeto -name settings.gradle -type f \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Nao foi encontrado settings.gradle dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/www/index.html" ]; then
            echo "::error::Arquivo index.html do jogo nao encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Verificar APK gerado
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::A compilacao terminou sem gerar APK."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-final"
          cp "$APK" "$GITHUB_WORKSPACE/apk-final/MENTEX-V4.12.apk"
          echo "APK preparado para download."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.12-APK
          path: apk-final/MENTEX-V4.12.apk
          if-no-files-found: error

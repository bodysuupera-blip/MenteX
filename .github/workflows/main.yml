
name: CAO FUJAO 3.2 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 3.2
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto 3.2
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./CAO-FUJAO-3.2-PROJETO-COMPLETO.zip"
          DEST="/tmp/cao-fujao-32"

          test -f "$ZIP" || {
            echo "ERRO: ZIP 3.2 não encontrado."
            exit 1
          }

          mkdir -p "$DEST"
          unzip -oq "$ZIP" -d "$DEST"

          PROJECT=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle" ] &&
               grep -q 'com.caofujao.game' "$DIR/app/build.gradle"; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$DEST" -type f -name settings.gradle -print0)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android não encontrado."
            find "$DEST" -maxdepth 6 -type f | head -150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT"

      - name: Configurar SDK e aceitar licenças
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDK principal: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          chmod +x "$SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Verificar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          for FILE in \
            settings.gradle \
            build.gradle \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/assets/index.html
          do
            test -s "$PROJECT_DIR/$FILE" || {
              echo "ERRO: arquivo ausente: $FILE"
              exit 1
            }
          done

          grep -q 'com.caofujao.game' \
            "$PROJECT_DIR/app/build.gradle"

          echo "PROJETO CONFIRMADO!"

      - name: Compilar Cão Fujão
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Verificar APK
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p entrega
          cp "$APK" entrega/CAO-FUJAO-3.2.apk

          ls -lh entrega/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-3.2-APK
          path: entrega/CAO-FUJAO-3.2.apk
          if-no-files-found: error
          

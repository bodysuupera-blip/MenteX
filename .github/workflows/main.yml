
name: NEXUS 350 - GERAR APK CORRIGIDO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Localizar ZIP atualizado
        run: |
          set -e

          ZIP=$(find . -maxdepth 4 -type f \
            -name 'Nexus350_Labirinto_Fantasmas_CORRIGIDO.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP corrigido não encontrado."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Localizar projeto
        run: |
          set -e

          PROJECT=$(find extracted -name package.json \
            -not -path '*/node_modules/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json não encontrado."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          set -e

          cd "$PROJECT"

          npm pkg set \
            "dependencies.@capacitor/core=^7.0.0" \
            "dependencies.@capacitor/android=^7.0.0" \
            "devDependencies.@capacitor/cli=^7.0.0"

          npm install

      - name: Preparar Android
        run: |
          set -e

          cd "$PROJECT"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configurar jogo horizontal
        run: |
          set -e

          MANIFEST="$PROJECT/android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/g' "$MANIFEST"

            if ! grep -q 'android:screenOrientation="landscape"' "$MANIFEST"; then
              sed -i 's/<activity /<activity android:screenOrientation="landscape" /' "$MANIFEST"
            fi
          fi

      - name: Compilar APK
        run: |
          set -e

          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Localizar APK
        run: |
          set -e

          APK=$(find "$PROJECT/android/app/build/outputs/apk" \
            -name '*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK não encontrado."
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/NEXUS350.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-APK-CORRIGIDO
          path: resultado/NEXUS350.apk
          if-no-files-found: error
          retention-days: 30

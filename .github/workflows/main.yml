
      name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          for DIR in . LabirintoMortal; do
            if [ -f "$DIR/settings.gradle" ] && [ -f "$DIR/app/build.gradle" ]; then
              PROJECT="$DIR"
              break
            fi
          done

          if [ -z "$PROJECT" ]; then
            echo "Procurando projeto dentro dos ZIPs..."
            mkdir -p /tmp/projetos

            while IFS= read -r -d '' ZIP; do
              DEST="/tmp/projetos/$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"

              if unzip -oq "$ZIP" -d "$DEST"; then
                while IFS= read -r -d '' FILE; do
                  DIR="${FILE%/settings.gradle}"
                  if [ -f "$DIR/app/build.gradle" ]; then
                    PROJECT="$DIR"
                    break
                  fi
                done < <(find "$DEST" -type f -name settings.gradle -print0)
              fi

              [ -n "$PROJECT" ] && break
            done < <(find . -maxdepth 1 -type f -name '*.zip' -print0)

          fi

          if [ -z "$PROJECT" ]; then
            echo "ERRO: nenhum projeto Android válido foi encontrado."
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          

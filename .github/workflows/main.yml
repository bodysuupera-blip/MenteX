
name: CAO FUJAO - GERAR APK ATUALIZADO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar codigo fonte
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

          echo "Aceitando licencas automaticamente..."
          yes | "$SDKMANAGER" --licenses

          echo "Instalando componentes Android..."
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar projeto
        run: |
          set -e
          find . -name settings.gradle -o -name settings.gradle.kts
          find . -name AndroidManifest.xml

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "ERRO: projeto Android nao encontrado na raiz"
            exit 1
          fi

      - name: Preparar Gradle
        run: |
          if [ ! -f gradlew ]; then
            echo "ERRO: gradlew nao encontrado na raiz"
            exit 1
          fi
          chmod +x gradlew

      - name: Compilar APK
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-APK-ATUALIZADO
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          

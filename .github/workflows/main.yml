
name: MENTEX V4.16 - Corrigir Rolagem e Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "::error::Arquivo gradlew não encontrado na raiz."
            echo "O repositório precisa conter o projeto Android completo."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::settings.gradle não encontrado."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Compilar APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APK=$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -not -path "*/build/intermediates/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          cp "$APK" dist/MENTEX-V4.16-ROLAGEM.apk
          ls -lh dist/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.16-ROLAGEM-APK
          path: dist/MENTEX-V4.16-ROLAGEM.apk
          if-no-files-found: error
          


name: MENTE EM FUGA - APK INDEPENDENTE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Localizar e extrair jogo
        shell: bash
        run: |
          set -e

          ZIP="Mente-em-Fuga-Independente-NOVO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP do jogo nao encontrado"
            exit 1
          fi

          mkdir -p /tmp/mente-fuga
          unzip -q "$ZIP" -d /tmp/mente-fuga

          HTML=$(find /tmp/mente-fuga -type f -name index.html | head -n 1)

          if [ -z "$HTML" ]; then
            echo "index.html nao encontrado"
            exit 1
          fi

          WEB_DIR=$(dirname "$HTML")

          mkdir -p mente-em-fuga/www
          cp -a "$WEB_DIR/." mente-em-fuga/www/

      - name: Criar aplicativo Android
        working-directory: mente-em-fuga
        run: |
          set -e

          cat > package.json <<'EOF'
          {
            "name": "mente-em-fuga",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "6.1.2"
            },
            "devDependencies": {
              "@capacitor/cli": "6.1.2",
              "@capacitor/android": "6.1.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rafaelheranca.menteemfuga",
            "appName": "Mente em Fuga",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: mente-em-fuga/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Conferir APK
        run: |
          test -f mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTE-EM-FUGA-APK
          path: mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          


name: MENTEX V4.7 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo MENTEX
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar SDK Manager
        id: sdk
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: SDK Manager não encontrado."
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Instalar componentes Android
        shell: bash
        run: |
          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar projeto
        shell: bash
        run: |
          if [ ! -f settings.gradle ] || [ ! -f app/build.gradle ]; then
            echo "ERRO: coloque o conteúdo de MENTEX_REFEITO_PROJETO na raiz do repositório."
            exit 1
          fi

      - name: Gerar APK
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.7-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

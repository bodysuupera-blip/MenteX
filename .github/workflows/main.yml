
name: CAO FUJAO 2.6 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' arquivo; do
            pasta="extraido_$(basename "$arquivo" .zip)"
            mkdir -p "$pasta"
            unzip -oq "$arquivo" -d "$pasta"
          done < <(find . -type f -name "*.zip" -print0)

          PROJETO=""

          while IFS= read -r -d '' arquivo; do
            pasta="$(dirname "$arquivo")"

            if { [ -f "$pasta/app/build.gradle" ] || \
                 [ -f "$pasta/app/build.gradle.kts" ]; } && \
               [ -f "$pasta/app/src/main/AndroidManifest.xml" ]; then
              PROJETO="$pasta"
              break
            fi
          done < <(find . -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print0)

          if [ -z "$PROJETO" ]; then
            echo "ERRO: Projeto Android nao encontrado."
            exit 1
          fi

          echo "Projeto encontrado: $PROJETO"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJETO" >> "$GITHUB_ENV"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

      - name: Aceitar licencas e instalar componentes
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon clean :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/resultado"
          cp "$APK" "$GITHUB_WORKSPACE/resultado/CAO-FUJAO.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.6-APK
          path: resultado/CAO-FUJAO.apk
          if-no-files-found: error
          retention-days: 30
          


name: LABIRINTO MORTAL - Gerar APK 3.0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=""

          # Procura projeto já extraído
          while IFS= read -r -d '' FILE; do
            PROJECT_DIR="$(dirname "$FILE")"
            break
          done < <(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' -print0)

          # Se não encontrou, extrai o ZIP
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FOUND=""

            while IFS= read -r -d '' ZIP; do
              case "$(basename "$ZIP")" in
                LABIRINTO*.zip|labirinto*.zip)
                  ZIP_FOUND="$ZIP"
                  break
                  ;;
              esac
            done < <(find . -type f -iname '*.zip' -print0)

            if [ -z "$ZIP_FOUND" ]; then
              echo "ERRO: ZIP do LABIRINTO MORTAL não encontrado."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/labirinto"
            unzip -q "$ZIP_FOUND" -d "$RUNNER_TEMP/labirinto"

            while IFS= read -r -d '' FILE; do
              PROJECT_DIR="$(dirname "$FILE")"
              break
            done < <(find "$RUNNER_TEMP/labirinto" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' -print0)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "Projeto localizado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar configuração Android
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "ERRO: arquivo build.gradle não encontrado."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERRO: módulo Android app não encontrado."
            exit 1
          fi

          echo "Configuração Android encontrada."
          cat build.gradle

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          gradle --version
          gradle clean assembleDebug --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp "$APK" "$GITHUB_WORKSPACE/saida/LABIRINTO-MORTAL-3.0.1.apk"

          ls -lh "$GITHUB_WORKSPACE/saida/"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-3.0.1-APK
          path: saida/LABIRINTO-MORTAL-3.0.1.apk
          if-no-files-found: error

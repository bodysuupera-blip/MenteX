name: MENTEX V4.6 - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilador MENTEX V4.6
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDK encontrado:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Procurar projeto Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO PROJETO ANDROID"
          echo "======================================"

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERRO: nenhum settings.gradle foi encontrado."
            echo ""
            echo "Arquivos encontrados no repositorio:"
            find . -maxdepth 4 -type f | sort
            echo ""
            echo "O repositorio precisa conter o PROJETO-FONTE Android."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo ""
          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar modulo app
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFICANDO MODULO APP"
          echo "======================================"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERRO: pasta app não encontrada."
            echo ""
            echo "Conteudo do projeto:"
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Modulo app encontrado."

      - name: Instalar Gradle
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle Wrapper encontrado."
            chmod +x "$PROJECT_DIR/gradlew"
          else
            echo "Gradle Wrapper não encontrado."

            wget -q \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp

            echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

      - name: Compilar MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COMPILANDO MENTEX"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug
          else
            gradle clean assembleDebug
          fi

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROCURANDO APK GERADO"
          echo "======================================"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p resultado

          cp "$APK" \
            resultado/MENTEX-V4.6-ATUALIZADO.apk

          ls -lh resultado/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-ATUALIZADO
          path: resultado/MENTEX-V4.6-ATUALIZADO.apk
          if-no-files-found: error
          retention-days: 30


name: MENTE EM FUGA - LABIRINTO 2.0 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -type f -iname '*Mente*Fuga*Labirinto*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do Mente em Fuga nao encontrado."
            echo "ZIPs encontrados:"
            find . -type f -iname '*.zip' || true
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "SDK encontrado em $ANDROID_HOME"

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mente-fuga"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/mente-fuga"

          PROJECT=$(find "$RUNNER_TEMP/mente-fuga" -type f -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: package.json nao encontrado dentro do ZIP."
            find "$RUNNER_TEMP/mente-fuga" -maxdepth 4 -type f
            exit 1
          fi

          test -f "$PROJECT/capacitor.config.json"
          test -f "$PROJECT/www/index.html"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          npm install
          npm install @capacitor/android@^6.2.0
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            find "$PROJECT/android" -name '*.apk' || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTE-EM-FUGA-LABIRINTO-2.0-APK
          path: ${{ runner.temp }}/mente-fuga/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

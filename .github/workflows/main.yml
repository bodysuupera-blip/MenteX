
name: CAO FUJAO 3.2 - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cão Fujão 3.2
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e extrair projeto original
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="$(find . -maxdepth 2 -type f \
            -iname 'CAO-FUJAO-3.2-PROJETO-COMPLETO.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP original do Cão Fujão 3.2 não encontrado."
            exit 1
          fi

          mkdir -p /tmp/cao-fujao-32
          unzip -q "$ZIP" -d /tmp/cao-fujao-32

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/app/build.gradle" ] &&
               grep -Rq 'com.caofujao.game' "$DIR/app"; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find /tmp/cao-fujao-32 -name settings.gradle -type f)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Android original não encontrado."
            find /tmp/cao-fujao-32 -maxdepth 4 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERRO: Android SDK não configurado."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDK: $SDK_ROOT"

          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Verificar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          for FILE in settings.gradle build.gradle app/build.gradle; do
            if [ ! -f "$FILE" ]; then
              echo "ERRO: arquivo ausente: $FILE"
              exit 1
            fi
          done

          if ! grep -Rq 'com.caofujao.game' app; then
            echo "ERRO: pacote não corresponde ao Cão Fujão."
            exit 1
          fi

          echo "Projeto Cão Fujão validado."

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find "$PROJECT_DIR" -path '*build/outputs/apk*' -type f
            exit 1
          fi

          mkdir -p entrega
          cp "$APK" entrega/CAO-FUJAO-3.2.apk

          echo "APK pronto para instalação."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-3.2-APK
          path: entrega/CAO-FUJAO-3.2.apk
          if-no-files-found: error
          

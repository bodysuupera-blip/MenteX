
name: Gerar APK MENTEX V4.10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto V4.10
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-V4.10-TELA-AJUSTADA.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: envie o ZIP V4.10 para o repositório."
            exit 1
          fi

          mkdir -p projeto
          unzip -oq "$ZIP" -d projeto

          GRADLE_FILE=$(find projeto -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: projeto Android Gradle não encontrado."
            exit 1
          fi

          echo "PROJETO=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJETO"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.10-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          

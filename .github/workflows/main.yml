
name: CAO FUJAO 2.4 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cao Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name "*.zip" -print0 |
          while IFS= read -r -d '' arquivo; do
            pasta="extraido_$(basename "$arquivo" .zip)"
            mkdir -p "$pasta"
            unzip -oq "$arquivo" -d "$pasta"
          done

          PROJETO=""

          while IFS= read -r arquivo; do
            pasta="$(dirname "$arquivo")"

            if [ -f "$pasta/app/build.gradle" ] || \
               [ -f "$pasta/app/build.gradle.kts" ]; then
              PROJETO="$pasta"
              break
            fi
          done < <(find . -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \))

          if [ -z "$PROJETO" ]; then
            echo "ERRO: Projeto Android nao encontrado."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          if [ ! -f "$PROJETO/app/src/main/AndroidManifest.xml" ]; then
            echo "ERRO: Manifest nao encontrado."
            exit 1
          fi

          GRADLE="$PROJETO/app/build.gradle"
          if [ ! -f "$GRADLE" ]; then
            GRADLE="$PROJETO/app/build.gradle.kts"
          fi

          if ! grep -q "com.caofujao.game" "$GRADLE"; then
            echo "ERRO: Este projeto nao foi identificado como Cao Fujão."
            echo "Nao sera compilado um projeto diferente."
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJETO" >> "$GITHUB_ENV"
          echo "Projeto Cao Fujão confirmado!"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Instalar pacotes Android separadamente
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager)"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar aplicativo APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon clean :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/resultado"
          cp "$APK" "$GITHUB_WORKSPACE/resultado/CAO-FUJAO.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.4-APK
          path: resultado/CAO-FUJAO.apk
          if-no-files-found: error
          retention-days: 30
          

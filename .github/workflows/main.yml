
name: MENTEX 5.1 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX Android
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar projeto MENTEX
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/android/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: package.json não encontrado."
            find . -maxdepth 5 -type f | head -150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Conferir arquivos necessários
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          for FILE in package.json capacitor.config.json www/index.html; do
            if [ ! -f "$FILE" ]; then
              echo "ERRO: arquivo não encontrado: $FILE"
              exit 1
            fi
          done

          echo "Arquivos principais encontrados."

      - name: Instalar dependências
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Configurar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: SDK Manager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Criar plataforma Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sincronizar aplicativo
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Gerar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Conferir APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado."
            find "$PROJECT_DIR/android" -name '*.apk'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/resultado"
          cp "$APK" "$GITHUB_WORKSPACE/resultado/MENTEX-5.1.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-5.1-APK
          path: resultado/MENTEX-5.1.apk
          if-no-files-found: error
          

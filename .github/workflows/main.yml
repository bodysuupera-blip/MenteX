
name: MENTEX - Atualizar Icone e Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK do MENTEX
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Extrair projeto MENTEX
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MENTEX-4.7-PROJETO-RECONSTRUIDO-CORRIGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP do projeto não encontrado."
            ls -lah
            exit 1
          fi

          mkdir -p projeto
          unzip -oq "$ZIP" -d projeto

          ROOT=$(find projeto -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$ROOT")

          if [ ! -d "$PROJECT_DIR/app/src/main" ]; then
            echo "ERRO: estrutura do aplicativo não encontrada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aplicar icone MENTEX
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MENTEX-ICONE-MELHORADO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP do icone não encontrado."
            exit 1
          fi

          mkdir -p /tmp/mentex-icon
          unzip -oq "$ZIP" -d /tmp/mentex-icon

          ICON_DIR=$(find /tmp/mentex-icon \
            -type d -name android-res -print -quit)

          if [ -z "$ICON_DIR" ]; then
            echo "ERRO: pasta android-res não encontrada."
            find /tmp/mentex-icon -type f
            exit 1
          fi

          RES="$PROJECT_DIR/app/src/main/res"
          mkdir -p "$RES"

          cp -R "$ICON_DIR"/. "$RES"/

          if [ ! -f "$RES/mipmap-mdpi/ic_launcher.png" ]; then
            echo "ERRO: ícone não foi instalado corretamente."
            exit 1
          fi

          echo "Novo icone MENTEX aplicado."

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --version
          gradle clean assembleDebug --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK gerado com sucesso:"
          ls -lh "$APK"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-ATUALIZADO
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
          

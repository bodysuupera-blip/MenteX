
name: Construir APK MENTEX

on:
  workflow_dispatch:
  push:
    paths:
      - "MENTEX-V4.17-APK.zip"
      - "mentex_icon.png"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jre-headless \
            zip unzip curl jq \
            python3-pil apksigner zipalign aapt

          URL=$(curl -fsSL \
            https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
            | jq -r '.assets[]
              | select(.name | test("^apktool_[0-9.]+\\.jar$"))
              | .browser_download_url' | head -n 1)

          test -n "$URL"
          curl -fL "$URL" -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Localizar e extrair APK
        shell: bash
        run: |
          set -e
          ZIP_FILE="MENTEX-V4.17-APK.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Nao encontrei $ZIP_FILE na raiz do repositorio."
            exit 1
          fi

          mkdir -p entrada
          unzip -o "$ZIP_FILE" -d entrada

          APK=$(find entrada -type f -iname "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::O ZIP nao contem nenhum APK."
            exit 1
          fi

          cp "$APK" original.apk
          echo "APK encontrado: $APK"

      - name: Verificar imagem do icone
        shell: bash
        run: |
          set -e
          if [ ! -f mentex_icon.png ]; then
            echo "::error::Adicione mentex_icon.png na raiz do repositorio."
            exit 1
          fi

          python3 - <<'PY'
          from PIL import Image
          im = Image.open("mentex_icon.png").convert("RGBA")
          im.thumbnail((512, 512))
          im.save("icone_convertido.png")
          print("Imagem do icone preparada:", im.size)
          PY

      - name: Desmontar APK
        shell: bash
        run: |
          set -e
          java -jar "$RUNNER_TEMP/apktool.jar" \
            d -f original.apk -o projeto

      - name: Substituir icones existentes
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path("projeto/res")
          source = Image.open("icone_convertido.png").convert("RGBA")
          names = ("ic_launcher", "launcher_icon", "app_icon", "appicon")
          replaced = 0

          for folder in root.glob("*"):
              if not folder.is_dir():
                  continue
              if not (folder.name.startswith("mipmap")
                      or folder.name.startswith("drawable")):
                  continue

              for file in folder.iterdir():
                  if not file.is_file():
                      continue
                  if file.suffix.lower() not in (".png", ".webp"):
                      continue
                  if not any(n in file.stem.lower() for n in names):
                      continue

                  try:
                      with Image.open(file) as old:
                          size = old.size
                      image = source.resize(size, Image.Resampling.LANCZOS)
                      if file.suffix.lower() == ".webp":
                          image.save(file, "WEBP")
                      else:
                          image.save(file, "PNG")
                      print("Icone substituido:", file)
                      replaced += 1
                  except Exception as e:
                      print("Aviso:", file, e)

          if replaced == 0:
              print("Aviso: nenhum icone compativel foi encontrado.")
              print("Os nomes dos recursos precisam ser verificados.")
          PY

      - name: Reconstruir APK
        shell: bash
        run: |
          set -e
          java -jar "$RUNNER_TEMP/apktool.jar" \
            b projeto -o mentex-unsigned.apk

      - name: Alinhar e assinar APK
        shell: bash
        run: |
          set -e

          zipalign -f -p 4 \
            mentex-unsigned.apk mentex-aligned.apk

          if [ ! -f "$RUNNER_TEMP/mentex.keystore" ]; then
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/mentex.keystore" \
              -storepass android \
              -keypass android \
              -alias mentex \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MENTEX, OU=App, O=MENTEX, L=Brasil, ST=SP, C=BR"
          fi

          apksigner sign \
            --ks "$RUNNER_TEMP/mentex.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out MENTEX-assinado.apk \
            mentex-aligned.apk

          apksigner verify MENTEX-assinado.apk

      - name: Criar ZIP final
        shell: bash
        run: |
          set -e
          mkdir -p entrega
          cp MENTEX-assinado.apk entrega/
          cp mentex_icon.png entrega/
          cd entrega
          zip -j ../MENTEX-APK-final.zip *

      - name: Disponibilizar APK e ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK-final
          path: |
            MENTEX-assinado.apk
            MENTEX-APK-final.zip
          if-no-files-found: error
          

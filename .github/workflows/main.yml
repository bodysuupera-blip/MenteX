
name: MENTE EM FUGA - LABIRINTO 2.0 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Android SDK existente
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms"

          echo "Android SDK encontrado!"
          ls "$ANDROID_HOME/platforms"

      - name: Localizar ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f \
            -iname 'Mente_em_Fuga_Labirinto_2.0_ATUALIZADO.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ZIP atualizado nao encontrado."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mente-fuga"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/mente-fuga"

          PROJECT="$RUNNER_TEMP/mente-fuga/mente-em-fuga"

          test -f "$PROJECT/package.json"
          test -f "$PROJECT/capacitor.config.json"
          test -f "$PROJECT/www/index.html"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT"

          npm install
          npm install @capacitor/android@^6.2.0

          npx cap add android
          npx cap sync android

      - name: Gerar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT/android"

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT/android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTE-EM-FUGA-LABIRINTO-2.0-APK
          path: ${{ runner.temp }}/mente-fuga/mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

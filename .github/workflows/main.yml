
name: MENTEX V5.1 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V5.1
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar arquivos
        run: |
          APK=$(find . -type f -iname "*.apk" | grep -v "unsigned" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado"
            exit 1
          fi

          cp "$APK" base.apk

          ICON=$(find . -type f -iname "mentex_icon.png" | head -1)

          if [ -z "$ICON" ]; then
            ICON=$(find . -type f -iname "*.png" | head -1)
          fi

          if [ -z "$ICON" ]; then
            echo "ERRO: Ícone não encontrado"
            exit 1
          fi

          cp "$ICON" mentex_icon.png

          IMG=$(find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) | head -1)

          if [ -n "$IMG" ]; then
            cp "$IMG" opening_first.jpg
          else
            cp mentex_icon.png opening_first.png
          fi

          echo "Arquivos preparados"

      - name: Instalar APKTool
        run: |
          curl -fL \
          https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
          -o apktool.jar

      - name: Extrair aplicativo
        run: |
          java -jar apktool.jar d -f base.apk -o projeto

      - name: Atualizar MENTEX
        run: |
          python3 - <<'PY'
          import os
          import shutil

          p = "projeto/assets/www/index.html"

          if not os.path.exists(p):
              raise Exception("Não foi encontrado o arquivo index.html")

          with open(p, encoding="utf-8") as f:
              h = f.read()

          inicio = h.index('<div id="opening"')
          fim = h.index('<audio id="introMusic"', inicio)

          tela = """
          <div id="opening" class="opening mentex-v51">
            <img src="opening_first.jpg"
                 class="welcome-image"
                 onerror="this.src='opening_first.png'"
                 alt="Bem-vindo ao MENTEX">

            <button class="welcome-button"
                    onclick="enterGame()"
                    aria-label="Começar">
            </button>
          </div>
          """

          h = h[:inicio] + tela + h[fim:]

          css = """
          <style id="mentex-v51">
          .mentex-v51 {
            position:fixed!important;
            inset:0!important;
            width:100%!important;
            height:100%!important;
            height:100dvh!important;
            margin:0!important;
            padding:0!important;
            overflow:hidden!important;
            background:#031a53!important;
            z-index:99999!important;
          }

          .welcome-image {
            position:absolute!important;
            inset:0!important;
            width:100%!important;
            height:100%!important;
            object-fit:fill!important;
          }

          .welcome-button {
            position:absolute!important;
            left:19%!important;
            bottom:5%!important;
            width:62%!important;
            height:9%!important;
            border:0!important;
            border-radius:30px!important;
            background:transparent!important;
          }

          .share-mentex {
            width:100%!important;
            padding:14px!important;
            margin:12px 0!important;
            background:#079447!important;
            color:white!important;
            border-radius:15px!important;
            font-weight:bold!important;
          }
          </style>
          """

          h = h.replace("</head>", css + "</head>", 1)

          marcador = '<button class="secondary home-ad"'

          if marcador not in h:
              raise Exception("Local do botão de compartilhamento não encontrado")

          botao = """
          <button class="secondary share-mentex"
          onclick="shareMentex()">
          📲 COMPARTILHAR PELO WHATSAPP
          </button>
          """

          h = h.replace(marcador, botao + marcador, 1)

          js = """
          function shareMentex() {
            const msg = '🧠 Conheça o MENTEX! Desafie seu cérebro!';
            const url = 'https://wa.me/?text=' + encodeURIComponent(msg);

            if (navigator.share) {
              navigator.share({
                title: 'MENTEX',
                text: msg
              }).catch(function() {
                window.location.href = url;
              });
            } else {
              window.location.href = url;
            }
          }
          """

          pos = h.rfind("</script>")

          if pos < 0:
              raise Exception("Script principal não encontrado")

          h = h[:pos] + js + h[pos:]

          with open(p, "w", encoding="utf-8") as f:
              f.write(h)

          os.makedirs("projeto/assets/www", exist_ok=True)

          if os.path.exists("opening_first.jpg"):
              shutil.copy(
                  "opening_first.jpg",
                  "projeto/assets/www/opening_first.jpg"
              )

          if os.path.exists("opening_first.png"):
              shutil.copy(
                  "opening_first.png",
                  "projeto/assets/www/opening_first.png"
              )

          print("MENTEX V5.1 atualizado!")
          PY

      - name: Reconstruir APK
        run: |
          java -jar apktool.jar b projeto -o MENTEX-unsigned.apk

      - name: Criar assinatura
        run: |
          keytool -genkeypair -v \
            -keystore mentex.jks \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX,O=MENTEX,C=BR"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Alinhar e assinar
        run: |
          sdkmanager "build-tools;35.0.0"

          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -f -p 4 MENTEX-unsigned.apk MENTEX-aligned.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks mentex.jks \
            --ks-key-alias mentex \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out MENTEX-V5.1.apk \
            MENTEX-aligned.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify MENTEX-V5.1.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.1-FINAL
          path: MENTEX-V5.1.apk
          if-no-files-found: error
          

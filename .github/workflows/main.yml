
name: MENTEX - Reconstruir APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Localizar APK original
        id: original
        run: |
          APK=$(find . -maxdepth 3 -type f -iname '*.apk' \
            ! -name '*atualizado*' \
            ! -name '*rebuild*' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK original não encontrado."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Baixar Apktool
        run: |
          curl -fL \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar \
            -o apktool.jar

      - name: Decodificar aplicativo
        run: |
          java -jar apktool.jar d \
            "${{ steps.original.outputs.path }}" \
            -o mentex-decoded \
            -f

      - name: Atualizar interface
        run: |
          HTML="mentex-decoded/assets/www/index.html"

          if [ ! -f "$HTML" ]; then
            echo "Interface HTML não encontrada."
            exit 1
          fi

          python3 - "$HTML" <<'PY'
          import sys

          p = sys.argv[1]
          with open(p, encoding="utf-8") as f:
              html = f.read()

          css = """
          <style id="mentex-scroll-update">
          html, body {
            min-height: 100% !important;
            height: auto !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
          }

          body {
            touch-action: pan-y !important;
          }

          #profile:not(.hidden) {
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
            padding-bottom: 100px !important;
            touch-action: pan-y !important;
          }
          </style>
          """

          if "mentex-scroll-update" not in html:
              if "</head>" not in html:
                  raise SystemExit("Tag </head> não encontrada.")
              html = html.replace("</head>", css + "\n</head>", 1)

          with open(p, "w", encoding="utf-8") as f:
              f.write(html)
          PY

      - name: Reconstruir APK
        run: |
          java -jar apktool.jar b mentex-decoded \
            -o MENTEX-reconstruido.apk

      - name: Alinhar APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f -v 4 MENTEX-reconstruido.apk \
            MENTEX-alinhado.apk

      - name: Criar chave temporária
        run: |
          keytool -genkeypair \
            -keystore mentex-temp.jks \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX, O=MENTEX, C=BR"

      - name: Assinar APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks mentex-temp.jks \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out MENTEX-atualizado.apk \
            MENTEX-alinhado.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose MENTEX-atualizado.apk

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: MENTEX-atualizado.apk
          if-no-files-found: error
          

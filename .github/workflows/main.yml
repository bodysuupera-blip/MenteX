
name: Labirinto de Fantasmas - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Aceitar licencas
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d7f3" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8a55" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb6" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Instalar pacotes Android
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extrair fonte
        run: |
          set -e
          ZIP=$(find . -type f -iname "Labirinto_de_Fantasmas_Fonte_Nova.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP da fonte nao encontrado"
            exit 1
          fi

          mkdir -p appsource
          unzip -o "$ZIP" -d appsource

      - name: Localizar projeto
        run: |
          set -e
          PROJECT=$(find appsource -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json nao encontrado"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Instalar dependencias
        run: |
          cd "$PROJECT"
          npm install

      - name: Sincronizar Capacitor
        run: |
          cd "$PROJECT"
          npx cap sync android

      - name: Gerar APK
        run: |
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Labirinto-de-Fantasmas-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

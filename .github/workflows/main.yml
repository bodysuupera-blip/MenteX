
name: LABIRINTO DE FANTASMA - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar ZIP
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f \
            -iname 'Labirinto_de_Fantasma_ANDROID_PRONTO.zip' \
            -print -quit)
          test -n "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/labirinto"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/labirinto"

          PROJECT="$RUNNER_TEMP/labirinto"
          test -f "$PROJECT/package.json"
          test -f "$PROJECT/capacitor.config.json"
          test -f "$PROJECT/www/index.html"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          cd "$PROJECT"
          npm install
          npm install @capacitor/android@^6.2.0

      - name: Configurar plataforma Android
        run: |
          set -euo pipefail
          cd "$PROJECT"
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        run: |
          set -euo pipefail
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK
        run: |
          set -euo pipefail
          APK="$PROJECT/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-DE-FANTASMA-APK
          path: ${{ runner.temp }}/labirinto/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          

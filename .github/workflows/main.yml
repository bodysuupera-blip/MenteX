
name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX com Novo Ícone
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="./MENTEX-ESTILO-ORIGINAL-MELHORADO-ICONE-NOVO.zip"
          DEST="$RUNNER_TEMP/mentex-original"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP atualizado não encontrado."
            exit 1
          fi

          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          PACKAGE=$(find "$DEST" -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "$PROJECT_DIR" > "$RUNNER_TEMP/project-dir.txt"

          echo "Projeto localizado: $PROJECT_DIR"

      - name: Instalar dependências
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR"

          test -f www/index.html
          test -f capacitor.config.json

          npm install
          npx cap add android

      - name: Aplicar novo ícone
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          RES_DIR="$PROJECT_DIR/android-icon-res"
          ANDROID_RES="$PROJECT_DIR/android/app/src/main/res"

          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            SOURCE="$RES_DIR/$density"

            if [ ! -f "$SOURCE/ic_launcher.png" ]; then
              echo "ERRO: ícone ausente em $density"
              exit 1
            fi

            mkdir -p "$ANDROID_RES/$density"

            cp "$SOURCE/ic_launcher.png" \
              "$ANDROID_RES/$density/ic_launcher.png"

            cp "$SOURCE/ic_launcher_round.png" \
              "$ANDROID_RES/$density/ic_launcher_round.png"
          done

          echo "Novo ícone instalado sem modificar o AndroidManifest.xml."

      - name: Sincronizar Android
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR"

          npx cap sync android

      - name: Compilar APK
        run: |
          set -Eeuo pipefail

          PROJECT_DIR=$(cat "$RUNNER_TEMP/project-dir.txt")
          cd "$PROJECT_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-NOVO-ICONE.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-NOVO-ICONE-APK
          path: MENTEX-NOVO-ICONE.apk
          if-no-files-found: error
          


name: MENTEX V5.1 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Atualizar MENTEX V5.1
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar APKTool
        run: |
          curl -fL \
          https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
          -o apktool.jar

      - name: Encontrar APK compatível
        run: |
          python3 - <<'PY'
          import zipfile
          import glob
          import os

          candidatos = glob.glob("**/*.apk", recursive=True)
          candidatos = [
              x for x in candidatos
              if "unsigned" not in x.lower()
              and "aligned" not in x.lower()
          ]

          escolhidos = []

          for apk in candidatos:
              try:
                  with zipfile.ZipFile(apk) as z:
                      nomes = z.namelist()
                      paginas = [
                          n for n in nomes
                          if n.endswith("/index.html")
                          and n.startswith("assets/")
                      ]

                      if paginas and "assets/www/index.html" in paginas:
                          prioridade = 0 if "v5.0" in apk.lower() else 1
                          escolhidos.append((prioridade, apk))
                          print("APK compatível:", apk)
              except Exception:
                  pass

          if not escolhidos:
              raise Exception(
                  "Nenhum APK com assets/www/index.html encontrado. "
                  "Adicione o MENTEX V5.0 ao repositório."
              )

          escolhidos.sort()
          apk = escolhidos[0][1]

          import shutil
          shutil.copy2(apk, "base.apk")

          print("APK selecionado:", apk)
          PY

      - name: Extrair aplicativo
        run: |
          java -jar apktool.jar d -f base.apk -o projeto

      - name: Atualizar tela e compartilhamento
        run: |
          python3 - <<'PY'
          import os
          import shutil

          raiz = "projeto/assets/www"
          arquivo = raiz + "/index.html"

          if not os.path.isfile(arquivo):
              raise Exception("index.html não encontrado após extração")

          with open(arquivo, encoding="utf-8") as f:
              h = f.read()

          inicio = h.find('<div id="opening"')
          audio = h.find('<audio id="introMusic"', inicio)

          if inicio < 0 or audio < 0:
              raise Exception("Estrutura da tela inicial incompatível")

          tela = """
          <div id="opening" class="opening mentex-v51">
            <img src="opening_first.jpg"
                 class="welcome-image"
                 alt="Bem-vindo ao MENTEX">

            <button class="welcome-button"
                    onclick="enterGame()"
                    aria-label="Começar">
            </button>
          </div>
          """

          h = h[:inicio] + tela + h[audio:]

          css = """
          <style id="mentex-v51">
          .mentex-v51 {
            position:fixed!important;
            inset:0!important;
            width:100%!important;
            height:100%!important;
            height:100dvh!important;
            padding:0!important;
            margin:0!important;
            overflow:hidden!important;
            background:#031a53!important;
            z-index:99999!important;
          }

          .welcome-image {
            position:absolute!important;
            inset:0!important;
            width:100%!important;
            height:100%!important;
            object-fit:fill!important;
          }

          .welcome-button {
            position:absolute!important;
            left:19%!important;
            bottom:5%!important;
            width:62%!important;
            height:9%!important;
            border:0!important;
            border-radius:30px!important;
            background:transparent!important;
          }

          .share-mentex {
            display:block!important;
            width:100%!important;
            padding:14px!important;
            margin:12px 0!important;
            background:#079447!important;
            color:white!important;
            border-radius:15px!important;
            font-weight:bold!important;
          }
          </style>
          """

          h = h.replace("</head>", css + "</head>", 1)

          marcador = '<button class="secondary home-ad"'

          if marcador not in h:
              raise Exception("Botão original da tela inicial não encontrado")

          botao = """
          <button class="secondary share-mentex"
          onclick="shareMentex()">
          📲 COMPARTILHAR PELO WHATSAPP
          </button>
          """

          if "function shareMentex()" not in h:
              h = h.replace(marcador, botao + marcador, 1)

          js = """
          function shareMentex() {
            const msg = '🧠 Conheça o MENTEX! Desafie seu cérebro!';
            const url = 'https://wa.me/?text=' + encodeURIComponent(msg);

            if (navigator.share) {
              navigator.share({
                title: 'MENTEX',
                text: msg
              }).catch(function() {
                window.location.href = url;
              });
            } else {
              window.location.href = url;
            }
          }
          """

          pos = h.rfind("</script>")

          if pos < 0:
              raise Exception("Script principal não encontrado")

          h = h[:pos] + js + h[pos:]

          with open(arquivo, "w", encoding="utf-8") as f:
              f.write(h)

          imagem = "opening_first.jpg"

          if not os.path.isfile(raiz + "/" + imagem):
              if os.path.isfile("opening_first.jpg"):
                  shutil.copy2("opening_first.jpg", raiz + "/" + imagem)
              else:
                  raise Exception(
                      "Imagem opening_first.jpg ausente. "
                      "Coloque a imagem de boas-vindas no repositório."
                  )

          print("Tela inicial e compartilhamento atualizados!")
          PY

      - name: Reconstruir APK
        run: |
          java -jar apktool.jar b projeto -o MENTEX-unsigned.apk

      - name: Criar assinatura
        run: |
          keytool -genkeypair -v \
            -keystore mentex.jks \
            -storepass mentex123 \
            -keypass mentex123 \
            -alias mentex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MENTEX,O=MENTEX,C=BR"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Alinhar e assinar APK
        run: |
          sdkmanager "build-tools;35.0.0"

          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -f -p 4 MENTEX-unsigned.apk MENTEX-aligned.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks mentex.jks \
            --ks-key-alias mentex \
            --ks-pass pass:mentex123 \
            --key-pass pass:mentex123 \
            --out MENTEX-V5.1.apk \
            MENTEX-aligned.apk

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify MENTEX-V5.1.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.1
          path: MENTEX-V5.1.apk
          if-no-files-found: error
          

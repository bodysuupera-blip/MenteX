
name: Nexus 350 Ghost Run - APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Localizar ZIP do Nexus 350
        run: |
          ZIP=$(find . -maxdepth 3 -type f \
            -iname 'Nexus350_GhostRun_RECRIADO.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP do Nexus 350 não encontrado!"
            echo "Envie Nexus350_GhostRun_RECRIADO.zip para a raiz do repositório."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair jogo
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted

      - name: Localizar projeto
        id: projeto
        run: |
          PROJECT=$(find extracted -type f -name package.json | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "package.json não existe dentro do ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado: $DIR"

      - name: Instalar dependências
        run: |
          cd "${{ steps.projeto.outputs.dir }}"
          npm install

      - name: Preparar Android
        run: |
          cd "${{ steps.projeto.outputs.dir }}"
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Gerar APK
        run: |
          cd "${{ steps.projeto.outputs.dir }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus350-GhostRun-APK
          path: extracted/**/android/app/build/outputs/apk/debug/app-debug.apk
          

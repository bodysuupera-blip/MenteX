
name: NEXUS 350 - NOVA BUILD SEM ALTERAR O JOGO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          set -e
          if [ -f "gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android/gradlew" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "ERRO: Gradle nao encontrado no projeto."
            exit 1
          fi

      - name: Compilar APK sem modificar o jogo
        shell: bash
        run: |
          set -e
          cd "${{ steps.projeto.outputs.dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Localizar APK gerado
        shell: bash
        run: |
          set -e
          mkdir -p entrega
          find . -type f -name "*.apk" -path "*/build/outputs/apk/*" -exec cp {} entrega/ \;
          if [ -z "$(ls -A entrega)" ]; then
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          fi

      - name: Disponibilizar novo APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-350-NOVA-BUILD
          path: entrega/*.apk
          retention-days: 30

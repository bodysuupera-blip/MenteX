
name: MENTEX - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX Nova Geração
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e compilar projeto
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Procurando projeto MENTEX..."

          PACKAGE=$(find . -type f -name package.json \
            -not -path '*/node_modules/*' \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERRO: package.json não encontrado."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "Projeto encontrado: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ ! -f www/index.html ]; then
            echo "ERRO: www/index.html não encontrado."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERRO: capacitor.config.json não encontrado."
            exit 1
          fi

          echo "Instalando dependências..."
          npm install

          echo "Preparando Android..."

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          echo "Compilando APK..."

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MENTEX-NOVA-GERACAO.apk"

          echo "APK gerado com sucesso!"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-NOVA-GERACAO-APK
          path: MENTEX-NOVA-GERACAO.apk
          if-no-files-found: error
          

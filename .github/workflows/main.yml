name: Gerar APK MENTEX 3.8

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar projeto MENTEX 3.8
        shell: bash
        run: |
          set -e

          rm -rf /tmp/mentex
          mkdir -p /tmp/mentex

          ZIP="./MENTEX_Android_3_8_Jogo_Completo_Entrada_Corrigida.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          unzip -o "$ZIP" -d /tmp/mentex

          echo "=== CONTEÚDO DO PROJETO ==="
          find /tmp/mentex -maxdepth 4 -type f | head -200

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find /tmp/mentex -type f -name "settings.gradle*" -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find /tmp/mentex -type d -name "app" -printf '%h\n' | head -1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            find /tmp/mentex -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== PROJETO ENCONTRADO ==="
          echo "$PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper encontrado."
          else
            echo "Gradle Wrapper não encontrado."
            echo "Tentando usar Gradle instalado no runner."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "ERRO: Gradle não está disponível."
              exit 1
            fi

            gradle --version
          fi

      - name: Verificar projeto Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== DIRETÓRIO DO PROJETO ==="
          pwd

          echo "=== ARQUIVOS ==="
          find . -maxdepth 3 -type f | sort

          echo "=== VERIFICAÇÃO ==="

          if [ ! -d "app" ]; then
            echo "ERRO: pasta app não encontrada."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERRO: build.gradle não encontrado."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "Projeto Android OK."

      - name: Compilar APK MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          echo "=== APK GERADO ==="

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-3.8-APK
          path: ${{ env.APK }}
          if-no-files-found: error

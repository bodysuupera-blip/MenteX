
name: LABIRINTO MORTAL - Gerar APK 3.0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto e localizar Android
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Procurando projeto ou arquivo ZIP..."

          mkdir -p "$RUNNER_TEMP/labirinto-fonte"

          # Primeiro verifica se o projeto já está extraído.
          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -not -path '*/build/*' -print0)

          # Se não encontrou, procura e extrai o ZIP.
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FOUND=""

            while IFS= read -r -d '' ZIP; do
              case "$(basename "$ZIP")" in
                LABIRINTO*.zip|labirinto*.zip)
                  ZIP_FOUND="$ZIP"
                  break
                  ;;
              esac
            done < <(find . -type f -iname '*.zip' -print0)

            if [ -z "$ZIP_FOUND" ]; then
              echo "ERRO: nenhum ZIP do LABIRINTO MORTAL foi encontrado."
              echo "Envie o arquivo LABIRINTO-MORTAL-3.0.1-SEM-ARCADE.zip para o repositório."
              exit 1
            fi

            echo "ZIP encontrado: $ZIP_FOUND"
            unzip -q "$ZIP_FOUND" -d "$RUNNER_TEMP/labirinto-fonte"

            while IFS= read -r -d '' FILE; do
              DIR="$(dirname "$FILE")"
              if [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(find "$RUNNER_TEMP/labirinto-fonte" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' -not -path '*/build/*' -print0)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: o ZIP foi extraído, mas não contém um projeto Android válido."
            echo "Arquivos encontrados:"
            find "$RUNNER_TEMP/labirinto-fonte" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verificar Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "ERRO: arquivo gradlew ausente no projeto."
            exit 1
          fi

          if [ ! -d gradle/wrapper ]; then
            echo "ERRO: pasta gradle/wrapper ausente."
            exit 1
          fi

          chmod +x gradlew
          ls -la

      - name: Compilar APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p saida
          cp "$APK" saida/LABIRINTO-MORTAL-3.0.1.apk
          ls -lh saida/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-3.0.1-APK
          path: saida/LABIRINTO-MORTAL-3.0.1.apk
          if-no-files-found: error
          

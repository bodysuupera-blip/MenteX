
name: NEXUS 350 - APK COM NOVO ICONE REDONDO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verificar fonte
        run: |
          cd labirinto_novo
          ls -la
          test -f package.json
          test -f capacitor.config.json

      - name: Instalar dependencias
        run: |
          cd labirinto_novo
          npm install

      - name: Preparar Android
        run: |
          cd labirinto_novo
          npx cap add android

      - name: Gerar icones Android
        run: |
          cd labirinto_novo
          npx capacitor-assets generate --android

      - name: Sincronizar Android
        run: |
          cd labirinto_novo
          npx cap sync android

      - name: Compilar APK
        run: |
          cd labirinto_novo/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-APK-ICONE-REDONDO
          path: labirinto_novo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          


name: MENTE EM FUGA - APK INDEPENDENTE

on:
  workflow_dispatch:
  push:
    paths:
      - 'mente-em-fuga/**'
      - '.github/workflows/mente-em-fuga.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Preparar jogo independente
        working-directory: mente-em-fuga
        run: |
          test -f www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Mente em Fuga" br.com.menteemfuga.app --web-dir www --npm-client npm
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        working-directory: mente-em-fuga/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mente-em-Fuga-APK
          path: mente-em-fuga/android/app/build/outputs/apk/debug/app-debug.apk
          

name: Build MENTEX V4.6 Compacto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V4.6 Compacto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar projeto MENTEX
        shell: bash
        run: |
          set -e

          echo "Procurando settings.gradle..."

          SETTINGS=$(find . \
            -type f \
            -name "settings.gradle" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find . -type f \
              \( -name "settings.gradle" -o -name "build.gradle" \) \
              -not -path "./.git/*"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERRO: build.gradle não encontrado."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERRO: app/build.gradle não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar MENTEX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "COMPILANDO MENTEX V4.6"
          echo "======================================"

          gradle assembleDebug --stacktrace --no-daemon

      - name: Procurar APK
        shell: bash
        run: |
          set -e

          echo "Procurando APK gerado..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."

            echo "Arquivos de build:"
            find "$PROJECT_DIR" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/MENTEX-V4.6-COMPACTO.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-COMPACTO
          path: MENTEX-V4.6-COMPACTO.apk
          if-no-files-found: error

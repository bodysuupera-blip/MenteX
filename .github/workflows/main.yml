name: MENTEX V4.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MENTEX V4.6
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-V4.6-TELA-CHEIA-ESTAVEL.zip"

          echo "Procurando:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP nao encontrado."
            echo ""
            echo "Arquivos disponiveis:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "ZIP encontrado."

          rm -rf projeto
          mkdir -p projeto

          unzip -o "$ZIP" -d projeto

          echo "Conteudo extraido:"
          find projeto -maxdepth 4 -type f -print

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find projeto -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            find projeto -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Limpar projeto
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Limpando projeto..."
          gradle clean

      - name: Compilar APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "COMPILANDO MENTEX V4.6"
          echo "VERSAO ESTAVEL"
          echo "========================================"

          gradle assembleDebug --stacktrace

      - name: Procurar APK
        shell: bash
        run: |
          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6-TELA-CHEIA-ESTAVEL
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

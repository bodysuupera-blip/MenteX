
name: NEXUS 350 - V5 HORIZONTAL FIXO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Localizar ZIP V5
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 4 -type f \
            -name 'Nexus350_Labirinto_Fantasmas_TELAS_ANIMADAS_V5.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP V5 nao encontrado."
            exit 1
          fi

          echo "ZIP localizado: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Localizar projeto
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -name package.json \
            -not -path '*/node_modules/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: package.json nao encontrado."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto localizado: $PROJECT"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          npm pkg set \
            "dependencies.@capacitor/core=^7.0.0" \
            "dependencies.@capacitor/android=^7.0.0" \
            "devDependencies.@capacitor/cli=^7.0.0"

          npm install

      - name: Preparar Android
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: FIX DEFINITIVO - HORIZONTAL UNICO
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERRO: AndroidManifest.xml nao encontrado."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest_path = sys.argv[1]
          android = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          activities = root.findall(".//activity")

          if not activities:
              raise SystemExit("ERRO: Nenhuma activity encontrada.")

          for activity in activities:
              activity.set(android + "screenOrientation", "landscape")
              activity.set(android + "resizeableActivity", "false")

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Todas as activities foram travadas em LANDSCAPE.")
          print("Reverse landscape e retrato nao serao permitidos.")
          PY

          echo "Conferencia de orientacao:"
          grep -o 'screenOrientation="[^"]*"' "$MANIFEST" || true

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT/android"

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT/android/app/build/outputs/apk" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          mkdir -p resultado

          cp "$APK" resultado/NEXUS350_HORIZONTAL_FIXO.apk

          echo "APK encontrado e preparado."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS350-HORIZONTAL-FIXO
          path: resultado/NEXUS350_HORIZONTAL_FIXO.apk
          if-no-files-found: error
          retention-days: 30

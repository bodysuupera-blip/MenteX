
      - name: Reconstruir APK
        shell: bash
        run: |
          set -euo pipefail

          APKTOOL="$RUNNER_TEMP/apktool.jar"
          PROJETO="$RUNNER_TEMP/mentex/decoded"
          SAIDA="$RUNNER_TEMP/mentex/MENTEX-V4.7-alinhado.apk"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"

          if [ ! -f "$APKTOOL" ]; then
            echo "::error::Apktool não encontrado."
            exit 1
          fi

          if [ ! -x "$AAPT2" ]; then
            echo "::error::AAPT2 não encontrado: $AAPT2"
            exit 1
          fi

          java -jar "$APKTOOL" b "$PROJETO" \
            --aapt "$AAPT2" \
            --force \
            --output "$SAIDA"

          if [ ! -s "$SAIDA" ]; then
            echo "::error::O APK reconstruído não foi gerado."
            exit 1
          fi

          echo "APK reconstruído com sucesso: $SAIDA"
          


name: MENTEX V5.0 - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar MENTEX V5.0
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Localizar Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Cordova
        run: |
          npm install -g cordova@12.0.0
          cordova --version

      - name: Verificar ZIP do MENTEX
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-V5.0-ATUALIZACAO-DUAS-MELHORIAS.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado na raiz do repositório."
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      - name: Extrair e localizar projeto
        shell: bash
        run: |
          set -e

          mkdir -p origem

          unzip -q \
            "MENTEX-V5.0-ATUALIZACAO-DUAS-MELHORIAS.zip" \
            -d origem

          INDEX=$(find origem -type f \
            -path "*/mentex-package/www/index.html" \
            -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERRO: index.html não encontrado."
            find origem -type f | head -100
            exit 1
          fi

          WWW_DIR=$(dirname "$INDEX")

          echo "WWW_DIR=$WWW_DIR" >> "$GITHUB_ENV"

          echo "Index encontrado em:"
          echo "$INDEX"

          echo "Conteúdo da pasta www:"
          ls -la "$WWW_DIR"

      - name: Criar projeto Cordova
        shell: bash
        run: |
          set -e

          cordova create mentex-build br.com.mentex.app MENTEX

          rm -rf mentex-build/www
          mkdir -p mentex-build/www

          cp -a "$WWW_DIR/." mentex-build/www/

          cd mentex-build

          cordova platform add android@14.0.1

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd mentex-build

          cordova build android --debug --verbose

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          APK="mentex-build/platforms/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."

            find mentex-build -type f -name "*.apk"

            exit 1
          fi

          mkdir -p resultado

          cp "$APK" resultado/MENTEX-V5.0.apk

          echo "APK gerado:"
          ls -lh resultado/MENTEX-V5.0.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V5.0-APK
          path: resultado/MENTEX-V5.0.apk
          if-no-files-found: error
          retention-days: 7
          

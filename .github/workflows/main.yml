
name: LABIRINTO MORTAL - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar LABIRINTO MORTAL
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório MENTEX
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Localizar ZIP do jogo
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP_FILE=$(find . -type f \
            -name "LABIRINTO-MORTAL-PROJETO-ANDROID.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP do LABIRINTO MORTAL não encontrado."
            echo "Envie o ZIP para a raiz do repositório."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extrair projeto Android
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/labirinto"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/labirinto"

          PROJECT=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/build.gradle" ] &&
               [ -f "$DIR/app/build.gradle" ] &&
               [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$RUNNER_TEMP/labirinto" \
            -type f -name settings.gradle)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: Projeto Android incompleto."
            find "$RUNNER_TEMP/labirinto" -maxdepth 5 -type f
            exit 1
          fi

          echo "Projeto localizado: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Preparar APK
        run: |
          set -Eeuo pipefail

          mkdir -p output

          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             output/LABIRINTO-MORTAL.apk

          ls -lh output/

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LABIRINTO-MORTAL-APK
          path: output/LABIRINTO-MORTAL.apk
          if-no-files-found: error
          retention-days: 30
          

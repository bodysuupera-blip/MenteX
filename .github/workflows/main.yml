
name: CAO FUJAO 2.9 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Cao Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' arquivo; do
            pasta="extraido_$(basename "$arquivo" .zip)"
            mkdir -p "$pasta"
            unzip -oq "$arquivo" -d "$pasta"
          done < <(find . -type f -name "*.zip" -print0)

          PROJETO=""

          while IFS= read -r -d '' arquivo; do
            pasta="$(dirname "$arquivo")"

            if { [ -f "$pasta/app/build.gradle" ] || \
                 [ -f "$pasta/app/build.gradle.kts" ]; } && \
               [ -f "$pasta/app/src/main/AndroidManifest.xml" ]; then
              PROJETO="$pasta"
              break
            fi
          done < <(find . -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print0)

          if [ -z "$PROJETO" ]; then
            echo "ERRO: Projeto Android nao encontrado."
            exit 1
          fi

          echo "Projeto encontrado: $PROJETO"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJETO" >> "$GITHUB_ENV"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Instalar plataforma Android 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon clean :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            find app/build/outputs -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/resultado"

          cp "$APK" "$GITHUB_WORKSPACE/resultado/CAO-FUJAO.apk"

          ls -lh "$GITHUB_WORKSPACE/resultado/CAO-FUJAO.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-2.9-APK
          path: resultado/CAO-FUJAO.apk
          if-no-files-found: error
          retention-days: 30
          

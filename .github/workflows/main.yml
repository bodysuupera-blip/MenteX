- name: Localizar APK gerado
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          echo "Procurando arquivos APK..."

          find "$GITHUB_WORKSPACE" \
            -type f -name '*.apk' \
            -not -path '*/.git/*' \
            -print

          APK="$(find "$PROJETO_ANDROID" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            echo "Verifique o resultado da etapa Compilar APK."
            find "$PROJETO_ANDROID" \
              -type f \( -name '*.apk' -o -name '*.aab' \) \
              -print 2>/dev/null || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/artifacts/MENTEX.apk"
          echo "APK localizado: $APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-APK
          path: artifacts/MENTEX.apk
          if-no-files-found: error

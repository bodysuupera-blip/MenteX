name: Gerar APK MENTEX V4.6.4

on:
  workflow_dispatch:
  push:
    paths:
      - "MENTEX-V4.6.4-PERGUNTAS-CEREBRO-SEM-DESLIZAR.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          ZIP="MENTEX-V4.6.4-PERGUNTAS-CEREBRO-SEM-DESLIZAR.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado na raiz do repositório."
            exit 1
          fi

          mkdir projeto
          unzip -q "$ZIP" -d projeto

          SETTINGS=$(find projeto -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            echo "O ZIP precisa conter um projeto Android Gradle completo."
            exit 1
          fi

          DIR="$(dirname "$SETTINGS")"
          echo "PROJETO_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Projeto localizado em: $DIR"

      - name: Compilar APK Android
        shell: bash
        run: |
          set -e
          cd "$PROJETO_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Preparar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJETO_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi encontrado."
            exit 1
          fi

          mkdir -p resultado
          cp "$APK" resultado/MENTEX-V4.6.4.apk

          ls -lh resultado/MENTEX-V4.6.4.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MENTEX-V4.6.4-APK
          path: resultado/MENTEX-V4.6.4.apk
          if-no-files-found: error
          retention-days: 14
